<style>
:root{--bg:#f4f6fa;--sf:#fff;--tx:#1b2330;--mt:#6b7686;--ln:#e3e7ee;--pr:#3b82f6;--ex:#ef4444;--inc:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--sf:#1f1f1f;--tx:#eceff4;--mt:#9aa3b0;--ln:#2e2e2e;--pr:#5b9bf5;color-scheme:dark}}

:root[data-theme="desa"]{--bg:#f5faf0;--sf:#ffffff;--tx:#10321a;--mt:#5f7a64;--ln:#dfe9d8;--pr:#1f8a2e;--ex:#ef4444;--inc:#16a34a;color-scheme:light}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
main{max-width:1040px;margin:0 auto}

.ic{background:none;border:0;font-size:22px;padding:0 4px}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}.mt{color:var(--mt);font-size:13px}
.big{font-size:24px;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.ex{color:var(--ex)}.in{color:var(--inc)}
.fab::before,.fab::after{content:'';position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}.fab::before{width:22px;height:3px}.fab::after{width:3px;height:22px}
.fab{font-size:0!important;padding:0!important;line-height:0!important;display:block}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--pr);color:#fff;border:0;font-size:28px;box-shadow:0 4px 12px #0004;z-index:6}
.btn{background:var(--pr);color:#fff;border:0;border-radius:22px;padding:10px 18px;font-weight:600}
.btn.o{background:none;color:var(--pr);border:1px solid var(--pr)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.chip{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;white-space:nowrap}
.acc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.ac{min-width:0;border-radius:10px;padding:8px;color:#fff}
.acc .ac>div:first-child{font-size:11px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .ac b{font-size:12px;min-width:0;overflow-wrap:anywhere}.acc .ac>div:last-child:not(:first-child){font-size:10px!important}
.acc .ac .eye{padding:2px;margin:-2px}.acc .ac .eye .sv{width:14px;height:14px}
.acc .chip{padding:0;min-height:60px;border-radius:10px;display:grid;place-items:center}
.pin.tall{position:static}
@media(max-width:479px){.acc{grid-template-columns:repeat(2,minmax(0,1fr))}.acc .ac{padding:10px}.acc .ac>div:first-child{font-size:13px!important}.acc .ac b{font-size:15px}.acc .ac>div:last-child:not(:first-child){font-size:11px!important}.acc .ac .eye .sv{width:17px;height:17px}.pin.tall2{position:static}}
@media(min-width:640px){.acc .ac{padding:12px}.acc .ac>div:first-child{font-size:13px!important}.acc .ac b{font-size:15px}.acc .ac>div:last-child:not(:first-child){font-size:11px!important}.acc .ac .eye .sv{width:17px;height:17px}}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;position:relative}.donut:after{content:"";position:absolute;inset:32px;background:var(--sf);border-radius:50%}
.lg{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.empty{text-align:center;color:var(--mt);padding:60px 20px}.empty div{font-size:48px}
#dr{position:fixed;inset:0;z-index:10;display:none}#dr.on{display:flex}
#dr nav{width:270px;max-width:80%;background:var(--sf);height:100%;overflow:auto;padding-top:env(safe-area-inset-top,0px)}

.pf{padding:22px 20px;border-bottom:1px solid var(--ln)}
#md{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}#md.on{display:flex}
#md form{background:var(--sf);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mt);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.x{background:none;border:0;color:var(--mt);font-size:18px}
.sv{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv{color:var(--mt);font-size:14px;padding:12px 20px}.nv.on{color:var(--pr);font-weight:600}.nv .tg{margin-left:auto;font-size:11px;background:#22c55e;color:#fff;border-radius:6px;padding:2px 7px}.nv .ch{margin-left:auto}.nv.sb{padding-left:54px}
.sw{margin-left:auto;width:40px;height:22px;border-radius:11px;background:var(--ln);position:relative}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--pr)}.sw.on:after{left:21px}
hr{border:0;border-top:1px solid var(--ln);margin:6px 0}.empty .sv{width:44px;height:44px}
.acc{position:relative}.ac,.fc{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ac.drag,.fc.drag{position:relative;z-index:5;box-shadow:0 10px 24px #0006;filter:brightness(1.08);cursor:grabbing;transition:none!important}
body.dragging{user-select:none;-webkit-user-select:none}
.dv{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:6px 0 16px}.dv:before{content:"";flex:1;height:1px;background:var(--ln)}
.fcb{border:1px solid var(--ln);background:var(--sf);color:var(--pr);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.fcg{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;position:relative}
.fc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;min-height:96px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fc .fi{display:flex}.fc b{font-size:14px}.fc.fw{display:block;min-height:0;padding:14px 14px 22px}.fcv{font-size:20px;font-weight:700}.fsep{height:1px;background:var(--ln);margin:10px -14px 12px}.fc{position:relative}.fc.w1{grid-column:span 1}.fc.w2,.fc.w3{grid-column:span 2}.fc.fw h3{margin:0;font-size:15px}.fc.fw .row.hd{border:0;padding:0}
@media(min-width:640px){.fcg{grid-template-columns:repeat(3,minmax(0,1fr))}.fc.w3{grid-column:span 3}}
.rz{position:absolute;right:3px;bottom:3px;width:24px;height:24px;touch-action:none;cursor:nwse-resize;opacity:.6}.rz:after{content:"";position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-right:2px solid var(--mt);border-bottom:2px solid var(--mt);border-radius:0 0 3px 0}
@media(min-width:640px){main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 14px;align-items:start;padding:16px 20px 90px}main>.acc,main>.chips,main>.empty,main>.mt,main>.card:only-child{grid-column:1/-1}.fab{right:24px}}

@media(max-width:639px){main{padding:12px 12px 90px}.fab{right:16px}}
.pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--bg);padding-top:12px;margin-top:-12px;grid-column:1/-1}.pin .acc{margin-bottom:8px}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}@keyframes fi{from{opacity:0}}@keyframes sl{from{transform:translateX(-100%)}}@keyframes su{from{transform:translateY(100%)}}@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1) rotate(0)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes spn{from{opacity:0;transform:rotate(-140deg) scale(.5)}}@keyframes flt{50%{transform:translateY(-8px)}}@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}@keyframes rw{from{opacity:0;transform:translateX(-10px)}}
body,header,.card,.chip,input,select,textarea,#dr nav,#md form{transition:background-color .3s,color .3s,border-color .3s}
main>*{animation:fu .45s cubic-bezier(.2,.7,.2,1) both}main>:nth-child(2){animation-delay:.06s}main>:nth-child(3){animation-delay:.12s}main>:nth-child(4){animation-delay:.18s}main>:nth-child(5){animation-delay:.24s}main>:nth-child(n+6){animation-delay:.3s}
.row{animation:rw .4s ease both}.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}.row:nth-child(4){animation-delay:.15s}.row:nth-child(n+5){animation-delay:.2s}
.ac{animation:fu .5s both;transition:transform .2s,box-shadow .2s}.ac:nth-child(2){animation-delay:.08s}.ac:nth-child(3){animation-delay:.16s}

/* ===== Sinkron Google Sheets (PAIIDY) ===== */
(function () {
  var URL_API = 'https://script.google.com/macros/s/AKfycbxoHxOW-70GKwOFDjqhpgYMUo8VWk-blCjk1hI69xcRTjt9o-2lIXyIOTvbDI4K_2I-6Q/exec'; // URL Web App (/exec)
  var TOKEN = 'asadaridesa';                      // sama dengan Code.gs
  var KEY = 'mm', TSK = 'mm_ts', DELAY = 2500;
  var ls = window.localStorage, setI = Storage.prototype.setItem, remI = Storage.prototype.removeItem;
  var timer = null, busy = false, again = false;

  function num(k) { try { return Number(ls.getItem(k)) || 0; } catch (e) { return 0; } }
  function badge(t, ok) {
    var b = document.getElementById('syncb');
    if (!b) {
      b = document.createElement('div'); b.id = 'syncb';
      b.style.cssText = 'position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font:11px system-ui;padding:3px 8px;border-radius:10px;background:#0006;color:#fff;z-index:2;pointer-events:none';
      document.body.appendChild(b);
    }
    b.textContent = t; b.style.background = ok === false ? '#dc2626cc' : '#0006';
  }

  // tangkap setiap penyimpanan data aplikasi
  Storage.prototype.setItem = function (k, v) {
    setI.call(this, k, v);
    if (this === ls && k === KEY) { setI.call(ls, TSK, String(Date.now())); schedule(); }
  };
  Storage.prototype.removeItem = function (k) {
    remI.call(this, k);
    if (this === ls && k === KEY) setI.call(ls, TSK, String(Date.now())); // reset sengaja, jangan ditimpa cloud
  };

  function schedule() { clearTimeout(timer); timer = setTimeout(push, DELAY); }

  function push(force) {
    if (busy) { again = true; return; }
    var raw = ls.getItem(KEY); if (!raw) return;
    busy = true; badge('Menyimpan…');
    fetch(URL_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain = tanpa preflight CORS
      body: JSON.stringify({ token: TOKEN, action: 'save', data: JSON.parse(raw), base: num('mm_base'), force: force === true })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) { setI.call(ls, 'mm_base', String(j.ts)); badge('Tersimpan ☁'); }
      else if (j.conflict) {
        badge('Data cloud lebih baru', false);
        if (confirm('Data di Google Sheets lebih baru (perangkat lain).\nOK = ambil data cloud\nBatal = timpa cloud dengan data ini')) pull(true);
        else push(true);
      } else badge('Gagal: ' + (j.error || '?'), false);
    }).catch(function () { badge('Offline - ditunda', false); })
      .then(function () { busy = false; if (again) { again = false; schedule(); } });
  }

  function pull(ask) {
    fetch(URL_API + '?action=load&token=' + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) return badge('Gagal: ' + (j.error || '?'), false);
      var localTs = num(TSK), localBase = num('mm_base');
      if (j.data && j.ts > localBase && (ask || j.ts > localTs)) {
        setI.call(ls, KEY, JSON.stringify(j.data));
        setI.call(ls, 'mm_base', String(j.ts)); setI.call(ls, TSK, String(j.ts));
        if (!sessionStorage.getItem('mm_rl')) { sessionStorage.setItem('mm_rl', '1'); location.reload(); }
      } else {
        sessionStorage.removeItem('mm_rl');
        badge(j.data ? 'Sinkron ☁' : 'Cloud kosong');
        if (!j.data && ls.getItem(KEY)) push(true);   // unggah awal
        else if (localTs > j.ts) schedule();          // ada perubahan lokal yang belum terkirim
      }
    }).catch(function () { badge('Offline', false); });
  }

  window.addEventListener('load', function () { pull(false); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && timer) { clearTimeout(timer); push(); } });
})();
</script>

const rwx=(t,v)=>`<div class="row" style="padding:5px 0"><span>${t}</span>${v}</div>`;

/* ---------- Langkah 1: Produk & Komposisi bahan (rencana satu batch) ---------- */
let D=null;
/* komposisi default resep baru: [nama, kata kunci cocok, kata kunci pengecualian, jumlah, persen]; persen kosong = tanpa jatah persen */
const DEF_MIX=[['Sekam mentah',['sekam'],['bakar','arang'],16,31],['Sekam bakar',['bakar','arang'],[],16,31],['Kohe kambing',['kohe'],[],9,18],['Tanah top soil',['top soil','topsoil','tanah'],[],11,20],['Fermentator',['fermentator','biang'],[],7,''],['Dolomit',['dolomit'],[],10,'']];
const defMix=()=>{if(!bahan().length)return[{b:'',j:'',p:''}];const used={},has=(x,a)=>a.some(k=>String(x.n||'').toLowerCase().indexOf(k)>=0);return DEF_MIX.map(d=>{const f=bahan().find(x=>!used[x.id]&&has(x,d[1])&&!has(x,d[2]));if(f)used[f.id]=1;return{b:f?f.id:'',j:d[3],p:d[4]}})};
window.pdEdit=function(id){
  const x=id?prods().find(p=>p.id==id):null;
  D=x?{id:x.id,n:x.n,v:x.v,us:x.us||'kg',w:x.w!=null?x.w:10,tgt:x.bt?x.tgt:'',old:!x.bt,rows:x.bt?normMix(x.mix,x.us||'kg').map(m=>({b:m.b,j:m.j,p:m.p==null?'':m.p})):[{b:'',j:'',p:''}],pack:(x.pack||[]).map(m=>({b:m.b,j:m.j}))}
     :{id:null,n:'',v:'',us:'kg',w:10,tgt:'',old:false,rows:defMix(),pack:[]};
  ED.pd=D;draw();open()};
DRAW.pd=()=>draw();
function draw(){
  const fm=$('#fm'),st=fm.scrollTop;
  const ni=(a,ph,v)=>`<input type="number" min="0" step="any" inputmode="decimal" placeholder="${ph}" value="${v===''||v==null?'':v}" ${a}>`;
  fm.innerHTML=`${stp(1)}<h3 style="margin:6px 0 0">${D.id?'Ubah':'Tambah'} Produk &amp; Komposisi</h3>${D.old?'<div class="mt" style="color:var(--ex)">Komposisi lama (per kemasan) tidak dipakai lagi. Susun ulang untuk satu batch.</div>':''}
<label>Nama Produk</label><input placeholder="Contoh: Pupuk Organik Granul" value="${esc(D.n)}" oninput="pdTop('n',this.value)" required>
<div class="rw" style="grid-template-columns:1fr 1fr;align-items:end"><div><label>Harga Jual (Rp)</label>${ni(`oninput="pdTop('v',this.value)" required`,'',D.v)}</div><div><label>Target produk / batch</label>${ni(`oninput="pdTop('tgt',this.value)" required`,'160',D.tgt)}</div></div>
<div class="rw" style="grid-template-columns:1fr 1fr;align-items:end"><div><label>Isi per produk</label>${ni(`oninput="pdTop('w',this.value)" required`,'10',D.w)}</div><div><label>Satuan</label><input value="${esc(D.us)}" oninput="pdTop('us',this.value)" placeholder="kg" maxlength="12"></div></div>
<div class="mt" style="margin-top:6px">Satu produk = satu kemasan (default 10 kg, bisa diganti). Target = jumlah kemasan yang diharapkan satu batch (estimasi; jumlah aktual diisi saat packing).</div>
<label style="margin-top:14px;color:var(--tx);font-weight:600">Komposisi bahan mentah satu batch</label>${bahan().length?'':'<div class="mt" style="color:var(--ex)">Belum ada bahan baku di Inventori. Produk tetap bisa disimpan dulu; komposisi diisi nanti lewat Ubah Komposisi.</div>'}
${rowsHTML('pd')}
<div class="mt" style="margin-top:6px"><b>Jumlah</b> diisi dalam satuan bahan (mis. karung) dan menjadi dasar pengurangan stok &amp; biaya. <b>Persen</b> = porsi bahan dalam produk jadi, boleh dikosongkan: sisa persen dibagi otomatis menurut perbandingan jumlah. Bila persen yang diisi sudah 100%, bahan yang kosong tidak mendapat jatah persen. Persen ini jadi nilai awal tiap batch dan boleh diubah per batch.</div>
<div class="card" id="pdsum" style="margin:12px 0 0;padding:8px 12px"></div><div id="pderr" role="alert" style="color:var(--ex);font-weight:600;margin-top:8px"></div>${btns('Simpan')}`;
  fm.onsubmit=e=>{e.preventDefault();save()};fm.oninput=null;fm.scrollTop=st;upd('pd')}
SUMF.pd=function(A,us){
  const el=$('#pdsum');if(!el)return;
  const rows=D.rows.filter(r=>r.b&&num(r.j)>0),c=rows.reduce((a,r)=>a+num(r.j)*uc(bf(r.b)),0),t=num(D.tgt),per=t>0?c/t:0,c2=cost(D.pack),mg=num(D.v)-per-c2,W=t*num(D.w);
  el.innerHTML=rwx('Total persen',pctBadge(A))+rwx('Berat satu batch',`<b>${W>0?fmt(W)+' '+esc(us):'-'}</b>`)+rwx('Total biaya bahan',`<b>${rp(c)}</b>`)+rwx('Modal bahan / produk (estimasi)',`<b>${t>0?rp(per):'-'}</b>`)+(c2>0?rwx('+ Packing / produk',`<b>${rp(c2)}</b>`):'')+rwx('Margin / produk',`<b style="color:${mg<0?'var(--ex)':'var(--inc)'}">${t>0?rp(mg):'-'}</b>`)};
window.pdTop=function(k,v){D[k]=v;upd('pd')};
function save(){
  const n=String(D.n).trim(),t=num(D.tgt),us=String(D.us||'').trim(),w=num(D.w);
  if(!n)return err('Nama produk tidak boleh kosong.');
  const rows=D.rows.filter(r=>r.b||r.j!==''||hasP(r));
  if(rows.length&&!(t>0))return err('Target produk per batch harus lebih dari 0.');
  if(!(w>0))return err('Isi per produk harus lebih dari 0 (default 10).');
  if(!us)return err('Isi satuan (mis. kg).');
  if(rows.some(r=>!r.b||!(num(r.j)>0)))return err('Setiap baris harus memilih bahan dan mengisi jumlah.');
  if(new Set(rows.map(r=>r.b)).size<rows.length)return err('Ada bahan yang dipilih dua kali. Gabungkan jadi satu baris.');
  if(rows.length){const A=alloc(rows);if(!A.ok)return err(pctErr(A))}
  const rec={id:D.id||uid(),n,v:num(D.v),us,w,tgt:t,bt:1,q:0,mix:rows.map(r=>({b:r.b,j:num(r.j),p:hasP(r)?num(r.p):null})),pack:D.pack.map(r=>({b:r.b,j:num(r.j)}))};
  ask('Simpan produk "'+esc(n)+'" dan komposisinya? Isi per produk '+fmt(w)+' '+esc(us)+', target '+fmt(t)+' produk per batch.',()=>{
    const l=S.g.inv_produk=S.g.inv_produk||[],i=l.findIndex(p=>p.id==rec.id);
    if(i>=0){rec.q=l[i].q||0;l[i]=Object.assign({},l[i],rec)}else l.push(rec);
    sv();cl();go(cur,1)},'Simpan')}

/* Rencana batch: salinan komposisi + target sebagai estimasi awal (stok belum berkurang) */
window.pdPlan=function(id){
  const x=prods().find(p=>p.id==id);if(!x)return;
  if(!x.bt||!(num(x.tgt)>0)||!(x.mix||[]).length)return ask('Komposisi produk ini belum disusun per batch (bahan, jumlah, dan target). Lengkapi dulu.',()=>pdEdit(id),'Lengkapi');
  const us=x.us||'kg',mix=snap(normMix(x.mix,us),us),c=sumc(mix);
  const fm=$('#fm');
  fm.innerHTML=`${stp(1)}<h3 style="margin:6px 0 0">Rencana Batch · ${esc(x.n)}</h3><div class="mt">Target ${fmt(x.tgt)} produk · estimasi biaya bahan ${rp(c)}. Stok belum dikurangi sampai pencampuran dimulai.</div><label>Tanggal rencana</label><input id="pdtg" type="date" value="${today()}" required>${btns('Buat Rencana')}`;
  fm.onsubmit=e=>{e.preventDefault();const dv=$('#pdtg').value||today();(S.g.batch=S.g.batch||[]).push({id:uid(),k:mk(dv),pid:x.id,n:x.n,qty:num(x.tgt),tgt:num(x.tgt),us,w:(x.w!=null?num(x.w):10),st:'rencana',d:dv,mix,pack:[],plan:{mix:mix.map(r=>Object.assign({},r)),c,tgt:num(x.tgt),e:sume(mix)}});sv();cl();go(cur,1)};
  open()};
window.pdRun=window.pdPlan;

/* ---------- Langkah 2a: Pencampuran (konfirmasi bahan yang benar-benar masuk) ---------- */
let MX=null;
window.pdMix=function(id){
  const b=batches().find(z=>z.id==id);if(!b||b.st!='rencana')return;
  const us=b.us||'kg',pr=prods().find(z=>z.id==b.pid)||{};
  MX={id,tgl:today(),us,w:String(b.w!=null?b.w:(pr.w!=null?pr.w:10)),tgt:String(b.tgt!=null?b.tgt:b.qty),rows:normMix(b.mix,us).map(r=>({b:r.b,j:r.j,p:r.p==null?'':r.p}))};
  ED.mx=MX;drawMx();open()};
DRAW.mx=()=>drawMx();
window.mxTgt=function(v){MX.tgt=v;upd('mx')};
window.mxW=function(v){MX.w=v;upd('mx')};
function drawMx(){
  const b=batches().find(z=>z.id==MX.id),fm=$('#fm'),st=fm.scrollTop;if(!b)return;
  fm.innerHTML=`${stp(2)}<h3 style="margin:6px 0 0">Pencampuran · ${esc(b.n)}</h3><div class="mt">Batch <b>${esc(b.k)}</b> · sesuaikan dengan bahan yang benar-benar masuk. Persen terisi dari resep dan boleh diubah untuk batch ini.</div>
${rowsHTML('mx')}
<div class="rw" style="grid-template-columns:1fr 1fr;align-items:end"><div><label>Target / estimasi produk jadi</label><input type="number" min="0" step="any" inputmode="decimal" value="${esc(MX.tgt)}" oninput="mxTgt(this.value)" required></div><div><label>Isi per produk (${esc(MX.us)})</label><input type="number" min="0" step="any" inputmode="decimal" value="${esc(MX.w)}" oninput="mxW(this.value)" required></div></div>
<label>Tanggal pencampuran</label><input type="date" value="${esc(MX.tgl)}" oninput="MX.tgl=this.value" required>
<div class="card" id="mxsum" style="margin:12px 0 0;padding:8px 12px"></div><div id="pderr" role="alert" style="color:var(--ex);font-weight:600;margin-top:8px"></div>${btns('Mulai Pencampuran')}`;
  fm.onsubmit=e=>{e.preventDefault();saveMx()};fm.scrollTop=st;upd('mx')}
SUMF.mx=function(A,us){
  const el=$('#mxsum'),b=batches().find(z=>z.id==MX.id);if(!el||!b)return;
  const rows=MX.rows.filter(r=>r.b&&num(r.j)>0),c=rows.reduce((a,r)=>a+num(r.j)*uc(bf(r.b)),0),pc=(b.plan&&b.plan.c)||0,d=c-pc,W=num(MX.tgt)*num(MX.w);
  el.innerHTML=rwx('Total persen',pctBadge(A))+rwx('Berat estimasi batch',`<b>${W>0?fmt(W)+' '+esc(us):'-'}</b>`)+rwx('Biaya bahan (dikunci saat mulai)',`<b>${rp(c)}</b>`)+rwx('Rencana awal',`<span>${rp(pc)}</span>`)+(Math.abs(d)>0.5?rwx('Selisih dari rencana',`<b style="color:${d>0?'var(--ex)':'var(--inc)'}">${d>0?'+':'-'}${rp(Math.abs(d))}</b>`):'')};
function saveMx(){
  const b=batches().find(z=>z.id==MX.id);if(!b||b.st!='rencana')return;
  const t=num(MX.tgt),w=num(MX.w),us=MX.us,rows=MX.rows.filter(r=>r.b||r.j!==''||hasP(r));
  if(!rows.length)return err('Minimal satu bahan.');
  if(rows.some(r=>!r.b||!(num(r.j)>0)))return err('Setiap baris harus memilih bahan dan mengisi jumlah.');
  if(new Set(rows.map(r=>r.b)).size<rows.length)return err('Ada bahan yang dipilih dua kali. Gabungkan jadi satu baris.');
  const A=alloc(rows);if(!A.ok)return err(pctErr(A));
  if(!(t>0))return err('Target produk jadi harus lebih dari 0.');
  if(!(w>0))return err('Isi per produk harus lebih dari 0.');
  if(!MX.tgl)return err('Isi tanggal pencampuran.');
  if(b.d&&MX.tgl<b.d)return err('Tanggal pencampuran tidak boleh sebelum tanggal rencana ('+b.d+').');
  const mix=snap(rows,us),bad=check(mix).filter(c=>!c.ok);
  if(bad.length)return err('Stok kurang: '+bad.map(c=>`${c.n} (butuh ${fmt(c.need)}, stok ${fmt(c.has)})`).join(', '));
  ask(`Mulai pencampuran ${esc(b.n)}? ${mix.length} bahan dikurangi dari stok dan biaya bahan ${rp(sumc(mix))} dikunci. Persen & isi per produk (${fmt(w)} ${esc(us)}) tidak bisa diubah lagi setelah ini.`,()=>{
    mix.forEach(r=>{const x=bf(r.b);setStock(x,(+x.q||0)-r.j)});
    b.mix=mix;b.c1=sumc(mix);b.k1=0;b.w=w;b.qty=t;b.tgt=t;b.st='campur';b.md=MX.tgl||today();
    sv();cl();go(cur,1)},'Mulai')}

/* ---------- Langkah 2b: Jeda fermentasi (masa tunggu, bukan langkah produksi) ---------- */
window.pdFerm=function(id){
  const b=batches().find(z=>z.id==id);if(!b||b.st!='campur')return;
  const fm=$('#fm');
  fm.innerHTML=`${stp(2)}<h3 style="margin:6px 0 0">Fermentasi · ${esc(b.n)}</h3><div class="mt">Batch <b>${esc(b.k)}</b> · biaya bahan terkunci ${rp(b.c1||0)}</div>
<div class="rw rw2" style="align-items:end"><div><label>Tanggal mulai</label><input id="fms" type="date" value="${today()}"></div><div><label>Lama (hari)</label><input id="fmh" type="number" min="0" step="1" inputmode="numeric" placeholder="opsional"></div></div>
<label>Catatan (opsional)</label><input id="fmn" placeholder="Mis. ditutup terpal, dibalik tiap 3 hari" autocomplete="off">

    sv();cl();go(cur,1)};
  open()};

/* ---------- Langkah 3: Packing (sumber kebenaran jumlah produk jadi) ---------- */
let PK=null;
window.pdNext=function(id){
  const b=batches().find(z=>z.id==id);if(!b||(b.st!='campur'&&b.st!='fermentasi'))return;
  if(!b.k)b.k=mk();
  const p=prods().find(z=>z.id==b.pid)||{};
  PK={id,tgl:today(),act:String(b.qty),note:'',rows:(p.pack||[]).map(r=>({b:r.b,u:num(r.j),j:r6(num(r.j)*b.qty),man:0}))};
  if(!PK.rows.length)PK.rows.push({b:'',u:0,j:'',man:1});
  draw3();open()};
function draw3(){
  const b=batches().find(z=>z.id==PK.id),fm=$('#fm'),st=fm.scrollTop;if(!b)return;
  const opt=s=>{let L=packing();const cu=s&&!L.some(x=>x.id==s)?bf(s):null;if(cu)L=L.concat([cu]);return '<option value="">Pilih bahan packing…</option>'+L.map(x=>`<option value="${x.id}"${x.id==s?' selected':''}>${esc(x.n)} · ${fmt(+x.q||0)}${x.s?' '+esc(x.s):''}</option>`).join('')};
  const rows=PK.rows.map((r,i)=>`<div class="rw rw2p"><select data-i="${i}" onchange="pkSel(this)">${opt(r.b)}</select><input type="number" min="0" step="any" inputmode="decimal" placeholder="Jumlah" value="${r.j===''?'':r.j}" data-i="${i}" oninput="pkIn(this)"><button type="button" class="x" aria-label="Hapus baris" onclick="pkDel(${i})">✕</button></div>`).join('');
  fm.innerHTML=`${stp(3)}<h3 style="margin:6px 0 0">Packing · ${esc(b.n)}</h3><div class="mt">Batch <b>${esc(b.k)}</b> · estimasi awal ${fmt(b.qty)}${b.rd&&b.st=='fermentasi'&&today()<b.rd?` · <span style="color:var(--ex)">fermentasi selesai ${esc(b.rd)}</span>`:''}</div>
<label>Tanggal packing</label><input type="date" value="${esc(PK.tgl)}" oninput="pkTgl(this.value)" required>
<label>Jumlah produk jadi aktual</label><input id="pdact" type="number" min="0" step="any" inputmode="decimal" value="${esc(PK.act)}" oninput="pkAct(this.value)" required>
<div class="mt" style="margin-top:4px">Boleh sama, lebih banyak, atau lebih sedikit dari estimasi. Angka ini menggantikan estimasi untuk seluruh perhitungan.</div>
<label>Catatan selisih / penyusutan (opsional)</label><input value="${esc(PK.note)}" oninput="pkNote(this.value)" placeholder="Mis. bahan susut saat fermentasi" autocomplete="off">
<label style="margin-top:14px;color:var(--tx);font-weight:600">Bahan packing terpakai (opsional)</label>${packing().length?'':'<div class="mt">Belum ada bahan packing di Inventori.</div>'}${rows}<button type="button" class="btn o" style="margin-top:8px;padding:6px 14px" onclick="pkAdd()">+ Bahan Packing</button>
<div class="card" id="pksum" style="margin:12px 0 0;padding:8px 12px"></div><div id="pderr" role="alert" style="color:var(--ex);font-weight:600;margin-top:8px"></div>${btns('Simpan Packing')}`;
  fm.onsubmit=e=>{e.preventDefault();savePk()};fm.scrollTop=st;sum3()}
function sum3(){
  const el=$('#pksum'),b=batches().find(z=>z.id==PK.id);if(!el||!b)return;{const pe=$('#pderr');if(pe)pe.textContent=''}
  const a=num(PK.act),rows=PK.rows.filter(r=>r.b&&num(r.j)>0),c1=b.c1||0,c2=cost(rows),bad=check(rows).filter(c=>!c.ok),sel=a-b.qty;
  el.innerHTML=`${bad.length?rwx(`<span style="color:var(--ex)">Stok kurang: ${bad.map(c=>esc(c.n)).join(', ')}</span>`,''):''}${a>0?rwx('Selisih dari estimasi',`<b style="color:${sel<0?'var(--ex)':sel>0?'var(--inc)':'inherit'}">${sel>0?'+':''}${fmt(sel)}</b>`):''}${rwx('Modal bahan / produk',`<b>${a>0?rp(c1/a):'-'}</b>`)}${c2>0?rwx('Packing / produk',`<b>${a>0?rp(c2/a):'-'}</b>`):''}${rwx('HPP / produk',`<b>${a>0?rp((c1+c2)/a):'-'}</b>`)}${b.k1>0&&a>0?rwx('Rasio hasil',`<span>${fmt(a/b.k1)} produk / ${esc(b.us||'')}</span>`):''}`}
window.pkAct=function(v){PK.act=v;const a=num(v);PK.rows.forEach((r,i)=>{if(!r.man&&r.u>0){r.j=r6(r.u*a);const e=$('#fm').querySelector(`input[data-i="${i}"]`);if(e)e.value=r.j}});sum3()};
window.pkNote=function(v){PK.note=v};
window.pkTgl=function(v){PK.tgl=v};
window.pkIn=function(el){const r=PK.rows[+el.dataset.i];r.j=el.value;r.man=1;sum3()};
window.pkSel=function(el){PK.rows[+el.dataset.i].b=el.value;draw3()};
window.pkAdd=function(){PK.rows.push({b:'',u:0,j:'',man:1});draw3()};
window.pkDel=function(i){PK.rows.splice(i,1);draw3()};
function savePk(){
  const b=batches().find(z=>z.id==PK.id);if(!b)return;
  const a=num(PK.act),rows=PK.rows.filter(r=>r.b||r.j!=='');
  if(!(a>0))return err('Jumlah produk jadi aktual harus lebih dari 0.');
  const pt=PK.tgl||today(),pv0=b.fs||b.md||b.d;
  if(!PK.tgl)return err('Isi tanggal packing.');
  if(pv0&&pt<pv0)return err('Tanggal packing tidak boleh sebelum proses sebelumnya ('+pv0+').');
  if(rows.some(r=>!r.b||!(num(r.j)>0)))return err('Setiap baris packing harus memilih bahan dan mengisi jumlah.');
  if(new Set(rows.map(r=>r.b)).size<rows.length)return err('Ada bahan packing yang dipilih dua kali. Gabungkan jadi satu baris.');
  const pk=rows.map(r=>({b:r.b,n:(bf(r.b)||{}).n||'(bahan dihapus)',j:r6(num(r.j)),c:num(r.j)*uc(bf(r.b))})),bad=check(pk).filter(c=>!c.ok);
  if(bad.length)return err('Stok packing kurang: '+bad.map(c=>`${c.n} (butuh ${fmt(c.need)}, stok ${fmt(c.has)})`).join(', '));
  const run=()=>{
    b.c2=sumc(pk);
    pk.forEach(r=>{const x=bf(r.b);setStock(x,(+x.q||0)-r.j)});
    b.pack=pk;b.qc=1;b.act=a;b.sel=r6(a-b.qty);b.rej=Math.max(0,r6(b.qty-a));b.pn=String(PK.note||'').trim();b.pd=pt;b.ck=new Date().toISOString();b.st='packing';
    const p=prods().find(z=>z.id==b.pid);if(p)p.pack=pk.map(r=>({b:r.b,j:r6(r.j/a)}));
    sv();cl();go(cur,1)};
  const early=b.st=='fermentasi'&&b.rd&&pt<b.rd;
  ask((early?'Jadwal fermentasi baru selesai '+b.rd+'. ':'')+'Simpan packing '+esc(b.n)+'? Hasil aktual '+fmt(a)+' produk dikunci'+(pk.length?' dan bahan packing dikurangi dari stok':'')+'.',run,'Simpan')}

/* ---------- Langkah 4: Produk Jadi (rekonsiliasi, rincian per produk, simulasi) ---------- */
let VB=null;

function rincianTotal(){
  const q=x=>(+x.q||0)*(+x.v||0),o=x=>+x.o||0,sm=(l,f)=>l.reduce((a,x)=>a+f(x),0);
  const bh=S.g.inv_bahan||[],pk=S.g.inv_packing||[],pr=S.g.inv_produk||[];
  const a=sm(bh,q),ao=sm(bh,o),b=sm(pk,q),bo=sm(pk,o),c=sm(pr,q);
  const r=(n,v,sub)=>`<div class="row"><div><b>${n}</b>${sub?`<div class="mt">${sub}</div>`:''}</div><b>${rp(v)}</b></div>`;
  const f=$('#fm');
  f.innerHTML=`<h3 style="margin:0 0 8px">Rincian Total Nilai</h3>`
   +r('Bahan Baku',a,'Stok × harga satuan · '+bh.length+' item')
   +r('Ongkir Bahan Baku',ao,'Termasuk dalam total')
   +r('Bahan Packing',b,'Stok × harga satuan · '+pk.length+' item')
   +r('Ongkir Bahan Packing',bo,'Termasuk dalam total')
   +r('Produk Jadi',c,'Stok × harga jual · '+pr.length+' produk')
   +`<div class="row" style="border-top:2px solid var(--pr)"><div><b>Total Nilai</b><div class="mt">Ongkir total ${rp(ao+bo)}</div></div><b class="big" style="font-size:18px">${rp(a+ao+b+bo+c)}</b></div>`
   +`<button type="button" class="btn" style="width:100%;margin-top:14px" onclick="cl()">Tutup</button>`;

const PSD=[['Reinvestasi Usaha',15],['Owner',40],['Dana Safety',10],['Operasional',35]];
const PSO=['Reinvestasi usaha:40','Gaji / Owner:30','Operasional:20','Dana darurat:10'].join('|');
const PSO2='Reinvestasi usaha:15|Owner:40|Dana Safety:10|Operasional:35';
const psp=()=>{const g=S.g;if(Array.isArray(g.profitSplit)){const k=g.profitSplit.map(r=>r.n+':'+r.p).join('|');if(k==PSO||k==PSO2)g.profitSplit=null}if(!Array.isArray(g.profitSplit))g.profitSplit=PSD.map(x=>({id:uid(),n:x[0],p:x[1]}));return g.profitSplit};
function bpMargin(){const pr=S.g.inv_produk||[];let j=0,mod=0;pr.forEach(x=>{const q=+x.q||0,h=window.pdCost?window.pdCost(x):0;j+=q*(+x.v||0);mod+=q*(+h||0)});return{j,mod,m:j-mod}}
function bpUp(){const m=bpMargin().m,L=psp();L.forEach(r=>{const e=$('#bpa_'+r.id);if(e)e.textContent=rp(m*r.p/100)});const t=L.reduce((a,r)=>a+(+r.p||0),0),ok=Math.abs(t-100)<.01,e=$('#bpt');if(e){e.textContent='Total '+(Math.round(t*100)/100).toLocaleString('id-ID')+'%'+(ok?'':' · idealnya 100%');e.style.color=ok?'var(--inc)':'var(--ex)'}}
window.bpSet=(id,k,v)=>{const r=psp().find(x=>x.id==id);if(!r)return;r[k]=k=='p'?Math.max(0,+v||0):v;sv();bpUp()};
window.bpAdd=()=>{psp().push({id:uid(),n:'Pos baru',p:0});sv();brDet('p')};
window.bpDel=id=>{S.g.profitSplit=psp().filter(x=>x.id!=id);sv();brDet('p')};
window.brDet=function(m){

  const bh=S.g.inv_bahan||[],pk=S.g.inv_packing||[],pr=S.g.inv_produk||[],B=S.g.batch||[],tr=S.g.inv_transaksi||[];

     +(g.j||g.mod?'':`<div class="mt" style="margin-top:8px">Belum ada stok produk, jadi margin masih 0.</div>`)

     +`<div class="row" style="border-top:2px solid var(--pr);margin-top:6px"><b id="bpt"></b></div>`
     +`<button type="button" class="btn o" style="width:100%;margin-top:8px" onclick="bpAdd()">+ Tambah pos</button><button type="button" class="btn" style="width:100%;margin-top:8px" onclick="cl()">Tutup</button>`;

   +`<div class="brl">`

   +row('check','Batch Selesai',sm('selesai')+' batch','Riwayat produksi',"cl();go('inv_produk')")
   +row('receipt','Invoice',tr.length+' catatan','Barang masuk &amp; keluar',"cl();go('inv_transaksi')")
   +`</div><button type="button" class="btn o" style="width:100%;margin-top:12px" onclick="rincianTotal()">Rincian total nilai</button><button type="button" class="btn" style="width:100%;margin-top:8px" onclick="cl()">Tutup</button>`;

  if(d.mode=='buat'){const fl=(k,l,t,ph,ex)=>`<div><label>${l}</label><input type=\"${t||'text'}\" value=\"${esc(f[k])}\" placeholder=\"${ph||''}\" oninput=\"ivDraft.f.${k}=this.value${ex||''}\" autocomplete=\"off\"></div>`;

/* ---------- PDF (A5 landscape = 595.28 x 419.53 pt) ---------- */
function ivPdf(js){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{if(typeof b=='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
  push('%PDF-1.4\n');const N=js.length;
  obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>push('<</Type/Pages/Count '+N+'/Kids['+js.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>'));
  js.forEach((j,i)=>{const p=3+3*i,c='q 595.28 0 0 419.53 0 0 cm /Im0 Do Q';
    obj(p,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 419.53]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
    obj(p+1,()=>push('<</Length '+c.length+'>>\nstream\n'+c+'\nendstream'));
    obj(p+2,()=>{push('<</Type/XObject/Subtype/Image/Width '+j.w+'/Height '+j.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.d.length+'>>\nstream\n');push(j.d);push('\nendstream')})});
  const xr=len,Z=3+3*N;let t='xref\n0 '+Z+'\n0000000000 65535 f \n';
  for(let n=1;n<Z;n++)t+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  push(t+'trailer\n<</Size '+Z+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'})}
