<style>
:root{--bg:#f4f6fa;--sf:#fff;--tx:#1b2330;--mt:#6b7686;--ln:#e3e7ee;--pr:#3b82f6;--ex:#ef4444;--inc:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--sf:#1f1f1f;--tx:#eceff4;--mt:#9aa3b0;--ln:#2e2e2e;--pr:#5b9bf5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--sf:#1f1f1f;--tx:#eceff4;--mt:#9aa3b0;--ln:#2e2e2e;--pr:#5b9bf5;color-scheme:dark}
:root[data-theme="desa"]{--bg:#f5faf0;--sf:#ffffff;--tx:#10321a;--mt:#5f7a64;--ln:#dfe9d8;--pr:#1f8a2e;--ex:#ef4444;--inc:#16a34a;color-scheme:light}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
main{max-width:1040px;margin:0 auto}

.ic{background:none;border:0;font-size:22px;padding:0 4px}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}.mt{color:var(--mt);font-size:13px}
.big{font-size:24px;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.ex{color:var(--ex)}.in{color:var(--inc)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--pr);color:#fff;border:0;font-size:28px;box-shadow:0 4px 12px #0004;z-index:6}
.btn{background:var(--pr);color:#fff;border:0;border-radius:22px;padding:10px 18px;font-weight:600}
.btn.o{background:none;color:var(--pr);border:1px solid var(--pr)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.chip{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;white-space:nowrap}
.acc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.ac{min-width:0;border-radius:10px;padding:8px;color:#fff}
.acc .ac>div:first-child{font-size:11px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .ac b{font-size:12px;min-width:0;overflow-wrap:anywhere}.acc .ac>div:last-child:not(:first-child){font-size:10px!important}
.acc .ac .eye{padding:2px;margin:-2px}.acc .ac .eye .sv{width:14px;height:14px}
.acc .chip{padding:0;min-height:60px;border-radius:10px;display:grid;place-items:center}
.pin.tall{position:static}
@media(max-width:479px){.acc{grid-template-columns:repeat(2,minmax(0,1fr))}.acc .ac{padding:10px}.acc .ac>div:first-child{font-size:13px!important}.acc .ac b{font-size:15px}.acc .ac>div:last-child:not(:first-child){font-size:11px!important}.acc .ac .eye .sv{width:17px;height:17px}.pin.tall2{position:static}}
@media(min-width:640px){.acc .ac{padding:12px}.acc .ac>div:first-child{font-size:13px!important}.acc .ac b{font-size:15px}.acc .ac>div:last-child:not(:first-child){font-size:11px!important}.acc .ac .eye .sv{width:17px;height:17px}}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;position:relative}.donut:after{content:"";position:absolute;inset:32px;background:var(--sf);border-radius:50%}
.lg{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.empty{text-align:center;color:var(--mt);padding:60px 20px}.empty div{font-size:48px}
#dr{position:fixed;inset:0;z-index:10;display:none}#dr.on{display:flex}

#dr .bd{flex:1;background:#0008}
.nv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:13px 20px}.nv.on{background:#3b82f633;border-radius:0 24px 24px 0;margin-right:10px;width:calc(100% - 10px)}
.pf{padding:22px 20px;border-bottom:1px solid var(--ln)}
#md{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}#md.on{display:flex}
#md form{background:var(--sf);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mt);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.x{background:none;border:0;color:var(--mt);font-size:18px}
.sv{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv{color:var(--mt);font-size:14px;padding:12px 20px}.nv.on{color:var(--pr);font-weight:600}.nv .tg{margin-left:auto;font-size:11px;background:#22c55e;color:#fff;border-radius:6px;padding:2px 7px}.nv .ch{margin-left:auto}.nv.sb{padding-left:54px}
.sw{margin-left:auto;width:40px;height:22px;border-radius:11px;background:var(--ln);position:relative}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--pr)}.sw.on:after{left:21px}
hr{border:0;border-top:1px solid var(--ln);margin:6px 0}.empty .sv{width:44px;height:44px}
.acc{position:relative}.ac,.fc{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ac.drag,.fc.drag{position:relative;z-index:5;box-shadow:0 10px 24px #0006;filter:brightness(1.08);cursor:grabbing;transition:none!important}
body.dragging{user-select:none;-webkit-user-select:none}
.dv{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:6px 0 16px}.dv:before{content:"";flex:1;height:1px;background:var(--ln)}
.fcb{border:1px solid var(--ln);background:var(--sf);color:var(--pr);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.fcg{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;position:relative}
.fc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;min-height:96px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fc .fi{display:flex}.fc b{font-size:14px}.fc.fw{display:block;min-height:0;padding:14px 14px 22px}.fcv{font-size:20px;font-weight:700}.fsep{height:1px;background:var(--ln);margin:10px -14px 12px}.fc{position:relative}.fc.w1{grid-column:span 1}.fc.w2,.fc.w3{grid-column:span 2}.fc.fw h3{margin:0;font-size:15px}.fc.fw .row.hd{border:0;padding:0}
@media(min-width:640px){.fcg{grid-template-columns:repeat(3,minmax(0,1fr))}.fc.w3{grid-column:span 3}}
.rz{position:absolute;right:3px;bottom:3px;width:24px;height:24px;touch-action:none;cursor:nwse-resize;opacity:.6}.rz:after{content:"";position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-right:2px solid var(--mt);border-bottom:2px solid var(--mt);border-radius:0 0 3px 0}
@media(min-width:640px){main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 14px;align-items:start;padding:16px 20px 90px}main>.acc,main>.chips,main>.empty,main>.mt,main>.card:only-child{grid-column:1/-1}.fab{right:24px}}
@media(min-width:960px){body{padding-left:270px}#dr{display:flex!important;position:fixed;inset:0 auto 0 0;width:270px;z-index:4}#dr nav{width:100%;max-width:none;border-right:1px solid var(--ln)}#dr .bd{display:none}header>.ic{display:none}header{padding-left:24px}}
@media(max-width:639px){main{padding:12px 12px 90px}.fab{right:16px}}
.pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--bg);padding-top:12px;margin-top:-12px;grid-column:1/-1}.pin .acc{margin-bottom:8px}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}@keyframes fi{from{opacity:0}}@keyframes sl{from{transform:translateX(-100%)}}@keyframes su{from{transform:translateY(100%)}}@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1) rotate(0)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes spn{from{opacity:0;transform:rotate(-140deg) scale(.5)}}@keyframes flt{50%{transform:translateY(-8px)}}@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}@keyframes rw{from{opacity:0;transform:translateX(-10px)}}
body,header,.card,.chip,input,select,#dr nav,#md form{transition:background-color .3s,color .3s,border-color .3s}
main>*{animation:fu .45s cubic-bezier(.2,.7,.2,1) both}main>:nth-child(2){animation-delay:.06s}main>:nth-child(3){animation-delay:.12s}main>:nth-child(4){animation-delay:.18s}main>:nth-child(5){animation-delay:.24s}main>:nth-child(n+6){animation-delay:.3s}
.row{animation:rw .4s ease both}.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}.row:nth-child(4){animation-delay:.15s}.row:nth-child(n+5){animation-delay:.2s}
.ac{animation:fu .5s both;transition:transform .2s,box-shadow .2s}.ac:nth-child(2){animation-delay:.08s}.ac:nth-child(3){animation-delay:.16s}
.donut{animation:spn .9s cubic-bezier(.2,.8,.2,1) both}.bar i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}

<script>
/* ===== Sinkron Google Sheets () ===== */
(function () {
  var URL_API = 'https://script.google.com/macros/s/AKfycbxoHxOW-70GKwOFDjqhpgYMUo8VWk-blCjk1hI69xcRTjt9o-2lIXyIOTvbDI4K_2I-6Q/exec'; // URL Web App (/exec)
  var TOKEN = 'GANTI_DENGAN_KATA_SANDI_PANJANG_ACAK';                      // sama dengan Code.gs
  var KEY = 'mm', TSK = 'mm_ts', DELAY = 2500;
  var ls = window.localStorage, setI = Storage.prototype.setItem, remI = Storage.prototype.removeItem;
  var timer = null, busy = false, again = false;

  function num(k) { try { return Number(ls.getItem(k)) || 0; } catch (e) { return 0; } }
  function badge(t, ok) {
    var b = document.getElementById('syncb');
    if (!b) {
      b = document.createElement('div'); b.id = 'syncb';
      b.style.cssText = 'position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font:11px system-ui;padding:3px 8px;border-radius:10px;background:#0006;color:#fff;z-index:2;pointer-events:none';
      document.body.appendChild(b);
    }
    b.textContent = t; b.style.background = ok === false ? '#dc2626cc' : '#0006';
  }

  // tangkap setiap penyimpanan data aplikasi
  Storage.prototype.setItem = function (k, v) {
    setI.call(this, k, v);
    if (this === ls && k === KEY) { setI.call(ls, TSK, String(Date.now())); schedule(); }
  };
  Storage.prototype.removeItem = function (k) {
    remI.call(this, k);
    if (this === ls && k === KEY) setI.call(ls, TSK, String(Date.now())); // reset sengaja, jangan ditimpa cloud
  };

  function schedule() { clearTimeout(timer); timer = setTimeout(push, DELAY); }

  function push(force) {
    if (busy) { again = true; return; }
    var raw = ls.getItem(KEY); if (!raw) return;
    busy = true; badge('Menyimpan…');
    fetch(URL_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain = tanpa preflight CORS
      body: JSON.stringify({ token: TOKEN, action: 'save', data: JSON.parse(raw), base: num('mm_base'), force: force === true })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) { setI.call(ls, 'mm_base', String(j.ts)); badge('Tersimpan ☁'); }
      else if (j.conflict) {
        badge('Data cloud lebih baru', false);
        if (confirm('Data di Google Sheets lebih baru (perangkat lain).\nOK = ambil data cloud\nBatal = timpa cloud dengan data ini')) pull(true);
        else push(true);
      } else badge('Gagal: ' + (j.error || '?'), false);
    }).catch(function () { badge('Offline - ditunda', false); })
      .then(function () { busy = false; if (again) { again = false; schedule(); } });
  }

  function pull(ask) {
    fetch(URL_API + '?action=load&token=' + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) return badge('Gagal: ' + (j.error || '?'), false);
      var localTs = num(TSK), localBase = num('mm_base');
      if (j.data && j.ts > localBase && (ask || j.ts > localTs)) {
        setI.call(ls, KEY, JSON.stringify(j.data));
        setI.call(ls, 'mm_base', String(j.ts)); setI.call(ls, TSK, String(j.ts));
        if (!sessionStorage.getItem('mm_rl')) { sessionStorage.setItem('mm_rl', '1'); location.reload(); }
      } else {
        sessionStorage.removeItem('mm_rl');
        badge(j.data ? 'Sinkron ☁' : 'Cloud kosong');
        if (!j.data && ls.getItem(KEY)) push(true);   // unggah awal
        else if (localTs > j.ts) schedule();          // ada perubahan lokal yang belum terkirim
      }
    }).catch(function () { badge('Offline', false); });
  }

  window.addEventListener('load', function () { pull(false); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && timer) { clearTimeout(timer); push(); } });
})();
</script>

  const pack=D.pack.map((r,i)=>`<div style="margin-top:10px"><select data-t="pack" data-i="${i}" onchange="pdSel(this)">${opt(r.b,'pack')}</select><div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:6px;align-items:center">${ni(`data-t="pack" data-i="${i}" data-k="j" oninput="pdIn(this)"`,'Jumlah per 1 produk',r.j)}<button type="button" class="x" aria-label="Hapus baris" onclick="pdDel('pack',${i})">✕</button></div></div>`).join('');
  fm.innerHTML=`<h3 style="margin:0">${D.id?'Ubah':'Tambah'} Produk</h3>

<div class="mt" style="margin-top:6px">Satuan isi kemasan produk, mis. kg. Persen otomatis dihitung hanya untuk bahan yang satuannya sama; bahan bersatuan lain (karung, liter, drum) isi Jumlah saja.</div>

${mix}<button type="button" class="btn o" style="margin-top:10px;padding:7px 14px" onclick="pdAdd('mix')">+ Bahan</button>
<h3 style="margin:18px 0 0;font-size:15px">Tahap 2 · Packing</h3>
<div class="mt">Pilih dari Bahan Packing di menu Inventori: kemasan, benang, label, dus, dll untuk tiap 1 produk.</div>${packing().length?'':'<div class="bbpk">Belum ada bahan packing.<br><button type="button" class="btn" onclick="cl();INVT=\'inv_packing\';go(\'inv_stok\')">Buka Bahan Packing</button></div>'}
${pack}<button type="button" class="btn o" style="margin-top:10px;padding:7px 14px" onclick="pdAdd('pack')">+ Bahan Packing</button>

  fm.onsubmit=e=>{e.preventDefault();save()};fm.oninput=null;fm.scrollTop=st;sum()}
function sum(){
  const el=$('#pdsum');if(!el)return;{const pe=$('#pderr');if(pe)pe.textContent=''}
  const tp=D.mix.reduce((a,r)=>a+num(r.p),0),c1=cost(D.mix),c2=cost(D.pack),hpp=c1+c2,mg=num(D.v)-hpp,allp=D.mix.every(r=>num(r.p)>0),ok=!allp||Math.abs(tp-100)<=.05;
  el.innerHTML=`<div class="row"><span>Total persen${allp?' campuran':' (bahan berpersen)'}</span><b style="color:${ok?'var(--inc)':'var(--ex)'}">${fmt(tp)}%</b></div><div class="row"><span>Biaya tahap 1 (campur)</span><b>${rp(c1)}</b></div><div class="row"><span>Biaya tahap 2 (packing)</span><b>${rp(c2)}</b></div><div class="row"><span>HPP per 1 produk</span><b>${rp(hpp)}</b></div><div class="row"><span>Margin per produk</span><b style="color:${mg<0?'var(--ex)':'var(--inc)'}">${rp(mg)}</b></div>`}
const uu=b=>{const x=bf(b);return x&&x.s?' '+esc(x.s):''};
const same=r=>{const x=bf(r.b),u=String(D.us||'').trim().toLowerCase();return !x||!x.s||!u||x.s.trim().toLowerCase()==u};
const inp=(t,i,k)=>$('#fm').querySelector(`input[data-t="${t}"][data-i="${i}"][data-k="${k}"]`);
window.pdTop=function(k,v){D[k]=v;if(k=='iso'){const iso=num(v);D.mix.forEach((r,i)=>{if(iso>0&&r.p!==''&&r.p!=null&&same(r)){r.j=r6(num(r.p)*iso/100);const e=inp('mix',i,'j');if(e)e.value=r.j}})}sum()};
window.pdIn=function(el){
  const t=el.dataset.t,i=+el.dataset.i,k=el.dataset.k,r=D[t][i];r[k]=el.value;
  if(t=='mix'){const iso=num(D.iso);if(iso>0&&same(r)){
    if(k=='p'){r.j=el.value===''?'':r6(num(r.p)*iso/100);const e=inp('mix',i,'j');if(e)e.value=r.j}
    else{r.p=el.value===''?'':r4(num(r.j)/iso*100);const e=inp('mix',i,'p');if(e)e.value=r.p}}}

window.pdSel=function(el){const r=D[el.dataset.t][+el.dataset.i];r.b=el.value;if(el.dataset.t=='mix'&&!same(r))r.p='';draw()};
window.pdAdd=function(t){D[t].push(t=='mix'?{b:'',p:'',j:''}:{b:'',j:''});draw()};
window.pdDel=function(t,i){D[t].splice(i,1);draw()};
const err=m=>{const e=$('#pderr');if(e){e.textContent=m;e.scrollIntoView({block:'center'})}else alert(m)};
function save(){
  const n=String(D.n).trim(),iso=num(D.iso);
  if(!n)return err('Nama produk tidak boleh kosong.');
  if(!(iso>0))return err('Isi per 1 produk harus lebih dari 0.');
  const mix=D.mix.filter(r=>r.b||r.p!==''||r.j!==''),pack=D.pack.filter(r=>r.b||r.j!=='');
  if(!mix.length)return err('Tahap 1 minimal punya satu bahan mentah.');
  if(mix.some(r=>!r.b||!(num(r.j)>0)))return err('Tahap 1: setiap baris harus memilih bahan dan mengisi persen/jumlah.');
  if(pack.some(r=>!r.b||!(num(r.j)>0)))return err('Tahap 2: setiap baris harus memilih bahan packing dan mengisi jumlah.');
  if(new Set(mix.map(r=>r.b)).size<mix.length)return err('Tahap 1: ada bahan yang dipilih dua kali. Gabungkan jadi satu baris.');
  if(new Set(pack.map(r=>r.b)).size<pack.length)return err('Tahap 2: ada kemasan yang dipilih dua kali. Gabungkan jadi satu baris.');
  const tp=mix.reduce((a,r)=>a+num(r.p),0);
  if(mix.every(r=>num(r.p)>0)&&Math.abs(tp-100)>.05)return err('Total persen campuran harus 100% (sekarang '+fmt(tp)+'%).');
  const rec={id:D.id||uid(),n,v:num(D.v),iso,us:String(D.us||'').trim(),q:0,
    mix:mix.map(r=>({b:r.b,p:num(r.p),j:num(r.j)})),pack:pack.map(r=>({b:r.b,j:num(r.j)}))};
  ask('Simpan produk dan resepnya?',()=>{
    const l=S.g.inv_produk=S.g.inv_produk||[],i=l.findIndex(p=>p.id==rec.id);
    if(i>=0){rec.q=l[i].q||0;l[i]=rec}else l.push(rec);
    sv();cl();go(cur,1)},'Simpan')}

/* ---------- Produksi ---------- */
let RN=null;
window.pdRun=function(id){
  const x=prods().find(p=>p.id==id);if(!x)return;
  RN={id,qty:''};const fm=$('#fm');
  fm.innerHTML=`<h3 style="margin:0">Produksi ${esc(x.n)}</h3><label>Jumlah kemasan yang dibuat</label><input id="pdq" type="number" min="0" step="any" inputmode="decimal" oninput="pdRunUp(this.value)" required><label>Lama fermentasi (hari, opsional)</label><input id="pdfd" type="number" min="0" step="1" inputmode="numeric" placeholder="Contoh: 14"><div id="pdn"></div>${btns('Mulai Campur')}`;
  fm.onsubmit=e=>{e.preventDefault();start()};runUp();open()};
window.pdRunUp=function(v){RN.qty=v;runUp()};
const mk=()=>{const d='B'+today().replace(/-/g,''),n=batches().filter(z=>z.k&&z.k.indexOf(d)==0).length+1;return d+'-'+String(n).padStart(3,'0')};
const scale=(l,q)=>l.map(r=>({b:r.b,n:(bf(r.b)||{}).n||'(bahan dihapus)',j:r6(num(r.j)*q)}));
function runUp(){
  const x=prods().find(p=>p.id==RN.id),q=num(RN.qty),el=$('#pdn');if(!x||!el)return;
  const rows=(l,note)=>check(scale(l,q)).map(c=>`<div class="row"><span>${esc(c.n)}</span><span style="color:${c.ok?'var(--inc)':'var(--ex)'}">butuh ${fmt(c.need)}${uu(c.b)} · stok ${fmt(c.has)}${uu(c.b)}${c.ok?'':' (kurang '+fmt(c.need-c.has)+')'}</span></div>`).join('')||`<div class="mt">-</div>`;
  const c=(x.mix||[]).concat(x.pack||[]);
  el.innerHTML=q>0?`<div class="card" style="margin:14px 0 0"><div class="mt"><b>Tahap 1 · Campur &amp; fermentasi</b> (dipakai sekarang)</div>${rows(x.mix||[])}<div class="mt" style="margin-top:10px"><b>Tahap 2 · Packing</b> (dipakai saat lanjut ke Packing)</div>${rows(x.pack||[])}<div class="row"><span>Perkiraan modal</span><b>${rp(cost(c)*q)}</b></div></div>`:`<div class="mt" style="margin-top:10px">Isi jumlah untuk melihat kebutuhan bahan.</div>`}
function start(){
  const x=prods().find(p=>p.id==RN.id),q=num(RN.qty),fh=Math.max(0,Math.floor(num($('#pdfd')&&$('#pdfd').value)));
  if(!x)return;if(!(q>0))return alert('Jumlah produksi harus lebih dari 0.');
  const mix=scale(x.mix||[],q),pack=scale(x.pack||[],q),bad=check(mix).filter(c=>!c.ok);

  ask(`Mulai campur ${fmt(q)} ${esc(x.n)}? Bahan mentah tahap 1 akan langsung mengurangi stok.`,()=>{
    const c1=mix.reduce((a,r)=>a+r.j*uc(bf(r.b)),0);

    (S.g.batch=S.g.batch||[]).push({id:uid(),k:mk(),pid:x.id,n:x.n,qty:q,st:'campur',d:today(),mix,pack,c1,fh,rd:fh?new Date(Date.now()+fh*864e5).toISOString().slice(0,10):''});
    sv();cl();go(cur,1)},'Mulai')}
window.pdNext=function(id){
  const b=batches().find(z=>z.id==id);if(!b)return;
  if(!b.k)b.k=mk();

  const ck=b.pack.map(r=>`<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" class="pdck" style="width:auto;margin:0"> ${esc(r.n)} · ${fmt(r.j)}</label>`).join('')||'<div class="mt">-</div>';
  const qc=['Fermentasi matang (suhu stabil, tidak berbau menyengat)','Kadar air sesuai (tidak basah / menggumpal)','Tercampur merata, tanpa benda asing'].map(t=>`<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" class="pdck" style="width:auto;margin:0"> ${t}</label>`).join('');

<div class="card" style="margin:12px 0 0"><div class="mt"><b>1. Resep yang sudah dicampur</b></div>${mx}</div>
<div class="card" style="margin:12px 0 0"><div class="mt"><b>2. Cek mutu pupuk (wajib)</b></div>${b.rd&&today()<b.rd?`<div class="mt" style="color:var(--ex)">Jadwal fermentasi baru selesai ${esc(b.rd)}.</div>`:''}${qc}</div>
<div class="card" style="margin:12px 0 0"><div class="mt"><b>3. Kemasan siap? Centang semua</b></div>${ck}</div>
<label>4. Hasil jadi layak (aktual)</label><input id="pdact" type="number" min="0" step="any" inputmode="decimal" value="${b.qty}" required>

  fm.onsubmit=e=>{e.preventDefault();

    b.pack=pk;b.qc=1;b.act=a;b.rej=r6(b.qty-a);b.ck=new Date().toISOString();b.st='packing';
    sv();cl();go(cur,1)};
  open()};
window.pdDone=function(id){

  ask(`Batalkan produksi ${esc(b.n)} × ${fmt(b.qty)}? Bahan mentah${b.st=='packing'?' dan kemasan':''} dikembalikan ke stok.`,()=>{
    b.mix.forEach(r=>{const x=bf(r.b);if(x)setStock(x,(+x.q||0)+r.j)});
    if(b.st=='packing')b.pack.forEach(r=>{const x=bf(r.b);if(x)setStock(x,(+x.q||0)+r.j)});
    S.g.batch=batches().filter(z=>z.id!=id);sv();go(cur,1)},'Batalkan',1)};

/* tombol (+) di menu Produksi membuka form resep */
window.pdCost=x=>cost(x.mix||[])+cost(x.pack||[]);
const _ag=window.addG;window.addG=function(k){if(k=='inv_produk')return pdEdit();return _ag.apply(this,arguments)};
})();

/* ===== Bahan Baku: banyak pengiriman, tiap pengiriman banyak bahan, ongkir dibagi ===== */
(function(){
const num=v=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)?v:0};
const f=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID');
const OT={antar:['Diantar penjual',1],jemput:['Dijemput sendiri',1],potong:['Potongan / subsidi ongkir',-1]};
let D=[],K='inv_bahan';
const KT=()=>K=='inv_packing'?'Bahan Packing':'Bahan Baku',KP=()=>K=='inv_packing'?'Contoh: Karung 25 kg, Benang jahit karung':'Contoh: Kotoran kambing (kohe)';
const bi=()=>({n:'',q:'',v:'',s:''}),bg=()=>({on:'',ot:'antar',o:'',bs:'nilai',items:[bi()]});
const sgn=g=>OT[g.ot][1]*num(g.o);
function alloc(g){
  const it=g.items,w=it.map(r=>g.bs=='qty'?num(r.q):g.bs=='sama'?1:num(r.q)*num(r.v));
  let tw=w.reduce((a,x)=>a+x,0);if(!(tw>0)){w.fill(1);tw=w.length}
  const T=Math.round(sgn(g));let used=0;
  return w.map((x,i)=>{if(i==w.length-1)return T-used;const v=Math.round(T*x/tw);used+=v;return v})}
function draw(){
  const fm=$('#fm'),st=fm.scrollTop;
  const ni=(gi,i,k,ph,v)=>`<input type="number" min="0" step="any" inputmode="decimal" placeholder="${ph}" value="${v===''||v==null?'':v}" data-g="${gi}" ${i==null?'':`data-i="${i}"`} data-k="${k}" oninput="bbIn(this)">`;
  const sel=(gi,k,o,v)=>`<select data-g="${gi}" data-k="${k}" onchange="bbIn(this)">${o.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>${x[1]}</option>`).join('')}</select>`;
  fm.innerHTML=`<datalist id="pdu"><option value="kg"><option value="karung"><option value="liter"><option value="drum"><option value="gram"><option value="pcs"><option value="lembar"><option value="roll"></datalist><h3 style="margin:0">Tambah ${KT()}</h3><div class="mt" style="margin-top:4px">Satu pengiriman bisa berisi beberapa bahan. Ongkirnya dibagi otomatis ke tiap bahan.</div>`+D.map((g,gi)=>`<div class="card" style="margin:14px 0 0"><div class="row" style="padding-top:0"><b>Pengiriman ${gi+1}</b>${D.length>1?`<button type="button" class="x" aria-label="Hapus pengiriman" onclick="bbDelG(${gi})">✕</button>`:''}</div>
${g.items.map((r,i)=>`<div style="border:1px solid var(--ln);border-radius:12px;padding:10px;margin-top:10px"><div class="row" style="border:0;padding:0"><span class="mt">Bahan ${i+1}</span>${g.items.length>1?`<button type="button" class="x" aria-label="Hapus bahan" onclick="bbDel(${gi},${i})">✕</button>`:''}</div>
<label style="margin-top:4px">Nama ${KT()}</label><input value="${esc(r.n)}" data-g="${gi}" data-i="${i}" data-k="n" oninput="bbIn(this)" placeholder="${KP()}">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Stok (jumlah)</label>${ni(gi,i,'q','0',r.q)}</div><div><label>Satuan</label><input list="pdu" value="${esc(r.s||'')}" data-g="${gi}" data-i="${i}" data-k="s" oninput="bbIn(this)" placeholder="${K=='inv_packing'?'lembar / pcs / roll':'kg / karung / liter'}" maxlength="12"></div></div><label>Harga per satuan (Rp)</label>${ni(gi,i,'v','0',r.v)}
<div class="mt" style="margin-top:8px" id="bbs${gi}_${i}"></div></div>`).join('')}
<button type="button" class="btn o" style="margin-top:10px;padding:6px 14px;font-size:13px" onclick="bbAdd(${gi})">+ Bahan di pengiriman ini</button>
<h4 style="margin:16px 0 0;font-size:14px">Ongkir pengiriman ini</h4>
<label>Nama Ongkir</label><input value="${esc(g.on)}" data-g="${gi}" data-k="on" oninput="bbIn(this)" placeholder="Contoh: JNE, kurir toko, bensin">
<label>Jenis</label>${sel(gi,'ot',Object.keys(OT).map(k=>[k,OT[k][0]]),g.ot)}
<div class="mt" style="margin-top:4px;font-size:12px">Diantar: biaya kirim menambah modal. Dijemput: isi biaya jemput sendiri (boleh 0). Potongan: mengurangi modal.</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Ongkir Total (Rp)</label>${ni(gi,null,'o','0',g.o)}</div><div><label>Dibagi berdasarkan</label>${sel(gi,'bs',[['nilai','Nilai bahan'],['qty','Jumlah stok'],['sama','Sama rata']],g.bs)}</div></div></div>`).join('')+`<button type="button" class="btn o" style="margin-top:12px;padding:8px 16px" onclick="bbAddG()">+ Pengiriman lain</button><div class="card" id="bbt" style="margin:14px 0 0"></div><div style="display:flex;gap:8px;margin-top:16px"><button type="button" class="btn o" style="flex:1" onclick="cl()">Batal</button><button class="btn" style="flex:1">Simpan</button></div>`;
  fm.onsubmit=e=>{e.preventDefault();save()};fm.oninput=null;fm.scrollTop=st;sum()}
function sum(){
  let sb=0,og=0,n=0;
  D.forEach((g,gi)=>{const a=alloc(g);og+=Math.round(sgn(g));g.items.forEach((r,i)=>{const q=num(r.q),b=q*num(r.v);sb+=b;n++;const t=b+a[i],e=$('#bbs'+gi+'_'+i);if(e)e.innerHTML=`Ongkir bagian bahan ini <b>${f(a[i])}</b> · Total ${f(t)}${q>0?'<br>Harga per satuan (incl. ongkir) <b>'+f(t/q)+'</b>':''}`})});
  const el=$('#bbt');if(!el)return;
  el.innerHTML=`<div class="row"><span>Subtotal bahan (${n})</span><b>${f(sb)}</b></div><div class="row"><span>Total ongkir / potongan</span><b class="${og<0?'in':''}">${f(og)}</b></div><div class="row"><span>Total modal</span><b>${f(sb+og)}</b></div>`}
window.bbIn=function(el){const g=D[+el.dataset.g];if(el.dataset.i!=null)g.items[+el.dataset.i][el.dataset.k]=el.value;else g[el.dataset.k]=el.value;sum()};
window.bbAdd=function(gi){D[gi].items.push(bi());draw();const l=$('#fm').querySelectorAll('input[data-g="'+gi+'"][data-k="n"]');if(l.length)l[l.length-1].focus()};
window.bbDel=function(gi,i){D[gi].items.splice(i,1);draw()};
window.bbAddG=function(){D.push(bg());draw()};
window.bbDelG=function(gi){D.splice(gi,1);draw()};
function save(){
  const out=[];
  for(let gi=0;gi<D.length;gi++){const g=D[gi],a=alloc(g),rows=g.items.map((r,i)=>({r,o:a[i]})).filter(x=>x.r.n.trim()||x.r.q!==''||x.r.v!=='');
    if(!rows.length){if(num(g.o)||g.on.trim())return alert('Pengiriman '+(gi+1)+': ada ongkir tapi belum ada bahan.');continue}
    const nm=g.items.findIndex(r=>!r.n.trim()&&(r.q!==''||r.v!==''));if(nm>=0)return alert('Pengiriman '+(gi+1)+': nama bahan wajib diisi.');
    const al=alloc({...g,items:rows.map(x=>x.r)});
    rows.forEach((x,i)=>{const t=num(x.r.q)*num(x.r.v)+al[i];if(t<0)return out.err=out.err||'Pengiriman '+(gi+1)+': potongan terlalu besar sehingga modal '+x.r.n.trim()+' menjadi negatif.';out.push({id:uid(),n:x.r.n.trim(),s:String(x.r.s||'').trim(),q:num(x.r.q),v:num(x.r.v),o:al[i],on:g.on.trim(),ot:num(g.o)||g.on.trim()?OT[g.ot][0]:''})})}
  if(out.err)return alert(out.err);
  if(!out.length)return alert('Isi minimal satu bahan baku.');
  ask('Simpan '+out.length+' '+KT().toLowerCase()+'?',()=>{const l=S.g[K]=S.g[K]||[];out.forEach(x=>l.push(x));sv();cl();go(cur,1)},'Simpan')}
const _ag=window.addG;
window.addG=function(k){
  if(k=='inv_bahan'||k=='inv_packing'){K=k;D=[bg()];draw();$('#md').classList.remove('side');$('#md').classList.add('on');return}
  return _ag.apply(this,arguments)};
})();

/* ===== Inventori gabungan: Bahan Baku + Bahan Packing + Produk (bisa difilter per tab) ===== */
let INVT='all';
(function(){
const sty=document.createElement('style');sty.textContent=`
.ivt{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding:4px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;grid-column:1/-1}
.ivt button{flex:1 0 auto;border:0;background:transparent;color:var(--mt);font:inherit;font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.ivt button.on{background:var(--pr);color:#fff}
.ivt button small{opacity:.8;margin-left:4px;font-weight:600}
.ivs{grid-column:1/-1;min-width:0;margin-bottom:12px}
.ivch{display:flex;flex-direction:column;gap:8px}
.ivch .btn{width:100%}`;document.head.appendChild(sty);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('id-ID');
const TABS=[['all','Semua'],['inv_bahan','Bahan Baku'],['inv_packing','Bahan Packing'],['inv_produk','Produk']];
const cnt=k=>(S.g[k]||[]).length;
window.invTab=k=>{INVT=k;go(cur,1)};

function PRL(){
  const l=S.g.inv_produk||[],stok=l.reduce((a,x)=>a+(+x.q||0),0),nilai=l.reduce((a,x)=>a+(+x.q||0)*(+x.v||0),0);
  const st=(t,v,i)=>`<div class="bbst"><span class="bbi">${I(i)}</span><div><div class="mt">${t}</div><b>${v}</b></div></div>`;
  const head=`<div class="bbs">${st('Nilai stok jual',rp(nilai),'wallet')}${st('Jumlah produk',fmt(l.length),'store')}${st('Total stok',fmt(stok),'box')}</div>`;
  const bar=`<div class="bbh"><b>Daftar Produk</b><button class="btn" onclick="addG('inv_produk')">+ Tambah</button></div>`;
  if(!l.length)return`<div class="bb">${head}<div class="card bbc">${bar}<div class="bbe"><span class="bbo">${I('store')}</span><b>Belum ada produk</b><p class="mt">Produk dibuat lewat resep (campur bahan, lalu packing). Stok produk jadi bertambah saat produksi diselesaikan.</p><button class="btn" onclick="addG('inv_produk')">+ Tambah Produk</button></div></div></div>`;
  return`<div class="bb">${head}<div class="card bbc">${bar}${l.map(x=>{
    const q=+x.q||0,v=+x.v||0,hpp=window.pdCost?window.pdCost(x):0,mg=v-hpp;
    return`<div class="row bbr"><div class="bbm"><b>${esc(x.n)}</b><div class="mt">Stok ${fmt(q)} × ${rp(v)}</div><div class="mt">HPP ${rp(hpp)} · Margin <span style="color:${mg<0?'var(--ex)':'var(--inc)'}">${rp(mg)}</span></div><div><button class="bbmv" onclick="pdEdit('${x.id}')">Ubah Resep</button> <button class="bbmv" onclick="go('inv_produk')">Ke Produksi</button></div></div><div class="bbv"><b>${rp(q*v)}</b><div class="mt">Nilai jual</div></div><button class="x" aria-label="Hapus" onclick="delG('inv_produk','${x.id}')">✕</button></div>`}).join('')}</div></div>`;
}
const view=k=>k=='inv_produk'?PRL():BBL(k);

R.inv_stok=function(){
  const tabs=`<div class="ivt" role="tablist">${TABS.map(t=>`<button type="button" role="tab" class="${INVT==t[0]?'on':''}" aria-selected="${INVT==t[0]}" onclick="invTab('${t[0]}')">${t[1]}${t[0]=='all'?'':`<small>${cnt(t[0])}</small>`}</button>`).join('')}</div>`;
  const body=INVT=='all'?['inv_bahan','inv_packing','inv_produk'].map(k=>`<div class="ivs">${view(k)}</div>`).join(''):view(INVT);
  return tabs+body};

/* tombol (+): sesuai tab aktif; di tab Semua tampilkan pilihan */
const _ag2=window.addG;
window.addG=function(k){
  if(k!='inv_stok')return _ag2.apply(this,arguments);
  if(INVT!='all')return _ag2(INVT);
  const f=$('#fm');
  f.innerHTML=`<h3 style="margin:0 0 12px">Tambah ke Inventori</h3><div class="ivch"><button type="button" class="btn" onclick="cl();addG('inv_bahan')">Bahan Baku</button><button type="button" class="btn" onclick="cl();addG('inv_packing')">Bahan Packing</button><button type="button" class="btn" onclick="cl();addG('inv_produk')">Produk</button><button type="button" class="btn o" onclick="cl()">Batal</button></div>`;
  f.onsubmit=e=>e.preventDefault();
  $('#md').classList.remove('side');$('#md').classList.add('on')};
ADD.inv_stok='addG';
})();

go('beranda');

(()=>{const t=Date.now(),e=document.getElementById('ld');setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),600)},Math.max(0,4200-(Date.now()-t)))})();
</script><script>
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body></html>
