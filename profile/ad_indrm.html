<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile Space – Adi Indra Muliani</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#030305;--ink:#dedad6;--mute:#85808f;--red:#b4b4be;--hot:#d6d6dc;--on:#08070a;--gold:#d19a2e;--line:rgba(255,255,255,.1);--grade:brightness(.78) contrast(1.12) saturate(.8);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
body{height:100%;background:var(--bg);color:var(--ink);font-family:'Rajdhani','Segoe UI',sans-serif;font-weight:600;font-size:1.1rem;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.d{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:.02em}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(80% 40% at 50% 112%,rgba(255,255,255,.015),transparent 70%),radial-gradient(120% 80% at 70% 20%,#0b0a0e 0,#030304 50%,#000 100%)}
#fx,#smk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
#fx{opacity:1}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}

/* START */
#start{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2rem;padding:1rem}
.logo{display:flex;align-items:center;gap:.5rem}
.names{display:flex;flex-direction:column;align-items:center;line-height:.85;font-size:clamp(4rem,16vw,12rem)}
.l1{animation:fromL 1.2s .2s cubic-bezier(.22,1,.36,1) both}
.l2{color:transparent;-webkit-text-stroke:2px var(--ink);animation:fromR 1.2s .4s cubic-bezier(.22,1,.36,1) both}
#press{font-size:clamp(.75rem,1.4vw,.95rem);letter-spacing:.22em;padding:.4rem 1.4rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);animation:fade 1s 1.7s both,blink 2.4s 2.7s ease-in-out infinite}
.copy{position:absolute;bottom:max(1rem,env(safe-area-inset-bottom,0px));font-size:.9rem;color:var(--mute);animation:fade 1s 2s both}

/* MENU */
#menu{flex-direction:row;align-items:stretch;padding:clamp(1rem,4vw,3rem);gap:2rem}
.mtop{position:absolute;top:clamp(1rem,3vw,2rem);left:clamp(1rem,4vw,3rem);font-size:1.8rem;display:flex;align-items:center;gap:.7rem;animation:fromL .9s var(--o,0s) cubic-bezier(.22,1,.36,1) both}
.mtop::before{content:"";width:34px;height:12px;background:var(--red);transform:skewX(-30deg)}
.list{display:flex;flex-direction:column;justify-content:center;gap:.5rem;width:min(460px,100%);z-index:1}
.item{position:relative;isolation:isolate;overflow:hidden;display:block;text-align:left;padding:.65rem 1.6rem;transform:skewX(-14deg);border-bottom:0;transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s;animation:itemIn .8s calc(var(--d) + var(--o,0s)) cubic-bezier(.22,1,.36,1) backwards}
.item span{display:block;transform:skewX(14deg)}
.item .t{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1;letter-spacing:.04em}
.item .s{font-size:.95rem;color:var(--mute)}
.item::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#c4c4ce 0%,rgba(176,176,188,.9) 50%,rgba(120,120,134,.32) 100%);transform:translateX(-101%);transition:transform .55s cubic-bezier(.22,1,.36,1)}
.item.sel{transform:skewX(-14deg) translateX(18px);box-shadow:inset 6px 0 0 var(--gold)}
.item.sel::before{transform:none}
.item.sel .t{color:var(--on)}.item.sel .s{color:#4a4a55}
.item.sel::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(140,140,160,.45),transparent);animation:sheen 1.4s cubic-bezier(.22,1,.36,1)}
.item:focus-visible,.cl:focus-visible,.back:focus-visible,#press:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.preview{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ghost{position:absolute;right:-2%;top:50%;transform:translateY(-50%);font-size:clamp(7rem,22vw,19rem);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.07);white-space:nowrap;pointer-events:none;animation:pv .9s var(--o,0s) cubic-bezier(.22,1,.36,1) both}
.pv{position:relative;animation:pv .7s var(--o,0s) cubic-bezier(.22,1,.36,1) both}
.pv h2{font-size:clamp(3rem,8vw,6rem);line-height:.95;color:var(--ink)}
.pv p{max-width:36ch;margin:.8rem 0 1rem;color:#b0abb8;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:.5rem}
.tag{padding:.15rem .9rem;font-size:.95rem;background:rgba(255,255,255,.08);border-left:3px solid var(--red);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.hints{position:absolute;bottom:max(1rem,env(safe-area-inset-bottom,0px));left:clamp(1rem,4vw,3rem);display:flex;gap:1.4rem;color:var(--mute);font-size:.95rem;animation:fade 1s calc(1s + var(--o,0s)) both}
kbd{font:inherit;color:var(--ink);border:1px solid var(--line);padding:0 .45rem;margin-right:.35rem;background:rgba(255,255,255,.06)}

/* PAGE */
#page{flex-direction:column;padding:clamp(1rem,4vw,3rem);overflow-y:auto;overflow-x:hidden}
.phead{display:flex;align-items:center;gap:1.2rem;padding-bottom:.6rem;border-bottom:2px solid var(--red);animation:fromL .9s cubic-bezier(.22,1,.36,1) both}
.back{padding:.35rem 1.1rem;background:var(--red);color:var(--on);transform:skewX(-14deg);transition:background .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1)}
.back span{display:block;transform:skewX(14deg)}
.back:hover{background:var(--hot);transform:skewX(-14deg) translateX(-4px)}
#ptitle{font-size:clamp(2.6rem,7vw,4.4rem);line-height:1}
.body{margin-top:1.5rem;animation:fade .7s .3s both}
.prof{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:2rem}
.fighter{position:relative;aspect-ratio:var(--ar,4/5);display:flex;flex-direction:column;align-items:center;justify-content:center;clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));background:linear-gradient(160deg,#2a2a31,#0b0a0f 70%);animation:slam2 1s .3s cubic-bezier(.22,1,.36,1) both}
.fighter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.05) 14px 16px)}
.fighter em{position:absolute;top:1rem;left:1.2rem;font-style:normal;color:var(--gold);letter-spacing:.2em;font-size:.9rem}
.info h3{font-size:clamp(2rem,5vw,3.2rem);line-height:1}
.info .bio{max-width:54ch;margin:.7rem 0 1.2rem;color:#b0abb8;line-height:1.4;animation:up .9s .4s cubic-bezier(.22,1,.36,1) both}
.row{display:flex;gap:1rem;padding:.55rem .2rem;border-bottom:1px solid var(--line);animation:up .8s var(--d) cubic-bezier(.22,1,.36,1) both}
.row span:first-child{width:9.5rem;color:var(--gold);flex:none}
.stats{display:flex;gap:2.2rem;margin-top:1.4rem;flex-wrap:wrap}
.stat{animation:up .9s var(--d) cubic-bezier(.22,1,.36,1) both}
.stat b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:3.6rem;line-height:1;color:var(--hot)}
.stat span{color:var(--mute);font-size:.95rem}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.4rem 3rem;max-width:1000px}
.sk{animation:fromL .9s var(--d) cubic-bezier(.22,1,.36,1) both}
.sk div:first-child{display:flex;justify-content:space-between;margin-bottom:.35rem}
.sk b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.5rem;color:var(--gold);line-height:1}
.bar{height:14px;background:rgba(255,255,255,.08);transform:skewX(-20deg);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);transform-origin:left;background:linear-gradient(90deg,var(--red),var(--gold));animation:bar 1.4s var(--d) cubic-bezier(.22,1,.36,1) backwards}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.4rem}
.card{position:relative;background:#0c0b0f;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%);transition:transform .5s cubic-bezier(.22,1,.36,1),background .5s;animation:up .9s var(--d) cubic-bezier(.22,1,.36,1) both;border-top:3px solid var(--red)}
.card:hover{transform:translateY(-6px);background:#15141a}
.th{height:130px;position:relative;background:linear-gradient(135deg,hsl(var(--h) var(--sat,80%) 38%),hsl(calc(var(--h) + 60) var(--sat,60%) 12%))}
.th::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 12px,rgba(255,255,255,.07) 12px 14px)}
.rank{position:absolute;top:.4rem;right:.9rem;font-family:'Bebas Neue',Impact,sans-serif;font-size:3.6rem;line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(246,196,83,.6)}
.cb{padding:1rem 1.2rem 1.4rem}
.cb h3{font-size:2rem;line-height:1}
.cb p{margin:.4rem 0 .8rem;color:#cfc9d6;line-height:1.3;font-size:1rem}
.links{display:flex;flex-direction:column;gap:.6rem;max-width:560px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.6rem;border-bottom:1px solid var(--line);transform:skewX(-14deg);text-decoration:none;color:var(--ink);transition:background .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1);animation:itemIn .8s var(--d) cubic-bezier(.22,1,.36,1) backwards}
.cl span{transform:skewX(14deg)}
.cl .d{font-size:2rem}
.cl small{color:var(--mute);font-size:1rem}
.cl:hover,.cl:focus-visible{background:linear-gradient(90deg,#c4c4ce 0%,rgba(176,176,188,.9) 50%,rgba(120,120,134,.32) 100%);color:var(--on);transform:skewX(-14deg) translateX(16px)}.cl:hover small,.cl:focus-visible small{color:#3a3a44}
.wipe{position:absolute;inset:0 -30%;background:linear-gradient(90deg,#0b0b0f,#1b1b22);transform:translateX(-120%) skewX(-20deg);z-index:9;pointer-events:none}

/* RUANGAN + AKTOR */
.room{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.room i{position:absolute;display:block}
.wall{inset:-4%;translate:calc(var(--mx,0)*-8px) calc(var(--my,0)*-4px);background:radial-gradient(70% 90% at 78% 30%,rgba(120,130,170,.05),transparent 70%)}
.actor{position:absolute;right:1%;bottom:0;height:96%;aspect-ratio:var(--ar,9/16);translate:calc(var(--mx,0)*-18px) calc(var(--my,0)*-6px);pointer-events:none}
.actor canvas{display:block;width:100%;height:100%;object-fit:cover;filter:var(--grade)}
.ck canvas[data-vid]{filter:url(#chroma) var(--grade)}
.fg{position:absolute;right:-24px;bottom:0;width:calc(100% + 48px);height:58%;opacity:.34;pointer-events:none;translate:calc(var(--mx,0)*-12px) calc(var(--my,0)*0px);-webkit-mask-image:linear-gradient(to top,#000 30%,transparent);mask-image:linear-gradient(to top,#000 30%,transparent)}
.plate{position:absolute;right:clamp(1rem,4vw,3rem);bottom:clamp(2.6rem,6vh,4rem);z-index:1;text-align:right;transform:skewX(-14deg);padding:.4rem 1.4rem;background:linear-gradient(90deg,transparent,rgba(0,0,0,.7));border-right:4px solid var(--gold);animation:fromR .9s calc(.5s + var(--o,0s)) cubic-bezier(.22,1,.36,1) both}
.plate>*{display:block;transform:skewX(14deg)}
.plate small{color:var(--gold);letter-spacing:.3em;font-size:.85rem}
.plate strong{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(1.8rem,3.4vw,2.8rem);line-height:1}
#menu .list,#menu .preview{z-index:1}
.fighter>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:var(--grade)}
.fighter .np{position:absolute;left:0;right:0;bottom:0;padding:2.2rem 1.2rem .9rem;background:linear-gradient(transparent,rgba(0,0,0,.88));border-bottom:4px solid var(--gold)}
.fighter .np small{display:block;color:var(--gold);letter-spacing:.3em;font-size:.8rem}
.fighter .np strong{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:2.2rem;line-height:1}
.fighter em{z-index:1}
/* FOTO LAYAR AWAL */
.hero{position:absolute;left:50%;top:0;bottom:0;width:min(100%,calc(100vh*.8));translate:-50% 0;overflow:hidden;pointer-events:none;--rev-delay:2.1s;--rev-dur:3.8s;will-change:opacity,filter;animation:heroIn var(--rev-dur) var(--rev-delay) cubic-bezier(.4,0,.2,1) both}
.hero canvas{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0;filter:var(--grade)}
#start>:not(.hero):not(.glow){position:relative;z-index:1}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(46% 40% at 50% 40%,rgba(150,170,225,.26),rgba(90,110,170,.1) 55%,transparent 78%),radial-gradient(70% 16% at 50% 100%,rgba(190,200,255,.16),transparent 80%);animation:glowIn 4.8s 1.9s cubic-bezier(.3,0,.2,1) both}
#start.rev .glow{animation-duration:1.4s;animation-delay:.1s}
.copy{position:absolute!important}
.names{flex-direction:row;align-items:baseline;gap:.28em;white-space:nowrap;font-size:clamp(2.6rem,10vw,8.5rem)}#start{text-align:center;justify-content:flex-end;padding-bottom:clamp(5rem,17vh,9.5rem)}.copy{left:0;right:0;text-align:center;font-size:.55rem}.logo{filter:drop-shadow(0 2px 18px rgba(0,0,0,.8))}#press{text-shadow:0 2px 18px rgba(0,0,0,.85)}
@keyframes heroIn{0%{opacity:0;filter:brightness(0) blur(22px);transform:scale(1.045)}28%{opacity:.3;filter:brightness(.14) blur(15px)}34%{opacity:.18;filter:brightness(.06) blur(15px)}42%{opacity:.4;filter:brightness(.22) blur(12px)}64%{opacity:.8;filter:brightness(.55) blur(5px)}100%{opacity:1;filter:brightness(1) blur(0);transform:scale(1)}}
@keyframes glowIn{0%{opacity:0;transform:translateY(40px) scale(.9)}45%{opacity:.2}100%{opacity:1;transform:none}}
#press{transition:color .3s}
#press:hover{color:var(--gold)}
#start.rev .l1{animation-duration:.9s;animation-delay:.4s}
#start.rev .l2{animation-duration:.9s;animation-delay:.55s}
#start.rev #press{animation-delay:1s,2s}
#start.rev .copy{animation-delay:.9s}
#app::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 42%,transparent 36%,rgba(0,0,0,.75) 100%),linear-gradient(to top,rgba(0,0,0,.5),transparent 36%)}
#page{z-index:1}.mtop,.hints{z-index:1}
@keyframes fromL{from{opacity:0;transform:translateX(-70px) skewX(-8deg)}}
@keyframes fromR{from{opacity:0;transform:translateX(70px) skewX(8deg)}}
@keyframes slam2{from{opacity:0;transform:scale(1.06) translateY(-14px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes blink{50%{opacity:.3}}
@keyframes itemIn{from{opacity:0;transform:skewX(-14deg) translateX(-50px)}}
@keyframes sheen{to{left:130%}}
@keyframes pv{from{opacity:0;transform:translateX(24px)}}
@keyframes bar{from{transform:scaleX(0)}}

@media(max-width:760px){
 .actor{height:80%;right:-20%}
 .hero{width:100%}
 .hero canvas{position:absolute;left:0;bottom:0;width:100%;height:auto;aspect-ratio:var(--ar,9/16)}
 .fg{width:100%;height:40%}
 .plate{right:1rem;bottom:max(1rem,env(safe-area-inset-bottom,0px))}
 .plate small{font-size:.7rem}
 .plate strong{font-size:1.5rem}
 #menu{flex-direction:row;overflow:hidden;padding:5rem 1rem 1rem;gap:0}
 .list{justify-content:flex-start;width:64%;flex:none}
 .item{padding:.45rem 1rem}
 .item .t{font-size:1.75rem}
 .item .s{font-size:.85rem}
 .item.sel{transform:skewX(-14deg) translateX(8px)}
 .ghost{display:none}
 .preview{position:absolute;left:1rem;right:1rem;bottom:calc(max(1rem,env(safe-area-inset-bottom,0px)) + 3.6rem);flex:none;display:block;z-index:1}
 .pv h2{font-size:2.6rem}
 .pv p{max-width:28ch;margin:.5rem 0 .7rem;font-size:1rem}
 .hints{display:none}
 .prof{grid-template-columns:1fr}
 .fighter{max-width:260px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app">

  <div class="glow"></div>

function countUps(){
 document.querySelectorAll('[data-count]').forEach(el=>{
  const to=+el.dataset.count;
  if(reduce){el.textContent=to;return}
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/1700);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0);
 });
}
function show(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
 scr=id;
}
function go(fn){
 if(busy)return;
 if(reduce){fn();return}
 busy=true;const w=$('#wipe'),o={fill:'forwards',easing:'cubic-bezier(.65,0,.35,1)'};
 w.animate([{transform:'translateX(-120%) skewX(-20deg)'},{transform:'translateX(0) skewX(-20deg)'}],{...o,duration:480}).onfinish=()=>{
  fn();
  w.animate([{transform:'translateX(0) skewX(-20deg)'},{transform:'translateX(120%) skewX(-20deg)'}],{...o,duration:600}).onfinish=()=>{busy=false};
 };
}

/* Transisi layar awal <-> menu: foto berpindah ke posisi menu, elemen lain menyesuaikan */

 const run=()=>{
  const hs=getComputedStyle(hero),hop=hs.opacity,hfil=hs.filter,from=fit(him);
  hero.style.animation='none';hero.style.visibility='hidden';
  menu.style.setProperty('--o','.3s');
  menu.classList.add('active');scr='menu';
  const ar=actor.getBoundingClientRect();
  actor.style.transformOrigin='0 0';
  const fa=actor.animate([
   {transform:`translate(${from.left-ar.left}px,${from.top-ar.top}px) scale(${from.w/ar.width})`,opacity:hop,filter:hfil},
   {transform:'none',opacity:1,filter:'none'}],{duration:1100,easing:EASE,fill:'backwards'});
  const out=[];
  out.push($('.l1').animate([{opacity:0,transform:'translateX(-90px) skewX(-8deg)'}],{duration:520,easing:EXIT,fill:'forwards'}));
  out.push($('.l2').animate([{opacity:0,transform:'translateX(90px) skewX(8deg)'}],{duration:520,delay:60,easing:EXIT,fill:'forwards'}));
  out.push($('#press').animate([{opacity:0,transform:'translateY(14px)'}],{duration:380,easing:EXIT,fill:'forwards'}));
  out.push($('#copy').animate([{opacity:0}],{duration:380,fill:'forwards'}));
  out.push($('.glow').animate([{opacity:0}],{duration:700,fill:'forwards'}));
  [$('.room'),$('#fg')].forEach(el=>el.animate([{opacity:0,offset:0}],{duration:900,delay:400,fill:'backwards'}));
  fa.onfinish=()=>{
   start.classList.remove('active');out.forEach(a=>a.cancel());
   actor.style.transformOrigin='';items[sel].focus({preventScroll:true});busy=false;
  };
 };
 ch.decode?ch.decode().then(run,run):run();
}
function leaveMenu(){

 const to=fit(him),ar=actor.getBoundingClientRect();
 actor.style.transformOrigin='0 0';
 const fa=actor.animate([{transform:'none'},{transform:`translate(${to.left-ar.left}px,${to.top-ar.top}px) scale(${to.w/ar.width})`}],{duration:1000,easing:EASE,fill:'forwards'});

 o($('.hints'),{opacity:0},{duration:300});

  hero.style.visibility='';menu.classList.remove('active');

$('#press').addEventListener('click',e=>{e.stopPropagation();enterMenu()});

$('#back').addEventListener('click',toMenu);
addEventListener('keydown',e=>{
 if(busy)return;
 const k=e.key;
 if(scr==='start'){
  if(!['Shift','Control','Alt','Meta','Tab'].includes(k)){e.preventDefault();enterMenu()}
 }else if(scr==='menu'){
  if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();items[(sel+1)%items.length].focus({preventScroll:true})}
  else if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();items[(sel+items.length-1)%items.length].focus({preventScroll:true})}
  else if(k==='Enter'||k===' '){e.preventDefault();openPage(sel)}
  else if(k==='Escape'||k==='Backspace'){leaveMenu()}
 }else if(scr==='page'){
  if(k==='Escape'||k==='Backspace'){e.preventDefault();toMenu()}
 }
});

   const al=Math.min(.95,env*fl*(.3+.7*heat)),r=p.r*(1-.4*u);

   x.globalAlpha=al;x.drawImage(SP[Math.round(heat*(NS-1))],p.x-sz/2,p.y-sz/2,sz,sz);
   if(heat>.45){x.globalAlpha=al*Math.min(1,(heat-.45)*2);x.fillStyle='rgb(255,244,212)';x.beginPath();x.arc(p.x,p.y,Math.max(.4,r*.42),0,6.283);x.fill()}
  });
  x.globalAlpha=1;x.globalCompositeOperation='source-over';

/* Mesin asap WebGL: fbm + domain warping, dirender setengah resolusi */
(function(){
 if(reduce)return;
 const c=$('#smk'),gl=c.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});
 if(!gl)return;
 const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
 const fs=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R,M,V;uniform float T,L;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*n(p);p=m*p;a*=.5;}return v;}
void main(){
 vec2 uv=gl_FragCoord.xy/R,asp=vec2(R.x/R.y,1.);
 vec2 p=uv*asp*2.4;
 float t=T*.05;
 vec2 q=vec2(fbm(p+vec2(0.,-t*2.)),fbm(p+vec2(5.2,1.3)-t));
 vec2 r=vec2(fbm(p+3.5*q+vec2(1.7,9.2)+t*.6),fbm(p+3.5*q+vec2(8.3,2.8)-t*.5));
 float f=fbm(p+3.5*r+vec2(0.,-t*3.));
 float dens=smoothstep(.38,.92,f);dens*=dens;
 float mask=pow(1.-uv.y,1.3)*.9+.1;
 float a=dens*mask*.14*L;
 vec3 col=vec3(.6,.61,.7)+.15*q.x;
 gl_FragColor=vec4(col*a,a);
}`;
 function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
 const pg=gl.createProgram();
 gl.attachShader(pg,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pg);
 if(!gl.getProgramParameter(pg,gl.LINK_STATUS))return;
 window.GLOK=true;
 gl.useProgram(pg);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const at=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);
 const U=k=>gl.getUniformLocation(pg,k),uR=U('R'),uM=U('M'),uV=U('V'),uT=U('T'),uL=U('L');
 let mx=.5,my=.3,tx=.5,ty=.3,vx=0,vy=0,lv=1;
 function size(){const s=innerWidth<760?.4:.55;c.width=Math.max(2,Math.round(innerWidth*s));c.height=Math.max(2,Math.round(innerHeight*s));gl.viewport(0,0,c.width,c.height)}
 addEventListener('resize',size);size();
 const t0=performance.now();
 (function frame(now){
  const ox=mx,oy=my;mx+=(tx-mx)*.12;my+=(ty-my)*.12;
  vx+=((mx-ox)*25-vx)*.1;vy+=((my-oy)*25-vy)*.1;
  lv+=((scr==='page'?.45:1)-lv)*.03;
  gl.uniform2f(uR,c.width,c.height);gl.uniform2f(uM,mx,my);gl.uniform2f(uV,vx,vy);
  gl.uniform1f(uT,(now-t0)/1000);gl.uniform1f(uL,lv);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
 })(t0);
})();

/* Mesin panggung: parallax berlapis, cahaya mengikuti kursor, kedip lampu, kabut dan debu di depan karakter */
(function(){
 if(reduce)return;
 const m=$('#menu'),c=$('#fg'),x=c.getContext('2d');
 let W=0,H=0,tx=.5,ty=.4,px=.5,py=.4,t=0,idle=0,F=[],D=[];
 const S=document.createElement('canvas');S.width=S.height=128;
 {const g=S.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(200,208,230,.5)');r.addColorStop(1,'rgba(200,208,230,0)');g.fillStyle=r;g.fillRect(0,0,128,128)}
 addEventListener('pointermove',e=>{tx=e.clientX/innerWidth;ty=e.clientY/innerHeight;idle=performance.now()});
 function build(){
  F=Array.from({length:8},(_,i)=>({x:Math.random()*W*1.4-W*.2,y:H*(.35+.65*Math.random()),s:W*(.35+Math.random()*.35),v:(.12+Math.random()*.25)*(i%2?1:-1),a:.3+Math.random()*.3,p:Math.random()*6.28}));
  D=Array.from({length:46},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),p:Math.random()*6.28}));
 }
 (function loop(){
  requestAnimationFrame(loop);
  if(scr!=='menu')return;
  t+=.016;
  if(c.clientWidth&&(c.width!==c.clientWidth||c.height!==c.clientHeight)){W=c.width=c.clientWidth;H=c.height=c.clientHeight;build()}
  if(!W)return;
  const on=performance.now()-idle<3500,gx=on?tx:.5+.1*Math.sin(t*.35),gy=on?ty:.4+.06*Math.cos(t*.27);
  px+=(gx-px)*.06;py+=(gy-py)*.06;
  const s=m.style;
  s.setProperty('--mx',((px-.5)*2).toFixed(3));s.setProperty('--my',((py-.5)*2).toFixed(3));
    x.clearRect(0,0,W,H);
  for(const f of F){f.x+=f.v;if(f.x>W*1.2)f.x=-W*.2;if(f.x<-W*.2)f.x=W*1.2;
   x.globalAlpha=f.a*(.75+.25*Math.sin(t*.5+f.p));x.drawImage(S,f.x-f.s/2,f.y-f.s*.3,f.s,f.s*.6)}
  for(const d of D){d.y-=.15+d.z*.4;d.x+=Math.sin(t+d.p)*.25-(px-.5)*d.z*.8;if(d.y<-10){d.y=H+10;d.x=Math.random()*W}
   const z=d.z>.8,sz=z?60+d.z*40:6+d.z*8;x.globalAlpha=z?.12:.35;x.drawImage(S,d.x-sz/2,d.y-sz/2,sz,sz)}
  x.globalAlpha=1;
 })();
})();
