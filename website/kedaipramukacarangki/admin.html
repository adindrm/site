<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin Kedai Pramuka Carangki</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--p:#550194;--g:#fbbe15;--ink:#2a0b47;--line:#e6dcf2;--tile:#f0e7fa;--bg:#f8f4fd}
*{box-sizing:border-box}body{margin:0;font:15px "Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--p);color:var(--g);padding:12px 16px;border-bottom:3px solid var(--g);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
header b{font-size:17px}header{flex-wrap:wrap}textarea{resize:vertical}
a.btn{text-decoration:none;display:inline-block}.btn.lnk{background:transparent;border:1.5px solid var(--g);color:var(--g);padding:7px 16px}main{max-width:960px;margin:auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(251,190,21,.5);border-color:var(--g)}
.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--g);color:var(--ink);font-weight:600;cursor:pointer}
.btn.o{background:transparent;border:1.5px solid var(--p);color:var(--p)}.btn.x{background:#fff;border:1.5px solid #d9302c;color:#d9302c;padding:6px 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer}
.tabs .on{background:var(--p);color:var(--g);border-color:var(--p)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-size:13px;color:#6f5a88;margin:10px 0 4px}label:first-child{margin-top:0}
.row{display:grid;gap:8px;align-items:end;margin-bottom:8px}.hint{font-size:12.5px;color:#6f5a88;margin:6px 0 12px}
.chk{display:flex;gap:6px;align-items:center;margin:0;padding-bottom:9px}.chk input{width:auto}
#login{position:fixed;inset:0;margin:auto;height:fit-content;max-height:calc(100% - 32px);overflow:auto;width:min(360px,calc(100% - 32px));padding:24px;text-align:center}#login label{text-align:left}#login h2{color:var(--p)}#login .btn{width:100%;padding:11px}#login .stat{margin:12px 0 0!important}#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--g);padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none}#msg.on{opacity:1}
@media(max-width:640px){.row{grid-template-columns:1fr!important}}
input[type=file]{display:none}.btn.sm{padding:5px 12px;font-size:13px;display:inline-block}
.pv{width:96px;height:96px;border-radius:12px;background:var(--tile);display:grid;place-items:center;overflow:hidden;color:#9a82b8;font-size:12px;text-align:center;margin-bottom:6px}.pv img{width:100%;height:100%;object-fit:cover}
.grp{margin-bottom:14px}.grp summary{cursor:pointer;font-weight:600;padding:10px 14px;background:var(--p);color:var(--g);border-radius:12px;margin-bottom:8px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.grp summary::-webkit-details-marker{display:none}.grp summary span{font-weight:400;font-size:13px;color:#fff}
.lgw{display:inline-grid;place-items:center;width:30px;height:30px;flex:none}
.lg{width:22px;height:22px;flex:none;--l1:#000;--l2:#000;--l3:#000;--l4:#000;--l5:#000}
.lit{fill:var(--l1)}.lit [style="--i:1"]{fill:var(--l2)}.lit [style="--i:4"]{fill:var(--l2)}.lit [style="--i:6"]{fill:var(--l2)}.lit [style="--i:7"]{fill:var(--l4)}.lit [style="--i:8"]{fill:var(--l2)}.lit [style="--i:9"]{fill:var(--l4)}.lit [style="--i:10"]{fill:var(--l2)}.lit [style="--i:11"]{fill:var(--l2)}.lit [style="--i:12"]{fill:var(--l4)}.lit [style="--i:13"]{fill:var(--l4)}.lit [style="--i:14"]{fill:var(--l2)}.lit [style="--i:15"]{fill:var(--l2)}.lit [style="--i:16"]{fill:var(--l2)}.lit [style="--i:17"]{fill:var(--l2)}.lit [style="--i:18"]{fill:var(--l2)}.lit [style="--i:19"]{fill:var(--l2)}.lit [style="--i:20"]{fill:var(--l2)}.lit [style="--i:21"]{fill:var(--l2)}.lit [style="--i:22"]{fill:var(--l2)}.lit [style="--i:23"]{fill:var(--l2)}.lit [style="--i:24"]{fill:var(--l2)}.lit [style="--i:25"]{fill:var(--l2)}.lit [style="--i:26"]{fill:var(--l2)}.lit [style="--i:27"]{fill:var(--l2)}.lit [style="--i:28"]{fill:var(--l2)}.lit [style="--i:29"]{fill:var(--l2)}
.stat{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;max-width:100%}.stat:empty{display:none}
.stat.ok{color:#0a7a3d;background:#e6f6ec}.stat.err{color:#c4231f;background:#fdeaea}.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn:disabled{opacity:.6;cursor:wait}.pv{position:relative}
.pv .st{position:absolute;left:0;right:0;bottom:0;padding:3px 4px;font-size:11px;font-weight:600;background:rgba(255,255,255,.93);display:flex;gap:4px;align-items:center;justify-content:center;line-height:1.2}
.pv .st .lgw{width:20px;height:20px}.pv .st .lg{width:15px;height:15px}.pv .st.ok,.pv .st.saved{color:#0a7a3d}.pv .st.err{color:#c4231f}
:root{--rad:14px}
header{padding-inline:max(16px,calc((100vw - 1000px)/2 + 16px))}
main{max-width:1000px;padding:20px 16px 80px}
.tabs{gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;border-radius:10px 10px 0 0;padding:10px 20px;font-weight:600;color:#6f5a88}
.tabs .on{background:var(--p);color:var(--g)}
.card{padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(85,1,148,.05)}
.card h3{margin:0 0 12px;font-size:15px;color:var(--p)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.fg .full{grid-column:1/-1}
.fg>div>label{margin-top:12px}.fg>div>label:first-child{margin-top:12px}
label{font-size:12.5px;font-weight:600;margin:0 0 5px}
.row{gap:10px 12px}.row .btn.x{align-self:end;margin-bottom:1px}
.row.prod{grid-template-columns:140px repeat(4,minmax(0,1fr))!important;align-items:end}
.row.prod>:nth-child(1){grid-row:1/6;align-self:start}.row.prod>:nth-child(2){grid-column:2/-1}
.row.prod>:nth-child(7),.row.prod>:nth-child(8){grid-column:2/-1}.row.prod>:nth-child(9){grid-column:2/3}.row.prod>:nth-child(10){grid-column:3/5}.row.prod>:nth-child(11){grid-column:5;justify-self:end}
.row.prod .pv{width:140px;height:140px}
.row.prod .btn.sm{margin-bottom:2px}
.imgc .url{margin-top:6px;font-size:12px}
.grp summary{justify-content:flex-start;gap:8px;border-radius:var(--rad)}.grp summary span{margin-left:auto}
.grp summary::before{content:'▾';color:var(--g)}.grp:not([open]) summary::before{content:'▸'}
.grp>.btn.o,#pane>.btn.o{width:100%;border-style:dashed;padding:11px;margin-top:2px}
.hint{line-height:1.5}
@media(max-width:640px){
 header{position:static;padding:10px 12px!important}header b{font-size:16px;width:100%}
 .hr{width:100%;justify-content:flex-start;gap:8px}.hr .btn{padding:7px 14px;font-size:13px}
 #save{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;padding:13px 22px;font-size:15px;box-shadow:0 6px 18px rgba(42,11,71,.35)}
 #msg{bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px);text-align:center}
 main{padding:12px 10px 100px}
 .card{padding:12px}
 input,select,textarea{font-size:16px;padding:11px 12px}
 .fg{grid-template-columns:1fr}
 .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs button{padding:9px 14px;flex:none;white-space:nowrap}
 .grp summary{padding:13px 14px}
 .row>.btn.x{width:100%;padding:10px}
 .row.prod{grid-template-columns:1fr 1fr!important;gap:14px 10px;align-items:end}
 .row.prod>*{grid-column:auto!important;grid-row:auto!important}
 .row.prod>:nth-child(1),.row.prod>:nth-child(2),.row.prod>:nth-child(7),.row.prod>:nth-child(8),.row.prod>:nth-child(11){grid-column:1/-1!important;justify-self:stretch}
 .row.prod>:nth-child(11){margin-top:2px}
 .row.prod .imgc{display:flex;gap:12px;align-items:flex-start}
 .row.prod .imgc .pv{width:108px;height:108px;margin:0;flex:none}
 .row.prod .imgc .ctl{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
 .row.prod .imgc .btn.sm{margin:0;padding:8px 14px}
 .row.prod .imgc .url{flex:1 1 100%;margin-top:0;font-size:16px}
 .row.prod textarea{min-height:92px}.row.prod>:nth-child(8) textarea{min-height:130px}
 .chk{min-height:46px;padding:0;font-size:15px}.chk input{width:22px;height:22px}
}
/* produk: daftar dropdown (gambar + nama), hanya satu terbuka */
.pc{margin-bottom:10px;scroll-margin-top:76px}
.ph{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(85,1,148,.05)}
.ph:hover{border-color:var(--p)}
.ph .th{width:52px;height:52px;flex:none;border-radius:10px;background:var(--tile);color:#9a82b8;display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:20px}
.ph .th img{width:100%;height:100%;object-fit:cover}
.ph .pn{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .chev{flex:none;color:var(--p);font-size:18px;transition:transform .25s}
.pc.open>.ph{background:var(--tile);border-color:var(--p);border-radius:14px 14px 0 0}
.pc.open>.ph .chev{transform:rotate(180deg)}
.pc:not(.open)>.row{display:none}
.pc.open>.row{border-top-left-radius:0;border-top-right-radius:0;border-top:0;margin-bottom:0;animation:pcin .25s ease}
@keyframes pcin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--p)}
.chip .n{margin-left:6px;font-weight:400;opacity:.7}.chip.on{background:var(--p);color:var(--g);border-color:var(--p)}
@media(max-width:640px){.chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-10px;padding:0 10px 6px;scrollbar-width:none}.chip{flex:none;white-space:nowrap;padding:8px 14px}.ph .th{width:48px;height:48px}}

<script>
const API='https://script.google.com/macros/s/AKfycbzrsl2cJlPfIXoAgWt-z5LtbOx8H7UzCZW9BJJYMtLOj3VTT_H3BwJs4hMfPAB1jUtETA/exec';/* tempel URL Web App Apps Script (berakhiran /exec) */
const $=i=>document.getElementById(i);
let url=API||localStorage.getItem('kpc-api')||'',pw='',D={settings:{},kategori:[],produk:[],lagu:[]},tab='tampilan';
const FIELDS=[['nama_toko','Nama toko'],['alamat','Alamat (tampil di header & peta)'],['lokasi_peta','Kata kunci / Plus Code untuk Google Maps'],['nomor_wa','Nomor WhatsApp (format 62812…, tanpa +)'],['judul_hero','Judul beranda'],['teks_hero','Teks beranda','t'],['tombol_belanja','Teks tombol belanja'],['tombol_wa','Teks tombol WhatsApp'],['kutipan_1','Kutipan layar pembuka baris 1'],['kutipan_2','Kutipan layar pembuka baris 2']];
let FILT='',OPENP=-1;
const SES='kpc-sess',JAM=3600000;/* sesi login 1 jam */
function sesGet(){try{const s=JSON.parse(sessionStorage.getItem(SES));if(s&&s.pw&&s.exp>Date.now())return s.pw}catch(e){}try{sessionStorage.removeItem(SES)}catch(e){}return ''}
function sesSet(p){try{sessionStorage.setItem(SES,JSON.stringify({pw:p,exp:Date.now()+JAM}))}catch(e){}}
const PREV=new WeakMap(),OPEN=new Set(),UP=new WeakMap(),LG='<span class="lgw"><svg class="lg" aria-hidden="true"><use href="#i-lit"/></svg></span>';
/* animasi logo: bentuk logo muncul satu per satu (sama seperti loading screen web utama), diulang selama ada proses */
(function(){const sh=[...document.querySelectorAll('#i-lit .s')],n=sh.length,C=119.2,red=matchMedia('(prefers-reduced-motion:reduce)').matches;let run=false,t0=0;
 const set=(q,fade)=>sh.forEach((el,j)=>{const x=Math.max(0,Math.min(1,q*(n+1)-j)),z=1+.07*(1-x);el.setAttribute('opacity',x*fade);el.setAttribute('transform',`translate(${C} ${C}) scale(${z}) translate(-${C} -${C})`);const m=el.dataset.m,mp=m&&document.getElementById(m);if(mp)mp.setAttribute('stroke-dashoffset',100*(1-x))});
 set(red?1:0,1);
 function tick(now){if(!document.querySelector('.lg')){run=false;return}
  const k=((now-t0)%2600)/2600,p=Math.min(1,k/.75);set(1-Math.pow(1-p,2.2),k>.9?(1-k)/.1:1);requestAnimationFrame(tick)}
 window.lgRun=()=>{if(!run&&!red){run=true;t0=performance.now();requestAnimationFrame(tick)}}})();
function setStat(el,k,t){if(k==='load')setTimeout(lgRun,0);el.className='stat '+k;el.innerHTML=(k==='load'?LG:k==='ok'?'✓':'✕')+' '+esc(t)}
function stHtml(o){const s=UP.get(o);return s?`<div class="st ${s.k}">${s.k==='load'?LG:s.k==='err'?'✕':'✓'} ${esc(s.t)}</div>`:''}
async function unggah(obj,apply,file,png,nama){
 UP.set(obj,{k:'load',t:'Mengunggah…'});setTimeout(lgRun,0);setStat($('stat'),'load','Mengunggah gambar…');draw();
 try{const b=await kecil(file,png),m=png?'image/png':'image/jpeg';PREV.set(obj,'data:'+m+';base64,'+b);draw();
  const j=await post({action:'upload',base64:b,mime:m,name:nama});if(!j.ok)throw new Error(j.error||'Server menolak');
  apply(j.url);UP.set(obj,{k:'ok',t:'Terunggah, belum disimpan'});setStat($('stat'),'ok','Gambar terunggah. Klik Simpan');toast('Gambar terunggah')}
 catch(x){UP.set(obj,{k:'err',t:'Gagal diunggah'});setStat($('stat'),'err','Upload gagal: '+x.message);toast('Upload gagal')}
 draw()}
const GROUPS=[['Identitas toko',['nama_toko','alamat','lokasi_peta','nomor_wa']],['Beranda',['judul_hero','teks_hero','tombol_belanja','tombol_wa']],['Layar pembuka',['kutipan_1','kutipan_2']]];
const IKON=['shirt','badge','gear','tent','book'];
const TABLES={

 produk:{judul:'Produk',baru:()=>({nama:'',kategori:(D.kategori[0]||{}).nama||'',harga:0,rating:4.8,terjual:0,aktif:true,gambar:'',stok:'',deskripsi:'',spesifikasi:''}),
  cols:[['gambar','Gambar','i'],['nama','Nama produk'],['kategori','Kategori','s',()=>D.kategori.map(k=>k.nama)],['harga','Harga (Rp)','n'],['rating','Rating','n'],['terjual','Terjual','n'],['deskripsi','Deskripsi produk (tampil di detail produk)','t','Ukuran, bahan, isi paket, dll.'],['spesifikasi','Spesifikasi (satu baris = satu data, format Label: Isi)','t','Merek: Renebook\nImpor/Lokal: Lokal\nBahasa: Indonesia\nJenis Cover: Soft Cover\nPerusahaan Penerbit: Renebook\nISBN: 9786021201428\nAsal Produk: -'],['stok','Stok (kosong = tak terbatas)','n'],['aktif','Tampil','c']],g:'140px repeat(4,minmax(0,1fr))'},
 lagu:{judul:'Lagu',baru:()=>({judul:'',file:'musik/'}),cols:[['judul','Judul lagu'],['file','Lokasi file (mis. musik/lagu-1.mp3)']],g:'1fr 1.4fr auto',
  hint:'Upload file mp3 ke folder <b>musik/</b> di samping Kedai_Pramuka_Carangki.html, lalu isi lokasinya di sini.'}};
const toast=t=>{const m=$('msg');m.textContent=t;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),2200)};
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function tabs(){$('tabs').innerHTML=[['tampilan','Tampilan']].concat(Object.keys(TABLES).map(k=>[k,TABLES[k].judul])).map(t=>`<button class="${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}
function draw(){tabs();const p=$('pane');
 if(tab==='tampilan'){p.innerHTML=GROUPS.map(g=>`<section class="card"><h3>${g[0]}</h3><div class="fg">${g[1].map(k=>{const f=FIELDS.find(x=>x[0]===k);return `<div class="${f[2]||/alamat|lokasi/.test(k)?'full':''}"><label>${f[1]}</label>${f[2]?`<textarea rows="2" data-s="${k}">${esc(D.settings[k])}</textarea>`:`<input data-s="${k}" value="${esc(D.settings[k])}">`}</div>`}).join('')}</div></section>`).join('')+(()=>{const u=PREV.get(D.settings)||D.settings.gambar_hero;return `<section class="card"><h3>Gambar beranda</h3><p class="hint" style="margin-top:0">Menggantikan logo di kartu ungu pada beranda.</p><div class="pv" style="width:140px;height:140px">${u?`<img src="${esc(u)}" alt="" style="object-fit:contain">`:'Memakai logo bawaan'}${stHtml(D.settings)}</div><label class="btn o sm">Pilih gambar<input type="file" accept="image/*" data-uph="1"></label>${u?' <button class="btn x sm" data-noh="1">Hapus (pakai logo bawaan)</button>':''}<input data-s="gambar_hero" placeholder="atau tempel URL gambar" value="${esc(D.settings.gambar_hero)}" style="margin-top:8px;max-width:420px"></section>`})();return}
 const T=TABLES[tab],R=D[tab];
 const card0=(r,i)=>`<div class="card row${tab==='produk'?' prod':''}" style="grid-template-columns:${T.g}">`+T.cols.map(c=>{const v=r[c[0]];
  if(c[2]==='i'){const u=PREV.get(r)||v;return `<div class="imgc"><div class="pv">${u?`<img src="${esc(u)}" alt="">`:'Belum ada gambar'}${stHtml(r)}</div><div class="ctl"><label class="btn o sm">Pilih gambar<input type="file" accept="image/*" data-up="${i}"></label>${u?` <button class="btn x sm" data-noimg="${i}">Hapus</button>`:''}<input class="url" placeholder="atau tempel URL gambar" data-i="${i}" data-k="gambar" value="${esc(v)}"></div></div>`}
  if(c[2]==='t')return `<div><label>${c[1]}</label><textarea rows="${c[0]==='spesifikasi'?6:3}" data-i="${i}" data-k="${c[0]}" placeholder="${esc(c[3]||'')}">${esc(v)}</textarea></div>`;
  if(c[2]==='c')return `<label class="chk"><input type="checkbox" data-i="${i}" data-k="${c[0]}" ${v!==false?'checked':''}>${c[1]}</label>`;
  if(c[2]==='s'){let o=typeof c[3]==='function'?c[3]():c[3];if(v&&!o.includes(v))o=o.concat(v);return `<div><label>${c[1]}</label><select data-i="${i}" data-k="${c[0]}">${o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
  return `<div><label>${c[1]}</label><input ${c[2]==='n'?'type="number" step="any"':''} data-i="${i}" data-k="${c[0]}" value="${esc(v)}"></div>`}).join('')+`<button class="btn x" data-del="${i}">Hapus</button></div>`;
 const thumb=r=>{const u=PREV.get(r)||r.gambar;return u?`<img src="${esc(u)}" alt="">`:esc((String(r.nama||'?').trim()[0]||'?').toUpperCase())};

  const key=n=>n||'__none',chips=gr.length?`<div class="chips"><button class="chip${FILT?'':' on'}" data-f="">Semua<span class="n">${R.length}</span></button>${gr.map(([n,ix])=>`<button class="chip${FILT===key(n)?' on':''}" data-f="${esc(key(n))}">${esc(n||'Tanpa kategori')}<span class="n">${ix.length}</span></button>`).join('')}</div>`:'';
  p.innerHTML=chips+(gr.filter(g=>!FILT||key(g[0])===FILT).map(([n,ix])=>`<details class="grp" data-g="${esc(n)}" ${OPEN.has(n)||FILT===key(n)?'open':''}><summary>${esc(n||'Tanpa kategori')}<span>${ix.length} produk</span></summary>${ix.map(i=>card(R[i],i)).join('')}<button class="btn o" style="margin-bottom:6px" data-addcat="${esc(n)}">+ Tambah produk${n?' di '+esc(n):''}</button></details>`).join('')||'<p class="hint">Belum ada kategori. Tambahkan dulu di tab Kategori.</p>');return}
 p.innerHTML=(T.hint?`<p class="hint">${T.hint}</p>`:'')+R.map(card).join('')+`<button class="btn o" id="add">+ Tambah ${T.judul.toLowerCase()}</button>`}
$('pane').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.g!=null){d.open?OPEN.add(d.dataset.g):OPEN.delete(d.dataset.g)}},true);
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;draw()}};
$('pane').addEventListener('input',e=>{const t=e.target;
 if(t.dataset.s){D.settings[t.dataset.s]=t.value;return}
 if(t.dataset.k==null)return;const r=D[tab][t.dataset.i],k=t.dataset.k,v=t.type==='checkbox'?t.checked:t.value,old=r[k];
 r[k]=t.type==='number'?(v===''?(k==='stok'?'':0):(k==='stok'?Math.max(0,Math.floor(Number(v))):Number(v))):v;
 if(tab==='kategori'&&k==='nama')D.produk.forEach(p=>{if(p.kategori===old)p.kategori=v});
 if(tab==='produk'&&(k==='nama'||k==='gambar')){const pc=document.querySelector('.pc[data-pc="'+t.dataset.i+'"]');if(pc){if(k==='nama')pc.querySelector('.pn').textContent=String(v).trim()||'Produk baru';const u=PREV.get(r)||r.gambar;pc.querySelector('.th').innerHTML=u?`<img src="${esc(u)}" alt="">`:esc((String(r.nama||'?').trim()[0]||'?').toUpperCase())}}});
$('pane').onclick=e=>{const T=TABLES[tab];
 const tp=e.target.closest('[data-tp]');
 if(tp){const i=+tp.dataset.tp,was=OPENP===i,pc=tp.closest('.pc');OPENP=was?-1:i;
  document.querySelectorAll('.pc.open').forEach(x=>{x.classList.remove('open');x.querySelector('.ph').setAttribute('aria-expanded','false')});
  if(!was){pc.classList.add('open');tp.setAttribute('aria-expanded','true');setTimeout(()=>pc.scrollIntoView({block:'start',behavior:'smooth'}),30)}
  return}
 if(e.target.id==='add'){D[tab].push(T.baru());draw()}
 else if(e.target.dataset.addcat!=null){const n=e.target.dataset.addcat,b=T.baru();if(n)b.kategori=n;D.produk.push(b);OPEN.add(n);OPENP=D.produk.length-1;draw();const np=document.querySelector('.pc.open');if(np)np.scrollIntoView({block:'start',behavior:'smooth'})}
 else if(e.target.closest('[data-f]')){FILT=e.target.closest('[data-f]').dataset.f;draw()}
 else if(e.target.dataset.noh!=null){D.settings.gambar_hero='';PREV.delete(D.settings);draw()}
 else if(e.target.dataset.noimg!=null){const r=D.produk[+e.target.dataset.noimg];r.gambar='';PREV.delete(r);draw()}
 else if(e.target.dataset.del!=null&&confirm('Hapus baris ini?')){const di=+e.target.dataset.del;D[tab].splice(di,1);if(tab==='produk'){if(OPENP===di)OPENP=-1;else if(OPENP>di)OPENP--}draw()}};
function kecil(f,png){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(png?'image/png':'image/jpeg',.82).split(',')[1])};im.onerror=no;im.src=URL.createObjectURL(f)})}
$('pane').addEventListener('change',e=>{const t=e.target;
 if(t.dataset.s==='gambar_hero'){PREV.delete(D.settings);draw();return}
 if(t.dataset.uph!=null&&t.files[0]){const f=t.files[0];return unggah(D.settings,u=>D.settings.gambar_hero=u,f,/png|svg/.test(f.type),'beranda')}
 if(t.dataset.k==='kategori'&&tab==='produk'){OPEN.add(D.produk[+t.dataset.i].kategori);draw();return}
 if(t.dataset.k==='gambar'&&t.type!=='file'){PREV.delete(D.produk[+t.dataset.i]);draw();return}
 if(t.dataset.up==null||!t.files[0])return;const r=D.produk[+t.dataset.up];
 unggah(r,u=>r.gambar=u,t.files[0],false,(r.nama||'produk').replace(/[^\w-]+/g,'-'))});
async function post(b){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({password:pw},b))});const x=await r.text();try{return JSON.parse(x)}catch(e){throw new Error('respon server tidak valid (izin Drive/versi deployment belum diperbarui?)')}}
async function masuk(auto){const b=$('go');if(b.disabled)return;
 try{if(!API&&!auto){url=$('api').value.trim()||url;localStorage.setItem('kpc-api',url)}
  if(!url){$('apibox').hidden=false;return setStat($('lstat'),'err','Isi URL Web App dulu')}
  b.disabled=true;setStat($('lstat'),'load','Memeriksa password…');
  pw=auto||$('pw').value;const c=await post({action:'cek'});if(!c.ok)throw new Error(c.error||'Gagal masuk');
  setStat($('lstat'),'load','Memuat data dari spreadsheet…');
  const d=await post({action:'baca'});if(!d.ok)throw new Error(d.error||'Data tidak bisa dibaca');
  D={settings:d.settings||{},kategori:d.kategori||[],produk:d.produk||[],lagu:d.lagu||[]};
  if(!auto)sesSet(pw);$('login').hidden=true;$('app').hidden=false;draw();setStat($('stat'),'ok','Data dimuat')}
 catch(e){if(auto&&/password/i.test(e.message)){try{sessionStorage.removeItem(SES)}catch(x){}}if(!API&&(e.message==='Failed to fetch'||/tidak valid/.test(e.message)))$('apibox').hidden=false;setStat($('lstat'),'err',e.message==='Failed to fetch'?'Tidak tersambung, cek URL Web App':e.message)}
 b.disabled=false}
$('go').onclick=()=>masuk();
$('out').onclick=()=>{try{sessionStorage.removeItem(SES);localStorage.removeItem(SES)}catch(e){}location.reload()};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('save').onclick=async()=>{const b=$('save');b.disabled=true;setStat($('stat'),'load','Menyimpan…');
 try{const r=await post({action:'save',data:D});if(!r.ok)throw new Error(r.error||'Server menolak');
  setStat($('stat'),'load','Memverifikasi…');
  const d=await post({action:'baca'});
  if(!d.ok||d.produk.length!==D.produk.length||d.kategori.length!==D.kategori.length||d.lagu.length!==D.lagu.length)throw new Error('data di sheet tidak cocok, muat ulang lalu cek');
  D.produk.forEach(p=>{if((UP.get(p)||{}).k==='ok')UP.set(p,{k:'saved',t:'Tersimpan'})});if((UP.get(D.settings)||{}).k==='ok')UP.set(D.settings,{k:'saved',t:'Tersimpan'});
  setStat($('stat'),'ok','Tersimpan & terverifikasi ('+D.produk.length+' produk)');toast('Tersimpan');draw()}
 catch(e){setStat($('stat'),'err','Gagal menyimpan: '+e.message);toast('Gagal menyimpan')}
 b.disabled=false};
if(!API){$('apibox').hidden=!!url;$('api').value=url;$('apibox').hidden=false}
{const s=sesGet();if(s)masuk(s)}
</script></body></html>
