<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
@font-face {
  font-family:'Crow Bait';
  src:url('arstudios.otf') format('opentype');
  font-display:swap
}
* {
  box-sizing:border-box;
  margin:0;
  -webkit-tap-highlight-color:transparent
}
:root {
  --bg:#f3efe8;
  --cd:#fbf9f5;
  --ink:#17120f;
  --mu:#8a8076;
  --ln:#e2dacd;
  --ac:#c2552d;
  --dk:#1a1512;
  --dkt:#f4efe6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#100e0c;
    --cd:#1b1815;
    --ink:#f1ebe2;
    --mu:#8f867b;
    --ln:#2e2924;
    --ac:#dc6a3c;
    --dk:#251f1a;
    color-scheme:dark
  }
}
:root[data-theme="dark"] {
  --bg:#100e0c;
  --cd:#1b1815;
  --ink:#f1ebe2;
  --mu:#8f867b;
  --ln:#2e2924;
  --ac:#dc6a3c;
  --dk:#251f1a;
  color-scheme:dark
}
html,body {
  height:100%
}
body {
  background:var(--bg);
  color:var(--ink);
  font:14px/1.4 Inter,system-ui,sans-serif;
  display:grid;
  place-items:center
}
button,input,select {
  font:inherit;
  color:inherit
}
button {
  cursor:pointer;
  border:0;
  background:none
}
:focus-visible {
  outline:2px solid var(--ac);
  outline-offset:2px
}
.app {
  width:100%;
  max-width:none;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  background:var(--bg)
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px 8px
}
.br {
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px
}
.dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4aa56a
}
.mono {
  font:500 9.5px 'JetBrains Mono',ui-monospace,monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--mu)
}
.mu {
  color:var(--mu)
}
.sm {
  font-size:12px
}
.hr {
  display:flex;
  gap:8px;
  align-items:center
}
.ib {
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid var(--ln);
  display:grid;
  place-items:center;
  background:var(--cd)
}
svg.i {
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round
}
.seg2,.seg {
  display:flex;
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:99px;
  padding:3px;
  gap:2px
}
.seg2 button,.seg button {
  flex:1;
  padding:6px 11px;
  border-radius:99px;
  font-size:12px;
  font-weight:500;
  white-space:nowrap
}
.seg button {
  padding:8px 6px
}
.seg2 .on,.seg .on {
  background:var(--ink);
  color:var(--bg)
}
main {
  flex:1;
  overflow:auto;
  padding:6px 16px 110px;
  scrollbar-width:none
}
.ph {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin:10px 0 14px;
  gap:10px
}
h1 {
  font:400 30px/1 'Crow Bait',Georgia,serif;
  letter-spacing:.01em
}
h2 {
  font:400 22px/1.1 'Crow Bait',Georgia,serif
}
.cd {
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px
}
.dk {
  background:var(--dk);
  color:var(--dkt);
  border-radius:16px;
  padding:16px;
  margin-bottom:10px
}
.dk .mono {
  color:#a79c8f
}
.amt {
  font:400 34px/1.1 'Crow Bait',Georgia,serif;
  margin:6px 0 2px
}
.g2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.st b {
  display:block;
  font:400 24px/1.2 'Crow Bait',Georgia,serif;
  margin-top:6px
}
.row {
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:space-between
}
.av {
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--ac);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:600;
  flex:none
}
.chip {
  display:inline-block;
  padding:3px 9px;
  border-radius:99px;
  font-size:11px;
  border:1px solid var(--ln)
}
.chip.w {
  background:#f4e2b8;
  color:#6b4a00;
  border-color:transparent
}
.chip.g {
  background:#d3ecd9;
  color:#1d5a30;
  border-color:transparent
}
.btn {
  background:var(--ac);
  color:#fff;
  border-radius:12px;
  padding:12px 16px;
  font-weight:600;
  width:100%;
  margin-top:10px
}
.btn.s {
  width:auto;
  margin:0;
  padding:8px 13px;
  font-size:12px
}
.btn.o {
  background:none;
  border:1px solid var(--ln);
  color:var(--ink)
}
.btn.k {
  background:var(--ink);
  color:var(--bg)
}
.bar {
  height:5px;
  border-radius:9px;
  background:var(--ln);
  overflow:hidden;
  margin-top:6px
}
.bar i {
  display:block;
  height:100%;
  background:var(--ac)
}
select,input {
  width:100%;
  padding:11px 12px;
  border-radius:11px;
  border:1px solid var(--ln);
  background:var(--bg);
  margin-top:6px
}
label {
  display:block;
  margin-top:12px
}
.sec {
  margin:16px 0 8px
}
.qty {
  display:flex;
  align-items:center;
  gap:10px
}
.qty button {
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid var(--ln);
  font-size:16px
}
.x {
  color:var(--mu);
  width:28px;
  height:28px
}
nav {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background:var(--cd);
  border-top:1px solid var(--ln);
  display:flex;
  padding:8px 6px 12px;
  align-items:flex-end
}
nav>* {
  flex:1
}
nav button.t {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:10.5px;
  color:var(--mu);
  position:relative;
  padding:4px 0
}
nav button.on {
  color:var(--ac);
  font-weight:600
}
.bg {
  position:absolute;
  top:-2px;
  left:56%;
  background:var(--ac);
  color:#fff;
  font-size:9px;
  border-radius:9px;
  padding:0 5px
}
.fab {
  width:54px;
  height:54px;
  border-radius:16px;
  background:var(--ac);
  color:#fff;
  display:grid;
  place-items:center;
  margin:-26px auto 0;
  flex:none!important;
  box-shadow:0 6px 16px rgba(194,85,45,.35)
}
.fab svg {
  width:24px;
  height:24px
}
.cbar {
  position:sticky;
  bottom:0
}
.sh {
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none
}
.sh.on {
  pointer-events:auto
}
.bd {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
  opacity:0;
  transition:.3s
}
.on .bd {
  opacity:1
}
.pn {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-height:88%;
  overflow:auto;
  background:var(--bg);
  border-radius:22px 22px 0 0;
  padding:10px 18px 24px;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1)
}
.on .pn {
  transform:none
}
.hd {
  display:block;
  width:38px;
  height:4px;
  border-radius:9px;
  background:var(--ln);
  margin:0 auto 12px
}
.sr {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px
}
.mt {
  border:1.5px solid var(--ln);
  border-radius:12px;
  padding:14px;
  background:var(--cd);
  text-align:left;
  font-weight:500
}
.mt.on {
  border-color:var(--ink)
}
.ln {
  display:flex;
  justify-content:space-between;
  font-size:12.5px;
  padding:7px 0;
  border-top:1px solid #ffffff1f
}
.lst {
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:10px 0;
  border-top:1px solid var(--ln)
}
.lst:first-child {
  border:0
}
#toast {
  position:absolute;
  left:50%;
  top:70px;
  transform:translate(-50%,-20px);
  background:var(--ink);
  color:var(--bg);
  padding:9px 16px;
  border-radius:99px;
  font-size:12.5px;
  opacity:0;
  transition:.3s;
  z-index:30;
  pointer-events:none;
  white-space:nowrap
}
#toast.on {
  opacity:1;
  transform:translate(-50%,0)
}
.tk {
  text-align:center;
  padding:22px
}
.tk .amt {
  font-size:58px
}
#ld {
  position:fixed;
  inset:0;
  z-index:99;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  transition:opacity .8s ease,transform 1s cubic-bezier(.4,0,.2,1),visibility 0s .8s;
  will-change:opacity,transform
}
#ld.out {
  opacity:0;
  transform:scale(1.06);
  visibility:hidden;
  pointer-events:none
}
#ld .lw {
  position:relative;
  width:min(68vw,280px);
  aspect-ratio:1;
  display:grid;
  place-items:center
}
#ld .lg {
  width:80%;
  height:auto;
  overflow:visible;
  animation:br 4.5s ease-in-out
}
#ld .rg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform:rotate(-90deg);
  overflow:visible
}
#ld .rg circle {
  fill:none;
  stroke-width:1.2
}
#ld .rg .tk {
  stroke:var(--ln)
}
#ld .rg .pr {
  stroke:var(--ac);
  stroke-linecap:round;
  stroke-dasharray:1;
  stroke-dashoffset:1;
  animation:pr 4.5s cubic-bezier(.5,0,.2,1) forwards
}
@keyframes pr {
  to {
    stroke-dashoffset:0
  }
}
#ld .dr {
  fill:var(--ink);
  fill-opacity:0;
  stroke:var(--ac);
  stroke-width:.35;
  stroke-dasharray:1;
  stroke-dashoffset:1;
  animation:draw 1.3s cubic-bezier(.6,0,.2,1) forwards,fil .7s 1.3s ease forwards;
  animation-delay:calc(var(--i)*55ms),1.3s
}
#ld .st0 {
  fill:var(--bg);
  transform-box:fill-box;
  transform-origin:center;
  transform:scale(0);
  animation:zin .55s cubic-bezier(.3,1.5,.5,1) calc(2s + var(--o,0)*1ms) forwards
}
@keyframes zin {
  to {
    transform:scale(1)
  }
}
@keyframes lt {
  0% {
    stroke-dashoffset:1;
    fill-opacity:0
  }
  55% {
    stroke-dashoffset:0;
    fill-opacity:0
  }
  100% {
    stroke-dashoffset:0;
    fill-opacity:1
  }
}
#ld .st2 {
  fill:var(--ink);
  fill-opacity:0;
  stroke:var(--ink);
  stroke-width:.3;
  stroke-dasharray:1;
  stroke-dashoffset:1;
  animation:lt .75s ease calc(2.95s + var(--o,0)*1ms) forwards
}
@keyframes draw {
  to {
    stroke-dashoffset:0
  }
}
@keyframes fil {
  to {
    fill-opacity:1;
    stroke-opacity:0
  }
}
@keyframes fi {
  to {
    opacity:1
  }
}
@keyframes up {
  from {
    transform:translateY(10px)
  }
  to {
    opacity:1;
    transform:none
  }
}
@keyframes pb {
  to {
    transform:none
  }
}
@keyframes br {
  0%,60% {
    transform:scale(.96)
  }
  85% {
    transform:scale(1.03)
  }
  100% {
    transform:scale(1)
  }
}
@media(prefers-reduced-motion:reduce) {
  #ld * {
    animation-duration:.01s!important;
    animation-delay:0s!important
  }
}
html,body {
  overscroll-behavior:none
}
input,select {
  font-size:16px
}
button {
  touch-action:manipulation
}
.ib[hidden] {
  display:none
}
.ins {
  display:flex;
  gap:14px;
  align-items:flex-start;
  margin-top:12px
}
.ins .av {
  background:var(--ink);
  color:var(--bg)
}
@media(max-width:479px) {
  .app {
    height:100dvh
  }
  main {
    padding-bottom:120px
  }
  .pn {
    max-height:92%
  }
}
@media(display-mode:standalone) {
  body {
    user-select:none;
    -webkit-user-select:none
  }
  input {
    user-select:text;
    -webkit-user-select:text
  }
}
@keyframes rise {
  from {
    opacity:0;
    transform:translateY(16px) scale(.98)
  }
}
@keyframes fin {
  from {
    opacity:0
  }
}
@keyframes grow {
  from {
    transform:scaleX(0)
  }
}
@keyframes pop {
  0% {
    transform:scale(.6)
  }
  60% {
    transform:scale(1.25)
  }
  100% {
    transform:none
  }
}
@keyframes spin {
  to {
    transform:rotate(360deg)
  }
}
@keyframes out {
  to {
    opacity:0;
    transform:translateX(44px) scale(.96);
    max-height:0;
    margin-top:0;
    margin-bottom:0;
    padding-top:0;
    padding-bottom:0;
    border-width:0
  }
}
@keyframes rip {
  to {
    transform:scale(1);
    opacity:0
  }
}
@keyframes pulse {
  0% {
    box-shadow:0 0 0 0 rgba(74,165,106,.55)
  }
  100% {
    box-shadow:0 0 0 8px rgba(74,165,106,0)
  }
}
.enter>*:not(.cl),.enter .cl>* {
  animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;
  animation-delay:calc(var(--k,0)*55ms)
}
.enter .bar i {
  transform-origin:left;
  animation:grow .9s cubic-bezier(.2,.8,.2,1) .35s backwards
}
.enter .ln-draw {
  stroke-dasharray:700;
  stroke-dashoffset:700;
  animation:draw 1.4s cubic-bezier(.6,0,.2,1) .25s forwards
}
.enter polygon {
  animation:fin 1s .9s backwards
}
.enter .pt {
  transform-box:fill-box;
  transform-origin:center;
  animation:pop .5s 1.45s backwards
}
.dot {
  animation:pulse 2.2s infinite
}
.cd,.dk {
  transition:border-color .3s,transform .3s
}
button {
  transition:transform .18s,background-color .3s,color .3s,border-color .3s,filter .3s,opacity .3s
}
button:active {
  transform:scale(.95)
}
.fab:active {
  transform:scale(.9)
}
.fab svg {
  transition:transform .4s cubic-bezier(.3,1.5,.5,1)
}
.fab:active svg {
  transform:rotate(135deg)
}
@media(hover:hover) {
  .cd:hover {
    border-color:var(--mu);
    transform:translateY(-2px)
  }
  .btn:hover,.fab:hover {
    filter:brightness(1.1)
  }
  .ib:hover,.mt:hover {
    border-color:var(--mu)
  }
  nav button.t:hover {
    color:var(--ink)
  }
}
select,input {
  transition:border-color .3s,box-shadow .3s
}
select:focus,input:focus {
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 3px rgba(194,85,45,.2)
}
.seg {
  position:relative
}
.seg button {
  position:relative;
  z-index:1
}
.seg .on {
  background:none
}
.pl {
  position:absolute;
  top:3px;
  bottom:3px;
  left:3px;
  background:var(--ink);
  border-radius:99px;
  transition:left .45s cubic-bezier(.3,1.2,.4,1),width .45s cubic-bezier(.3,1.2,.4,1)
}
.btn,.fab,.mt {
  position:relative;
  overflow:hidden
}
.rp {
  position:absolute;
  border-radius:50%;
  background:currentColor;
  opacity:.28;
  transform:scale(0);
  animation:rip .65s ease-out forwards;
  pointer-events:none
}
#nv.sw button.on svg {
  animation:pop .5s cubic-bezier(.3,1.4,.5,1)
}
.on .pn>* {
  animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;
  animation-delay:calc(var(--k,0)*45ms + .1s)
}
#cash,#qr {
  animation:rise .35s backwards
}
.rm {
  overflow:hidden;
  animation:out .32s cubic-bezier(.5,0,.8,.4) forwards
}
.tx,.tx * {
  transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s!important
}
.tx #thm svg {
  animation:spin .6s
}
@media(prefers-reduced-motion:reduce) {
  *,::before,::after {
    animation-duration:.01ms!important;
    animation-delay:0s!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
}
@media(min-width:768px) {
  .app {
    max-width:none;
    height:100%;
    border:0;
    border-radius:0;
    display:grid;
    grid-template-columns:92px 1fr;
    grid-template-rows:auto minmax(0,1fr)
  }
  header {
    grid-column:1/-1;
    padding:14px 24px 10px;
    border-bottom:1px solid var(--ln)
  }
  nav {
    position:static;
    grid-row:2;
    grid-column:1;
    min-height:0;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:6px;
    padding:16px 8px;
    border-top:0;
    border-right:1px solid var(--ln);
    overflow:auto
  }
  nav>* {
    flex:none
  }
  .fab {
    order:-1;
    margin:0 auto 14px;
    box-shadow:none
  }
  main {
    grid-row:2;
    grid-column:2;
    min-height:0;
    padding:12px max(28px,calc((100% - 1000px)/2)) 56px
  }
  h1 {
    font-size:38px
  }
  .cl {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 14px
  }
  .cl>.cd {
    margin-bottom:14px
  }
  .cl>.mu {
    grid-column:1/-1
  }
  .pg {
    grid-template-columns:repeat(3,1fr)
  }
  .g4 {
    grid-template-columns:repeat(4,1fr)
  }
  .dk svg {
    height:150px!important
  }
  .cbar {
    bottom:12px;
    max-width:420px;
    margin-left:auto
  }
  .pn {
    left:50%;
    right:auto;
    bottom:auto;
    top:50%;
    width:min(540px,92%);
    max-height:88%;
    border-radius:22px;

  position:relative
}
.wc div {
  height:40px;
  scroll-snap-align:center;

  cursor:pointer
}

  color:var(--ink);

}
.wh b {

  position:relative

.sg {

}

.sg button.sel {

  border-color:var(--ac)
}
.sg button:disabled {
  opacity:.35;
  text-decoration:line-through
}
.pim {
  height:86px;

.pim svg {

}
.pik {

.bsr::-webkit-scrollbar {

.pc .cd {

.pc .pim {

.pc b {

  line-height:1.25;
  overflow-wrap:anywhere
}
.pc .sm {
  font-size:11px

  }

    font-size:14px

    font-size:13px
  }

`<div class="cl">`+(b.map(x=>`<div class="cd"><div class="row"><span class="row"><span class="chip" style="font-family:'JetBrains Mono',monospace">${x.sch.time}</span><span class="chip ${x.st=='pending'?'w':'g'}">${bst(x)}</span></span><span class="mono">${x.sch.day?'besok':'hari ini'}</span></div>

const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0),

`<div class="g2 pg${cus?' pc':''}">${S.prod.length?'':'<div class="cd mu" style="grid-column:1/-1;text-align:center">Belum ada produk.</div>'}${S.prod.map((p,i)=>`<div class="cd" style="margin:0">${pimgH(p)}<div class="row"><span class="mono">${cus?(p.s>0?'tersedia':'habis'):'stok '+p.s}</span>${!cus&&S.role=='adm'?`<span class="row" style="gap:2px"><button class="chip" data-a="pd-e" data-id="${i}">Ubah</button><button class="x" data-a="pd-d" data-id="${i}" aria-label="Hapus">${I.x}</button></span>`:''}</div><div style="margin:6px 0 2px;min-height:${cus?30:38}px"><b>${p.n}</b></div><div class="mu sm">${rp(p.p)}</div>${cus?'':`<div class="qty row" style="margin-top:10px"><button data-a="cm" data-v="${i}" aria-label="Kurang">-</button><b>${S.cart[i]||0}</b><button data-a="cp" data-v="${i}" aria-label="Tambah">+</button></div>`}</div>`).join('')}</div>`+
(cus?bar:(cartN()?`<div class="cbar"><button class="btn" data-a="co">Bayar ${cartN()} produk · ${rp(cartT())}</button></div>`:'')+`<div class="mono sec">penjualan produk hari ini</div><div class="cd">${tp.slice().reverse().map(x=>`<div class="lst"><span>${x.n}<div class="mu sm">${jam(x.t)}</div></span><b>${rp(x.a)}</b></div>`).join('')||'<span class="mu">Belum ada penjualan hari ini.</span>'}</div>`)

<div class="cd">${CAT.map((c,i)=>{
    const a=ex.filter(x=>x.c==i).reduce((s,x)=>s+x.a,0);

const wait=()=>S.q.filter(x=>x.st=='wait'),
  bst=x=>({pending:'Menunggu konfirmasi',ok:'Terkonfirmasi',wait:'Sudah check-in',chair:'Di kursi',done:'Selesai'}[x.st]);
function cq(){
  const me=S.q.find(x=>x.id==S.me.q)||(CU.guest?null:S.q.find(x=>x.uid==CU.id&&(x.st=='wait'||x.st=='chair'))),
    cur=S.q.find(x=>x.st=='chair'),
    w=wait();
  let top;
  if(me&&me.st!='done'){
    const ah=w.filter(x=>x.t<me.t),eta=ah.reduce((a,x)=>a+sv(x.svc).m,0)+(cur&&me.st=='wait'?15:0);
    top=`<div class="dk tk${me.st=='chair'?' turn':''}"><div class="mono">nomor antrian anda</div><div class="amt">${me.no}</div><div>${me.name} · ${sv(me.svc).n}</div>${CU.guest?'<div class="mu sm" style="margin-top:10px;color:#a79c8f">Catat nomor ini. Setelah halaman ditutup, nomor tidak bisa dilihat lagi.</div>':''}<div class="ln" style="margin-top:14px"><span>${me.st=='chair'?'Status':'Di depan anda'}</span><b>${me.st=='chair'?'Sedang dicukur':ah.length+' orang'}</b></div>${me.st=='wait'?`<div class="ln"><span>Perkiraan dipanggil</span><b>±${eta} menit</b></div>`:''}</div>${me.st=='wait'?`<button class="btn o" data-a="cx">Batalkan antrian</button>`:''}`
  }
else if(me){
    top=`<div class="dk tk"><div class="mono">selesai</div><div class="amt">Terima kasih</div><div>Sampai jumpa lagi, ${me.name}.</div></div><button class="btn" data-a="cn">Ambil antrian baru</button>`
  }
else top=`<div class="cd"><div class="mono">ambil nomor antrian</div><label>Nama<input id="f-n" placeholder="Nama anda" autocomplete="name" value="${CU.guest?'':CU.name}"></label><label>Layanan<select id="f-s">${opts(SV,0)}</select></label><label>Barber<select id="f-b">${optsC('Siapa saja')}</select></label><button class="btn" data-a="cq-go">Ambil nomor</button></div>`;
  return head('Antrian',today)+`<div class="g2"><div class="cd st"><div class="mono">sedang dilayani</div><b>${cur?cur.no:'-'}</b></div><div class="cd st"><div class="mono">menunggu</div><b>${w.length} orang</b></div></div>`+top+rtc()+`<div class="mono sec">antrian saat ini</div><div class="cd">${S.q.filter(x=>x.st=='wait'||x.st=='chair').sort((a,b)=>a.t-b.t).map(x=>`<div class="lst"><span>${x.no} · ${x.name.split(' ')[0]} ${x.name.split(' ')[1]?x.name.split(' ')[1][0]+'.':''}<div class="mu sm">${sv(x.svc).n}</div></span><span class="chip ${x.st=='chair'?'g':'w'}">${x.st=='chair'?'Di kursi':'Menunggu'}</span></div>`).join('')||'<span class="mu">Tidak ada antrian. Silakan langsung datang.</span>'}</div>`
}
function cb(){
  if(CU.guest){
    S.qv='q';
    return cq()
  }
  const mine=S.q.filter(x=>S.me.b.includes(x.id)||(x.uid==CU.id&&x.sch&&(x.st=='pending'||x.st=='ok')));
  return head('Booking','Pesan jadwal tanpa antri')+`<div class="cd"><label style="margin:0">Nama<input id="f-n" placeholder="Nama anda" value="${CU.guest?'':CU.name}"></label><label>Layanan<select id="f-s">${opts(SV,0)}</select></label><label>Barber<select id="f-b">${optsC('Siapa saja')}</select></label><div class="g2"><label>Hari<select id="f-d"><option value="0">Hari ini</option><option value="1">Besok</option></select></label><label>Jam<select id="f-t">${TM.map(t=>`<option>${t}</option>`).join('')}</select></label></div><button class="btn" data-a="bk-go">Pesan sekarang</button></div><div class="mono sec">booking saya</div>`+(mine.map(x=>`<div class="cd"><div class="row"><b>${x.sch.time} · ${x.sch.day?'Besok':'Hari ini'}</b><span class="chip ${x.st=='pending'?'w':'g'}">${bst(x)}</span></div><div class="mu sm">${sv(x.svc).n} · ${BR[x.b]||'Siapa saja'}</div>${x.st=='ok'?`<button class="btn s" style="margin-top:10px" data-a="cbc" data-id="${x.id}">Saya sudah tiba, masuk antrian</button>`:''}${x.st=='pending'||x.st=='ok'?`<button class="btn s o" style="margin:10px 0 0 8px" data-a="cbx" data-id="${x.id}">Batalkan booking</button>`:''}</div>`).join('')||`<div class="mu sm">Belum ada booking.</div>`)
}

const fN=`<label>Nama pelanggan<input id="f-n" placeholder="Nama"></label>`,
  fS=`<label>Layanan<select id="f-s">${opts(SV,0)}</select></label>`,
  fB=`<label>Barber<select id="f-b">${opts(BR,-1,'Pilih barber…')}</select></label>`;
let PAY;
function payOpen(lines,total,done){

  sheet('Pembayaran',`<div class="dk"><div class="mono">untuk dibayar</div><div class="amt">${rp(total)}</div>${lines.map(l=>`<div class="ln"><span>${l[0]}</span><span>${rp(l[1])}</span></div>`).join('')}</div><div class="mono sec">metode pembayaran</div><div class="g2"><button class="mt on" data-a="pm" data-v="cash">Tunai</button><button class="mt" data-a="pm" data-v="qris">QRIS</button></div><div id="cash"><label>Diterima<input id="rcv" inputmode="numeric" placeholder="0"></label><div class="row" style="margin-top:8px"><span class="mu">Kembalian</span><b id="chg">Rp 0</b></div></div><div id="qr" class="mu sm" hidden style="margin-top:12px">Tunjukkan kode QRIS ke pelanggan, lalu konfirmasi setelah pembayaran masuk.</div><button class="btn" data-a="paygo">Konfirmasi pembayaran</button>`)
}
const val=id=>($('#'+id)||{}).value;
const A={
  theme(){
    const r=document.documentElement;
    r.classList.add('tx');
    setTimeout(()=>r.classList.remove('tx'),600);
    const d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme=d?'light':'dark'
  },
  role(v){
    S.role=v;
    $('main').scrollTop=0
  },
  tab(v){
    if(S.tab[S.role]!=v){
      S.tab[S.role]=v;
      $('main').scrollTop=0
    }
  },
  rng(v){
    S.rng=+v
  },
  qt(v){
    S.qt=v
  },
  qv(v){
    S.qv=v
  },
  bt(v){
    S.bt=+v
  },
  close,
  qb(v,el){
    S.q.find(x=>x.id==el.dataset.id).b=+el.value
  },
  qs(v,el){
    const x=S.q.find(x=>x.id==el.dataset.id);
    if(x.b<0&&(CU.role=='kry'||CU.role=='adm')&&CU.bi!=null)x.b=CU.bi;
    if(x.b<0)return toast('Pilih barber dulu');
    x.st='chair';
    S.qt='chair';
    toast('Pelanggan di kursi')
  },
  qp(v,el){
    const x=S.q.find(x=>x.id==el.dataset.id),s=sv(x.svc);
    payOpen([[s.n,s.p]],s.p,()=>{
      x.st='done';
      x.pa=s.p;
      S.tx.push({t:Date.now(),y:'j',a:s.p,b:Math.max(x.b,0),n:s.n});
      S.qt='done'
    })
  },
  qx(v,el){
    S.q=S.q.filter(x=>x.id!=el.dataset.id)
  },
  bk(v,el){
    S.q.find(x=>x.id==el.dataset.id).st='ok';
    toast('Booking dikonfirmasi')
  },
  bx(v,el){
    S.q=S.q.filter(x=>x.id!=el.dataset.id)
  },
  bc(v,el){
    arrive(S.q.find(x=>x.id==el.dataset.id));
    S.tab[S.role]='queue';
    S.qt='wait';
    S.qv='q';
    toast('Check-in berhasil, masuk antrian')
  },
  fab(){
    sheet('Tambah baru',`<div class="g2">${[['fab-q','Antrian walk-in',I.q],['fab-b','Booking baru',I.cal],['fab-p','Jual produk',I.bag],['fab-e','Catat pengeluaran',I.wal]].filter(z=>z[0]!='fab-e'||S.role=='adm').map(([a,l,i])=>`<button class="mt" data-a="${a}">${i}<div style="margin-top:8px">${l}</div></button>`).join('')}</div>`)
  },
  'fab-q'(){
    sheet('Antrian walk-in',fN+fS+fB+`<button class="btn" data-a="q-go">Tambah ke antrian</button>`)
  },
  'q-go'(){
    if(!SV.length)return toast('Layanan belum tersedia');
    const n=val('f-n').trim();
    if(!n)return toast('Isi nama pelanggan');
    addQ(n,+val('f-s'),+val('f-b'),'walk-in');
    S.tab[S.role]='queue';
    S.qt='wait';
    S.qv='q';
    close()
  },
  'fab-b'(){
    sheet('Booking baru',fN+fS+fB+`<div class="g2"><label>Hari<select id="f-d"><option value="0">Hari ini</option><option value="1">Besok</option></select></label><label>Jam<select id="f-t">${TM.map(t=>`<option>${t}</option>`).join('')}</select></label></div><button class="btn" data-a="bk-go">Simpan booking</button>`)
  },
  'bk-go'(){
    if(!SV.length)return toast('Layanan belum tersedia');
    if(!TM.length)return toast('Slot jam belum tersedia');
    const n=val('f-n').trim();
    if(!n)return toast('Isi nama dulu');
    const b={id:nid(),no:null,sch:{day:+val('f-d'),time:val('f-t')},name:clean(n),uid:S.role=='cus'?CU.id:null,svc:+val('f-s'),b:+val('f-b'),st:S.role!='cus'?'ok':'pending',t:Date.now(),src:'booking'};
    S.q.push(b);
    if(S.role=='cus')S.me.b.push(b.id);else{
      S.tab[S.role]='queue';
      S.qv='b';
      S.bt=b.sch.day;
      close()
    }
    toast(S.role!='cus'?'Booking disimpan':'Booking terkirim, tunggu konfirmasi')
  },
  'fab-p'(){
    close();
    S.tab[S.role]='prod'
  },
  'fab-e'(){
    sheet('Catat pengeluaran',`<label>Keterangan<input id="e-n" placeholder="Contoh: Makan siang"></label><label>Kategori<select id="e-c">${opts(CAT,0)}</select></label><label>Jumlah (Rp)<input id="e-a" inputmode="numeric" placeholder="0"></label><button class="btn" data-a="e-go">Simpan pengeluaran</button>`)
  },
  'e-go'(){
    if(!CAT.length)return toast('Tambah kategori dulu di Katalog');
    const a=+String(val('e-a')).replace(/\D/g,''),n=val('e-n').trim();
    if(!n||!a)return toast('Isi keterangan dan jumlah');
    S.ex.push({id:nid(),n:clean(n),c:+val('e-c'),a,t:Date.now()});
    S.tab[S.role]='exp';
    close();
    toast('Pengeluaran dicatat')
  },
  'ex-del'(v,el){
    S.ex=S.ex.filter(x=>x.id!=el.dataset.id)
  },
  cp(v){
    const p=S.prod[v];
    if((S.cart[v]||0)<p.s)S.cart[v]=(S.cart[v]||0)+1;else toast('Stok habis')
  },
  cm(v){
    if(S.cart[v]>0)S.cart[v]--;
    if(!S.cart[v])delete S.cart[v]
  },
  co(){
    const l=Object.entries(S.cart).map(([i,n])=>[`${S.prod[i].n} × ${n}`,S.prod[i].p*n]),
      nm=Object.entries(S.cart).map(([i,n])=>`${S.prod[i].n} ×${n}`).join(', ');
    payOpen(l,cartT(),()=>{
      Object.entries(S.cart).forEach(([i,n])=>S.prod[i].s-=n);
      S.tx.push({t:Date.now(),y:'p',a:cartT(),b:-1,n:nm});
      S.cart={}
    })
  },
  pm(v,el){
    PAY.m=v;
    document.querySelectorAll('.mt').forEach(b=>b.classList.toggle('on',b==el));
    $('#cash').hidden=v!='cash';
    $('#qr').hidden=v=='cash'
  },
  paygo(){
    if(PAY.m=='cash'&&val('rcv')&&+val('rcv').replace(/\D/g,'')<PAY.total)return toast('Uang diterima kurang');
    PAY.done();
    close();
    toast('Pembayaran berhasil')
  },
  'cq-go'(){
    if(!SV.length)return toast('Layanan belum tersedia');
    const n=val('f-n').trim();
    if(!n)return toast('Isi nama dulu');
    {
      const x=addQ(n,+val('f-s'),+val('f-b'),CU.guest?'Tamu':'online');
      if(!CU.guest)x.uid=CU.id;else{
        const l=gt();
        l.push(x.id);
        sgt(l)
      }
      S.me.q=x.id
    }
    toast('Nomor antrian didapat')
  },
  cx(){
    S.q=S.q.filter(x=>x.id!=S.me.q);
    S.me.q=null
  },
  cn(){
    S.me.q=null
  }
};
function arrive(x){
  nxn();
  x.no='A'+String(S.n).padStart(2,'0');
  x.t=Date.now();

function toko(){

function dkWalk(root,sc){
  const d=S.dk;
  if(!root||!d)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];
  let n;
  while(n=w.nextNode())ns.push(n);

    const c=d[sc+'|'+t];

  });

    const c=d[sc+'|PH:'+e.getAttribute('placeholder')];
    if(c)e.setAttribute('placeholder',c)
  })
}

      const sh=shf(r),key=k+'|'+r.id,h=JSON.stringify(MAP[sh].to(r)),o=SYN.sn[key];
      seen[key]=1;
      if(!o)enq(sh,'save',r,k);else if(o.h!==h||o.sh!==sh){
        if(o.sh!=sh)enq(o.sh,'del',r,k);
        enq(sh,'save',r,k)
      }

    });
    Object.keys(SYN.sn).forEach(key=>{
      if(key.indexOf(k+'|')!==0||seen[key])return;
      const id=key.slice(k.length+1);

      enq(SYN.sn[key].sh,'del',{id},k);

  }

function ack(o,r){
  const k=SH2K[o.sh],key=k+'|'+o.id;
  if(o.op=='del'){
    delete SYN.ak[key];

  }
  if(o.row&&o.row.status=='batal'&&Object.keys(o.row).length==2)return;
  if(r.deleted){

      l._v=it.v
    }else{

      arr.push(l)
    }

const pad2=n=>String(n).padStart(2,'0');
function wheel(v,cb){
  const p=(/^\d{1,2}:\d{2}$/.test(v)?v:'10:00').split(':').map(Number),
    cur={h:p[0],m:Math.round(p[1]/5)*5%60},
    w=document.createElement('div');
  w.className='wh';
  const col=(c,n,st)=>`<div class="wc" data-c="${c}">${Array.from({length:n},(_,i)=>`<div data-i="${i*st}">${pad2(i*st)}</div>`).join('')}</div>`;
  w.innerHTML='<i class="wm"></i>'+col('h',24,1)+'<b>:</b>'+col('m',12,5);
  const cs=[...w.querySelectorAll('.wc')],
    stp=c=>c.dataset.c=='h'?1:5,
    mark=c=>[...c.children].forEach(e=>e.classList.toggle('sel',+e.dataset.i==cur[c.dataset.c]));
  cs.forEach(c=>{
    mark(c);
    let t;
    c.addEventListener('scroll',()=>{
      clearTimeout(t);
      t=setTimeout(()=>{
        const i=Math.max(0,Math.min(c.children.length-1,Math.round(c.scrollTop/40)));
        cur[c.dataset.c]=i*stp(c);
        mark(c);
        cb(pad2(cur.h)+':'+pad2(cur.m))
      },90)
    });
    c.addEventListener('click',e=>{
      const d=e.target.closest('[data-i]');
      if(d)c.scrollTo({top:d.dataset.i/stp(c)*40,behavior:'smooth'})
    })
  });
  requestAnimationFrame(()=>cs.forEach(c=>c.scrollTop=cur[c.dataset.c]/stp(c)*40));
  return w
}

    x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);
    URL.revokeObjectURL(u);
    let q=.8,d;
    do{
      d=c.toDataURL('image/jpeg',q);
      q-=.1
    }while(d.length>20000&&q>.3);
    cb(d.length>42000?null:d)
  };
  im.onerror=()=>cb(null);
  im.src=u

const FXA={c:null,on:(()=>{try{return localStorage.getItem('ars_snd')!='0'}catch(e){return true}})()};
function fxCtx(){
  if(!FXA.c){try{FXA.c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(FXA.c.state=='suspended')FXA.c.resume().catch(()=>{});
  return FXA.c
}
function tone(f,t0,d,v,type,f2){
  const c=fxCtx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)
}
const FXM={
  tap:()=>tone(900,0,.05,.045,'triangle'),
  nav:()=>{tone(620,0,.06,.05);tone(820,.05,.08,.04)},
  open:()=>{tone(520,0,.08,.05);tone(780,.06,.1,.05)},
  close:()=>tone(700,0,.1,.05,'sine',420),
  ok:()=>{tone(660,0,.1,.07);tone(990,.09,.16,.07)},
  err:()=>{tone(220,0,.16,.06,'sawtooth');tone(165,.12,.18,.05,'sawtooth')},
  del:()=>tone(520,0,.14,.06,'triangle',220),
  staff:()=>[0,.24,.48].forEach(d=>{tone(880,d,.2,.16);tone(1320,d,.2,.07)}),
  turn:()=>{const a=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,.17,'triangle'));a();setTimeout(a,950)},
  soft:()=>{tone(740,0,.22,.03);tone(988,.12,.28,.022)}
};
function FXS(n){if(!FXA.on)return;try{FXM[n]&&FXM[n]()}catch(e){}}
function FXT(m){FXS(/gagal|tidak|salah|bentrok|ditolak|habis|offline|berakhir|terlalu/i.test(m)?'err':'ok')}
function FXI(){
  const b='<path d="M4 9v6h4l5 4V5L8 9z"/>';
  return typeof P=='function'?P(FXA.on?b+'<path d="M16.5 8.5a5 5 0 010 7"/>':b+'<path d="M17 9l4 6M21 9l-4 6"/>'):''
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],button,.chip,.mt');
  if(!t)return;
  const a=t.dataset.a||'';
  if(a=='close'||a=='snd')return;
  FXS(/^(tab|nq|nbk|mgo|hgs|hgm|ngrp|menu)$/.test(a)?'nav':/(^cx$|^qx$|-d$|del|^x$)/.test(a)||t.classList.contains('x')?'del':'tap')
},true);
document.addEventListener('change',e=>{if(/SELECT|INPUT/.test(e.target.tagName))FXS('nav')},true);
Object.assign(A,{snd:()=>{
  FXA.on=!FXA.on;
  try{localStorage.setItem('ars_snd',FXA.on?'1':'0')}catch(e){}
  const h=$('#sndb');if(h)h.innerHTML=FXI();
  if(FXA.on)FXS('ok');
  toast(FXA.on?'Suara dinyalakan':'Suara dimatikan')
}});
(()=>{
  const th=$('#thm');
  if(th){th.insertAdjacentHTML('beforebegin','<button class="'+th.className+'" id="sndb" data-a="snd" aria-label="Suara">'+FXI()+'</button>')}
  document.body.insertAdjacentHTML('beforeend','<div id="ntf" aria-live="polite"></div>');
  const first=()=>{
    if(CU&&!FXA.asked&&window.Notification&&Notification.permission=='default'){FXA.asked=1;try{Notification.requestPermission()}catch(e){}}
  };
  document.addEventListener('click',first,true);
  ['pointerdown','keydown'].forEach(n=>document.addEventListener(n,()=>fxCtx(),{once:true,capture:true}))
})();
/* banner notifikasi: staff = ding 3x (keras), turn = giliran pelanggan, soft = info lembut */
function ntf(kind,title,body){
  FXS(kind);
  try{navigator.vibrate&&navigator.vibrate(kind=='turn'?[200,100,200,100,300]:kind=='staff'?[120,60,120]:[40])}catch(e){}
  const box=$('#ntf');if(!box)return;
  while(box.children.length>=3)box.firstChild.remove();
  const n=document.createElement('div');
  n.className='nt '+kind;
  n.innerHTML='<b></b><span></span>';
  n.firstChild.textContent=title;n.lastChild.textContent=body||'';
  const rm=()=>{if(!n.parentNode||n.classList.contains('out'))return;n.classList.add('out');setTimeout(()=>n.remove(),320)};
  n.addEventListener('click',rm);
  box.appendChild(n);
  setTimeout(rm,kind=='turn'?12000:6000);
  try{if(window.Notification&&Notification.permission=='granted'&&document.visibilityState!='visible')new Notification(title,{body:body||'',tag:'ars-'+kind})}catch(e){}
}
const FXN={prev:null,key:null,ah:null};
function fxScan(){
  if(!CU)return;
  const k=CU.id+'|'+CU.role,snap={};
  S.q.forEach(x=>snap[x.id]={st:x.st});
  const me=CU.role=='cus'?(S.q.find(x=>x.id==S.me.q)||(CU.guest?null:S.q.find(x=>x.uid==CU.id&&(x.st=='wait'||x.st=='chair')))):null,
    ah=me&&me.st=='wait'?S.q.filter(x=>x.st=='wait'&&x.t<me.t).length:null,p=FXN.prev,pa=FXN.ah;
  FXN.prev=snap;FXN.ah=ah;
  if(FXN.key!==k||!p){FXN.key=k;return}
  if(CU.role!='cus'){
    S.q.forEach(x=>{
      if(p[x.id]||x._ro||String(x.id).indexOf('i'+DV)==0)return;
      if(CU.role=='kry'&&x.b>=0&&x.b!=CU.bi)return;
      if(x.st=='wait')ntf('staff','Pelanggan baru masuk antrian',(x.no?x.no+' · ':'')+x.name);
      else if(x.st=='pending')ntf('staff','Booking baru masuk',x.name+' · menunggu konfirmasi')
    });
    Object.keys(p).forEach(id=>{if(!snap[id]&&p[id].st=='wait')ntf('soft','Antrian dibatalkan','Seorang pelanggan keluar dari antrian')})
  }else{
    if(me&&p[me.id]){
      if(p[me.id].st!='chair'&&me.st=='chair')ntf('turn','Giliran Anda!','Nomor '+me.no+', silakan menuju kursi.');
      else if(me.st=='wait'&&pa!=null&&ah<pa)ntf('soft',ah==0?'Anda berikutnya':'Antrian bergerak',ah==0?'Bersiaplah, sebentar lagi giliran Anda.':'Tinggal '+ah+' orang di depan Anda.')
    }
    (S.me.b||[]).forEach(id=>{
      const b=S.q.find(x=>x.id==id);
      if(b&&p[id]&&p[id].st=='pending'&&b.st=='ok')ntf('soft','Booking dikonfirmasi','Jadwal Anda sudah disetujui.')
    })
  }
}
</script>
<style>
#ntf{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none;padding:0 12px}
.nt{pointer-events:auto;cursor:pointer;width:100%;max-width:420px;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);border-left:4px solid var(--ac);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:ntin .45s cubic-bezier(.2,.8,.2,1) both}
.nt span{font-size:13px;opacity:.85}
.nt.staff{border-left-color:#e8821f}
.nt.turn{border-left-color:#2e9e5b;animation:ntin .45s cubic-bezier(.2,.8,.2,1) both,ntpl 1.6s ease-in-out .5s 4}
.nt.soft{opacity:.92}
.nt.out{animation:ntout .3s ease forwards}
@keyframes ntin{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ntout{to{opacity:0;transform:translateY(-16px) scale(.97)}}
@keyframes ntpl{50%{box-shadow:0 0 0 7px rgba(46,158,91,.3)}}
@media(prefers-reduced-motion:no-preference){
  .btn:active,.chip:active,.mt:active,.ib:active,nav button.t:active{animation:prs .18s ease}
  input:focus,select:focus{animation:fcs .35s ease}
  .dk.tk.turn{animation:tkp 2s ease-in-out infinite}
}
@keyframes prs{50%{transform:scale(.95)}}
@keyframes fcs{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 45%,transparent)}to{box-shadow:0 0 0 6px transparent}}
@keyframes tkp{50%{box-shadow:0 0 0 8px color-mix(in srgb,#2e9e5b 30%,transparent)}}
</style>
