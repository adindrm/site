*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3efe8;--cd:#fbf9f5;--ink:#17120f;--mu:#8a8076;--ln:#e2dacd;--ac:#c2552d;--dk:#1a1512;--dkt:#f4efe6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100e0c;--cd:#1b1815;--ink:#f1ebe2;--mu:#8f867b;--ln:#2e2924;--ac:#dc6a3c;--dk:#251f1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100e0c;--cd:#1b1815;--ink:#f1ebe2;--mu:#8f867b;--ln:#2e2924;--ac:#dc6a3c;--dk:#251f1a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;display:grid;place-items:center}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{width:100%;max-width:none;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px}
.br{font-weight:600;display:flex;align-items:center;gap:6px;font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:#4aa56a}
.mono{font:500 9.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu)}.sm{font-size:12px}
.hr{display:flex;gap:8px;align-items:center}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;background:var(--cd)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.seg2,.seg{display:flex;background:var(--cd);border:1px solid var(--ln);border-radius:99px;padding:3px;gap:2px}
.seg2 button,.seg button{flex:1;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.seg button{padding:8px 6px}
.seg2 .on,.seg .on{background:var(--ink);color:var(--bg)}
main{flex:1;overflow:auto;padding:6px 16px 110px;scrollbar-width:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 14px;gap:10px}
h1{font:400 30px/1 'Crow Bait',Georgia,serif;letter-spacing:.01em}
h2{font:400 22px/1.1 'Crow Bait',Georgia,serif}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.dk{background:var(--dk);color:var(--dkt);border-radius:16px;padding:16px;margin-bottom:10px}
.dk .mono{color:#a79c8f}
.amt{font:400 34px/1.1 'Crow Bait',Georgia,serif;margin:6px 0 2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st b{display:block;font:400 24px/1.2 'Crow Bait',Georgia,serif;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;border:1px solid var(--ln)}
.chip.w{background:#f4e2b8;color:#6b4a00;border-color:transparent}.chip.g{background:#d3ecd9;color:#1d5a30;border-color:transparent}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;width:100%;margin-top:10px}
.btn.s{width:auto;margin:0;padding:8px 13px;font-size:12px}.btn.o{background:none;border:1px solid var(--ln);color:var(--ink)}
.btn.k{background:var(--ink);color:var(--bg)}
.bar{height:5px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
select,input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--ln);background:var(--bg);margin-top:6px}
label{display:block;margin-top:12px}
.sec{margin:16px 0 8px}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);font-size:16px}
.x{color:var(--mu);width:28px;height:28px}
nav{position:absolute;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding:8px 6px 12px;align-items:flex-end}
nav>*{flex:1}
nav button.t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mu);position:relative;padding:4px 0}
nav button.on{color:var(--ac);font-weight:600}
.bg{position:absolute;top:-2px;left:56%;background:var(--ac);color:#fff;font-size:9px;border-radius:9px;padding:0 5px}
.fab{width:54px;height:54px;border-radius:16px;background:var(--ac);color:#fff;display:grid;place-items:center;margin:-26px auto 0;flex:none!important;box-shadow:0 6px 16px rgba(194,85,45,.35)}
.fab svg{width:24px;height:24px}
.cbar{position:sticky;bottom:0}
.sh{position:absolute;inset:0;z-index:20;pointer-events:none}.sh.on{pointer-events:auto}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:.3s}.on .bd{opacity:1}

.hgl{position:fixed;z-index:60;min-width:176px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.25)}.hgl.on{display:block}
.hgl button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;font-size:13.5px}.hgl button.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
@media(max-width:767px){html[data-role=adm] #hgp{display:flex}html[data-role=adm] header{flex-wrap:wrap}}
@media(min-width:768px){.hs,.hgl{display:none!important}}
@media(max-width:767px){
nav[data-ph] button.t{display:none!important}
nav[data-ph] button.t[data-pv]{display:flex!important}
.hs.on{display:none!important}
}
.av.im{color:transparent;background-size:cover;background-position:center}.av.avl{width:72px;height:72px;font-size:22px}.pfi{display:flex;gap:14px;align-items:center}
.dot.off{background:#c0392b;animation:none}.dot.sy{background:#e0a526;animation:none}

/* pemilih jam & slot */
.wh{display:flex;align-items:center;justify-content:center;gap:4px;position:relative;margin-top:8px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;height:120px;overflow:hidden}
.wm{position:absolute;left:8px;right:8px;top:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--ac) 14%,transparent);pointer-events:none}
.wc{height:120px;width:54px;overflow-y:auto;scroll-snap-type:y mandatory;padding:40px 0;text-align:center;font:400 24px/40px 'Crow Bait',Georgia,serif;position:relative}
.wc div{height:40px;scroll-snap-align:center;color:var(--mu);transition:color .2s,transform .2s;cursor:pointer}.wc div.sel{color:var(--ink);transform:scale(1.15)}
.wh b{font:400 24px 'Crow Bait',Georgia,serif;position:relative}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.sg button{padding:10px 0;border:1px solid var(--ln);border-radius:12px;background:var(--cd);font:500 12.5px 'JetBrains Mono',ui-monospace,monospace}
.sg button.sel{background:var(--ac);color:#fff;border-color:var(--ac)}.sg button:disabled{opacity:.35;text-decoration:line-through}
</style>
</head>

function wheel(v,cb){const p=(/^\d{1,2}:\d{2}$/.test(v)?v:'10:00').split(':').map(Number),cur={h:p[0],m:Math.round(p[1]/5)*5%60},w=document.createElement('div');w.className='wh';
const col=(c,n,st)=>`<div class="wc" data-c="${c}">${Array.from({length:n},(_,i)=>`<div data-i="${i*st}">${pad2(i*st)}</div>`).join('')}</div>`;
w.innerHTML='<i class="wm"></i>'+col('h',24,1)+'<b>:</b>'+col('m',12,5);
const cs=[...w.querySelectorAll('.wc')],stp=c=>c.dataset.c=='h'?1:5,mark=c=>[...c.children].forEach(e=>e.classList.toggle('sel',+e.dataset.i==cur[c.dataset.c]));
cs.forEach(c=>{mark(c);let t;c.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const i=Math.max(0,Math.min(c.children.length-1,Math.round(c.scrollTop/40)));cur[c.dataset.c]=i*stp(c);mark(c);cb(pad2(cur.h)+':'+pad2(cur.m))},90)});
c.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d)c.scrollTo({top:d.dataset.i/stp(c)*40,behavior:'smooth'})})});
requestAnimationFrame(()=>cs.forEach(c=>c.scrollTop=cur[c.dataset.c]/stp(c)*40));return w}
function sg(){const s=$('#f-t'),fd=$('#f-d'),fb=$('#f-b');if(!s||!fd||!fb)return;let g=$('#sg');
if(!g){s.style.display='none';g=document.createElement('div');g.id='sg';g.className='sg';s.after(g);fd.addEventListener('change',sg);fb.addEventListener('change',sg)}
const d=+fd.value,b=+fb.value,n=new Date(),nm=n.getHours()*60+n.getMinutes(),all=[...s.options].map(o=>o.value),
taken=t=>b>=0&&(S.q||[]).some(x=>x.sch&&x.st!='batal'&&x.st!='done'&&x.b==b&&x.sch.day==d&&x.sch.time==t),
ok=all.filter(t=>!(d==0&&hm(t)<=nm)&&!taken(t));if(!ok.includes(s.value))s.value=ok[0]||'';
const h=all.map(t=>`<button type="button" data-t="${t}" class="${t==s.value?'sel':''}" ${ok.includes(t)?'':'disabled'}>${t}</button>`).join('')+(ok.length?'':'<div class="mu sm" style="grid-column:1/-1">Tidak ada jam tersisa untuk pilihan ini.</div>');
if(g.innerHTML!==h)g.innerHTML=h}
function enh(){const mv=$('#sh #m-v');if(mv&&!mv.dataset.e&&/Jam/.test(mv.parentElement.textContent)){mv.dataset.e=1;mv.value='10:00';mv.style.display='none';mv.after(wheel('10:00',x=>mv.value=x))}
const oh=$('#sh #o-h');if(oh&&!oh.dataset.e){oh.dataset.e=1;const m=oh.value.match(/(\d{1,2})[:.](\d{2}).+?(\d{1,2})[:.](\d{2})/),v={a:m?pad2(m[1])+':'+m[2]:'10:00',z:m?pad2(m[3])+':'+m[4]:'21:00'},bx=document.createElement('div');
const set=()=>{oh.value=v.a+' – '+v.z;bx.nextSibling.textContent=hm(v.z)<=hm(v.a)?'Jam tutup harus setelah jam buka':''};oh.style.display='none';
bx.className='g2';bx.innerHTML='<div><div class="mono" style="margin-top:8px">buka</div></div><div><div class="mono" style="margin-top:8px">tutup</div></div>';
bx.children[0].append(wheel(v.a,x=>{v.a=x;set()}));bx.children[1].append(wheel(v.z,x=>{v.z=x;set()}));oh.after(bx);bx.insertAdjacentHTML('afterend','<div class="er"></div>')}
sg()}
let enT;new MutationObserver(()=>{if(enT)return;enT=requestAnimationFrame(()=>{enT=0;enh()})}).observe(document.querySelector('.app'),{childList:true,subtree:true});
