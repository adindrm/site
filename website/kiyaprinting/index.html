<html lang="id">
<head>
  <meta charset="utf-8">

      try { t = localStorage.getItem('kp_theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root {
      --bg: #f5f6fa; --sf: #ffffff; --tx: #15171c; --mt: #6b7280; --ln: #e4e7ec;
      --pr: #EF018D; --cy: #01AEF2; --ye: #FDF202; --ok: #16a34a; --wr: #d97706; --ex: #dc2626;
      --lk: #020001;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #111214; --sf: #1c1d21; --tx: #eceef2; --mt: #9aa1ac; --ln: #2c2e34;
      --pr: #ff3ba8; --cy: #38c3f7; --lk: #f1f1f1;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111214; --sf: #1c1d21; --tx: #eceef2; --mt: #9aa1ac; --ln: #2c2e34;
        --pr: #ff3ba8; --cy: #38c3f7; --lk: #f1f1f1;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; min-width: 280px; overflow-x: hidden;
      background: var(--bg); color: var(--tx);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: var(--cy); }
    .sv { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* ---------- Header ---------- */
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 12px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
      background: var(--sf); border-bottom: 1px solid var(--ln);
    }
    header::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px;
      background: linear-gradient(90deg, var(--cy) 0 33%, var(--pr) 33% 66%, var(--ye) 66%);
    }
    header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; min-width: 0; }
    .ic { background: none; border: 0; padding: 4px; display: flex; }

    /* ---------- Drawer ---------- */
    #dr { position: fixed; inset: 0; z-index: 10; display: none; }
    #dr.on { display: flex; }
    #dr nav { width: 270px; max-width: 82%; height: 100%; overflow: auto; background: var(--sf); padding-top: env(safe-area-inset-top, 0px); }
    #dr .bd { flex: 1; background: #0008; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 18px 14px 18px 20px; border-bottom: 1px solid var(--ln); color: var(--lk); }
    .brand > svg { width: 31px; height: 39px; flex: none; }
    .brand > div { flex: 1; min-width: 0; }
    .brand b { display: block; font-size: 16px; letter-spacing: .06em; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand small { color: var(--mt); }
    .brand .bs { flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--mt); display: grid; place-items: center; transition: background .2s, color .2s, transform .35s cubic-bezier(.3,1.4,.5,1); }
    .brand .bs:hover { background: color-mix(in srgb, var(--pr) 12%, transparent); color: var(--pr); transform: rotate(60deg); }
    .brand .bs:active { transform: rotate(60deg) scale(.88); }
    .brand .bs.on { color: var(--pr); background: color-mix(in srgb, var(--pr) 14%, transparent); }
    .brand .bs .sv { width: 22px; height: 22px; }
    .nv {
      display: flex; align-items: center; gap: 14px; width: calc(100% - 10px);
      padding: 12px 20px; border: 0; background: none; text-align: left; color: var(--mt);
    }
    .nv.on { color: var(--pr); font-weight: 600; background: color-mix(in srgb, var(--pr) 12%, transparent); border-radius: 0 24px 24px 0; }

    .ngh .chev { margin-left: auto; width: 18px; height: 18px; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
    .ng.open .chev { transform: rotate(180deg); }
    .ng.act:not(.open) .ngh { color: var(--pr); font-weight: 600; }
    .ngb { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s cubic-bezier(.2,.8,.2,1); }
    .ng.open .ngb { grid-template-rows: 1fr; }
    .ngb > div { overflow: hidden; min-height: 0; }
    .ngb .nv.sub { padding: 10px 20px 10px 54px; font-size: 14px; opacity: 0; transform: translateX(-8px); transition: background .2s, color .2s, opacity .25s, transform .25s; }
    .ng.open .nv.sub { opacity: 1; transform: none; }
    .ngb .nv.sub .sv { width: 18px; height: 18px; }

    /* ---------- Layout ---------- */
    main { max-width: 1080px; margin: 0 auto; padding: 16px 12px 100px; }
    .card { background: var(--sf); border: 1px solid var(--ln); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px; font-size: 15px; }
    .mt { color: var(--mt); font-size: 13px; }
    .big { font-size: 22px; font-weight: 700; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--ln); }
    .row:last-child { border-bottom: 0; }
    .row > div { min-width: 0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
    .stat { background: var(--sf); border: 1px solid var(--ln); border-left: 4px solid var(--c, var(--pr)); border-radius: 14px; padding: 12px; min-width: 0; }
    .stat b { display: block; font-size: 18px; overflow-wrap: anywhere; }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .g2 > div, .g3 > div { min-width: 0; }

    /* ---------- Buttons, badges, tabs ---------- */
    .btn { background: var(--pr); color: #fff; border: 0; border-radius: 22px; padding: 10px 18px; font-weight: 600; }
    .btn.o { background: none; color: var(--pr); border: 1px solid var(--pr); }
    .btn.s { padding: 6px 12px; font-size: 13px; }
    .btn.d { background: none; color: var(--ex); border: 1px solid var(--ex); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .x { background: none; border: 0; color: var(--mt); font-size: 17px; padding: 2px 6px; }
    .bd {
      --c: var(--mt);
      display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
      background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c);
    }
    .bd.ok { --c: var(--ok); } .bd.wr { --c: var(--wr); } .bd.ex { --c: var(--ex); } .bd.pr { --c: var(--pr); } .bd.cy { --c: var(--cy); }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 12px; background: var(--sf); border: 1px solid var(--ln); border-radius: 14px; }
    .tabs button { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; color: var(--mt); font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 10px; white-space: nowrap; }
    .tabs button.on { background: var(--pr); color: #fff; }
    .subc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .subc button { position: relative; text-align: left; border: 1px solid var(--ln); background: var(--sf); color: var(--tx); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: background .2s, border-color .2s, transform .12s; }
    .subc button:active { transform: scale(.97); }
    .subc button b { font-size: 14px; padding-right: 30px; }
    .subc button span { font-size: 12px; color: var(--mt); }
    .subc button small { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--bg); color: var(--mt); }
    .subc button.on { border-color: var(--pr); box-shadow: inset 0 0 0 1px var(--pr); }
    .subc button.on b { color: var(--pr); }
    .tabs small { opacity: .9; font-size: 11px; font-weight: 700; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--bg); color: var(--mt); line-height: 1.5; }
    .tabs button.on small { background: #ffffff33; color: #fff; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg button { border: 1px solid var(--ln); background: var(--sf); border-radius: 999px; padding: 6px 13px; font-size: 13px; }
    .seg button.on { background: var(--pr); border-color: var(--pr); color: #fff; }
    .bar { height: 8px; border-radius: 4px; background: var(--ln); overflow: hidden; margin: 4px 0 8px; }
    .bar i { display: block; height: 100%; }
    .empty { text-align: center; color: var(--mt); padding: 34px 16px; }
    .tbl { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--mt); padding: 8px; border-bottom: 1px solid var(--ln); white-space: nowrap; }
    td { padding: 9px 8px; border-bottom: 1px solid var(--ln); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .r { text-align: right; }
    .clk { cursor: pointer; }
    .clk:hover { background: color-mix(in srgb, var(--pr) 6%, transparent); }

    /* ---------- Forms ---------- */
    label { display: block; font-size: 13px; color: var(--mt); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; min-width: 0; padding: 10px; border-radius: 10px;
      border: 1px solid var(--ln); background: var(--bg); color: var(--tx); font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--pr); }
    input[type=checkbox] { width: 18px; height: 18px; padding: 0; accent-color: var(--pr); flex: none; }
    .ck { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--tx); font-size: 14px; cursor: pointer; }
    .sec { margin: 18px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--pr); }
    .itm { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--ln); border-radius: 14px; padding: 12px; margin: 10px 0; background: var(--bg); }
    .itn { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--pr); background: color-mix(in srgb, var(--pr) 14%, transparent); }
    .itb { flex: 1; min-width: 0; position: relative; }
    .itb > label:first-of-type, .itb > .g2:first-of-type > div > label, .itb > .x + label { margin-top: 0; }
    .itb > .x.rm { position: absolute; top: -6px; right: -8px; z-index: 1; }
    .itm input, .itm select { background: var(--sf); }
    .ih { display: flex; justify-content: space-between; align-items: center; }
    .ip { margin-top: 10px; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--sf); }
    .err { color: var(--ex); font-weight: 600; font-size: 13px; }

    /* ---------- Modal, confirm, toast ---------- */
    #md { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: #0009; }
    #md.on { display: flex; }
    #fm {
      width: 100%; max-width: 640px; max-height: 92vh; overflow: auto;
      background: var(--sf); border-radius: 18px 18px 0 0;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 700px) { #md { align-items: center; } #fm { border-radius: 18px; } }
    .mh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .mh h3 { margin: 0; font-size: 17px; }
    .ft { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); margin: 16px -18px calc(-18px - env(safe-area-inset-bottom, 0px)); padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--sf); border-top: 1px solid var(--ln); }
    .fb { display: flex; gap: 8px; margin-top: 10px; }
    .fb .btn { flex: 1; }
    #cf { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; background: #0009; }
    #cf.on { display: flex; }
    #cf .cb { width: 100%; max-width: 360px; background: var(--sf); border: 1px solid var(--ln); border-radius: 18px; padding: 20px; }
    #tst {
      position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60;
      transform: translateX(-50%); max-width: 90%; display: none;
      background: #1f2937; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px;
    }
    #tst.on { display: block; }
    .fab {
      position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 6;
      width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--pr); color: #fff;
      display: grid; place-items: center; box-shadow: 0 4px 12px #0004;
    }
    .fab .sv { width: 26px; height: 26px; }

    /* ---------- Produksi ---------- */
    .spk { border-left: 4px solid var(--c); }
    .sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sa { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .sa select { width: auto; flex: 1 1 180px; padding: 7px; font-size: 13px; }
    .tl { border-left: 2px solid var(--ln); margin-left: 6px; padding-left: 14px; }
    .tl div { position: relative; padding: 4px 0; }
    .tl div::before { content: ""; position: absolute; left: -20px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--pr); }

    /* ---------- Desktop sidebar ---------- */
    @media (min-width: 960px) {
      body { padding-left: 270px; }
      #dr { display: flex !important; position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 4; }
      #dr nav { width: 100%; max-width: none; border-right: 1px solid var(--ln); }
      #dr .bd, #mb { display: none !important; }
    }

    /* ---------- Animasi elemen ---------- */
    @keyframes fu { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
    @keyframes su { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
    @keyframes sl { from { transform: translateX(-100%); } to { transform: none; } }
    @keyframes tsi { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes wig { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
    /* Animasi masuk hanya saat pindah halaman (class .anim), bukan setiap render ulang.
       Fill-mode "backwards" agar transform hover/active tidak tertimpa hasil akhir animasi. */
    #mn.anim > .card, #mn.anim > .hero, #mn.anim > .grid > .stat, #mn.anim > .tabs, #mn.anim #ql > .card { animation: fu .45s cubic-bezier(.2,.7,.2,1) backwards; }
    #mn.anim > :nth-child(2), #mn.anim > .grid > .stat:nth-child(2), #mn.anim #ql > .card:nth-child(2) { animation-delay: .05s; }
    #mn.anim > :nth-child(3), #mn.anim > .grid > .stat:nth-child(3), #mn.anim #ql > .card:nth-child(3) { animation-delay: .1s; }
    #mn.anim > :nth-child(4), #mn.anim > .grid > .stat:nth-child(4), #mn.anim #ql > .card:nth-child(4) { animation-delay: .15s; }
    #mn.anim > :nth-child(5), #mn.anim #ql > .card:nth-child(5) { animation-delay: .2s; }
    #mn.anim > :nth-child(n+6), #mn.anim #ql > .card:nth-child(n+6) { animation-delay: .25s; }
    #mn.anim .bar i { transform-origin: left; animation: grow .8s .2s cubic-bezier(.2,.8,.2,1) backwards; }
    #md.on { animation: fi .2s ease-out; }
    #md.on #fm { animation: su .32s cubic-bezier(.2,.8,.2,1); }
    @media (min-width: 700px) { #md.on #fm { animation: pop .28s cubic-bezier(.2,.8,.2,1); } }
    #cf.on { animation: fi .2s ease-out; }
    #cf.on .cb { animation: pop .3s cubic-bezier(.3,1.4,.5,1); }
    #dr.on nav { animation: sl .28s cubic-bezier(.2,.8,.2,1); }
    #dr.on .bd { animation: fi .28s ease-out; }
    #dr.on .nv { animation: nvi .35s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--n, 0) * .04s + .08s); }
    @media (min-width: 960px) { #dr.on nav, #dr.on .bd, #dr.on .nv { animation: none; } }
    #tst.on { animation: tsi .3s cubic-bezier(.2,.8,.2,1); }
    .fab { animation: pop .5s .2s cubic-bezier(.3,1.4,.5,1) backwards; transition: transform .2s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; }
    .fab:hover { transform: translateY(-2px); box-shadow: 0 8px 18px #0005; }
    .fab:active, .btn:active { transform: scale(.94); }
    .btn { transition: transform .12s, filter .15s; }
    .btn:hover { filter: brightness(1.08); }
    .clk, .stat { transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }
    .card.clk:hover, .stat.clk:hover { transform: translateY(-2px); box-shadow: 0 6px 18px #0000000f; }
    .card.clk:active, .stat.clk:active { transform: scale(.985); }
    #mn.anim .itm { animation: fu .3s cubic-bezier(.2,.7,.2,1) backwards; }
    .empty b { display: block; animation: pop .55s .1s cubic-bezier(.3,1.4,.5,1) backwards; }
    .err:not(:empty) { animation: wig .1s ease-in-out 4 alternate; }
    .tabs button, .seg button { transition: background .2s, color .2s, transform .12s; }
    .tabs button:active, .seg button:active { transform: scale(.96); }
    .nv { transition: background .2s, color .2s, padding-left .2s; }
    .nv:hover:not(.on) { background: color-mix(in srgb, var(--pr) 7%, transparent); color: var(--tx); padding-left: 24px; border-radius: 0 24px 24px 0; }
    .ngb .nv.sub:hover:not(.on) { padding-left: 58px; }
    @keyframes nvi { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    /* ---------- Invoice ---------- */
    #ivo { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #000c; animation: fi .2s; }
    #ivo .ivb { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    #ivo img { width: 100%; max-width: 900px; border-radius: 8px; box-shadow: 0 8px 30px #0006; animation: fu .4s backwards; background: #fff; }
    #ivo .ivf { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--sf); }
    #ivo .ivf .btn { flex: 1; }

    /* ---------- Loading screen ---------- */
    #ld {
      position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: var(--bg); transition: opacity .5s, visibility .5s;
    }
    #ld.out { opacity: 0; visibility: hidden; }
    #ld svg { width: min(32vw, 124px); height: auto; overflow: visible; }
    #ld path {
      fill: var(--f); fill-opacity: 0; stroke: var(--f); stroke-width: 1.4; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: ldd 1.4s cubic-bezier(.6,.1,.3,1) forwards, ldp .9s ease forwards;
      animation-delay: calc(var(--i) * .15s), calc(1s + var(--i) * .15s);
    }
    #ld [data-c="y"] { --f: #FDF202; stroke: #d8cd00; }
    #ld [data-c="m"] { --f: #EF018D; }
    #ld [data-c="c"] { --f: #01AEF2; }
    #ld [data-c="k"] { --f: var(--lk); }

  <script>
    /* ===== Sinkron Google Sheets (KIYA PRINTING) ===== */
    (function () {
      var URL_API = 'https://script.google.com/macros/s/AKfycbxyFyEVSwsyTBCiHeOwAGUENFmm10M5QwfPvBPmjfHUQMPYlGz5wNePglmhwlSVmK0h/exec'; // URL Web App (/exec)
      var TOKEN = ''; try { TOKEN = localStorage.getItem('kp_tok') || ''; if (!TOKEN) { TOKEN = (prompt('Masukkan token admin (sama dengan TOKEN di Code.gs):') || '').trim(); if (TOKEN) localStorage.setItem('kp_tok', TOKEN); } } catch (e) {}
      window.KPAPI = { url: URL_API, tok: TOKEN };
      var KEY = 'mm', TSK = 'mm_ts', DELAY = 2500;
      var ls = window.localStorage, setI = Storage.prototype.setItem, remI = Storage.prototype.removeItem;
      var timer = null, busy = false, again = false;

      function num(k) { try { return Number(ls.getItem(k)) || 0; } catch (e) { return 0; } }

      function badge(t, ok) {
        var b = document.getElementById('syncb');
        if (!b) {
          b = document.createElement('div');
          b.id = 'syncb';
          b.style.cssText = 'position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font:11px system-ui;padding:3px 8px;border-radius:10px;background:#0006;color:#fff;z-index:2;pointer-events:none';
          document.body.appendChild(b);
        }
        b.textContent = t;
        b.style.background = ok === false ? '#dc2626cc' : '#0006';
      }

      // tangkap setiap penyimpanan data aplikasi
      Storage.prototype.setItem = function (k, v) {
        setI.call(this, k, v);
        if (this === ls && k === KEY) { setI.call(ls, TSK, String(Date.now())); schedule(); }
      };
      Storage.prototype.removeItem = function (k) {
        remI.call(this, k);
        if (this === ls && k === KEY) setI.call(ls, TSK, String(Date.now())); // reset sengaja, jangan ditimpa cloud
      };

      function schedule() { clearTimeout(timer); timer = setTimeout(push, DELAY); }

      function push(force) {
        if (busy) { again = true; return; }
        var raw = ls.getItem(KEY);
        if (!raw) return;
        busy = true;
        badge('Menyimpan…');
        fetch(URL_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain = tanpa preflight CORS
          body: JSON.stringify({ token: TOKEN, action: 'save', data: JSON.parse(raw), base: num('mm_base'), force: force === true })
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (j.ok) { setI.call(ls, 'mm_base', String(j.ts)); badge('Tersimpan ☁'); }
          else if (j.conflict) {
            badge('Data cloud lebih baru', false);
            if (confirm('Data di Google Sheets lebih baru (perangkat lain).\nOK = ambil data cloud\nBatal = timpa cloud dengan data ini')) pull(true);
            else push(true);
          } else badge('Gagal: ' + (j.error || '?'), false);
        }).catch(function () { badge('Offline - ditunda', false); })
          .then(function () { busy = false; if (again) { again = false; schedule(); } });
      }

      function pull(ask) {
        fetch(URL_API + '?action=load&token=' + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); }).then(function (j) {
          if (!j.ok) { if (j.error === 'token salah') { try { localStorage.removeItem('kp_tok'); } catch (e) {} } return badge('Gagal: ' + (j.error || '?'), false); }
          var localTs = num(TSK), localBase = num('mm_base');
          if (j.data && j.ts > localBase && (ask || j.ts > localTs)) {
            setI.call(ls, KEY, JSON.stringify(j.data));
            setI.call(ls, 'mm_base', String(j.ts));
            setI.call(ls, TSK, String(j.ts));
            if (!sessionStorage.getItem('mm_rl')) { sessionStorage.setItem('mm_rl', '1'); location.reload(); }
          } else {
            sessionStorage.removeItem('mm_rl'); window.KPsynced = true;
            badge(j.data ? 'Sinkron ☁' : 'Cloud kosong');
            if (!j.data && ls.getItem(KEY)) push(true);  // unggah awal
            else if (localTs > j.ts) schedule();         // ada perubahan lokal yang belum terkirim
          }
        }).catch(function () { badge('Offline', false); });
      }

      window.addEventListener('load', function () { pull(false); });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && timer) { clearTimeout(timer); push(); }
      });
    })();
  </script>

    function logoSVG(k, attrs) {

    }
    $('#fav').href = 'data:image/svg+xml,' + encodeURIComponent(

    /* ---------- Data ---------- */
    const KEY = 'mm';
    const blank = () => ({
      v: 2,
      cfg: { nama: 'KIYA PRINTING', tag: 'Digital Printing', alamat: '', telp: '', bayar: '', foot: 'Terima kasih atas pesanan Anda.' },
      bahan: [],   // bahan baku: {id,n,s,q,h,min}
      habis: [],   // bahan habis pakai: {id,n,mesin,ou}
      siklus: [],  // {id,bid,modal,tm,c0,ket,out,st,tt,adj,c1,hpp}
      fin: [],     // jasa finishing: {id,n,sat,h}
      produk: [],  // formula harga

      nota: [],    // transaksi

      minv: [],    // invoice manual: {id,no,tgl,nama,tel,alamat,items:[{d,q,h}],disk,dp,ket}
      spk: [],     // tiket produksi per item
      seq: {}
    });
    let D;
    function load() {
      let o = null;
      try { o = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
      if (o && o.v === 2) {
        D = Object.assign(blank(), o);
        if (D.cfg && D.cfg.tag === 'Digital Printing & Undangan') D.cfg.tag = 'Digital Printing';
      } else {
        D = blank();
        if (o) D.legacy = o; // data aplikasi lama disimpan sebagai cadangan
      }
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(D)); }
      catch (e) { alert('Penyimpanan perangkat penuh. Ekspor cadangan lalu hapus data lama.'); }
    }
    /* ---------- Stok bertahap (FIFO): tiap penambahan stok = satu batch bertanggal; dipakai dari yang terlama, batch kosong dihapus ---------- */
    const r4 = v => Math.round(v * 1e4) / 1e4;
    function lotFix() {
      (D.bahan || []).forEach(b => {
        if (Array.isArray(b.lots)) return;
        b.lots = num(b.q) > 0 ? [{ id: uid(), t: '', tgl: '', q: num(b.q), h: num(b.h), jn: '' }] : [];
        b.def = num(b.q) < 0 ? -num(b.q) : 0;
      });
    }
    function lotSync(b) {
      b.lots = (b.lots || []).filter(l => num(l.q) > 1e-9).sort((x, y) => String(x.t).localeCompare(String(y.t)));
      b.q = r4(sum(b.lots, l => num(l.q)) - num(b.def));
      if (b.lots.length) b.h = num(b.lots[0].h); // harga acuan = batch terlama (dipakai dulu)
    }
    function lotTake(b, qty) {
      lotFix(); lotSync(b);
      let need = num(qty);
      for (const l of b.lots) { if (need <= 1e-9) break; const k = Math.min(num(l.q), need); l.q = r4(num(l.q) - k); need = r4(need - k); }
      if (need > 1e-9) b.def = r4(num(b.def) + need); // dipakai melebihi stok → minus, tertutup saat stok masuk
      lotSync(b);
    }
    function lotPut(b, qty, h, jn, tgl, front) {
      lotFix(); lotSync(b);
      let q = num(qty);
      if (num(b.def) > 0) { const o = Math.min(num(b.def), q); b.def = r4(num(b.def) - o); q = r4(q - o); }
      if (q > 0) b.lots.push({ id: uid(), t: front ? '' : new Date().toISOString(), tgl: tgl || today(), q, h: num(h), jn: String(jn || '').trim() });
      lotSync(b);
    }
    const lotVal = b => Math.max(0, sum(b.lots || [], l => num(l.q) * num(l.h)));
    const lotList = b => (b.lots || []).length ? b.lots.map((l, i) => `<div class="mt" style="display:flex;justify-content:space-between;gap:8px;border-left:3px solid ${i ? 'var(--ln)' : 'var(--pr)'};padding-left:8px;margin-top:3px"><span>${l.tgl ? fd(l.tgl) : 'Stok awal'}${l.jn ? ' · ' + esc(l.jn) : ''}${i === 0 && b.lots.length > 1 ? ' <span class="bd pr">dipakai dulu</span>' : ''}</span><span>${fmt(l.q)} ${esc(b.s)} · ${rp(l.h)}</span></div>`).join('') : '';

    const JN = { sendiri: 'Produksi sendiri', luar: 'Dibuat di luar', jual: 'Jual bahan langsung' };
    const jenisOf = p => (p && p.jenis) || 'sendiri';
    const TP = { m2: 'Per m² (ukuran)', lembar: 'Per lembar (bertingkat)', tetap: 'Harga tetap / paket' };
    const OU = { m2: 'm²', lembar: 'lembar', tetap: 'pcs' };
    const FSAT = { pcs: 'per pcs', m2: 'per m²', order: 'per order' };
    const MET = ['Tunai', 'Transfer', 'QRIS'];
    const TAB = { man: 'plg', inv: 'bb', prod: 'aktif', et: 'pr' };
    let cur = 'dash', Q = '';

    /* ---------- Helper bisnis ---------- */
    const spkOf = n => D.spk.filter(s => s.nid === n.id);
    const paid = n => sum(n.bayar || [], b => num(b.j));
    const sisa = n => n.total - paid(n);
    function payB(n) {

      const m = Math.min(...sp.map(s => STI(s.st)));

      const pr = prO || find(D.produk, it.pid), q = Math.max(0, num(it.q));
      const r = { luas: 0, out: 0, sat: 0, base: 0, fc: 0, sub: 0, err: '' };

        if (num(pr.maxL) && lm > num(pr.maxL) + 1e-9) r.err = 'Lebar melebihi batas ' + fmt(pr.maxL) + ' m';
        const luas = ceilTo(pm, num(pr.step)) * ceilTo(lm, num(pr.step));
        r.luas = Math.round(Math.max(luas, num(pr.minLuas)) * 10000) / 10000;
        r.sat = num(R ? pr.hR : pr.hU) || num(pr.hU);
        r.base = r.sat * r.luas * q;
        r.out = r.luas * q;
      } else if (pr.tipe === 'lembar') {
        const t = (pr.tier || []).slice().sort((a, b) => num(b.min) - num(a.min));
        const tier = t.find(x => q >= num(x.min)) || t[t.length - 1] || {};
        r.sat = num(R ? tier.hR : tier.hU) || num(tier.hU);
        r.base = r.sat * q;
        r.out = q;
      } else {
        r.sat = num(R ? pr.hR : pr.hU) || num(pr.hU);
        r.base = r.sat * q;
        r.out = q;
      }
      if (num(pr.minQ) && q < num(pr.minQ)) r.err = r.err || 'Minimal pesan ' + fmt(pr.minQ) + ' ' + OU[pr.tipe];
      (it.fin || []).forEach(fid => {

      r.sub = ceilTo(r.base + r.fc, num(pr.bulat));

        <div class="stat kpi clk" style="--c:var(--ok)" onclick="dsum('kas')"><div class="ki"><svg class="sv" viewBox="0 0 24 24"><path d="${P.trend}"/></svg></div><div><div class="mt">Kas masuk hari ini</div><b>${rp(kas)}</b><small>${ordHari} pesanan baru</small></div></div>
        <div class="stat kpi clk" style="--c:${low.length ? 'var(--ex, #dc2626)' : 'var(--ok)'}" onclick="dsum('stok')"><div class="ki"><svg class="sv" viewBox="0 0 24 24"><path d="${low.length ? P.alert : P.chk}"/></svg></div><div><div class="mt">Stok menipis</div><b>${low.length}</b><small>${low.length ? 'perlu ditambah' : 'semua stok aman'}</small></div></div>

      // grafik omzet 7 hari

        </div></div>
        <div class="card clk" onclick="dsum('prod')"><div class="sh"><h3 style="margin:0">Progres Produksi</h3><span class="mt">${totTiket} tiket aktif</span></div>

           <div class="r"><b>${rp(n.total)}</b><div>${stageB(n)}</div></div></div>`).join('')}</div>`;

          <div><label>Diskon (Rp)</label><input type="number" min="0" step="any" inputmode="decimal" value="${esc(F.disk)}" oninput="F.disk=this.value;oTot()"></div>

          <div class="fb"><button type="button" class="btn o" onclick="discardOrder()">Batal</button><button type="button" class="btn o" onclick="saveOrder(true)">Pratinjau</button><button class="btn">Simpan atau Bagikan</button></div></div>`;

    function oPl(v) {
      F.pn = v;
      const p = D.plg.find(x => x.n.toLowerCase() === v.trim().toLowerCase());
      F.plg = p ? p.id : '';
      if (p) {
        if (!F.tel) { F.tel = p.tel || ''; const e = $('#otel'); if (e) e.value = F.tel; }
        F.th = p.tipe === 'umum' ? 'umum' : 'reseller';
        thRe(); oTot();
      }
    }
    function oFin(i, id, on) {
      const f = F.items[i].fin;
      if (on && !f.includes(id)) f.push(id);
      if (!on) F.items[i].fin = f.filter(x => x !== id);
      oTot();
    }
    function oCalc() {
      const rs = F.items.map(it => hitung(it, F.th));
      const sub = sum(rs, r => r.sub), disk = Math.min(num(F.disk), sub);
      return { rs, sub, disk, total: sub - disk };
    }
    function oDp(f) { const t = oCalc().total; F.dp = f ? String(Math.round(t * f)) : ''; const e = $('#odp'); if (e) e.value = F.dp; oTot(); }
    function oTot() {
      const c = oCalc();
      { const L = $('#oil'); if (L) L.innerHTML = itemRows(); }
      c.rs.forEach((r, i) => {
        const e = $('#ip' + i), it = F.items[i], pr = find(D.produk, it.pid);
        if (!e || !pr) return;
        e.innerHTML = (r.err ? `<div class="err">${esc(r.err)}</div>` : '') +
          (pr.tipe === 'm2' ? `Luas dihitung ${fmt(r.luas)} m² × ${fmt(num(it.q))} · ${rp(r.sat)}/m²` : `${rp(r.sat)} / ${OU[pr.tipe]}`) +
          (r.fc ? ` · finishing ${rp(r.fc)}` : '') + `<div style="margin-top:2px"><b>Subtotal ${rp(r.sub)}</b></div>`;
      });
      const dp = num(F.dp), e = $('#otot');
      if (e) e.innerHTML = `<div class="row" style="padding:2px 0;border:0"><span class="mt">Subtotal ${rp(c.sub)}${c.disk ? ' · diskon ' + rp(c.disk) : ''}</span><b style="font-size:17px">Total ${rp(c.total)}</b></div>
        <div class="row" style="padding:2px 0;border:0"><span class="mt">Bayar ${rp(dp)} (${F.met})</span><b style="color:${c.total - dp > 0 ? 'var(--wr)' : 'var(--ok)'}">Sisa ${rp(Math.max(0, c.total - dp))}</b></div>`;
    }
    function saveOrder(preview) {
      const er = m => { const e = $('#oerr'); if (e) e.textContent = m; };
      if (!D.produk.some(p => p.aktif)) {
        F._keep = true;
        return gate('Produk belum disiapkan', 'Pesanan butuh minimal satu produk aktif.',
          ['Buka Inventori › Produk & Formula', 'Buat formula harga', 'Centang “Aktif”, lalu simpan'],
          'Buka Produk & Formula', () => { TAB.inv = 'pr'; go('inv'); });
      }
      if (!F.pn.trim()) return er('Isi nama pemesan.');
      if (!F.items.length) return er('Minimal satu item.');
      for (let i = 0; i < F.items.length; i++) {
        const it = F.items[i], pr = find(D.produk, it.pid), r = hitung(it, F.th);
        if (!pr) return er(`Item ${i + 1}: pilih produk.`);
        if (!(num(it.q) > 0)) return er(`Item ${i + 1}: jumlah harus lebih dari 0.`);
        if (pr.tipe === 'm2' && !(num(it.p) > 0 && num(it.l) > 0)) return er(`Item ${i + 1}: isi panjang dan lebar.`);
        if (r.err) return er(`Item ${i + 1}: ${r.err}.`);
      }
      const c = oCalc(), dp = num(F.dp);
      if (dp > c.total + 0.5) return er('Pembayaran melebihi total.');
      const draft = () => ({
        no: peekNo('KP-', F.tgl), tgl: F.tgl, pn: F.pn.trim(), tel: F.tel.trim(), sub: c.sub, disk: c.disk, total: c.total, ket: F.ket.trim(),
        bayar: dp > 0 ? [{ j: dp }] : [],
        items: F.items.map((it, i) => {
          const pr = find(D.produk, it.pid), r = c.rs[i];
          return { pn: pr.n, tipe: pr.tipe, ou: OU[pr.tipe], p: num(it.p), l: num(it.l), q: num(it.q), luas: r.luas, sat: r.sat, sub: r.sub, fin: it.fin.map(id => (find(D.fin, id) || {}).n).filter(Boolean), cat: it.cat.trim() };
        })
      });
      const msgOf = n => docMsg('invoice', n.no, n.pn, n.items.map(it => `• ${it.pn} (${it.tipe === 'm2' ? `${fmt(it.p)}×${fmt(it.l)} cm × ${fmt(it.q)}` : `${fmt(it.q)} ${it.ou}`}) — ${rp(it.sub)}`), n.total, dp, n.ket, true);
      if (preview === true) return pv('Pratinjau Invoice', notaHTML(draft()), drawOrder, () => saveOrder('choose'), 'Simpan atau Bagikan');
      if (preview === 'choose') return shareSheet({ tel: F.tel, noun: `Nota <b>${esc(F.pn.trim())}</b> · ${rp(c.total)} · ${F.items.length} item`, onPick: (m, t) => { if (t) F.tel = t; saveOrder(m); } });
      const mode = preview || 'save';
      if (mode === 'share') { if (shareOpen(F.tel, msgOf(draft()))) toast('WhatsApp dibuka · nota belum disimpan'); return; }
      const nJual = F.items.filter(it => jenisOf(find(D.produk, it.pid)) === 'jual').length, nSpk = F.items.length - nJual;
      ask(`Simpan pesanan ${esc(F.pn.trim())} senilai ${rp(c.total)}?${nSpk ? ` ${nSpk} SPK dibuat di Produksi.` : ''}${nJual ? ` ${nJual} item langsung mengurangi stok.` : ''}${mode === 'both' ? ' Lalu WhatsApp dibuka.' : ''}`, () => {
        let plg = F.plg ? find(D.plg, F.plg) : D.plg.find(x => x.n.toLowerCase() === F.pn.trim().toLowerCase());
        if (!plg) {
          plg = { id: uid(), n: F.pn.trim(), tel: F.tel.trim(), tipe: F.th === 'umum' ? 'umum' : 'reseller', alamat: '' };
          D.plg.push(plg);
        } else if (F.tel.trim() && !plg.tel) plg.tel = F.tel.trim();
        const no = nextNo('KP-', F.tgl), iso = new Date().toISOString();
        const items = F.items.map((it, i) => {
          const pr = find(D.produk, it.pid), r = c.rs[i], jn = jenisOf(pr), bh = jn === 'luar' ? null : find(D.bahan, pr.bb);
          return {
            jn, vend: jn === 'luar' ? Math.round(num(pr.vend) * r.out * 100) / 100 : 0,
            id: uid(), pid: pr.id, pn: pr.n, tipe: pr.tipe, ou: OU[pr.tipe],
            p: num(it.p), l: num(it.l), q: num(it.q), luas: r.luas, out: r.out,
            sat: r.sat, base: r.base, fc: r.fc, sub: r.sub, // harga dikunci di nota
            fin: it.fin.map(id => (find(D.fin, id) || {}).n).filter(Boolean),
            cat: it.cat.trim(), file: it.file.trim(),
            bb: jn === 'luar' ? '' : pr.bb || '', bbUse: jn === 'luar' ? 0 : pakaiBB(pr, r.luas, num(it.q)), bbH: bh ? num(bh.h) : 0,
            hb: jn === 'sendiri' ? (pr.hb || []).slice() : []
          };
        });
        const n = {
          id: uid(), no, tgl: F.tgl, plg: plg.id, pn: plg.n, tel: F.tel.trim() || plg.tel || '', th: F.th,
          items, sub: c.sub, disk: c.disk, total: c.total,
          bayar: dp > 0 ? [{ id: uid(), tgl: F.tgl, j: dp, met: F.met, ket: dp >= c.total ? 'Lunas' : 'DP' }] : [],
          ket: F.ket.trim(), ambil: '', t: iso
        };
        D.nota.push(n);
        items.forEach((it, i) => {
          if (it.jn === 'jual') {
            const bh = find(D.bahan, it.bb);
            if (bh) lotTake(bh, it.bbUse);
            return;
          }
          D.spk.push({
            id: uid(), no: 'SPK' + no.slice(2) + '-' + (i + 1), nid: n.id, iid: it.id,
            st: 'antre', log: [{ st: 'antre', t: iso, k: 'SPK dibuat dari nota ' + no }], stok: 0, done: 0, cyc: []
          });
        });
        save(); cl(); go('trx');
        toast(`Nota ${no} tersimpan` + (nSpk ? ` · ${nSpk} SPK dikirim ke Produksi` : ''));
        if (mode === 'both') { const dn = draft(); dn.no = no; shareOpen(F.tel, msgOf(dn)); }
      }, 'Simpan');
    }

    /* ---------- Detail nota ---------- */

          ${edit ? `<button type="button" class="btn o s" onclick="editItem('${n.id}','${it.id}')">Ubah ukuran / jumlah</button>` : s ? `<div class="mt" style="font-size:11px">Terkunci (sudah tahap cetak)</div>` : `<div class="mt" style="font-size:11px">Penjualan langsung · stok sudah dikurangi</div>`}
        </div>`;
      }).join('');
      const fm = $('#fm');

        <div style="margin-top:6px">${stageB(n)} ${payB(n)}</div>
        ${items}
        <div class="card" style="margin:10px 0 0">
          <div class="row"><span class="mt">Subtotal</span><b>${rp(n.sub)}</b></div>
          ${n.disk ? `<div class="row"><span class="mt">Diskon</span><b>- ${rp(n.disk)}</b></div>` : ''}
          <div class="row"><b>Total</b><b>${rp(n.total)}</b></div>
          ${(n.bayar || []).map(b => `<div class="row"><span class="mt">${fd(b.tgl)} · ${esc(b.ket || 'Bayar')} · ${esc(b.met)}</span><span>${rp(b.j)}</span></div>`).join('')}
          <div class="row"><b>Sisa tagihan</b><b style="color:${sisa(n) > 0 ? 'var(--wr)' : 'var(--ok)'}">${rp(Math.max(0, sisa(n)))}</b></div>
          <div class="row"><span class="mt">Laba ${est ? 'estimasi' : 'aktual'}</span><b>${rp(n.total - cost)}</b></div>
        </div>
        ${n.ket ? `<div class="mt" style="margin-top:8px">Catatan: ${esc(n.ket)}</div>` : ''}
        ${n.ambil ? `<div class="mt" style="margin-top:8px">Diambil ${fd(n.ambil)}</div>` : ''}
        <div class="sa">
          ${sisa(n) > 0 ? `<button type="button" class="btn" onclick="payM('${n.id}')">+ Pembayaran</button>` : ''}
          ${allDone && !n.ambil ? `<button type="button" class="btn" onclick="ambil('${n.id}')">Tandai Diambil</button>` : ''}
          <button type="button" class="btn o" onclick="pvNota('${n.id}')">Preview Invoice</button>
          <button type="button" class="btn o" onclick="printNota('${n.id}')">Cetak / PDF</button>
          ${canCancel && !n.ambil ? `<button type="button" class="btn d" onclick="cancelNota('${n.id}')">Batalkan Nota</button>` : ''}

      openM();
    }
    function payM(id) {
      const n = find(D.nota, id); if (!n) return;
      const s = Math.max(0, sisa(n)), fm = $('#fm');
      let met = 'Tunai';
      fm.innerHTML = `<div class="mh"><h3>Pembayaran ${esc(n.no)}</h3><button type="button" class="x" onclick="notaDet('${id}')">✕</button></div>
        <div class="mt">Sisa tagihan ${rp(s)}</div>
        <div class="g2"><div><label>Jumlah (Rp)</label><input id="pj" type="number" min="0" step="any" inputmode="decimal" value="${Math.round(s)}" required></div>

        Object.assign(it, { p: num(E.p), l: num(E.l), q: num(E.q), luas: r.luas, out: r.out, sat: r.sat, base: r.base, fc: r.fc, sub: r.sub,
          bbUse: pakaiBB(pr, r.luas, num(E.q)), cat: $('#ec').value.trim(), file: $('#ef').value.trim() });

        ${C.bayar ? `<p><b>Pembayaran:</b> ${esc(C.bayar)}</p>` : ''}

    function pvNota(id) {

    }
    function pvMi(id) {
      const v = find(D.minv, id); if (!v) return;
      pv('Preview Invoice', miHTML(v), () => miDet(id), () => miPrint(id), 'Cetak / PDF', true);

    /* =====================================================================
       PRODUKSI (SPK)
       ===================================================================== */
    const waLink = (n, msg) => {
      let t = String(n.tel || '').replace(/\D/g, ''); if (t.length < 8) return '';
      if (t.startsWith('0')) t = '62' + t.slice(1); else if (t.startsWith('8')) t = '62' + t;
      return 'https://wa.me/' + t + '?text=' + encodeURIComponent(msg);
    };
    /* Tab Produksi digabung: Persiapan (antre, desain, ACC) dan Cetak & Selesai. Tahap data tetap 5. */
    const PGRP = { siap: ['antre', 'desain', 'acc'], cetak: ['produksi', 'selesai'] };
    const prodSet = (live, k) => k === 'aktif' || !PGRP[k] ? live.filter(s => s.st !== 'selesai') : live.filter(s => PGRP[k].includes(s.st));
    const liveSpk = () => D.spk.filter(s => { const n = find(D.nota, s.nid); return n && !n.ambil; });
    R.prod = function () {
      const live = liveSpk();
      return tabs('prod', [['aktif', 'Semua aktif', prodSet(live, 'aktif').length], ['siap', 'Persiapan', prodSet(live, 'siap').length], ['cetak', 'Cetak & Selesai', prodSet(live, 'cetak').length]]) +
        `<div class="mt" style="margin:-4px 2px 10px">${TAB.prod === 'siap' ? 'Antrean / cek file · proses desain · menunggu ACC. Pindahkan tahap lewat tombol di tiap kartu.' : TAB.prod === 'cetak' ? 'Sedang diproduksi · selesai / siap diambil. Pindahkan tahap lewat tombol di tiap kartu.' : 'Semua tiket yang belum selesai.'}</div>` +
        `<div class="card"><input type="search" placeholder="Cari SPK, pelanggan, atau produk…" value="${esc(Q)}" oninput="Q=this.value;qRe()"></div><div id="ql">${prodList()}</div>`;
    };
    function prodList() {
      const live = liveSpk(), q = Q.trim().toLowerCase();
      let list = prodSet(live, TAB.prod);
      if (q) list = list.filter(s => { const n = find(D.nota, s.nid), it = n.items.find(i => i.id === s.iid); return (s.no + ' ' + n.no + ' ' + n.pn + ' ' + it.pn).toLowerCase().includes(q); });
      if (!list.length) {
        if (q) return '<div class="card empty">Tidak ada hasil untuk pencarian ini.</div>';
        return TAB.prod === 'aktif' || !PGRP[TAB.prod]
          ? '<div class="card empty"><b>Belum ada pekerjaan aktif</b><p>Pesanan baru otomatis muncul di sini sebagai tiket SPK.</p><button class="btn s" style="margin-top:10px" onclick="newOrder()">+ Pesanan Baru</button></div>'
          : '<div class="card empty"><b>Tidak ada tiket</b><p>Belum ada pekerjaan di tahap ini.</p></div>';
      }
      list.sort((a, b) => (TAB.prod === 'aktif' ? 0 : STI(a.st) - STI(b.st)) || String(find(D.nota, a.nid).t).localeCompare(String(find(D.nota, b.nid).t)));
      return list.map(spkCard).join('');
    }
    function spkCard(s) {
      const n = find(D.nota, s.nid), it = n.items.find(i => i.id === s.iid), a = STI(s.st), st = ST[a], nx = ST[a + 1];
      const opts = ST.map((x, j) => `<option value="${x[0]}" ${j === a ? 'selected' : ''} ${a >= LOCK && j < a ? 'disabled' : ''}>${x[1]}</option>`).join('');
      const age = days(n.tgl), late = age >= 3 && a < 4, allDone = spkOf(n).every(x => STI(x.st) >= 4);
      const wa = waLink(n, a === 4 ? `Halo ${n.pn}, pesanan ${n.no} sudah selesai dan siap diambil. Terima kasih.` : `Halo ${n.pn}, kami dari ${D.cfg.nama || 'KIYA PRINTING'} terkait pesanan ${n.no}.`);
      return `<div class="card spk" style="--c:${st[2]}">
        <div class="sh"><b>${esc(s.no)}</b><span>${it.jn === 'luar' ? '<span class="bd cy">Vendor</span> ' : ''}${stB(s.st)}</span></div>
        <div class="spt"><b>${esc(it.pn)}</b><div class="mt">${spec(it)}</div></div>
        <div class="stp" role="img" aria-label="Tahap ${a + 1} dari ${ST.length}">${ST.map((x, j) => `<i class="${j <= a ? 'on' : ''}" style="--c:${x[2]}"></i>`).join('')}</div>
        <div class="spm"><span class="av sm">${esc((n.pn || '?').trim().charAt(0).toUpperCase())}</span>
          <div><b>${esc(n.pn)}</b><div class="mt">${esc(n.no)} · ${fd(n.tgl)}</div></div>
          <div class="r">${payB(n)}<div class="mt" ${late ? 'style="color:var(--wr);font-weight:600"' : ''}>${age === 0 ? 'Masuk hari ini' : age + ' hari lalu'}</div></div></div>
        ${it.cat ? `<div class="chip">Catatan: ${esc(it.cat)}</div>` : ''}
        ${it.file ? `<div class="chip ok">${fileLink(it.file)}</div>` : '<div class="chip wr">File desain belum ada</div>'}
        <div class="sa">
          ${nx ? `<button type="button" class="btn" style="flex:1 1 100%" onclick="setSt('${s.id}','${nx[0]}')">→ ${nx[1]}</button>` : allDone ? `<button type="button" class="btn" style="flex:1 1 100%" onclick="ambil('${n.id}')">Tandai Sudah Diambil</button>` : ''}
          <select onchange="setSt('${s.id}',this.value)" aria-label="Pindah tahap">${opts}</select>
          <button type="button" class="btn o s" onclick="spkLog('${s.id}')">Riwayat</button>
          <button type="button" class="btn o s" onclick="notaDet('${n.id}')">Nota</button>
          ${wa ? `<a class="btn o s" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        </div></div>`;
    }
    function setSt(id, ns, ok) {
      const s = find(D.spk, id); if (!s) return;
      const a = STI(s.st), b = STI(ns);
      if (a === b) return;
      if (a >= LOCK && b < a) { toast('SPK sudah masuk tahap cetak, status tidak bisa mundur.'); return render(); }
      const n = find(D.nota, s.nid), it = n && n.items.find(i => i.id === s.iid);
      if (!it) return;
      if (b >= LOCK && !s.stok && !ok) {
        const bh = find(D.bahan, it.bb);
        const msg = 'Masuk tahap cetak? Ukuran & jumlah terkunci, status tak bisa mundur.' +
          (bh ? ` Stok ${esc(bh.n)} dikurangi ${fmt(it.bbUse)} ${esc(bh.s)}${num(bh.q) < it.bbUse ? ' (stok tidak cukup, akan minus)' : ''}.` : '');
        return ask(msg, () => setSt(id, ns, 1), 'Lanjutkan');
      }
      const iso = new Date().toISOString();
      if (b >= LOCK && !s.stok) {
        const bh = find(D.bahan, it.bb);
        if (bh) lotTake(bh, it.bbUse);
        s.stok = 1;
      }
      if (b >= 4 && !s.done) {
        const miss = [];
        (it.hb || []).forEach(hid => {
          const c = activeCyc(hid);
          if (c) { c.out = Math.round((num(c.out) + it.out) * 1e4) / 1e4; s.cyc.push({ sid: c.id, amt: it.out }); }
          else miss.push((find(D.habis, hid) || {}).n || 'bahan');
        });
        s.done = 1;
        if (miss.length) toast('Output tidak tercatat ke siklus (tidak ada siklus aktif): ' + miss.join(', '));
      }
      s.st = ns;
      s.log.push({ st: ns, t: iso });
      save(); render();
    }
    function spkLog(id) {
      const s = find(D.spk, id); if (!s) return;
      const fm = $('#fm');
      fm.innerHTML = `<div class="mh"><h3>Riwayat ${esc(s.no)}</h3><button type="button" class="x" onclick="cl()">✕</button></div>
        <div class="tl" style="margin-top:12px">${s.log.map(l => `<div><b>${esc((ST[STI(l.st)] || [])[1] || l.st)}</b><div class="mt">${fdt(l.t)}${l.k ? ' · ' + esc(l.k) : ''}</div></div>`).join('')}</div>
        ${s.cyc.length ? `<div class="mt" style="margin-top:10px">Output tercatat ke siklus: ${s.cyc.map(c => { const x = find(D.siklus, c.sid), h = x && find(D.habis, x.bid); return esc((h || {}).n || '-') + ' ' + fmt(c.amt); }).join(', ')}</div>` : ''}
        <div class="fb"><button type="button" class="btn o" onclick="cl()">Tutup</button><button type="button" class="btn" onclick="notaDet('${s.nid}')">Lihat Nota</button></div>`;
      fm.onsubmit = e => e.preventDefault();
      openM();
    }

    /* =====================================================================
       MANAJEMEN
       ===================================================================== */
    R.man = function () {
      const piu = D.nota.filter(n => sisa(n) > 0);
      let h = tabs('man', [['plg', 'Pelanggan', D.plg.length], ['riw', 'Riwayat Pesanan', D.nota.length], ['piu', 'Tagihan', piu.length]]);
      if (TAB.man === 'plg') {
        h += `<div class="card"><div class="sh"><h3 style="margin:0">Data Pelanggan</h3><button class="btn s" onclick="plgForm()">+ Pelanggan</button></div>`;
        h += D.plg.length ? D.plg.map(p => {

            <div class="mt">${esc(p.tel || '-')} · ${ns.length} nota · belanja ${rp(sum(ns, n => n.total))}</div></div>
            <div class="r">${sum(ns, n => Math.max(0, sisa(n))) > 0 ? `<span class="bd wr">Tagihan ${rp(sum(ns, n => Math.max(0, sisa(n))))}</span>` : ''}</div></div>`;
        }).join('') : '<div class="empty">Pelanggan otomatis tersimpan saat membuat pesanan.</div>';
        h += '</div>';
      } else if (TAB.man === 'riw') {
        h += `<div class="card"><input type="search" placeholder="Cari nota / pelanggan…" value="${esc(Q)}" oninput="Q=this.value;qRe()"></div><div class="card" id="ql">${riwayatList()}</div>`;
      } else {
        h += `<div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat" style="--c:var(--wr)"><div class="mt">Total tagihan</div><b>${rp(sum(piu, n => sisa(n)))}</b></div>

        h += `<div class="card">${piu.length ? piu.map(n => `<div class="row"><div class="clk" onclick="notaDet('${n.id}')"><b>${esc(n.pn)}</b><div class="mt">${esc(n.no)} · ${fd(n.tgl)} · ${stage(n)[0]} · dibayar ${rp(paid(n))} dari ${rp(n.total)}</div></div>
          <div class="r"><b style="color:var(--wr)">${rp(sisa(n))}</b><div><button class="btn s" onclick="payM('${n.id}');openM()">Pelunasan</button></div></div></div>`).join('') : '<div class="empty">Semua nota sudah lunas.</div>'}</div>`;
      }
      return h;
    };
    function riwayatList() {
      const q = Q.trim().toLowerCase();
      const l = D.nota.slice().reverse().filter(n => !q || (n.no + ' ' + n.pn).toLowerCase().includes(q));
      if (!l.length) return '<div class="empty">Belum ada pesanan.</div>';
      return `<div class="tbl"><table><thead><tr><th>Tanggal</th><th>Nota</th><th>Pelanggan</th><th>Status</th><th>Bayar</th><th class="r">Total</th></tr></thead><tbody>${l.map(n =>

    }
    function plgForm(id) {
      const p = id ? find(D.plg, id) : null, fm = $('#fm'), used = p && D.nota.some(n => n.plg === p.id);
      fm.innerHTML = `<div class="mh"><h3>${p ? 'Ubah' : 'Tambah'} Pelanggan</h3><button type="button" class="x" onclick="cl()">✕</button></div>

        <div><label>Kategori</label><select id="pk">${[['umum', 'Umum'], ['reseller', 'Reseller'], ['korporat', 'Korporat']].map(k => `<option value="${k[0]}" ${p && p.tipe === k[0] ? 'selected' : ''}>${k[1]}</option>`).join('')}</select></div></div>

        <div class="fb">${p && !used ? `<button type="button" class="btn d" onclick="ask('Hapus pelanggan ini?',()=>{D.plg=D.plg.filter(x=>x.id!=='${p.id}');save();cl();render()},'Hapus',1)">Hapus</button>` : ''}
        <button type="button" class="btn o" onclick="cl()">Batal</button><button class="btn">Simpan</button></div>`;

          else D.plg.push(Object.assign({ id: uid() }, d));
          save(); cl(); render();
        };

      openM();

    /* =====================================================================

       ===================================================================== */

        <button type="button" class="btn o" onclick="cl()">Batal</button><button class="btn">Simpan</button></div>`;

          if (b) {

    function pfTog(k, id, on) { PF[k] = on ? [...new Set(PF[k].concat(id))] : PF[k].filter(x => x !== id); }
    function pfSim() {
      const e = $('#pfs'); if (!e) return;

      const bb = PF.jenis === 'luar' ? num(PF.vend) * u.out : bh ? pakaiBB(PF, u.luas, num(it.q)) * num(bh.h) : 0;
      e.innerHTML = (u.err ? `<div class="err">${esc(u.err)}</div>` : '') +
        (PF.tipe === 'm2' ? `Luas dihitung ${fmt(u.luas)} m² / pcs<br>` : '') +
        `Umum <b>${rp(u.sub)}</b> · Reseller <b>${rp(r.sub)}</b><br><span class="mt">${PF.jenis === 'luar' ? 'Modal vendor' : 'Biaya bahan baku'} ±${rp(bb)}${PF.jenis === 'sendiri' ? ' (belum termasuk tinta/lem)' : ''}</span>`;

    function savePF() {
      const er = m => $('#pferr').textContent = m;
      if (!PF.n.trim()) return er('Isi nama produk.');
      const valid = PF.tipe === 'lembar'
        ? PF.tier.length && PF.tier.every(t => num(t.min) > 0 && num(t.hU) > 0) && new Set(PF.tier.map(t => num(t.min))).size === PF.tier.length
        : num(PF.hU) > 0;
      if (!valid) {
        if (PF.aktif) return er(PF.tipe === 'lembar' ? 'Lengkapi tingkat harga (jumlah minimum unik dan harga umum > 0) sebelum produk diaktifkan.' : 'Isi harga umum > 0 sebelum produk diaktifkan.');
      }
      const d = Object.assign({}, PF);
      delete d.sim;
      d.n = d.n.trim();
      ['hU', 'hR', 'step', 'minLuas', 'maxP', 'maxL', 'waste', 'minQ', 'bulat', 'bbq', 'vend'].forEach(k => d[k] = num(d[k]));
      d.jenis = d.jenis || 'sendiri';
      if (d.jenis === 'luar') { d.bb = ''; d.hb = []; d.waste = 0; }
      else { d.vend = 0; if (d.jenis === 'jual') { d.hb = []; d.fins = []; } }
      if (d.jenis === 'jual' && !d.bb) {
        if (!D.bahan.length) {
          PF._keep = !PF.id;
          return gate('Bahan baku belum ada', 'Produk jenis penjualan langsung memakai stok bahan baku, jadi bahannya perlu dibuat dulu.',

            'Buka Bahan Baku', () => { TAB.inv = 'bb'; go('inv'); });
        }
        return er('Pilih bahan baku yang dijual.');
      }
      if (d.jenis === 'luar' && !(d.vend > 0) && d.aktif) return er('Isi modal vendor > 0 sebelum produk diaktifkan.');
      d.tier = d.tier.filter(t => num(t.min) > 0).map(t => ({ min: num(t.min), hU: num(t.hU), hR: num(t.hR) })).sort((a, b) => a.min - b.min);
      ask(`Simpan formula “${esc(d.n)}”?${d.aktif ? ' Produk aktif dan langsung bisa dipilih di Pesanan Cetak.' : ''}`, () => {
        if (d.id) { const i = D.produk.findIndex(p => p.id === d.id); D.produk[i] = d; }
        else { d.id = uid(); D.produk.push(d); }

    function delProd(id) {

    /* =====================================================================
       NOTA PEMBELIAN (Inventori) — upload foto/file, atau dibuat otomatis
       File disimpan di penyimpanan browser (IndexedDB) di perangkat ini; data nota ikut tersinkron.
       ===================================================================== */
    const FDB = (() => {
      let db = null;
      const open = () => db ? Promise.resolve(db) : new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no idb'));
        const r = indexedDB.open('kp_files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('f');
        r.onsuccess = () => { db = r.result; res(db); };
        r.onerror = () => rej(r.error);
      });
      const tx = (m, fn) => open().then(d => new Promise((res, rej) => {
        const t = d.transaction('f', m), q = fn(t.objectStore('f'));
        t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      }));
      return { put: (k, v) => tx('readwrite', s => s.put(v, k)), get: k => tx('readonly', s => s.get(k)), del: k => tx('readwrite', s => s.delete(k)) };
    })();
    function packFile(file) {
      return new Promise((res, rej) => {
        if (file.type === 'application/pdf') return file.size > 1.5e6 ? rej(new Error('PDF maksimal 1,5 MB')) : res(file);
        if (!/^image\//.test(file.type)) return rej(new Error('Pilih foto/gambar atau file PDF'));
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => {
          const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          c.toBlob(b => b ? res(b) : rej(new Error('Gagal memproses gambar')), 'image/jpeg', .78);
        };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak bisa dibaca')); };
        img.src = url;
      });
    }
    const nbSub = v => sum(v.items || [], i => num(i.q) * num(i.h));

    function nbSave() {

      const stok = !old && v.stok && items.length > 0, baru = stok ? items.filter(i => !find(D.bahan, i.bid)).length : 0;
      ask(`${old ? 'Simpan perubahan nota' : 'Simpan nota pembelian'} senilai ${rp(tot)}?${stok ? ' Stok bertambah, harga rata-rata dihitung ulang.' : ''}${baru ? ` ${baru} bahan baru dibuat.` : ''}`, () => nbSave0(), 'Simpan');
    }
    async function nbSave0() {
      const v = NF, items = nbItems(); if (!items) return;
      const old = v.id ? find(D.pnota, v.id) : null;
      const d = { id: v.id || uid(), no: old ? old.no : nextNo('NB-', v.tgl), tgl: v.tgl, toko: v.toko.trim(), items, ongkir: num(v.ongkir), ket: v.ket.trim(), st: v.st, file: v.file };
      try {
        if (v.dropFile && v.file) { await FDB.del(v.file.id).catch(() => {}); d.file = null; }
        if (v.newFile) {
          const fid = uid();
          await FDB.put(fid, v.newFile);
          if (old && old.file) await FDB.del(old.file.id).catch(() => {});
          d.file = { id: fid, name: v.fname, type: v.newFile.type, size: v.newFile.size };
        }
      } catch (e) { toast('Penyimpanan file tidak tersedia di browser ini, nota dibuat otomatis.'); if (v.newFile) d.file = null; }
      if (!old && v.stok) {
        items.forEach(i => {
          if (find(D.bahan, i.bid)) return;
          const ex = D.bahan.find(b => b.n.toLowerCase() === i.n.toLowerCase() && String(b.s).toLowerCase() === String(i.s || 'pcs').toLowerCase());
          if (ex) { i.bid = ex.id; return; }
          const nb = { id: uid(), n: i.n, merek: i.m || '', sumber: i.sm || '', s: i.s || 'pcs', q: 0, h: 0, min: 0 };
          D.bahan.push(nb); i.bid = nb.id;
        });
        const sub = sum(items, i => i.q * i.h);
        items.forEach(i => {
          const b = find(D.bahan, i.bid); if (!b) return;
          const cost = i.q * i.h + (sub > 0 ? d.ongkir * (i.q * i.h) / sub : 0);
          lotPut(b, i.q, Math.round(cost / i.q * 100) / 100, i.jn, d.tgl);
          if (i.m && !b.merek) b.merek = i.m;
          if (i.sm) b.sumber = i.sm;
          d.st = 1;
        });
      }
      if (old) Object.assign(old, d); else D.pnota.push(d);
      save(); cl(); if (cur !== 'nb' && cur !== 'inv') go('nb'); else render();
      nbDet(d.id);
      toast(d.st ? 'Nota tersimpan · stok bertambah' : 'Nota tersimpan');
    }

  <script>
    /* Huruf awal kapital pada judul, label, tombol, badge. Kalimat panjang, singkatan, satuan, dan data pengguna tidak diubah. */
    (function () {
      const LOW = new Set(['dan', 'atau', 'yang', 'di', 'ke', 'dari', 'untuk', 'pada', 'dengan', 'serta', 'oleh', 'dalam', 'per', 'bagi', 'sebagai', 'ini', 'itu', 'pcs', 'cm', 'mm', 'kg', 'ml', 'm']);
      const SEL = 'h1, h3, .sec, label:not(.ck):not(.up), .btn, .tabs button, .seg button, .subc b, .subc span, .nv span, .bd, .empty b, .so b, .so small, .cb > b, .ni b';
      function tc(t) {
        const n = t.trim().split(/\s+/).length;
        if (n > 7 || /[.!?]\s+\S/.test(t) || (/[.!?]$/.test(t.trim()) && n > 3)) return t;
        let first = true;
        return t.split(/(\s+)/).map(w => {
          if (!w.trim()) return w;
          const f = first; first = false;
          if (!/^[^A-Za-zÀ-ÿ0-9(\[]*[a-zà-ÿ]/.test(w) || /[0-9²³]/.test(w) || /^[(\[]/.test(w)) return w;
          const core = w.replace(/[^a-zà-ÿ]/gi, '').toLowerCase();
          if (!f && LOW.has(core)) return w;
          return w.replace(/[a-zà-ÿ]/, c => c.toUpperCase());
        }).join('');
      }
      function fix(el) {
        if (el.closest('.nbv, #pr')) return;
        el.childNodes.forEach(c => { if (c.nodeType === 3 && c.nodeValue.trim()) { const v = tc(c.nodeValue); if (v !== c.nodeValue) c.nodeValue = v; } });
      }
      function scan(root) {
        if (root.nodeType !== 1) return;
        if (root.matches(SEL)) fix(root);
        root.querySelectorAll(SEL).forEach(fix);
      }
      new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(scan))).observe(document.body, { childList: true, subtree: true });
      scan(document.body);
    })();
  </script>

    (function () {
      const SEL = '[required], [data-req]';
      const empty = el => {
        const v = String(el.value == null ? '' : el.value).trim();
        if (!v) return true;
        return el.getAttribute('data-req') === 'pos' && !(parseFloat(v.replace(',', '.')) > 0);
      };
      function labelOf(el) {
        let p = el.previousElementSibling, k = 0;
        while (p && k++ < 4) { if (p.tagName === 'LABEL') return p; p = p.previousElementSibling; }
        const par = el.parentElement;
        return par && par.tagName === 'LABEL' ? par : null;
      }
      function mark(el) {
        if (el.closest('.nbv, #pr') || el.disabled) return;
        const l = labelOf(el); if (l) l.classList.toggle('rq', empty(el));
      }
      const scan = r => { if (r.nodeType !== 1) return; if (r.matches(SEL)) mark(r); r.querySelectorAll(SEL).forEach(mark); };
      const upd = e => { const t = e.target; if (t && t.matches && t.matches(SEL)) mark(t); };
      document.addEventListener('input', upd);
      document.addEventListener('change', upd);
      new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(scan))).observe(document.body, { childList: true, subtree: true });
      scan(document.body);
    })();

        const b64 = c.toDataURL('image/jpeg', .82).split(',')[1];
        fetch(A.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: A.tok, action: 'upload', mime: 'image/jpeg', b64 }) })
          .then(r => r.json()).then(j => { if (j.ok) { cb(j.url); toast('Foto terunggah'); } else toast('Gagal: ' + (j.error || '?')); })
          .catch(() => toast('Gagal mengunggah (offline?)'));
      };
      im.onerror = () => toast('File bukan gambar'); im.src = u;
    }
    /* bahan baku habis → produk tampil "Habis" di etalase (jenis di luar/vendor tidak pakai stok) */
    const stokHabis = p => !!(p && jenisOf(p) !== 'luar' && p.bb && !(num((find(D.bahan, p.bb) || {}).q) > 0));
    function etPub(id, on) { const p = find(D.produk, id); if (!p) return; p.pub = on; save(); render(); toast(on ? 'Tampil di etalase' : 'Disembunyikan dari etalase'); }
    function etLink(copy) {
      const u = new URL('produk.html', location.href).href;
      if (copy) { (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Link halaman produk disalin'), () => toast('Salin tidak didukung')); }
      else window.open(u, '_blank', 'noopener');
    }
    R.et = function () {
      const web = D.nota.filter(n => n.src === 'web').slice().reverse(), live = D.produk.filter(p => p.pub && p.aktif).length;
      let h = tabs('et', [['pr', 'Produk Etalase', live], ['web', 'Pesanan Web', web.length]]);
      if (TAB.et === 'pr') {
        h += `<div class="card"><div class="sh"><h3 style="margin:0">Halaman Produk</h3><button class="btn s" onclick="prodForm()">+ Produk & Formula</button></div>
          <div class="mt" style="margin:6px 0 10px">Produk aktif yang dicentang tampil di halaman pelanggan. Pesanan masuk otomatis menjadi nota + SPK di tahap “Antrean / Cek File” dan tetap mengikuti alur produksi.</div>
          <div style="display:flex;gap:8px"><button class="btn o s" onclick="etLink(0)">Buka halaman</button><button class="btn o s" onclick="etLink(1)">Salin link</button></div></div>`;
        h += D.produk.length ? D.produk.map(p => `<div class="card"><div style="display:flex;gap:12px;align-items:center">
          <div style="width:64px;height:64px;border-radius:10px;flex:none;background:var(--bg) center/cover;${stokHabis(p) ? 'filter:grayscale(1);opacity:.6;' : ''}${p.img ? `background-image:url('${esc(p.img)}')` : ''}"></div>
          <div style="flex:1;min-width:0"><b>${esc(p.n)}</b> ${stokHabis(p) ? '<span class="bd ex">Habis</span>' : ''}<div class="mt">${TP[p.tipe]} · ${rp(p.tipe === 'lembar' ? num(((p.tier || [])[0] || {}).hU) : p.hU)}</div>
          ${stokHabis(p) && p.pub ? '<div class="mt" style="color:var(--ex)">Bahan baku habis: di halaman pelanggan tertulis “Habis” dan tidak bisa dipesan. Tambah stok di Inventori.</div>' : ''}
          ${p.pub && !p.aktif ? '<div class="mt" style="color:var(--wr)">Produk nonaktif, tidak tampil.</div>' : ''}</div></div>
          <div class="sh" style="margin-top:10px"><label class="ck" style="margin:0"><input type="checkbox" ${p.pub ? 'checked' : ''} onchange="etPub('${p.id}',this.checked)"> Tampil di etalase</label>
          <button class="btn o s" onclick="prodForm('${p.id}')">Foto & Formula</button></div></div>`).join('')
          : '<div class="card empty">Belum ada produk. Ketuk “+ Produk & Formula” untuk membuat langsung.</div>';
      } else {
        h += web.length ? trxList(web) : '<div class="card empty">Belum ada pesanan dari halaman produk.</div>';
      }
      return h;
    };
    async function importWeb() {
      const A = window.KPAPI; if (!A || !A.tok || !window.KPsynced || importWeb.b || document.hidden) return;
      importWeb.b = 1;
      try {
        const j = await (await fetch(A.url + '?action=inbox&token=' + encodeURIComponent(A.tok))).json();
        if (!j.ok || !j.orders.length) return;
        const done = []; let made = 0;
        j.orders.forEach(o => {
          if (D.nota.some(n => n.wid === o.ref)) { done.push(o.ref); return; }
          const iso = new Date().toISOString(), tgl = today(), no = nextNo('KP-', tgl), items = []; let sub = 0;
          o.items.forEach(x => {
            const pr = find(D.produk, x.pid); if (!pr) return;
            const it0 = { pid: pr.id, p: x.p, l: x.l, q: x.q, fin: x.fin || [] }, r = hitung(it0, 'umum'), jn = jenisOf(pr), bh = jn === 'luar' ? null : find(D.bahan, pr.bb);
            items.push({
              jn, vend: jn === 'luar' ? Math.round(num(pr.vend) * r.out * 100) / 100 : 0, id: uid(), pid: pr.id, pn: pr.n, tipe: pr.tipe, ou: OU[pr.tipe],
              p: num(x.p), l: num(x.l), q: num(x.q), luas: r.luas, out: r.out, sat: r.sat, base: r.base, fc: r.fc, sub: r.sub,
              fin: it0.fin.map(id => (find(D.fin, id) || {}).n).filter(Boolean), cat: x.cat || '', file: x.file || '',
              bb: jn === 'luar' ? '' : pr.bb || '', bbUse: jn === 'luar' ? 0 : pakaiBB(pr, r.luas, num(x.q)), bbH: bh ? num(bh.h) : 0, hb: jn === 'sendiri' ? (pr.hb || []).slice() : []
            });
            sub += r.sub;
          });
          if (!items.length) { done.push(o.ref); return; }
          let plg = D.plg.find(x => x.tel && x.tel === o.tel) || D.plg.find(x => x.n.toLowerCase() === o.nama.toLowerCase());
          if (!plg) { plg = { id: uid(), n: o.nama, tel: o.tel, tipe: 'umum', alamat: o.alamat || '' }; D.plg.push(plg); }
          else { if (!plg.tel) plg.tel = o.tel; if (!plg.alamat && o.alamat) plg.alamat = o.alamat; }
          const n = { id: uid(), no, tgl, plg: plg.id, pn: plg.n, tel: o.tel, th: 'umum', items, sub, disk: 0, total: sub, bayar: [],
            ket: ('Pesanan web ' + o.ref + (o.alamat ? ' · ' + o.alamat : '') + (o.ket ? ' · ' + o.ket : '')).trim(), ambil: '', t: iso, src: 'web', wid: o.ref };
          D.nota.push(n);
          items.forEach((it, i) => {
            if (it.jn === 'jual') { const bh = find(D.bahan, it.bb); if (bh) lotTake(bh, it.bbUse); return; }
            D.spk.push({ id: uid(), no: 'SPK' + no.slice(2) + '-' + (i + 1), nid: n.id, iid: it.id, st: 'antre', log: [{ st: 'antre', t: iso, k: 'SPK otomatis dari pesanan web ' + o.ref }], stok: 0, done: 0, cyc: [] });
          });
          done.push(o.ref); made++;
        });
        if (made) { save(); render(); toast(made + ' pesanan baru dari halaman produk'); }
        if (done.length) await fetch(A.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: A.tok, action: 'ack', ids: done }) });
      } catch (e) {} finally { importWeb.b = 0; }
    }
    setTimeout(importWeb, 5000); setInterval(importWeb, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(importWeb, 800); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
