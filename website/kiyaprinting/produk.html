function ceilTo(v,s){return s>0?Math.ceil(v/s-1e-9)*s:v}
function price(pr,it){
  var q=Math.max(0,num(it.q)),r={luas:0,out:0,sub:0,err:''},base=0,fc=0;
  if(pr.tipe==='m2'){var pm=num(it.p)/100,lm=num(it.l)/100;
    if(!(pm>0&&lm>0))r.err='Isi panjang dan lebar.';
    if(pr.maxP&&pm>pr.maxP+1e-9)r.err='Panjang maksimal '+pr.maxP+' m.';
    if(pr.maxL&&lm>pr.maxL+1e-9)r.err='Lebar maksimal '+pr.maxL+' m.';
    r.luas=Math.round(Math.max(ceilTo(pm,pr.step)*ceilTo(lm,pr.step),pr.minLuas)*1e4)/1e4;base=pr.hU*r.luas*q;r.out=r.luas*q;
  }else if(pr.tipe==='lembar'){var t=pr.tier.slice().sort(function(a,b){return b.min-a.min}),tr=t.filter(function(x){return q>=x.min})[0]||t[t.length-1]||{hU:0};base=tr.hU*q;r.out=q}
  else{base=pr.hU*q;r.out=q}
  if(!(q>0))r.err=r.err||'Jumlah harus lebih dari 0.';
  if(pr.minQ&&q<pr.minQ)r.err='Minimal pesan '+pr.minQ+' '+OU[pr.tipe]+'.';
  (it.fin||[]).forEach(function(id){var f=C.fin.filter(function(x){return x.id===id})[0];if(!f)return;fc+=f.sat==='m2'?f.h*r.out:f.sat==='order'?f.h:f.h*q});
  r.sub=ceilTo(base+fc,pr.bulat);return r}
var from=function(p){var v=p.tipe==='lembar'?Math.min.apply(null,p.tier.map(function(t){return t.hU}).concat([1e12])):p.hU;return '<small>mulai</small> '+rp(v)+' <small>/ '+OU[p.tipe]+'</small>'};
function bg(p){return p.img?'background-image:url(\''+esc(p.img)+'\')':''}
function draw(){
  var types=[];C.produk.forEach(function(p){if(types.indexOf(p.tipe)<0)types.push(p.tipe)});
  $('#ch').innerHTML=types.length>1?['all'].concat(types).map(function(t){return '<button class="chip'+(F===t?' on':'')+'" onclick="F=\''+t+'\';draw()">'+(t==='all'?'Semua':TN[t])+'</button>'}).join(''):'';
  var q=Q.trim().toLowerCase(),L=C.produk.map(function(p,i){return{p:p,i:i}}).sort(function(a,b){return(a.p.habis?1:0)-(b.p.habis?1:0)}).filter(function(x){return(F==='all'||x.p.tipe===F)&&(!q||(x.p.n+' '+x.p.desc).toLowerCase().indexOf(q)>=0)});
  $('#gr').innerHTML=L.map(function(x,k){var p=x.p;return '<button class="pc'+(p.habis?' out':'')+'" style="animation-delay:'+Math.min(k,12)*40+'ms" onclick="openP('+x.i+')"><div class="im" style="'+bg(p)+'">'+(p.img?'':IC.img)+(p.habis?'<span class="sold">Habis</span>':'')+'</div><div class="b"><b>'+esc(p.n)+'</b><span class="tp">'+TN[p.tipe]+'</span><div class="pr">'+from(p)+'</div></div></button>'}).join('');
  $('#st').innerHTML=L.length?'':failed&&!C.produk.length?'<div class="state">'+IC.warn+'<div>Produk belum bisa dimuat. Periksa koneksi Anda.</div><button onclick="load()">Coba lagi</button></div>'
    :'<div class="state">'+IC.img+'<div>'+(C.produk.length?'Tidak ada produk yang cocok.':'Belum ada produk tersedia.')+'</div></div>';
  var n=CART.length,t=CART.reduce(function(a,c){return a+c.sub},0);
  $('#cb').classList.toggle('on',n>0);$('#cn').textContent='Keranjang · '+n+' item';$('#ct').textContent=rp(t);
  var cc=$('#cc');cc.hidden=!n;cc.textContent=n;
  $('#wa').classList.toggle('on',!!C.toko.telp);
  $('#ft').textContent=(C.toko.nama||'KIYA PRINTING')+(C.toko.tag?' · '+C.toko.tag:'')}
function cl(){$('#sh').classList.remove('on');document.body.style.overflow=''}
function show(h,wide){var b=$('#sb');b.className='sb'+(wide?' wide':'');b.innerHTML=h;$('#sh').classList.add('on');b.scrollTop=0;document.body.style.overflow='hidden'}
document.addEventListener('keydown',function(e){if(e.key==='Escape')cl()});
function waNo(){return(C.toko.telp||'').replace(/\D/g,'').replace(/^0/,'62')}
function chat(){var w=waNo();if(w)location.href='https://wa.me/'+w+'?text='+encodeURIComponent('Halo, saya mau tanya produk.')}
function hdr(t){return '<div class="sh"><h3>'+t+'</h3><button class="x" onclick="cl()" aria-label="Tutup">'+IC.x+'</button></div>'}
function openP(i){
  var p=C.produk[i];cur={pi:i,p:100,l:100,q:p.minQ||1,fin:[],cat:'',file:''};
  var f=p.fins.map(function(id){return C.fin.filter(function(x){return x.id===id})[0]}).filter(Boolean);
  show(hdr(esc(p.n))+'<div class="bd"><div class="dg two"><div class="pic"><div class="im" style="'+bg(p)+'">'+(p.img?'':IC.img)+'</div>'+(p.desc?'<p>'+esc(p.desc)+'</p>':'')+'<p>'+TN[p.tipe]+' · '+from(p)+'</p></div><div>'
  +(p.habis?'<div class="wb">'+IC.warn+'Stok produk ini sedang habis. Hubungi kami untuk info ketersediaan.</div>':'')
  +(p.tipe==='m2'?'<div class="g2"><div><label class="l" for="ip">Panjang (cm)</label><input id="ip" type="number" inputmode="decimal" min="1" value="100" oninput="cur.p=this.value;calc()"></div><div><label class="l" for="il">Lebar (cm)</label><input id="il" type="number" inputmode="decimal" min="1" value="100" oninput="cur.l=this.value;calc()"></div></div><div class="mt" style="margin-top:6px">'+(p.maxL?'Lebar maks. '+p.maxL+' m. ':'')+(p.step?'Ukuran dibulatkan ke atas per '+p.step+' m. ':'')+(p.minLuas?'Minimal '+p.minLuas+' m².':'')+'</div>':'')
  +'<label class="l">Jumlah ('+OU[p.tipe]+')</label><div class="sp"><button type="button" onclick="stp(-1)" aria-label="Kurangi">−</button><input id="iq" type="number" inputmode="numeric" min="1" value="'+cur.q+'" oninput="cur.q=this.value;calc()"><button type="button" onclick="stp(1)" aria-label="Tambah">+</button></div>'
  +(f.length?'<label class="l">Finishing (opsional)</label>'+f.map(function(x){return '<label class="ck"><input type="checkbox" onchange="tgF(\''+x.id+'\',this.checked)"><span>'+esc(x.n)+'</span><small>+'+rp(x.h)+' '+({pcs:'/ pcs',m2:'/ m²',order:'/ order'}[x.sat]||'')+'</small></label>'}).join(''):'')
  +'<label class="l" for="ic">Catatan (opsional)</label><textarea id="ic" rows="2" oninput="cur.cat=this.value" placeholder="Warna, bahan, instruksi khusus…"></textarea>'
  +'<label class="l" for="if">Link file desain (opsional)</label><input id="if" inputmode="url" oninput="cur.file=this.value" placeholder="Tempel link Google Drive dsb.">'
  +'<div class="err" id="pe"></div></div></div></div><div class="ft"><div class="tt"><small>Perkiraan harga</small><b id="pp"></b></div><button class="btn" id="pb" onclick="addCart()">'+(p.habis?'Stok Habis':'Tambah ke Keranjang')+'</button></div>',true);calc()}
function stp(d){var e=$('#iq'),v=Math.max(1,Math.round(num(e.value))+d);e.value=v;cur.q=v;calc()}
function tgF(id,on){cur.fin=on?cur.fin.concat(id):cur.fin.filter(function(x){return x!==id})}
function calc(){var r=price(C.produk[cur.pi],cur);$('#pp').textContent=r.err?'—':rp(r.sub);$('#pe').textContent=r.err;$('#pb').disabled=!!r.err||!!C.produk[cur.pi].habis}
function addCart(){var p=C.produk[cur.pi],r=price(p,cur);if(r.err||p.habis)return;
  CART.push({pid:p.id,pn:p.n,p:num(cur.p),l:num(cur.l),q:num(cur.q),fin:cur.fin.slice(),cat:cur.cat.trim(),file:cur.file.trim(),sub:r.sub,ou:OU[p.tipe],tipe:p.tipe});saveCart();draw();cl();toastC()}
function toastC(){var b=$('.cbtn');b.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:350})}
function openCart(){
  if(!CART.length)return show(hdr('Keranjang')+'<div class="bd"><div class="state">'+IC.img+'<div>Keranjang masih kosong.</div><button onclick="cl()">Pilih produk</button></div></div>');
  var t=CART.reduce(function(a,c){return a+c.sub},0);
  show(hdr('Keranjang')+'<div class="bd">'+CART.map(function(c,i){return '<div class="row"><div><b>'+esc(c.pn)+'</b>'+(soldIn().indexOf(c)>=0?' <span class="sold" style="position:static">Habis</span>':'')+'<div class="mt">'+(c.tipe==='m2'?c.p+' × '+c.l+' cm · ':'')+c.q+' '+(c.tipe==='m2'?'pcs':c.ou)+'</div></div><div style="text-align:right"><b>'+rp(c.sub)+'</b><div><button class="rm" onclick="rm('+i+')">Hapus</button></div></div></div>'}).join('')
  +'<div class="tot"><span>Total perkiraan</span><b>'+rp(t)+'</b></div>'
  +'<label class="l" for="fn">Nama</label><input id="fn" autocomplete="name" placeholder="Nama Anda"><label class="l" for="ft2">Nomor WhatsApp</label><input id="ft2" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx"><label class="l" for="fa">Alamat / keterangan pengambilan (opsional)</label><textarea id="fa" rows="2"></textarea>'
  +'<input class="hp" id="fh" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="err" id="fe"></div><button class="btn f" id="fb" onclick="send()">Kirim Pesanan</button><p class="mt" style="text-align:center">Harga final dikonfirmasi tim kami sebelum produksi.</p></div>')}
function rm(i){CART.splice(i,1);saveCart();draw();openCart()}
function soldIn(){return CART.filter(function(c){var p=C.produk.filter(function(x){return x.id===c.pid})[0];return p&&p.habis})}
function send(){
  var so=soldIn();if(so.length)return $('#fe').textContent='Stok habis: '+so.map(function(c){return c.pn}).join(', ')+'. Hapus dari keranjang.';
  var nama=$('#fn').value.trim(),tel=$('#ft2').value.trim();
  if(!nama)return $('#fe').textContent='Isi nama Anda.';
  if(tel.replace(/\D/g,'').length<8)return $('#fe').textContent='Isi nomor WhatsApp yang valid.';
  $('#fb').disabled=true;$('#fb').textContent='Mengirim…';$('#fe').textContent='';
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'order',nama:nama,tel:tel,alamat:$('#fa').value,hp:$('#fh').value,
    items:CART.map(function(c){return{pid:c.pid,p:c.p,l:c.l,q:c.q,fin:c.fin,cat:c.cat,file:c.file}})})})
  .then(function(r){return r.json()}).then(function(j){
    if(!j.ok){$('#fe').textContent=j.error||'Gagal mengirim.';$('#fb').disabled=false;$('#fb').textContent='Kirim Pesanan';return}
    CART=[];saveCart();draw();var wa=waNo(),msg='Halo, saya '+nama+'. Pesanan online '+j.ref+' sebesar '+rp(j.total)+'. Mohon konfirmasi.';
    show(hdr('Pesanan terkirim')+'<div class="bd done"><div class="ok">'+IC.ok+'</div><h3 style="margin:0 0 6px">Terima kasih!</h3><p style="margin:0">Nomor pesanan <b>'+esc(j.ref)+'</b><br>Total perkiraan <b>'+rp(j.total)+'</b></p><p class="mt">Tim kami akan memeriksa file dan menghubungi Anda.</p>'
    +(wa?'<button class="btn f" onclick="location.href=\'https://wa.me/'+wa+'?text='+encodeURIComponent(msg)+'\'">Konfirmasi via WhatsApp</button>':'')+'<button class="btn o f" onclick="cl()">Tutup</button></div>');
  }).catch(function(){$('#fe').textContent='Koneksi gagal. Coba lagi.';$('#fb').disabled=false;$('#fb').textContent='Kirim Pesanan'});
}
function hide(){var e=$('#ld');if(!e)return;e.classList.add('out');setTimeout(function(){e.remove()},600)}
var t0=Date.now(),MIN=2300;
function done(){var w=Math.max(0,MIN-(Date.now()-t0));setTimeout(hide,w)}
function load(){
  failed=false;
  fetch(API+'?action=catalog').then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw 0;C=j;try{localStorage.setItem('kp_cat',JSON.stringify(j))}catch(e){}
    if(C.toko.nama)$('#tn').textContent=C.toko.nama;draw();done()
  }).catch(function(){failed=true;try{C=JSON.parse(localStorage.getItem('kp_cat'))||C}catch(e){}draw();done()})}
draw();load();setTimeout(hide,8000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
