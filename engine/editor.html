<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #070d20; color: #e6efff; font: 12px/1.5 system-ui, sans-serif; }
  #pvbox { margin-top: 12px; background: radial-gradient(ellipse at 50% 50%, #142245 0%, #050a1a 80%); border: 1px solid #1c2a52; border-radius: 12px; aspect-ratio: 1; }
  #pv { width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { background: #0b1330; border: 1px solid #1c2a52; border-radius: 10px; padding: 8px 10px; }
  label { display: block; margin: 6px 0; color: #b9c9ec; }
  input[type=text], select { width: 100%; background: #060b1e; color: #e6efff; border: 1px solid #2a3b6e; border-radius: 8px; padding: 6px 8px; font: inherit; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { background: #16224a; color: #e6efff; border: 1px solid #34498a; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #1f2f66; }
  button.primary { background: #2c4fae; border-color: #5b86f0; }
  .stat { color: #9fb4e0; margin: 0 0 6px; }
  #ltable { max-height: 190px; overflow: auto; }
  #ltable div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: center; margin: 4px 0; }
  .note { color: #8fa6d6; font-size: 12px; margin: 6px 0 0; }
  .err { color: #ff9a9a; margin-top: 8px; }
  .hide { display: none; }
  .icgrid { display: grid; grid-template-columns: repeat(auto-fill, 72px); gap: 8px; margin-top: 10px; }
  .icgrid figure { margin: 0; text-align: center; font-size: 11px; color: #8fa6d6; }
  .icgrid img { width: 72px; height: 72px; object-fit: contain; display: block; background: #060b1e; border: 1px solid #2a3b6e; border-radius: 8px; }
  input[type=range] { width: 100%; accent-color: #6f9bff; }
  .atrow { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: start; margin: 8px 0; padding-bottom: 8px; border-bottom: 1px solid #1c2a52; }
  .atrow > img { width: 56px; height: 56px; object-fit: contain; background: #060b1e; border: 1px solid #2a3b6e; border-radius: 8px; }
  .atc { display: flex; gap: 6px; flex-wrap: wrap; }
  .atc button { display: flex; flex-direction: column; align-items: center; width: 84px; padding: 4px; font-size: 10px; line-height: 1.25; text-align: center; word-break: break-word; }
  .atc button img { width: 48px; height: 48px; object-fit: contain; background: #060b1e; border-radius: 6px; }
  .atc button.on { background: #2c4fae; border-color: #9cc4ff; }
  .atc button.low { opacity: .6; }
  .sprow { margin: 8px 0; padding-bottom: 8px; border-bottom: 1px solid #1c2a52; }
  .sprow .top { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: center; }
  .sprow img.ic { width: 56px; height: 56px; object-fit: contain; background: #060b1e; border: 1px solid #2a3b6e; border-radius: 8px; }
  .sprow .nm { font-size: 12px; color: #8fa6d6; margin: 2px 0 4px; }
  .sprow .tv { width: 100%; overflow: auto; margin-top: 6px; background: #060b1e; border: 1px solid #1c2a52; border-radius: 10px; }
  .sprow .tv svg { display: block; margin: 0 auto; }
  .sprow .tv text { fill: #cfe0ff; font-size: 11px; text-anchor: middle; }
/* ===== Kartu dropdown, form, dan ikon penjelasan ===== */
  details.panel > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; user-select: none; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel[open] > summary { margin-bottom: 10px; }
  .panel h3 { margin: 16px 0 6px; padding-top: 12px; border-top: 1px solid #1c2a52; font-size: 12px; font-weight: 500; color: #b9c9ec; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel h3:first-of-type { margin-top: 4px; padding-top: 0; border-top: 0; }
  .fld { margin: 10px 0; }
  .fld > label { margin: 0 0 4px; }
  .ctl { display: flex; gap: 8px; align-items: center; }
  .ctl.top { align-items: flex-start; }
  .ctl.top .inf { margin-top: 5px; }
  .ctl .grow { flex: 1; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .pair { display: flex; gap: 8px; }
  .pair input { flex: 1; min-width: 0; }
  .fld.chk { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fld.chk label { margin: 0; }
  .btnrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .btnrow .inf { margin-left: auto; }
  .inf { flex: none; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid #5b86f0; background: #16224a; color: #9cc4ff; font: 700 12px/1 system-ui, sans-serif; display: grid; place-items: center; cursor: help; }
  .inf:hover, .inf[aria-expanded=true] { background: #2c4fae; color: #fff; }
  #tip { position: fixed; z-index: 100; max-width: min(300px, calc(100vw - 24px)); background: #0f1a3d; color: #dce8ff; border: 1px solid #5b86f0; border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none; pointer-events: none; }
  #tip.open { display: block; }
  #ltable { position: relative; }
  #ltable div { grid-template-columns: 74px 1fr; padding: 2px 4px; }
  #ltable div.sel { background: rgba(255,226,122,.12); border-radius: 6px; outline: 1px solid rgba(255,226,122,.5); }
  #ltable div.own { background: rgba(127,176,255,.09); border-radius: 6px; }
/* ===== Skala tipografi seragam: judul 13 / label & isi 13 / penjelasan & status 12 / keterangan kecil 11 ===== */
  :root { --fs-title: 12px; --fs-text: 12px; --fs-note: 11px; --fs-micro: 10px; --c-label: #cfd9f3; --c-note: #8fa6d6; }
  .panel h3 { font-size: var(--fs-text); font-weight: 600; color: #dbe6ff; }
  label, input[type=text], select, button, textarea { font-size: var(--fs-text); }
  label { color: var(--c-label); }
  .note, .stat, .err, .sprow .nm, #tip { font-size: var(--fs-note); line-height: 1.5; }
  .stat { color: var(--c-note); margin: 0 0 6px; }
  .note:empty, .err:empty { display: none; }
  .atc button, .icgrid figure { font-size: var(--fs-micro); }
  .row { gap: 6px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:disabled:hover { background: #16224a; }
  button.primary:disabled:hover { background: #2c4fae; }
  #pvbox { position: relative; }
  .pvfab { position: absolute; top: 10px; right: 10px; z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
/* ===== Preview gaya halaman rasi ===== */
  #pvo { position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden;
    background: radial-gradient(ellipse at 50% 48%, rgba(20,34,69,.55) 0%, rgba(7,13,32,.45) 38%, transparent 70%), linear-gradient(180deg, #030611 0%, #070d20 55%, #02040c 100%); }
  #pvo.open { display: grid; place-items: center; }
  #pvs { width: min(86vmin, 900px); height: min(86vmin, 900px); overflow: visible; }
  #pvt { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: clamp(18px, 4vmin, 34px); font-weight: 300; color: rgba(238,245,255,.94);
    text-shadow: 0 0 6px rgba(214,232,255,.55), 0 0 18px rgba(150,190,255,.38); pointer-events: none; }
  #pvh { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(214,232,255,.65); pointer-events: none; padding: 0 16px; }
  #pvx { position: absolute; top: 12px; right: 12px; z-index: 2; }
  #pso { position: absolute; inset: 0; z-index: 1; display: none; overflow: hidden; align-items: stretch; justify-content: space-between; background: rgba(3,6,17,.6); backdrop-filter: blur(2px); }
  #pso.open { display: flex; animation: psFade .4s ease-out both; }
  #pso.closing { animation: psFadeOut .5s ease-in both; pointer-events: none; }
  @keyframes psFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes psFadeOut { to { opacity: 0; } }
/* kartu pohon spirit: masuk dari kanan ke kiri, keluar kembali ke kanan */
  #pso.open .sptree { animation: psTreeIn .55s cubic-bezier(.2, .85, .25, 1) both; }
  #pso.closing .sptree { animation: psTreeOut .42s cubic-bezier(.5, 0, .85, .4) both; }
  @keyframes psTreeIn { from { transform: translateX(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes psTreeOut { from { transform: none; opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
/* ikon spirit: setelah dua arus partikel sampai di tengah, ikon perlahan tersusun dari cahaya kuning (kabur+kuning -> jernih); keluar dengan arah sebaliknya */
  #pso .spimg { position: relative; }
  #pso.open .spimg img { animation: psImgForm 1.8s cubic-bezier(.3, .6, .3, 1) 1.75s both; }
  #pso.closing .spimg img { animation: psImgOut .6s ease-in both; }
  @keyframes psImgForm {
    0% { opacity: 0; transform: scale(.94); filter: blur(22px) sepia(1) saturate(3.2) brightness(1.9) hue-rotate(-12deg) drop-shadow(0 0 30px rgba(255,200,80,1)); }
    30% { opacity: .85; }
    70% { opacity: 1; filter: blur(5px) sepia(.8) saturate(2.4) brightness(1.4) hue-rotate(-8deg) drop-shadow(0 0 26px rgba(255,205,80,.8)); }
    100% { opacity: 1; transform: none; filter: blur(0px) sepia(0) saturate(1) brightness(1) hue-rotate(0deg) drop-shadow(0 0 18px rgba(255,205,90,.4)); }
  }
  @keyframes psImgOut {
    from { opacity: 1; transform: none; filter: blur(0px) sepia(0) saturate(1) brightness(1) hue-rotate(0deg) drop-shadow(0 0 18px rgba(255,205,90,.4)); }
    to { opacity: 0; transform: scale(.94); filter: blur(20px) sepia(1) saturate(3.2) brightness(1.9) hue-rotate(-12deg) drop-shadow(0 0 30px rgba(255,200,80,1)); }
  }
/* halo kuning tipis di belakang ikon spirit */
  #pso .psglow { position: absolute; left: 50%; top: 50%; width: min(64vmin, 560px); aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -46%); pointer-events: none; opacity: 0; z-index: -1;
    background: radial-gradient(circle, rgba(255,212,105,.2) 0, rgba(255,205,90,.08) 45%, transparent 68%); }
  #pso.open .psglow { animation: psGlowIn 1.8s ease-out 2.2s forwards, psBreath 5s ease-in-out 4s infinite; }
  @keyframes psGlowIn { to { opacity: 1; } }
  @keyframes psBreath { 0%, 100% { opacity: 1; } 50% { opacity: .62; } }
  #pso.closing .psglow { display: none; }
  #pso.open .spimg span { animation: psNameIn .6s ease-out 2.9s both; }
  #pso.closing .spimg span { animation: psNameOut .25s ease-in both; }
  @keyframes psNameIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes psNameOut { to { opacity: 0; } }
  #pso .psbeam { position: absolute; left: 50%; top: 0; bottom: 18%; width: clamp(60px, 14vmin, 130px); transform: translateX(-50%); pointer-events: none; opacity: 0; filter: blur(7px); z-index: -1;
    background: linear-gradient(180deg, rgba(255,222,140,0) 0, rgba(255,222,140,.34) 38%, rgba(255,222,140,0) 100%); }
  #pso.open .psbeam { animation: psBeam 2.4s ease-in-out both; }
  @keyframes psBeam { 0% { opacity: 0; } 25% { opacity: 1; } 70% { opacity: .75; } 100% { opacity: 0; } }
  #pso #pspart { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #pso.closing #pspart, #pso.closing .psbeam { display: none; }
/* garis pohon naik perlahan dari simpul bawah ke atas; simpul muncul menyusul */
  .rl { stroke-dasharray: 1 2; stroke-dashoffset: 1; animation: psLine 1.1s cubic-bezier(.3, .6, .3, 1) both; }
  @keyframes psLine { to { stroke-dashoffset: 0; } }
  .ni.rise { animation: psNodeIn .6s ease-out both; }
  @keyframes psNodeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
/* item baru diaktifkan: cahaya merambat naik di garis, lalu ikon menyala dengan lingkaran cahaya */
  .litin { opacity: 0; transform-box: fill-box; transform-origin: center; animation: psLitIn .6s ease-out forwards; pointer-events: none; }
  @keyframes psLitIn { 0% { opacity: 0; transform: scale(.85); } 55% { opacity: 1; transform: scale(1.18); } 100% { opacity: 1; transform: scale(1); } }
  .litring { fill: none; stroke: rgba(255,226,140,.95); stroke-width: 1.6; opacity: 0; transform-box: fill-box; transform-origin: center; animation: psRing .85s ease-out forwards; pointer-events: none; }
  @keyframes psRing { 0% { opacity: .9; transform: scale(.7); } 100% { opacity: 0; transform: scale(2.1); } }
  .txl { animation: psTxtLit .5s ease-out both; }
  @keyframes psTxtLit { from { opacity: .42; } to { opacity: 1; } }
/* ditolak: hanya ikon / tombol yang dipilih yang bergetar */
  .nd.deny, button.deny { animation: pdeny .5s ease-in-out; }
  @media (prefers-reduced-motion: reduce) { #pso, #pso * { animation: none !important; } .rl { stroke-dashoffset: 0; } .litin { opacity: 1 !important; } .litring { display: none; } #pso .psglow { opacity: 1; } }
  #pso .spimg { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px clamp(10px, 4vw, 56px); }
  #pso .spimg span { color: rgba(238,245,255,.95); font-size: clamp(18px, 3.8vmin, 34px); font-weight: 300; text-align: center; text-shadow: 0 0 6px rgba(214,232,255,.55), 0 0 18px rgba(150,190,255,.38); }
  #pso .spimg img { max-width: 100%; max-height: calc(100vh - 150px); object-fit: contain; filter: blur(0px) sepia(0) saturate(1) brightness(1) hue-rotate(0deg) drop-shadow(0 0 18px rgba(255,205,90,.4)); }
  #pso .sptree { flex: 0 0 auto; width: min(420px, 46vw); display: flex; flex-direction: column; overflow: auto; padding: 14px 10px; background: linear-gradient(90deg, rgba(2,5,16,0) 0, rgba(2,5,16,.5) 16%, rgba(2,5,16,.5) 100%); }
  #pso .sptbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 8px; color: #b9c9ec; font-size: 12px; }
  #pso .sptbar button { padding: 3px 8px; font-size: 12px; }
  #pso #pstv { margin: auto 0; }
  #pso .sptree text { fill: #e6efff; font-size: 11px; text-anchor: middle; }
  @media (max-width: 760px) { #pso { flex-direction: column; justify-content: flex-start; overflow-x: hidden; overflow-y: auto; } #pso .spimg { padding: 20px 12px; flex: none; } #pso .spimg img { max-height: 30vh; } #pso .sptree { width: 100%; flex: none; min-height: 50vh; background: rgba(2,5,16,.5); } }
  .pst0 { fill: #fff; cursor: pointer; transform-box: fill-box; transform-origin: center;
    filter: drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 10px rgba(191,220,255,.8));
    animation: pstar 5.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .pst0.wob { animation: pwob .48s ease-in-out, pstar 5.8s ease-in-out infinite; animation-delay: 0s, var(--d, 0s); }
  @keyframes pstar { 0%,100% { transform: translateY(0) scale(1); opacity: .78; } 28% { transform: translateY(-8px) scale(1.08); opacity: 1; } 62% { transform: translateY(3px) scale(.96); opacity: .86; } }
  @keyframes pwob { 0%,100% { rotate: 0deg; scale: 1; } 18% { rotate: -7deg; scale: 1.12; } 38% { rotate: 5deg; scale: .98; } 58% { rotate: -3deg; scale: 1.05; } 78% { rotate: 2deg; } }
  .pn { cursor: pointer; transform-box: fill-box; transform-origin: center; animation: pfloat 8s ease-in-out infinite; animation-delay: var(--cd, 0s); }
  .pn.deny { animation: pdeny .5s ease-in-out, pfloat 8s ease-in-out infinite; animation-delay: 0s, var(--cd, 0s); }
  .pn.locked { opacity: .45; }
  @keyframes pfloat { 0%,100% { transform: translateY(0); } 32% { transform: translateY(-7px); } 68% { transform: translateY(4px); } }
  @keyframes pdeny { 0%,100% { translate: 0 0; } 15% { translate: -6px 0; } 35% { translate: 6px 0; } 55% { translate: -4px 0; } 75% { translate: 3px 0; } }
  .pst1 { fill: rgba(255,255,255,.02); stroke: #fff; stroke-width: 4; transition: stroke-width .35s ease, filter .35s ease, stroke .6s ease;
    filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px rgba(196,220,255,.95)) drop-shadow(0 0 17px rgba(125,171,255,.5)); }
  .pn:hover .pst1 { stroke-width: 5; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px #fff) drop-shadow(0 0 24px rgba(150,195,255,.95)); }
  .pn.lit .pst1 { stroke-width: 5.5; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px #fff) drop-shadow(0 0 25px #fff) drop-shadow(0 0 42px rgba(164,203,255,1)); }
  #pvs.all .pst1 { stroke: #ffe2a8; }
  .picon { pointer-events: none; opacity: .88; transition: opacity .35s ease, filter .35s ease; filter: drop-shadow(0 0 2px rgba(255,255,255,.6)); }
  .pn.lit .picon { opacity: 1; filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 12px rgba(164,203,255,1)); }
  .pnum { fill: #fff; font-size: 52px; font-weight: 300; text-anchor: middle; dominant-baseline: central; pointer-events: none; opacity: .88; }
  .pst2 { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: butt; pointer-events: none;
    stroke-dasharray: var(--len, 1); stroke-dashoffset: var(--len, 1); transition: stroke-dashoffset 1.6s linear var(--dly, 0s); }
  .pst2.on { stroke-dashoffset: 0; stroke-linecap: round; stroke-opacity: .8;
    filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px rgba(194,220,255,.8)) drop-shadow(0 0 16px rgba(116,164,255,.42)); }
  @media (prefers-reduced-motion: reduce) { .pst0, .pn { animation: none !important; } .pst2 { transition: none; } }

  /* ===== Tata letak editor ===== */
  :root { --cv: 520px; }
  .wrap { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 12px; padding: 12px; }
  .lcol { width: min(var(--cv), 100%); flex: none; display: flex; flex-direction: column; gap: 8px; }
  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 8px 5px 12px; }
  .hdr { position: relative; justify-content: center; min-height: 38px; }
  .hdr h1 { margin: 0; font-size: 14px; font-weight: 500; text-align: center; text-transform: uppercase; letter-spacing: .12em; }
  .urlrow { margin: 0; flex-wrap: nowrap; align-items: center; }
  .err { margin-top: 0; }
  button, input[type=text], select { padding: 3px 7px; border-radius: 7px; }
  .inf { width: 16px; height: 16px; font-size: 10px; }
  .fld { margin: 6px 0; }
  .panel h3 { margin: 10px 0 4px; padding-top: 8px; }
  .ic { width: 16px; height: 16px; display: block; }
  .tb { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; flex: none; }
  #apanel.hide, #spanel.hide { display: block; opacity: .4; pointer-events: none; }
  /* kanvas + alat di tepi kiri */
  #pvbox { margin-top: 0; width: 100%; }
  .pvfab { top: 8px; right: 8px; }
  .tools { position: absolute; left: 0; top: 8px; z-index: 3; display: flex; flex-direction: column; gap: 4px; padding: 4px; background: rgba(11,19,48,.92); border: 1px solid #2a3b6e; border-left: 0; border-radius: 0 10px 10px 0; }
  .tgrp { position: relative; }
  .tcaret { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; padding: 0; border: 0; border-radius: 0; background: none; cursor: pointer; }
  .tcaret::after { content: ''; position: absolute; right: 2px; bottom: 2px; border: 3px solid transparent; border-right-color: #9cc4ff; border-bottom-color: #9cc4ff; }
  .tcaret:hover::after, .tcaret[aria-expanded=true]::after { border-right-color: #fff; border-bottom-color: #fff; }
  .tmenu { display: none; position: absolute; left: calc(100% + 8px); top: 0; flex-direction: column; gap: 4px; padding: 4px; background: #0f1a3d; border: 1px solid #5b86f0; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .tmenu.open { display: flex; }
  .tmenu button { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tmenu button.on { background: #2c4fae; border-color: #9cc4ff; }
  .cvh { position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px; z-index: 3; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 0 48%, #5b86f0 48% 56%, transparent 56% 70%, #5b86f0 70% 78%, transparent 78%); }
  /* baris ikon di bawah kanvas: ukuran ikut kanvas */
  .ubar { --bx: clamp(34px, calc(var(--cv) * .1), 84px); position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: calc(var(--bx) * .08); }
  .ubar .tb, .ubar details.panel > summary { width: var(--bx); height: calc(var(--bx) * .85); border-radius: calc(var(--bx) * .15); }
  .ubar details.panel { padding: 0; border: 0; border-radius: 0; background: none; }
  .ubar details.panel > summary { margin: 0; flex-direction: column; justify-content: center; gap: calc(var(--bx) * .07); background: #16224a; border: 1px solid #34498a; }
  .ubar details.panel > summary:hover { background: #1f2f66; }
  .ubar details.panel[open] > summary { background: #2c4fae; border-color: #9cc4ff; }
  .ubar .ic { width: calc(var(--bx) * .32); height: calc(var(--bx) * .32); }
  .ubar .lb { font-size: calc(var(--bx) * .17); line-height: 1; color: #cfd9f3; white-space: nowrap; }

<script>
(() => {
  const $ = id => document.getElementById(id);
  const pv = $('pv'), SVGNS = 'http://www.w3.org/2000/svg';
  const CANVAS = 996.7;
  let rawText = '';
  let spManual = false;   // true bila pengguna mengisi kolom lingkaran spesial sendiri (deteksi otomatis tidak menimpa)
  let icons = [];   // hasil "Ambil ikon": [{ n, png: Uint8Array, url }]
  let mode = null, R = null, imgUrl = '';   // mode: 'svg' | 'img' | null ; R = data gambar raster {W,H,M,lum}
  let C = [], S = [], L = [], owner = [];   // C:[x,y,r]  S:{x,y}  L:[x1,y1,x2,y2]  owner[i]: indeks lingkaran, -1 = tanpa
  let sel = new Set(), drag = null, hist = [], redoSt = [], clip = null, pasteN = 0, lastNudge = 0, mq = null;   // sel: kunci 'C3' | 'S1' | 'L0'
  let spSel = [];   // guid spirit per lingkaran
  let icoNames = [];   // nama ikon atlas terpilih per lingkaran (hasil pencocokan)

  const fx = v => Math.round(v * 10) / 10;
  const hue = i => i < 0 ? '#8890a8' : `hsl(${(i * 47) % 360} 85% 68%)`;

  // ---------- Deteksi dari SVG ----------
  function detect(text) {
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    if (doc.querySelector('parsererror')) throw new Error('File bukan SVG yang valid.');
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-9999px;top:0;width:0;height:0;overflow:hidden';
    const svg = document.importNode(doc.documentElement, true);
    host.appendChild(svg); document.body.appendChild(host);
    try {
      let vx = 0, vy = 0, vw = 0;
      const vb = svg.viewBox && svg.viewBox.baseVal;
      if (vb && vb.width) { vx = vb.x; vy = vb.y; vw = vb.width; }
      else vw = parseFloat(svg.getAttribute('width')) || CANVAS;
      const s = $('norm').checked ? CANVAS / vw : 1;
      const P = (x, y) => [fx((x - vx) * s), fx((y - vy) * s)];

      const circles = [], stars = [], lines = [];
      svg.querySelectorAll('circle').forEach(el => {
        const cx = +el.getAttribute('cx'), cy = +el.getAttribute('cy'), r = +el.getAttribute('r');
        if (!isFinite(cx + cy + r)) return;
        const [x, y] = P(cx, cy);
        if (r * s >= 25) circles.push([x, y, fx(r * s)]); else stars.push({ x, y });
      });
      svg.querySelectorAll('line').forEach(el => {
        const a = P(+el.getAttribute('x1'), +el.getAttribute('y1')), b = P(+el.getAttribute('x2'), +el.getAttribute('y2'));
        if (isFinite(a[0] + a[1] + b[0] + b[1])) lines.push([a[0], a[1], b[0], b[1]]);
      });
      svg.querySelectorAll('path, polygon').forEach(el => {
        let bb; try { bb = el.getBBox(); } catch (e) { return; }
        if (!bb.width || !bb.height || bb.width > 60 || bb.height > 60) return;
        const [x, y] = P(bb.x + bb.width / 2, bb.y + bb.height / 2);
        stars.push({ x, y });
      });
      return { circles, stars, lines };
    } finally { host.remove(); }
  }

  // ---------- Deteksi dari gambar raster (PNG/JPG/WebP) ----------
  // Alur: ambang terang -> Hough (gradien) untuk lingkaran -> hapus area lingkaran -> komponen terhubung:
  // gumpalan kecil = bintang, gumpalan memanjang = garis (ujung dari sumbu utama PCA).
  function otsu(lum) {
    const h = new Uint32Array(256); for (let i = 0; i < lum.length; i++) h[lum[i]]++;
    const tot = lum.length; let sum = 0; for (let i = 0; i < 256; i++) sum += i * h[i];
    let sB = 0, wB = 0, best = -1, bt = 128;
    for (let t = 0; t < 256; t++) {
      wB += h[t]; if (!wB) continue;
      const wF = tot - wB; if (!wF) break;
      sB += t * h[t];
      const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
      if (v > best) { best = v; bt = t; }
    }
    return bt;
  }
  function blur3(src, W, H) {
    const dst = new Float32Array(src.length);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      dst[i] = (src[i - W - 1] + src[i - W] + src[i - W + 1] + src[i - 1] + src[i] + src[i + 1] + src[i + W - 1] + src[i + W] + src[i + W + 1]) / 9;
    }
    return dst;
  }
  function boxSum5(src, W, H) {   // jumlah di jendela 5x5 (dua lintasan)
    const tmp = new Int32Array(src.length), dst = new Int32Array(src.length);
    for (let y = 0; y < H; y++) for (let x = 2; x < W - 2; x++) { const i = y * W + x; tmp[i] = src[i - 2] + src[i - 1] + src[i] + src[i + 1] + src[i + 2]; }
    for (let y = 2; y < H - 2; y++) for (let x = 0; x < W; x++) { const i = y * W + x; dst[i] = tmp[i - 2 * W] + tmp[i - W] + tmp[i] + tmp[i + W] + tmp[i + 2 * W]; }
    return dst;
  }
  function detectRaster() {
    const { W, H, M, lum } = R, N = W * H;
    const thr = +$('thr').value, inv = $('inv').checked;
    const k = M / CANVAS, s = $('norm').checked ? CANVAS / M : 1;
    const mask = new Uint8Array(N);
    for (let i = 0; i < N; i++) mask[i] = ((inv ? 255 - lum[i] : lum[i]) >= thr) ? 1 : 0;
    const rmin = Math.max(6, (parseFloat($('rmin').value) || 45) * k);

    const i = +n.dataset.i, nodes = [...pvs.querySelectorAll('.pn')], lit = x => x.classList.contains('lit');
    if (pvLocked(i)) { n.classList.remove('deny'); void n.getBoundingClientRect(); n.classList.add('deny'); setTimeout(() => n.classList.remove('deny'), 540); return; }   // spesial: tidak bisa dibuka sebelum semua rasi utama selesai
    if (SD && spSel[i] && treeProg(spSel[i])) { openSpirit(i); return; }   // spirit terpasang: buka overlay spirit + pohonnya
    pvSet(i, !lit(n));
    pvSync();   // spesial ikut padam bila ada rasi utama yang padam; perbarui status 'all' dan tampilan terkunci
  });
  $('pvBtn').addEventListener('click', openPreview);
  $('pvx').addEventListener('click', closePreview);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && pvo.classList.contains('open')) { if (pso.classList.contains('open')) closeSpirit(); else closePreview(); } });

  // ---------- Pengaturan ----------
  $('order').addEventListener('change', () => { if (mode) { build(); render(); } });
  $('norm').addEventListener('change', () => { if (mode) { build(); render(); } });
  let redoT = 0;
  const redo = () => { clearTimeout(redoT); redoT = setTimeout(() => { if (mode === 'img') { build(); render(); } }, 160); };
  ['thr', 'rmin', 'rmax'].forEach(id => $(id).addEventListener('input', redo));
  ['inv', 'uni'].forEach(id => $(id).addEventListener('change', redo));
  $('thr').addEventListener('input', () => { $('thrv').textContent = $('thr').value; });
  $('showimg').addEventListener('change', render);
  $('name').addEventListener('input', () => { nameTouched = true; syncNameSel(); });
  $('special').addEventListener('input', () => { spManual = true; $('spnote').textContent = ''; applyLeader(); });
  // ---------- Pilihan nama rasi: rasi utama (realm) + rasi season dari skygame-data, atau tulis sendiri ----------
  const REALM_FALLBACK = ['Isle of Dawn', 'Daylight Prairie', 'Hidden Forest', 'Valley of Triumph', 'Golden Wasteland', 'Vault of Knowledge'];   // dipakai bila realms.json gagal diunduh
  const nmKey = v => String(v || '').trim().replace(/[^\w]+/g, '_');
  function syncNameSel() {
    const sel = $('nameSel'), cur = nmKey($('name').value);
    const hit = [...sel.options].find(o => o.value && nmKey(o.value) === cur);
    sel.value = hit ? hit.value : '';
  }
  function fillNameSel(realms, seasons) {
    const sel = $('nameSel'); sel.innerHTML = '<option value="">Tulis sendiri…</option>';
    const group = (label, names) => {
      if (!names.length) return;
      const g = document.createElement('optgroup'); g.label = label;
      names.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; g.appendChild(o); });
      sel.appendChild(g);
    };
    group('Rasi utama', realms); group('Rasi season', seasons);
    syncNameSel();
  }
  const namesOf = a => [...new Set(a.map(x => String((x && (x.name || x.shortName)) || '').trim()).filter(Boolean))];
  async function loadNames() {
    let realms = REALM_FALLBACK, seasons = [], note = '';
    fillNameSel(realms, seasons);
    try { const raw = await getJson('realms'), r = namesOf(raw); if (r.length) { realms = r; raw.forEach(x => nmAdd('realm', x)); } else note = 'Data realm kosong, memakai daftar bawaan.'; } catch (e) { note = 'Daftar realm gagal diunduh, memakai daftar bawaan.'; }
    try { const raw = await getJson('seasons'); seasons = namesOf(raw); raw.forEach(x => nmAdd('season', x)); if (!seasons.length) note += ' Daftar season kosong.'; } catch (e) { note += ' Daftar season gagal diunduh.'; }
    fillNameSel(realms, seasons); $('nmnote').textContent = note.trim();
    if (!nameTouched) pickNameFromHint();
  }
  $('nameSel').addEventListener('change', () => {
    nameTouched = true;
    const v = $('nameSel').value;
    if (v) { $('name').value = v; applyLeader(); } else { $('name').focus(); $('name').select(); }
  });
  // ---------- Lingkaran spesial = spirit Elder (rasi utama) atau Guide (rasi season) sesuai nama rasi ----------
  const nameMap = new Map();   // kunci nama -> { kind: 'realm' | 'season', ent, name }
  function nmAdd(kind, ent) { const n = String((ent && (ent.name || ent.shortName)) || '').trim(); if (n) nameMap.set(nmKey(n), { kind, ent, name: n }); }
  const refGuid = v => (v && typeof v === 'object') ? v.guid : v;
  const typeIs = (sp, re) => re.test(String(sp.type || ''));
  const tokensOf = n => String(n || '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 4);
  let areaRealm = null;   // guid area -> guid realm
  async function loadAreaRealm() {
    if (areaRealm) return;
    areaRealm = new Map();
    try { (await getJson('areas')).forEach(a => areaRealm.set(a.guid, refGuid(a.realm))); } catch (e) {}
  }
  function leaderOf(hit) {
    if (!SD) return null;
    const L = SD.spirits, ent = hit.ent;
    if (hit.kind === 'season') {
      const guides = L.filter(x => typeIs(x, /guide/i)), list = Array.isArray(ent.spirits) ? ent.spirits.map(refGuid) : [];
      return guides.find(x => refGuid(x.season) === ent.guid) || guides.find(x => x.guid === refGuid(ent.guide)) || guides.find(x => list.includes(x.guid)) || null;
    }
    const elders = L.filter(x => typeIs(x, /elder/i)), tk = tokensOf(hit.name).concat(tokensOf(ent.shortName));
    return elders.find(x => refGuid(x.realm) === ent.guid)
      || elders.find(x => areaRealm && areaRealm.get(refGuid(x.area)) === ent.guid)
      || elders.find(x => tk.some(w => String(x.name || '').toLowerCase().includes(w))) || null;
  }
  function leaderForSpecial() {
    const spN = parseInt($('special').value, 10), idx = spN >= 1 && spN <= C.length ? spN - 1 : -1;
    const hit = nameMap.get(nmKey($('name').value));
    if (idx < 0 || !hit) return null;   // tanpa lingkaran spesial, atau nama tulis sendiri: tidak diubah
    const sp = leaderOf(hit);
    return sp ? { idx, s: sp, hit } : { idx, s: null, hit };
  }
  const ldText = ld => ld.s ? 'Lingkaran spesial ' + (ld.idx + 1) + ': ' + (ld.hit.kind === 'season' ? 'guide season ' : 'elder ') + ld.hit.name + ' = ' + ld.s.name + '.'
    : 'Spirit ' + (ld.hit.kind === 'season' ? 'guide' : 'elder') + ' untuk "' + ld.hit.name + '" tidak ditemukan di data; pilih spirit lingkaran spesial secara manual.';
  // CATATAN: ikon lingkaran spesial (lambang/bendera di tengah) sengaja belum otomatis. Sumber gambarnya akan disambungkan nanti
  // ke direktori web pemilik (kondisi khusus), jadi sementara dipakai potongan gambar asli atau gambar spirit Elder/Guide di atas.
  async function applyLeader() {
    const note = $('ldnote'); note.textContent = '';
    if (!parseInt($('special').value, 10) || !nameMap.has(nmKey($('name').value))) return;
    try {
      await loadSD(); await loadAreaRealm();
      const ld = leaderForSpecial(); if (!ld) return;
      note.textContent = ldText(ld);
      if (!ld.s) return;
      spSel[ld.idx] = ld.s.guid;
      if (mode === 'img') paintSpirits();
     
    } catch (err) { note.textContent = 'Gagal memuat data spirit: ' + err.message; }
  }
  $('name').addEventListener('change', applyLeader);
  // ---------- Nama sementara dari kata kunci nama file / link gambar ----------
  let nameHint = '', srcHint = '', nameTouched = false;
  const HINT_STOP = new Set(['of', 'the', 'and', 'season', 'seasons', 'rasi', 'realm', 'constellation', 'icon', 'image', 'img', 'png', 'jpg', 'jpeg', 'webp', 'svg', 'file', 'new', 'baru', 'revision', 'latest']);
  const splitWords = t => String(t || '').replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  function pickNameFromHint() {
    if (!nameHint || !nameMap.size) return false;
    const all = splitWords(nameHint), flat = all.join(''), hw = new Set(all.filter(w => !HINT_STOP.has(w)));
    const near = w => w.length >= 5 && [...hw].some(h => h.length >= 5 && (h.startsWith(w) || w.startsWith(h)));
    let best = null, bs = 0;
    nameMap.forEach(v => {
      [v.name, v.ent && v.ent.shortName].forEach(label => {
        const words = splitWords(label), ew = words.filter(w => !HINT_STOP.has(w));
        if (!ew.length) return;
        const phrase = words.join('').length >= 5 && flat.includes(words.join(''));
        const hit = ew.filter(w => hw.has(w) || near(w)), hl = hit.reduce((a, w) => a + w.length, 0);
        if (!phrase && !hit.some(w => w.length >= 4)) return;   // butuh kata khas (>= 4 huruf) atau frasa utuh
        const sc = (phrase ? 10 : 0) + hl / ew.reduce((a, w) => a + w.length, 0);
        if (sc > bs) { bs = sc; best = v; }
      });
    });
    if (!best) return false;
    $('name').value = best.name; syncNameSel();
    $('nmhint').textContent = 'Nama dipilih sementara dari kata kunci file/link: ' + best.name + (best.kind === 'season' ? ' (season)' : ' (rasi utama)') + '. Ganti lewat dropdown bila salah.';
    applyLeader();
    return true;
  }
  // ---------- Tampilan editor: dropdown dan ukuran kanvas ----------
  // kartu dropdown dan menu bentuk menutup sendiri saat area lain ditekan
  document.addEventListener('pointerdown', e => {
    const path = e.composedPath();
    document.querySelectorAll('details.panel[open]').forEach(d => { if (!path.includes(d)) d.removeAttribute('open'); });
    if (!path.includes($('addMenu')) && !path.includes($('addMore'))) closeAddMenu();
  });
  // ukuran kanvas: seret sudut kanan bawah, selalu tetap kotak
  const setCv = px => document.documentElement.style.setProperty('--cv', Math.max(260, Math.min(1100, Math.round(px))) + 'px');
  $('cvh').addEventListener('pointerdown', e => {
    e.preventDefault();
    const h = $('cvh'), x0 = e.clientX, y0 = e.clientY, w0 = $('pvbox').getBoundingClientRect().width;
    h.setPointerCapture(e.pointerId);
    const mv = ev => setCv(w0 + ((ev.clientX - x0) + (ev.clientY - y0)) / 2);
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
  render();
  loadNames();
})();
</script>
<script>
(() => {
  // Ikon "!" di samping tiap field: tooltip tunggal, hover di perangkat dengan mouse, ketuk di layar sentuh.
  const tip = document.createElement('div'); tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  const canHover = matchMedia('(hover: hover)').matches;
  let cur = null, pinned = false;
  function show(b) {
    if (cur && cur !== b) cur.setAttribute('aria-expanded', 'false');
    cur = b; pinned = false; b.setAttribute('aria-expanded', 'true');
    tip.textContent = b.dataset.tip; tip.classList.add('open');
    const r = b.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
    tip.style.top = (r.bottom + 8 + h > innerHeight - 8 ? Math.max(8, r.top - h - 8) : r.bottom + 8) + 'px';
  }
  function hide() { if (cur) cur.setAttribute('aria-expanded', 'false'); cur = null; pinned = false; tip.classList.remove('open'); }
  document.addEventListener('click', e => {
    const b = e.target.closest('.inf');
    if (!b) { hide(); return; }
    e.preventDefault(); e.stopPropagation();
    if (cur === b && pinned) hide(); else { show(b); pinned = true; }
  });
  document.addEventListener('mouseover', e => { if (!canHover) return; const b = e.target.closest('.inf'); if (b && !pinned) show(b); });
  document.addEventListener('mouseout', e => { if (canHover && !pinned && e.target.closest('.inf')) hide(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  addEventListener('scroll', hide, true); addEventListener('resize', hide);
})();
</script>
