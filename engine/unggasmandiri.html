<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><base target="_top">
<title>Administrasi Unggas Mandiri</title>
<style>
:root{--c:#0f766e;--bg:#f6f7f8;--b:#e4e7ea;--t:#1c2024;--m:#6b7480;--y:#ffd966}
*{box-sizing:border-box}
/* sembunyikan semua scrollbar (tetap bisa di-scroll) */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar,::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}
header{background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700;font-size:15px}
.brand .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm{width:30px;height:30px;flex:none;fill:var(--c)}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 10px}
nav button{border:0;background:none;padding:10px 12px;color:var(--m);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font:inherit}
nav button.on{color:var(--c);border-color:var(--c);font-weight:600}
main{max-width:1020px;margin:20px auto;padding:0 16px 60px}
h2{margin:0 0 14px;font-size:17px}
.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0}.st b{display:block;font-size:20px;margin-top:2px}.st span,.mu{color:var(--m);font-size:12px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--m);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;font:inherit;background:#fff;color:var(--t)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:1px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--b);vertical-align:middle}
th{font-size:12px;color:var(--m);font-weight:600}
.r{text-align:right}.tw{overflow-x:auto}
button.p,button.s{padding:8px 14px;border-radius:8px;border:1px solid var(--c);cursor:pointer;font:inherit}
button.p{background:var(--c);color:#fff}button.s{background:#fff;color:var(--c)}
button.x{border-color:#d9a0a0;color:#a33}button.sm{padding:4px 9px;font-size:12px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;white-space:nowrap}
.ok{background:#dcf5ec;color:#116149}.no{background:#fdeaea;color:#9b2c2c}
.bar{display:flex;align-items:flex-end;gap:10px;height:140px}
.bar div{flex:1;text-align:center;font-size:11px;color:var(--m);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;background:var(--c);border-radius:4px 4px 0 0;min-height:2px}
.bar+.mu{margin-top:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.row input{max-width:280px}.sp{flex:1}
.empty{color:var(--m);padding:18px;text-align:center}
dialog{border:0;border-radius:12px;padding:20px;width:min(440px,92vw);box-shadow:0 10px 40px #0003}
dialog::backdrop{background:#0006}
#pr{display:none}
.hd1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 2px 16px}
.ib{flex:none;width:40px;height:40px;border:1px solid var(--b);background:var(--bg);cursor:pointer;color:var(--m);padding:0;margin:0;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,border-color .2s,transform .12s}
.ib:hover{background:#e6f4f2;color:var(--c);border-color:var(--c)}
.ib svg{width:20px;height:20px;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.ib:hover svg{transform:rotate(90deg)}.ib:active{transform:scale(.92)}
#ovw{position:fixed;inset:0;z-index:30;background:#0007;display:none;padding:2vh 2vw}
#ovw.on{display:flex}
#ov{background:var(--bg);border-radius:12px;width:100%;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px #0004;overflow:hidden}
.ovh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid var(--b)}
.ovh h2{margin:0}
.ovb{flex:1;overflow-y:auto;padding:8px 16px 16px}
.ovf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:#fff;border-top:1px solid var(--b)}
#ds{width:min(560px,94vw)}
#cf{width:min(380px,92vw)}
#toast{position:fixed;inset:auto auto 90px 50%;transform:translateX(-50%);margin:0;border:0;background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;font-size:14px;z-index:60}
.jn{background:#eef1f3;color:#444}
#dl td:nth-child(-n+2),#dl td.r{white-space:nowrap}
@media(min-width:701px){#dt th,#dt td{padding:8px 4px}#dt td:last-child{padding-right:0}}
#bt{display:none}

/* ---------- Loading screen ---------- */
#ld{position:fixed;inset:0;z-index:99;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,visibility .5s}
#ld.out{opacity:0;visibility:hidden}
.ring{position:relative;width:176px;height:176px}
.ring .rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--b)}.ring .fg{stroke:var(--c);stroke-linecap:round}
#ld .lg{position:absolute;left:50%;top:50%;width:108px;height:108px;margin:-54px 0 0 -54px;overflow:visible}
.lg path{fill:none;stroke:var(--c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:dr var(--u) linear var(--d) forwards,so .6s ease var(--f) forwards}
.lg path.lf{fill:var(--c);fill-opacity:0;stroke:none;stroke-dasharray:none;stroke-dashoffset:0;animation:fi .8s ease var(--f) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes so{to{stroke-opacity:0}}
@keyframes fi{to{fill-opacity:1}}
#ld .nm{font-weight:700;font-size:21px;line-height:1.25;text-align:center;margin-top:2px}
#ld .ln{font-size:13px;color:var(--m);min-height:20px;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.lg path{animation:none;stroke-dashoffset:0;stroke-opacity:0}.lg path.lf{animation:none;fill-opacity:1}#ld{transition:none}}

/* ---------- Animasi ---------- */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes gr{from{transform:scaleY(0)}}
@keyframes bf{from{opacity:0}}
@keyframes dz{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes hd{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes bp{0%{transform:scale(.75)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
header{animation:hd .55s cubic-bezier(.2,.9,.3,1) both}
.bm{animation:pop .6s cubic-bezier(.3,1.5,.5,1) .15s both}
nav button{transition:color .2s,border-color .2s,background .2s}
nav button:hover{color:var(--c);background:#f1f9f8;border-radius:8px 8px 0 0}
#bt button svg{transition:transform .2s}#bt button.on svg{animation:bp .45s ease}
button{transition:transform .12s,background .2s,box-shadow .2s,color .2s,border-color .2s}
button:active{transform:scale(.96)}
button.p:hover{box-shadow:0 4px 14px #0f766e55;transform:translateY(-1px)}
button.s:hover{background:#f1f9f8}
button.x:hover{background:#fdeaea}
input,select,textarea{transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px #0f766e22}
.card{transition:box-shadow .25s,transform .25s}
.grid .card:hover{box-shadow:0 6px 20px #0f766e1a;transform:translateY(-2px)}
tbody tr{transition:background .15s}tbody tr:hover{background:#f6fbfa}
.bar i{transform-origin:bottom;transition:filter .2s}.bar div:hover i{filter:brightness(1.2)}
#v.fr .card{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
#v.fr tbody tr{animation:up .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*28ms + 120ms)}
#v.fr .tag{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both .35s}
#v.fr .bar i{animation:gr .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*80ms + 250ms)}
dialog[open]{animation:dz .3s cubic-bezier(.2,.9,.3,1.1)}
dialog[open]::backdrop{animation:bf .25s}
#ovw.on{animation:bf .25s}#ovw.on #ov{animation:sl .38s cubic-bezier(.2,.9,.3,1)}
#ov .paper{animation:up .5s cubic-bezier(.2,.8,.2,1) .1s both}
#ov .ovh{animation:up .4s ease both}
#toast:popover-open,#toast[style*="block"]{animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.seg button{transition:background .2s,color .2s}
.tg{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;font-size:14px;color:var(--t);cursor:pointer}
.tg input{width:42px;height:24px;min-height:0;appearance:none;-webkit-appearance:none;background:#cfd6db;border:0;border-radius:99px;position:relative;cursor:pointer;padding:0;flex:none}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg input:checked{background:var(--c)}.tg input:checked::after{transform:translateX(18px)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ---------- Form nota (meniru tampilan cetak) ---------- */
.seg{display:inline-flex;border:1px solid var(--b);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;font:inherit;cursor:pointer;color:var(--m)}
.seg button.on{background:var(--c);color:#fff;font-weight:600}
.paper{background:#fff;border:1px solid var(--b);border-radius:6px;padding:26px 28px 22px;max-width:860px;margin:12px auto 16px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:14px;color:#000;box-shadow:0 1px 4px #0001}
.paper label{color:#000;font-size:14px;margin:0}
.paper input,.paper textarea{border:0;border-radius:0;background:transparent;padding:4px 5px;color:#000}
.paper input:hover,.paper textarea:hover{background:#f1f9f8}
.ph{text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px}
.ph svg{width:64px;height:64px;display:block;margin:0 auto}
.ph svg path{fill:#000;fill-opacity:1;stroke:none;animation:none;stroke-dasharray:none;stroke-dashoffset:0}
.ph .lt{font-size:9px;letter-spacing:.16em;margin:2px 0 6px}
.ph h3{margin:0;font-size:20px}
.ph b{display:block;font-size:15px;line-height:1.3;margin-top:8px}
.ph small{display:block;font-size:10.5px;margin-top:3px}
.pm{display:grid;grid-template-columns:84px 1fr;gap:3px 6px;align-items:center;margin-bottom:16px;max-width:460px}
.fl{display:flex;align-items:center}.fl>b{font-weight:400}.fl input{border-bottom:1px dashed #b8c0c6}
.gh2{display:flex;align-items:center;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.gh2 .ab{font-weight:700}.gh2 .gname{font-weight:700;flex:1;min-width:140px;border-bottom:1px dashed #b8c0c6}
.gsm{display:none}
.ft{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:6px}
.ft th,.ft td{border:1px solid #555;padding:0;font-size:14px;color:#000;vertical-align:middle}
.ft th{padding:3px 4px;text-align:center;font-size:13px;color:#000;font-weight:700}
.ft td.c input{text-align:center}.ft td.rt input,.ft td.rt{text-align:right}
.ft td.rt:not(:has(input)){padding:0 6px}
.ft td.no{text-align:center;padding:0 4px}
.ft td.gj{text-align:center;padding:0 6px;font-weight:600}
.ft .dl{border:0!important;width:44px;text-align:right;padding-left:4px}
.ft th.dl{border:0}
.ft td.gj .ac2{display:flex;align-items:center;gap:6px;justify-content:center}
.ft td.gj input{text-align:right;width:110px}
.sr{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:3px 0}
.sr .sl{font-weight:700}
.yb{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:210px;padding:2px 8px;border:1px solid #555;font-weight:700}
.yb.y{background:var(--y)}
.yb input{text-align:right;width:130px;font-weight:700}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pk label{font-weight:700;margin-bottom:2px}
.pk textarea{border:1px dashed #b8c0c6;width:100%;resize:vertical}

@media(max-width:700px){
header nav{display:none}
#ovw{padding:0}#ov{border-radius:0}
.ovh{padding-top:calc(12px + env(safe-area-inset-top))}.ovf{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.ovf button{flex:1}
.ovh h2{flex:1}.ovh .sp{display:none}.ovh .seg{order:3;flex:1 0 100%}.ovh .seg button{flex:1}
.row.dn h2{flex:1 0 100%}.row.dn .sp{display:none}.row.dn input{flex:1 1 0;min-width:0}
main{margin:12px auto 90px;padding:0 12px}
input,select,textarea{font-size:16px;min-height:42px}
button.p,button.s{min-height:42px}button.sm{min-height:34px}
.card{padding:14px}
#bt{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--b);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
#bt button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 9px;color:var(--m);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#bt svg{width:22px;height:22px}#bt button.on{color:var(--c);font-weight:600}
.rs thead{display:none}
.rs tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--b)}
.rs td{display:block;border:0;padding:0;min-width:0}
.rs td[data-l]:not([data-l=""])::before{content:attr(data-l);display:block;font-size:11px;color:var(--m)}
.rs td.r{text-align:left}.rs td:last-child{grid-column:1/-1;text-align:right}.rs td.empty::before{display:none}
.rs input{width:100%!important;min-width:0!important}
.row input{max-width:none;flex:1 1 100%}
/* form nota di HP */
.paper{padding:16px 14px}
.pm{grid-template-columns:76px 1fr}
.ft thead{display:none}
.ft,.ft tbody{display:block}
.ft tr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;padding:10px 8px;border:1px solid #555;margin-bottom:8px;position:relative}
.ft td{border:0;display:block;min-width:0}
.ft td[data-l]:not([data-l=""])::before{content:attr(data-l);display:block;font-size:11px;color:var(--m)}
.ft td input{border:1px solid var(--b);border-radius:6px;min-height:38px}
.ft td.no,.ft td.gj{display:none}
.ft td.nm{grid-column:1/-1}
.ft td.rt:not(:has(input)){padding:0}
.ft td.dl{grid-column:1/-1;width:auto}
.gsm{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.gsm input{width:140px;text-align:right;border:1px solid var(--b)}
.pk{grid-template-columns:1fr}
.sr{justify-content:space-between}
.yb{flex:1;max-width:240px}
}

/* ---------- Cetak ---------- */
@media print{body{background:#fff}header,main,dialog,#bt,#ld,#ovw{display:none!important}#pr{display:block}}
</style></head>
<body>
<div id="ld" role="status" aria-live="polite">
  <div class="ring"><svg class="rg" viewBox="0 0 128 128" aria-hidden="true"><circle class="bg" cx="64" cy="64" r="58"/><circle class="fg" id="ldr" cx="64" cy="64" r="58" stroke-dasharray="364.42" stroke-dashoffset="364.42"/></svg><svg class="lg" id="lgl" viewBox="0 0 100 100" aria-hidden="true"></svg></div>
  <div class="nm">Administrasi<br>Unggas Mandiri</div>
  <div class="ln"><span id="ldt">Menyiapkan aplikasi…</span> <b id="ldn">0</b>%</div>
</div>
<header><div class="hd1"><div class="brand" id="bn"><span class="bt">Administrasi Unggas Mandiri</span></div><button class="ib" onclick="openSet()" aria-label="Pengaturan" title="Pengaturan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
<nav>
<button data-p="dash">Dashboard</button><button data-p="daftar">Daftar Nota</button>
<button data-p="bayar">Tagihan</button><button data-p="barang">Barang</button><button data-p="pel">Pelanggan</button>
</nav></header>
<main id="v"><div class="empty">Memuat data…</div></main>
<div id="bt"><button data-p="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></svg>Beranda</button><button data-p="daftar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>Nota</button><button data-p="bayar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>Tagihan</button><button data-p="barang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>Barang</button><button data-p="pel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/></svg>Pelanggan</button></div>
<dialog id="dg"></dialog><dialog id="ds"></dialog><dialog id="cf"></dialog><div id="toast" popover="manual" role="status"></div>
<div id="ovw"><div id="ov"></div></div>
<div id="pr"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Number(v)||0, id=v=>Number(String(v).replace(/\D/g,''))||0;
const rp=n=>'Rp '+num(n).toLocaleString('id-ID'), nf=n=>num(n).toLocaleString('id-ID');
const nc=n=>num(n).toLocaleString('en-US'); /* format angka di cetakan: 1,000,000 */
const sum=a=>a.reduce((s,r)=>s+num(r.q)*num(r.h),0);
const tgl=d=>d?String(d).split('-').reverse().join('-'):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

const SFX=(()=>{
  let c,on=true,last=0;try{on=localStorage.getItem('snd')!=='0'}catch(e){}
  const ctx=()=>{if(!c){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;c=new A()}if(c.state==='suspended')c.resume();return c};
  function tone(f,t,d,type,v,f2){
    const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
    o.type=type||'sine';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
    g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.06,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.03);
  }
  const P={
    tap:()=>tone(900,0,.05,'sine',.05),
    nav:()=>{tone(520,0,.07,'triangle',.06);tone(780,.05,.09,'triangle',.05)},
    open:()=>tone(330,0,.15,'sine',.06,660),
    close:()=>tone(660,0,.12,'sine',.05,330),
    ok:()=>{tone(660,0,.12,'sine',.07);tone(880,.09,.12,'sine',.07);tone(1320,.18,.24,'sine',.06)},
    err:()=>{tone(220,0,.2,'square',.035,140);tone(200,.12,.2,'square',.03,120)},
    del:()=>tone(440,0,.2,'triangle',.07,160),
    done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28,'sine',.06))
  };
  return{p(n){if(!on)return;if(n!=='close')last=Date.now();try{P[n]()}catch(e){}},get on(){return on},get last(){return last},set(v){on=v;try{localStorage.setItem('snd',v?'1':'0')}catch(e){}}};
})();

function pdoc(n){

    w.document.open();w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>${esc(no)}</title><style>${PCSS}body{margin:0}</style></head><body>${pdoc(n)}</body></html>`);w.document.close();
    setTimeout(()=>{try{w.focus();w.print()}catch(e){}},400);return;
  }catch(e){try{w.close()}catch(_){}}}
  $('#pr').innerHTML=pdoc(n);const t=document.title;document.title=no;
  setTimeout(()=>{window.print();document.title=t},200);
}
