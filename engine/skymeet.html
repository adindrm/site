  }
  $('fBack').addEventListener('click', () => { $('friendOverlay').classList.remove('open'); curFriend = null; });
  $('fSave').addEventListener('click', () => {
    if(!curFriend) return;
    curFriend.name = ($('fName').value || '').trim().slice(0, 20);
    saveFriends(); renderFriends(); $('fTitle').textContent = fLabel(curFriend);
    toast(vt().saved); SFX.success();
  });
  $('fRemove').addEventListener('click', () => {
    if(!curFriend || !confirm(vt().rm.replace('{n}', fLabel(curFriend)))) return;
    friendsCache = friendsCache.filter(x => x !== curFriend); saveFriends(); renderFriends();
    $('friendOverlay').classList.remove('open'); curFriend = null;
  });
  $('fChat').addEventListener('click', () => { if(curFriend) openChat(curFriend); });

  // ---------- chat ----------
  const pairId = (a,b) => [a,b].sort().join('__');
  let chatPid = null, chatRaw = null;
  function chatKey(pid){ return 'sky_chat_' + pid; }
  function openChat(friend){
    $('chatTitle').textContent = fLabel(friend);
    $('chatOverlay').classList.add('open');
    chatPid = pairId(myCode, friend.code); chatRaw = null;
    renderChat(); updateChatSub();
    setTimeout(() => $('chatInput').focus(), 350);
  }
  const readMsgs = pid => { try{ const m = JSON.parse(localStorage.getItem(chatKey(pid)) || '[]'); return Array.isArray(m) ? m : []; }catch(e){ return []; } };
  function renderChat(){
    const raw = localStorage.getItem(chatKey(chatPid)) || '[]';
    if(raw === chatRaw) return;   // tidak ada pesan baru: jangan gambar ulang
    chatRaw = raw;
    const msgsEl = $('chatMsgs'); msgsEl.innerHTML = '';
    readMsgs(chatPid).forEach(m => {
      const d = document.createElement('div');
      d.className = 'msg ' + (m.from === myCode ? 'me' : 'them');
      d.textContent = m.text;
      msgsEl.appendChild(d);
    });
    msgsEl.scrollTop = msgsEl.scrollHeight;
    markRead();
  }
  // sinkron: bila SkyVisitAdapter.fetchMessages(pid) tersedia (backend), pesan server digabung ke lokal
  async function syncChat(){
    if(!chatPid) return;
    const pid = chatPid, ad = window.SkyVisitAdapter;
    if(ad && typeof ad.fetchMessages === 'function'){
      try{
        const remote = await ad.fetchMessages(pid);
        if(chatPid === pid && Array.isArray(remote)){
          const loc = readMsgs(pid), seen = new Set(loc.map(m => m.ts + '|' + m.from + '|' + m.text));
          remote.forEach(m => { if(m && m.text && !seen.has(m.ts + '|' + m.from + '|' + m.text)) loc.push(m); });
          loc.sort((x, y) => x.ts - y.ts);
          localStorage.setItem(chatKey(pid), JSON.stringify(loc.slice(-200)));
        }
      }catch(e){}
    }
    if(chatPid === pid) renderChat();
  }
  window.addEventListener('storage', e => { if(chatPid && e.key === chatKey(chatPid)) renderChat(); });   // pesan dari tab/akun lain di browser ini
  setInterval(syncChat, 2500);
  $('chatBack').addEventListener('click', () => { $('chatOverlay').classList.remove('open'); chatPid = null; renderFriends(); updateChatSub(); });
  $('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('chatInput'), text = input.value.trim();
    if(!text || !chatPid) return;
    input.value = ''; SFX.send();
    const msgs = readMsgs(chatPid), msg = { from: myCode, text, ts: Date.now() };
    msgs.push(msg);
    if(msgs.length > 200) msgs.splice(0, msgs.length - 200);
    localStorage.setItem(chatKey(chatPid), JSON.stringify(msgs));
    renderChat();
    const ad = window.SkyVisitAdapter;
    if(ad && typeof ad.sendMessage === 'function'){ try{ ad.sendMessage(chatPid, msg); }catch(err){} }
  });

  // ---------- tambah teman ----------
  async function submitAdd(){
    const ci = $('addFriendInput'), ni = $('addFriendName');
    if(await addFriendByCode(ci.value, ni.value)){ ci.value = ''; ni.value = ''; }
  }
  $('addFriendBtn').addEventListener('click', submitAdd);
  ['addFriendInput', 'addFriendName'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key === 'Enter') submitAdd(); }));
  $('copyIdBtn').addEventListener('click', () => {
    if(!myCode) return;
    (navigator.clipboard?.writeText(myCode) || Promise.reject()).then(() => { toast(vt().copied); SFX.tap(); }).catch(() => {});
  });

  // ---------- nama sendiri ----------
  // Disimpan per akun ('sky_myname_<uid>'). Default: username akun, atau "Guest" untuk tamu. Dipakai juga di sapaan beranda.
  let editingName = false;
  function dispName(uid){
    const c = uid ? lsGet('sky_myname_' + uid) : null;
    if(c) return c;
    return uid && uid.indexOf('guest_') === 0 ? vt().guestName : (uid || '');
  }
  function renderMyName(){
    const v = vt(), val = $('myNameVal'), inp = $('myNameInput'), btn = $('myNameBtn');
    if(!val) return;
    val.textContent = myUid ? dispName(myUid) : '';
    val.hidden = editingName; inp.hidden = !editingName;
    btn.textContent = editingName ? v.save : v.edit;
    inp.placeholder = v.name;
  }
  function saveMyName(){
    if(!myUid) return;
    const n = ($('myNameInput').value || '').trim().slice(0, 20);
    if(n) lsSet('sky_myname_' + myUid, n); else lsDel('sky_myname_' + myUid);
    editingName = false; renderMyName();
    window.SkyApp.setUser(dispName(myUid), myUid);   // perbarui sapaan di beranda
    if(SKY_API && myToken()) api('updateProfile', { name: n || myUid });
    toast(vt().saved); SFX.success();
  }
  $('myNameBtn').addEventListener('click', () => {
    if(!myUid) return;
    if(editingName){ saveMyName(); return; }
    editingName = true; $('myNameInput').value = lsGet('sky_myname_' + myUid) || ''; renderMyName(); $('myNameInput').focus();
  });
  $('myNameInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') saveMyName();
    else if(e.key === 'Escape'){ editingName = false; renderMyName(); }
  });


  // ===== profil, kehadiran, lambaian, notifikasi, upgrade tamu =====
  // Mode lokal (SKY_API kosong): semua jalan di browser ini. Mode server: isi SKY_API dengan URL web app Apps Script (lihat Code.gs).
  const SKY_API = 'https://script.google.com/macros/s/AKfycbzlrUGOvvCiu5UPB1aiFbDjW1fYKilyBabltRYRbtrdMiiUuUZPlexjY4QNU4fqb_jFWw/exec';
  const TOKEN_KEY = 'sky_token';
  const tokenKey = uid => TOKEN_KEY + '_' + uid;   // satu token per akun
  const myToken = () => (myUid ? lsGet(tokenKey(myUid)) : null);
  let authFails = 0, netGen = 0;
  const AVATARS = ['🌙', '⭐', '☁️', '🦋', '🐋', '🕯️', '🌸', '🍃', '❄️', '🔥', '☀️', '🪽'];
  const tzNow = () => -new Date().getTimezoneOffset();
  const profKey = uid => 'sky_prof_' + uid;
  const defProf = () => ({ avatar: AVATARS[0], status: '', vis: 'friends', mute: false, email: '' });
  const readProf = uid => { try{ return Object.assign(defProf(), JSON.parse(lsGet(profKey(uid)) || '{}')); }catch(e){ return defProf(); } };
  let prof = defProf(), meta = {}, typingMap = {}, since = 0, pollTimer = null, lastUnread = 0, lastType = 0, lastTypeSend = 0;

  async function api(action, data, uid){   // uid opsional: pakai token akun itu (mis. saat simpan data tertunda)
    if(!SKY_API) return { ok:false, error:'off' };
    try{
      const r = await fetch(SKY_API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: (uid || myUid) ? (lsGet(tokenKey(uid || myUid)) || '') : '' }, data || {})) });
      return await r.json();
    }catch(e){ return { ok:false, error:'net' }; }
  }
  if(SKY_API){   // progres akun & data teman lewat server
    window.SkyApp.store.useAdapter({
      load: id => lsGet(tokenKey(id)) ? api('getData', null, id).then(r => (r.ok ? r.data : null)) : null,
      save: (id, snap) => lsGet(tokenKey(id)) ? api('saveData', { data: snap }, id) : null
    });
    window.SkyVisitAdapter = {
      exists: async code => { const r = await api('exists', { code }); return !!(r.ok && r.exists); },
      sendMessage: (pid, msg) => api('send', { to: pid.split('__').find(c => c !== myCode), text: msg.text, ts: msg.ts }),
      getFriendProgress: async code => { const r = await api('progressOf', { code }); return r.ok ? (r.denied ? { __denied:true } : r.pg) : null; }
    };
  }
  function hydrate(u, r){   // hasil login/daftar server -> tulis ke penyimpanan lokal, lalu enterApp memakainya
    lsSet(tokenKey(u), r.token); lsSet('sky_code_' + u, r.code); lsSet('sky_friends_' + u, JSON.stringify(r.friends || []));
    lsSet(profKey(u), JSON.stringify(Object.assign(readProf(u), r.profile || {}, { email: r.email || '' })));
    if(r.profile && r.profile.name) lsSet('sky_myname_' + u, r.profile.name);
  }
  function moveAccount(from, to){
    ['sky:v1:u:', 'sky_friends_', 'sky_myname_', 'sky_prof_', 'sky_code_', 'sky_token_'].forEach(pfx => { const v = lsGet(pfx + from); if(v !== null){ lsSet(pfx + to, v); lsDel(pfx + from); } });
  }

  // ----- profil -----
  function saveProf(patch, push){
    Object.assign(prof, patch); lsSet(profKey(myUid), JSON.stringify(prof));
    window.SkyMuted = !!prof.mute; paintProf();
    if(push && SKY_API && myToken()){ const o = Object.assign({}, patch); delete o.mute; api('updateProfile', o); }
  }
  function paintProf(){
    if(!$('avBtn')) return;
    const v = vt(), acct = !!(mySession && mySession.type === 'account' && !BUILTIN[myUid]);
    $('avBtn').textContent = prof.avatar;
    $('profUser').textContent = acct ? '@' + myUid : '';
    if(document.activeElement !== $('stIn')) $('stIn').value = prof.status || '';
    $('visSel').value = prof.vis;
    $('muteBtn').textContent = v.mute + ': ' + (prof.mute ? v.muteOn : v.muteOff); $('muteBtn').setAttribute('aria-pressed', String(!!prof.mute));
    document.querySelectorAll('#avGrid button').forEach(b => b.setAttribute('aria-pressed', String(b.textContent === prof.avatar)));
    $('accSec').hidden = !acct; $('upSec').hidden = !(mySession && mySession.type === 'guest');
    $('accNote').hidden = !!SKY_API; ['accUser', 'accEmail', 'accPwOld', 'accPwNew', 'accSave'].forEach(id => { $(id).disabled = !SKY_API; });
    if(document.activeElement !== $('accUser')) $('accUser').value = myUid || '';
    if(document.activeElement !== $('accEmail')) $('accEmail').value = prof.email || '';
  }
  function applyProfLang(){
    const v = vt(), set = (id, t) => { const e = $(id); if(e) e.textContent = t; };
    set('setT', v.settings); set('avT', v.avT); set('visT', v.visT); set('accT', v.accT); set('upT', v.upT); set('friendsT', v.friendsT);
    set('accSave', v.accSave); set('upBtn', v.upBtn); set('accNote', v.noSrv);
    const o = $('visSel').options; o[0].textContent = v.vPub; o[1].textContent = v.vFr; o[2].textContent = v.vPri;
    $('stIn').placeholder = v.stPh; $('accUser').placeholder = v.uname; $('accEmail').placeholder = v.email; $('accPwOld').placeholder = v.pwOld; $('accPwNew').placeholder = v.pwNew;
    $('upUser').placeholder = v.uname; $('upPw').placeholder = curL().rPass;
    paintProf(); updateChatSub();
  }
  AVATARS.forEach(a => { const b = mkEl('button', '', a); b.type = 'button'; b.addEventListener('click', () => saveProf({ avatar:a }, true)); $('avGrid').appendChild(b); });
  const toggleSet = () => { const f = $('setFold'), o = f.classList.toggle('open'); $('setBtn').setAttribute('aria-expanded', String(o)); f.inert = !o; };
  $('setBtn').addEventListener('click', toggleSet); $('avBtn').addEventListener('click', toggleSet);
  $('stIn').addEventListener('change', () => saveProf({ status: $('stIn').value.trim().slice(0, 40) }, true));
  $('visSel').addEventListener('change', () => saveProf({ vis: $('visSel').value }, true));
  $('muteBtn').addEventListener('click', () => saveProf({ mute: !prof.mute }, false));

  async function saveAccount(){   // username / email / sandi (butuh server)
    const v = vt(), L = curL(), fail = m => { toast(m); SFX.error(); };
    if(!SKY_API) return fail(v.noSrv);
    const nu = ($('accUser').value || '').trim().toLowerCase(), em = ($('accEmail').value || '').trim(), po = $('accPwOld').value, pn = $('accPwNew').value, rename = nu && nu !== myUid;
    if(em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return fail(v.bEmail);
    if(pn && pn.length < 6) return fail(L.ePw);
    if((pn || rename) && !po) return fail(v.needPw);
    if(rename && (!/^[a-z0-9_]{3,16}$/.test(nu) || nu.indexOf('guest') === 0)) return fail(L.eName);
    if(em !== (prof.email || '')){ await api('updateProfile', { email: em }); saveProf({ email: em }, false); }
    if(pn){ const r = await api('changePassword', { oldPw: po, newPw: pn }); if(!r.ok) return fail(L.eBad); }
    if(rename){
      const r = await api('changeUser', { newUser: nu, pw: pn || po });
      if(!r.ok) return fail(r.error === 'taken' ? L.eTaken : L.eBad);
      moveAccount(myUid, nu); const session = { type:'account', id:nu }; writeSession(session); enterApp(session);
    }
    $('accPwOld').value = ''; $('accPwNew').value = '';
    toast(v.accOk); SFX.success();
  }
  $('accSave').addEventListener('click', saveAccount);

  async function upgradeGuest(){   // tamu -> akun asli, progres/teman/ID ikut terbawa
    const v = vt(), L = curL(), fail = m => { toast(m); SFX.error(); };
    if(!mySession || mySession.type !== 'guest') return;
    const u = ($('upUser').value || '').trim().toLowerCase(), pw = $('upPw').value || '', gid = myUid;
    if(!/^[a-z0-9_]{3,16}$/.test(u) || u.indexOf('guest') === 0) return fail(L.eName);
    if(pw.length < 6) return fail(L.ePw);
    if(SKY_API){
      let data = {}; try{ data = JSON.parse(lsGet('sky:v1:u:' + gid) || '{}'); }catch(e){}
      const r = await api('register', { username:u, password:pw, code:myCode, friends:friendsCache, data });
      if(!r.ok) return fail(r.error === 'taken' ? L.eTaken : L.eName);
      lsSet(tokenKey(u), r.token);
    } else {
      const accs = readAccounts();
      if(BUILTIN[u] || Object.prototype.hasOwnProperty.call(accs, u)) return fail(L.eTaken);
      accs[u] = await hashPw(u, pw); lsSet(ACC_KEY, JSON.stringify(accs));
    }
    moveAccount(gid, u); lsDel(GUEST_KEY); lsDel(GUEST_SEEN);
    const session = { type:'account', id:u }; writeSession(session); enterApp(session);
    toast(v.upDone); SFX.success();
  }
  $('upBtn').addEventListener('click', upgradeGuest);

  // ----- kehadiran, jam teman, pesan belum dibaca -----
  function metaFor(code){
    if(SKY_API) return meta[code] || null;
    const uid = findLocalUid(code); if(!uid) return null;   // mode lokal: baca dari akun lain di perangkat ini
    const p = readProf(uid), seen = parseInt(lsGet('sky_seen_' + uid), 10) || 0;
    return { avatar:p.avatar, status:p.status, tz: parseInt(lsGet('sky_tz_' + uid), 10) || 0, online: Date.now() - seen < 20000 };
  }
  function timeInfo(m){
    if(!m || m.tz === undefined) return '';
    const v = vt(), t = new Date(Date.now() + m.tz * 60000), diff = m.tz - tzNow(), h = Math.round(Math.abs(diff) / 6) / 10;
    return String(t.getUTCHours()).padStart(2, '0') + ':' + String(t.getUTCMinutes()).padStart(2, '0') + ' \u00b7 ' + (diff === 0 ? v.same : (diff > 0 ? v.ahead : v.behind).replace('{h}', h));
  }
  const readK = pid => 'sky_read_' + myUid + '_' + pid;
  const unreadOf = f => { const pid = pairId(myCode, f.code), rd = parseInt(lsGet(readK(pid)), 10) || 0; return readMsgs(pid).filter(m => m.from !== myCode && m.ts > rd).length; };
  function markRead(){ if(!chatPid) return; const m = readMsgs(chatPid); lsSet(readK(chatPid), String(m.length ? m[m.length - 1].ts : 0)); }
  const chatFriend = () => chatPid ? friendsCache.find(f => pairId(myCode, f.code) === chatPid) : null;
  function updateChatSub(){ const f = chatFriend(); $('chatSub').textContent = f ? (typingMap[f.code] ? vt().typing : timeInfo(metaFor(f.code))) : ''; }
  $('chatInput').addEventListener('input', () => {   // indikator "sedang mengetik"
    lastType = Date.now();
    if(!chatPid || Date.now() - lastTypeSend < 2500) return;
    lastTypeSend = Date.now();
    if(SKY_API) pollNow(); else lsSet('sky_typing_' + chatPid, JSON.stringify({ from: myCode, ts: Date.now() }));
  });
  function paintDots(n){ $('navDot').hidden = $('navDotItem').hidden = !n; }
  function mergeMsg(m){
    const loc = readMsgs(m.pid);
    if(loc.some(x => x.ts === m.ts && x.from === m.from && x.text === m.text)) return;
    loc.push({ from:m.from, text:m.text, ts:m.ts }); loc.sort((a, b) => a.ts - b.ts);
    try{ localStorage.setItem(chatKey(m.pid), JSON.stringify(loc.slice(-200))); }catch(e){}
  }
  function waveTo(f){   // lambaian ringan tanpa membuka chat
    SFX.send(); toast('\ud83d\udc4b ' + fLabel(f));
    if(SKY_API){ api('nudge', { to: f.code }); return; }
    const uid = findLocalUid(f.code); if(!uid) return;
    let l = []; try{ l = JSON.parse(lsGet('sky_nudge_' + uid) || '[]'); }catch(e){}
    l.push({ from: myCode, ts: Date.now() }); lsSet('sky_nudge_' + uid, JSON.stringify(l.slice(-20)));
  }
  async function pollNow(){
    if(!myUid || !myCode) return;
    let nudges = [];
    if(SKY_API){
      const typing = (chatPid && Date.now() - lastType < 4000 && chatFriend()) ? chatFriend().code : '';
      const me = myUid, r = await api('poll', { since, tz: tzNow(), typing });
      if(myUid !== me) return;   // sudah ganti akun/keluar: hasil lama dibuang
      if(!r.ok){ if(r.error === 'auth' && ++authFails >= 3) logout(); return; }
      authFails = 0;
      meta = r.metas || {}; typingMap = r.typing || {};
      (r.msgs || []).forEach(m => { mergeMsg(m); since = Math.max(since, m.ts); });
      lsSet('sky_since_' + myUid, String(since)); lsSet('sky_meta_' + myUid, JSON.stringify(meta));   // cache: tampil instan saat app dibuka lagi
      nudges = r.nudges || [];
    } else {
      lsSet('sky_seen_' + myUid, String(Date.now())); lsSet('sky_tz_' + myUid, String(tzNow()));
      try{ nudges = JSON.parse(lsGet('sky_nudge_' + myUid) || '[]'); }catch(e){}
      if(nudges.length) lsDel('sky_nudge_' + myUid);
      typingMap = {};
      friendsCache.forEach(f => { try{ const t = JSON.parse(lsGet('sky_typing_' + pairId(myCode, f.code)) || 'null'); if(t && t.from !== myCode && Date.now() - t.ts < 5000) typingMap[f.code] = true; }catch(e){} });
    }
    nudges.forEach(n => { const f = friendsCache.find(x => x.code === n.from); toast(vt().waved.replace('{n}', f ? fLabel(f) : n.from)); SFX.notify(); });
    if(chatPid) renderChat();
    const total = friendsCache.reduce((a, f) => a + unreadOf(f), 0);
    if(total > lastUnread) SFX.notify();   // pesan baru: bunyi berbeda dari suara UI biasa
    lastUnread = total; paintDots(total); renderFriends(); updateChatSub();
  }
  function startNet(){
    stopNet();
    prof = readProf(myUid); window.SkyMuted = !!prof.mute;
    try{ meta = JSON.parse(lsGet('sky_meta_' + myUid) || '{}'); }catch(e){ meta = {}; }
    since = parseInt(lsGet('sky_since_' + myUid), 10) || 0;
    lastUnread = friendsCache.reduce((a, f) => a + unreadOf(f), 0); paintDots(lastUnread);
    paintProf(); renderFriends();
    const gen = ++netGen;   // cegah loop ganda
    const loop = async () => { await pollNow(); if(myUid && gen === netGen) pollTimer = setTimeout(loop, document.hidden ? 30000 : (SKY_API ? (chatPid ? 3000 : 10000) : 2500)); };
    loop();
  }
  function stopNet(){ netGen++; clearTimeout(pollTimer); pollTimer = null; paintDots(0); }

  // ----- perayaan saat rasi bintang / season mencapai 100% -----
  window.addEventListener('sky:celebrate', e => {
    SFX.cheer(); toast(vt().c100.replace('{n}', e.detail.name));
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = mkEl('div', 'cfLayer'); document.body.appendChild(layer);
    for(let i = 0; i < 22; i++){ const c = mkEl('i', 'cf'); c.style.cssText = '--x:' + (Math.random() * 100) + 'vw;--d:' + (Math.random() * 0.4) + 's;--r:' + (Math.random() * 360) + 'deg;--s:' + (8 + Math.random() * 10) + 'px'; layer.appendChild(c); }
    setTimeout(() => layer.remove(), 2200);
  });

  applyVisitLang();
  window.SkyVisit = { render: renderFriends };
})();
</script>
<script>
/* ===== Loading screen Sky Meet: logo pecah jadi partikel bintang, persen mengikuti proses memuat asli =====
   - Persen minimal 5 detik. Jika semua sudah termuat, 100% tepat di 5 detik.
     Jika belum, persen tertahan di 99% sampai benar-benar selesai (jaring pengaman 20 dtk).
   - Event: 'skymeetb:reveal' (20% bintang sudah terserap -> tampilkan login / masuk app)
            'skymeetb:done'   (bintang terakhir terserap -> loading screen ditutup)  */
(function(){
  const screenEl = document.getElementById('loadingScreen');

  // bintang berkelip untuk latar login (dipakai juga sebagai latar loading)
  (function(){
    const box = document.getElementById('loginStars'); if(!box) return;
    const n = Math.max(40, Math.min(160, Math.round(innerWidth * innerHeight / 9000)));
    for(let i = 0; i < n; i++){
      const s = document.createElement('i'), d = 0.8 + Math.random() * 1.8;
      s.style.cssText = 'left:' + (Math.random() * 100).toFixed(2) + '%;top:' + (Math.random() * 100).toFixed(2) + '%;width:' + d.toFixed(2) + 'px;height:' + d.toFixed(2) + 'px;--d:' + (3 + Math.random() * 4).toFixed(2) + 's;--dl:-' + (Math.random() * 6).toFixed(2) + 's';
      box.appendChild(s);
    }
  })();

  function bail(){   // bila canvas/animasi gagal: jangan pernah mengunci pengguna di loading
    screenEl.classList.add('reveal', 'hidden');
    window.dispatchEvent(new Event('skymeetb:reveal'));
    window.dispatchEvent(new Event('skymeetb:done'));
  }

            x = p.x; y = p.y;
            if(p.done || y > H_ + 200){ p.done = true; continue; }
            sz *= .35 + .65 * clamp((p.d - 24 * Math.max(ringK, .2)) / 60);
            for(let i = TN - 1; i > 0; i--){ p.hx[i] = p.hx[i - 1]; p.hy[i] = p.hy[i - 1]; }
            p.hx[0] = x; p.hy[0] = y; if(p.hn < TN) p.hn++;
            if(p.vx * p.vx + p.vy * p.vy > 400)
              for(let i = 0; i < p.hn - 1; i++){ const tp = tails[p.ci * 3 + (i >> 1)]; tp.moveTo(p.hx[i], p.hy[i]); tp.lineTo(p.hx[i + 1], p.hy[i + 1]); }
          }
        }
        drawStar(p.spr, x, y, sz, rot, a);
      }

      // lingkaran: bereaksi, mengecil setelah 20% bintang masuk, hilang bersama bintang terakhir
      const om = 22;
      rk.vx += (-om * om * rk.x - .36 * om * rk.vx) * dt; rk.vy += (-om * om * rk.y - .36 * om * rk.vy) * dt;
      rk.x = clamp(rk.x + rk.vx * dt, -6, 6); rk.y = clamp(rk.y + rk.vy * dt, -6, 6); rk.hit *= Math.exp(-5 * dt);
      let ro = t < G ? clamp(t / 700) : 1;
      ringK = 1;
      if(bursting){
        const u = clamp((1 - pending / Math.max(1, parts.length) - .2) / .8);
        ringK = 1 - u; ro = 1 - clamp((u - .8) / .2);
        if(u > 0) reveal();
      }
      ringEl.style.opacity = ro.toFixed(3);
      whitehole(time, shown >= .995, false);
      ringEl.style.transform = `translate(${rk.x.toFixed(2)}px,${rk.y.toFixed(2)}px) scale(${(ringK * (1 + rk.hit * .12)).toFixed(3)})`;
      ringEl.style.setProperty('--hit', rk.hit.toFixed(3));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round';
      for(let i = 0; i < 9; i++){ ctx.globalAlpha = TA[i % 3]; ctx.lineWidth = TW[i % 3]; ctx.strokeStyle = COLORS[(i / 3) | 0]; ctx.stroke(tails[i]); }

      if(isFinite(tBurst) && t > tBurst - 800 && t < tBurst + 150){ const k = (t - (tBurst - 800)) / 950; drawShine(k * k * (3 - 2 * k)); }
      let la = 0;
      if(!bursting){ if(t > G * .85) la = clamp((t - G * .85) / 1100) * .55; }
      else if(t < BS + 350) la = .55 * (1 - (t - BS) / 350);
      logoGlow(la);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

      if(bursting && t > BS + 300 && (pending === 0 || t > BS + 15000)){ finish(); return; }
      raf = requestAnimationFrame(frame);
    }

    let rz = 0;
    function onResize(){ clearTimeout(rz); rz = setTimeout(() => { if(bursting || finished) measure(); else build(); }, 150); }

    logoImg = new Image();
    logoImg.onload = () => { build(); addEventListener('resize', onResize); raf = requestAnimationFrame(frame); };
    logoImg.onerror = () => bail();
    logoImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG);
  }
})();
</script>
