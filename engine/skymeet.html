<script>
/* ===== Loading screen Skymeet: logo pecah jadi partikel bintang, persen mengikuti proses memuat asli =====
   - Persen minimal 5 detik. Jika semua sudah termuat, 100% tepat di 5 detik.
     Jika belum, persen tertahan di 99% sampai benar-benar selesai (jaring pengaman 20 dtk).
   - Event: 'skymeetb:reveal' (20% bintang sudah terserap -> tampilkan login / masuk app)
            'skymeetb:done'   (bintang terakhir terserap -> loading screen ditutup)  */
(function(){
  const screenEl = document.getElementById('loadingScreen');

  // latar login = langit malam yang sama dengan beranda (dibuat oleh SkyNight di skrip utama); dipakai juga sebagai latar loading
  (function(){
    const box = document.getElementById('loginStars'), scr = document.getElementById('loginScreen');
    if(!box || !scr || !window.SkyNight) return;
    window.SkyNight.build(box, innerWidth < 600 ? 55 : 90, { on: () => !scr.classList.contains('hidden'), yMax: 1, watch: scr });
  })();

  function bail(){   // bila canvas/animasi gagal: jangan pernah mengunci pengguna di loading
    screenEl.classList.add('reveal', 'hidden');
    window.dispatchEvent(new Event('skymeetb:reveal'));
    window.dispatchEvent(new Event('skymeetb:done'));
  }
  try{ init(); }catch(e){ console.error('loader', e); bail(); }

  function init(){
    const MIN_MS = 5000, SAFETY_MS = 20000, G = 2600;
    const cvs = document.getElementById('ldCanvas'), ctx = cvs.getContext('2d');
    if(!ctx) throw new Error('canvas');
    const hud = document.getElementById('ldHud'), ringEl = document.getElementById('ldRing');
    const arc = document.getElementById('ldArc'), pct = document.getElementById('ldPct');
    const w1 = document.getElementById('ldW1'), w2 = document.getElementById('ldW2');
    const COLORS = ['#ffffff', '#ffe9a8', '#9fd0ff'];
    const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    let W, H_, dpr, parts = [], logoImg, logoBox, cx, cy, sc, sx;

    // ---- progres memuat yang asli ----
    const loaded = { dom: document.readyState !== 'loading', fonts: false, win: document.readyState === 'complete' };
    if(document.fonts && document.fonts.ready){
      Promise.all([document.fonts.ready, document.fonts.load('400 16px "Space Grotesk"').catch(() => {})]).then(() => { loaded.fonts = true; }, () => { loaded.fonts = true; });
    } else loaded.fonts = true;
    if(!loaded.win) addEventListener('load', () => { loaded.win = true; });
    if(!loaded.dom) document.addEventListener('DOMContentLoaded', () => { loaded.dom = true; });

    // ---- sprite bintang 4 sudut ----
    const sprites = COLORS.map(col => {
      const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
      const x = c.getContext('2d'), m = s / 2;
      const g = x.createRadialGradient(m, m, 0, m, m, m);
      g.addColorStop(0, col); g.addColorStop(.25, col + '88'); g.addColorStop(1, 'transparent');
      x.fillStyle = g; x.globalAlpha = .5; x.fillRect(0, 0, s, s); x.globalAlpha = 1;
      x.fillStyle = col; x.beginPath();
      for(let i = 0; i < 8; i++){ const r = i % 2 ? 9 : 30, a = i * Math.PI / 4 - Math.PI / 2; x.lineTo(m + Math.cos(a) * r, m + Math.sin(a) * r); }
      x.closePath(); x.fill();
      return c;
    });

    // ---- logo: aset yang sama dengan layar login (aset/skymeet/logo.svg|webp). Tanpa aset / gagal dibaca -> tulisan "Skymeet" ----
    const loadImg = u => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; });
    async function logoImage(){
      const A = window.SkyAsset, u = A && await A.resolve('logo');
      if(!u) return null;
      let im = await loadImg(u);
      if(!im.naturalWidth && /\.svg$/i.test(u)){   // SVG hanya ber-viewBox (tanpa width/height): beri ukuran supaya bisa digambar ke canvas
        const txt = await (await fetch(u)).text(), vb = txt.match(/viewBox\s*=\s*["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/);
        if(!vb) return null;
        im = await loadImg(URL.createObjectURL(new Blob([txt.replace(/<svg\b/, `<svg width="${vb[1]}" height="${vb[2]}"`)], { type: 'image/svg+xml' })));
      }
      return im;
    }
    function crop(c){   // potong rapat ke bagian yang terisi, lalu jadikan siluet putih (hanya alfa gambar yang dipakai)
      const w = c.width, h = c.height, d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++) if(d[(y * w + x) * 4 + 3] > 16){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
      if(x1 < 0) return null;
      const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      const ox = o.getContext('2d'); ox.drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      ox.globalCompositeOperation = 'source-in'; ox.fillStyle = '#fff'; ox.fillRect(0, 0, o.width, o.height);
      return o;
    }
    function fromImage(im){
      const nw = im.naturalWidth || 300, nh = im.naturalHeight || 150, k = Math.min(1100 / nw, 1100 / nh);
      const c = document.createElement('canvas'); c.width = Math.ceil(nw * k); c.height = Math.ceil(nh * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      return crop(c);
    }
    function textLogo(){
      const c = document.createElement('canvas'); c.width = 1000; c.height = 300; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '600 200px "Space Grotesk", system-ui, sans-serif'; x.fillText('Skymeet', 500, 150);
      return crop(c);
    }
    async function getLogo(){
      try{ const im = await Promise.race([logoImage(), new Promise(r => setTimeout(() => r(null), 3000))]); const c = im && fromImage(im); if(c) return c; }catch(e){}
      return textLogo();
    }

    const TN = 7, TA = [.5, .3, .14], TW = [1.8, 1.3, .8];
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const rnd = (a, b) => a + Math.random() * (b - a);
    const outQuart = v => 1 - Math.pow(1 - v, 4);
    const rk = { x: 0, y: 0, vx: 0, vy: 0, hit: 0 };   // reaksi lingkaran: bergoyang + berpendar
    let ring = { x: -999, y: -999, r: 0 }, ring0 = { x: -999, y: -999 }, ringK = 1, ringU = 0, ringT = 0, ringV = 0, lastHit = -1;   // ringT: target progres (dari jumlah bintang terserap), ringU: progres yang sudah dihaluskan; ring0: posisi asal; ringU: progres menyusut/bergeser (0..1)
    const PULL = 1400, DRAG = 1.0, DRAG_IN = 2.5, REST_WALL = .9;

    function measure(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H_ = innerHeight;
      cvs.width = W * dpr; cvs.height = H_ * dpr;
      const hb = hud.getBoundingClientRect();
      ring = { x: hb.left + hb.width / 2, y: hb.top + hb.height / 2, r: ringEl.offsetWidth * .45 + 4 };
      ring0 = { x: ring.x, y: ring.y };
    }
    function build(){
      measure();
      const lw = Math.min(W * .72, 520), lh = lw * logoImg.height / logoImg.width;
      cx = W / 2; cy = H_ * .44;
      logoBox = { x: cx - lw / 2, y: cy - lh / 2, w: lw, h: lh };
      sc = document.createElement('canvas'); sc.width = Math.ceil(lw * dpr); sc.height = Math.ceil(lh * dpr); sx = sc.getContext('2d');
      const off = document.createElement('canvas'); off.width = Math.ceil(lw); off.height = Math.ceil(lh);
      const o = off.getContext('2d', { willReadFrequently: true });
      o.drawImage(logoImg, 0, 0, lw, lh);
      const data = o.getImageData(0, 0, off.width, off.height).data;
      const step = Math.max(3, Math.round(lw / 150));
      parts = [];
      for(let y = 0; y < off.height; y += step) for(let x = 0; x < off.width; x += step){
        if(data[(y * off.width + x) * 4 + 3] < 128) continue;
        const tx = logoBox.x + x + rnd(0, step), ty = logoBox.y + y + rnd(0, step);
        const ang = Math.random() * Math.PI * 2, rad = Math.max(W, H_) * rnd(.55, .9), ci = (Math.random() * 3) | 0;
        parts.push({
          tx, ty, sx: cx + Math.cos(ang) * rad, sy: cy + Math.sin(ang) * rad,
          delay: Math.random() * .45, curve: rnd(-.6, .6),
          size: rnd(step * 1.2, step * 2.8), ci, spr: sprites[ci], hx: new Float32Array(TN), hy: new Float32Array(TN), hn: 0,
          rot: Math.random() * 6.28, spin: rnd(-1.5, 1.5), ph: Math.random() * 6.28,
          ba: Math.atan2(ty - cy, tx - cx) + rnd(-.7, .7), bd: rnd(.35, 1) * Math.max(W, H_) * .5,
          bdel: ((ty - logoBox.y) / lh) * 900 + Math.random() * 150, g: rnd(.8, 1.2)   // pecah menyapu dari atas ke bawah
        });
      }
    }

    // ---- fisika: menyebar, lalu ditarik ke lingkaran persen dan terserap ----
    function step(p, dt){
      if(p.done) return;
      p.age += dt;
      const dx = ring.x - p.x, dy = ring.y - p.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
      p.d = d;
      const k = clamp((p.age - .35) / .7);
      const a = PULL * p.g * k * clamp(.6 + d / 800, .6, 1.5) * (1 + 3 / (d / 40 + 1));
      p.vx += (nx * a - ny * a * .05) * dt;
      p.vy += (ny * a + nx * a * .05) * dt;
      const f = Math.exp(-(p.age > 1.5 ? DRAG_IN : DRAG) * dt); p.vx *= f; p.vy *= f;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if(p.x < 0){ p.x = -p.x; p.vx = Math.abs(p.vx) * REST_WALL; }
      else if(p.x > W){ p.x = 2 * W - p.x; p.vx = -Math.abs(p.vx) * REST_WALL; }
      if(d < ring.r * .8 * Math.max(ringK, .2)){ p.done = true; rk.hit = Math.min(1, rk.hit + .03); }
    }

    function whitehole(time, full, calm){   // di 100%: dua lingkaran bercahaya bergetar berlawanan arah
      ringEl.classList.toggle('ld-full', full);
      if(!full) return;
      if(calm){
        w1.style.transform = w2.style.transform = 'translate(-50%,-50%)';
        w1.style.opacity = w2.style.opacity = (.65 + .35 * Math.sin(time * 3)).toFixed(2); return;
      }
      const jx = Math.sin(time * 47) * 1.4, jy = Math.cos(time * 53) * 1.4;
      w1.style.opacity = w2.style.opacity = 1;
      w1.style.transform = `translate(-50%,-50%) translate(${jx.toFixed(2)}px,${jy.toFixed(2)}px) scale(${(1 + .15 * Math.sin(time * 9)).toFixed(3)})`;
      w2.style.transform = `translate(-50%,-50%) translate(${(-jx * 1.3).toFixed(2)}px,${(-jy * 1.3).toFixed(2)}px) scale(${(1 + .1 * Math.sin(time * 7 + 1)).toFixed(3)})`;
    }

    function drawShine(pr){   // pita cahaya menyapu logo dari atas ke bawah tepat sebelum pecah
      const w = sc.width, h = sc.height, bh = h * .22, y = -bh + (h + 2 * bh) * pr;
      sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, w, h);
      const g = sx.createLinearGradient(0, y - bh, 0, y + bh);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,248,220,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      sx.fillStyle = g; sx.fillRect(0, 0, w, h);
      sx.globalCompositeOperation = 'destination-in'; sx.drawImage(logoImg, 0, 0, w, h);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
      ctx.drawImage(sc, logoBox.x, logoBox.y, logoBox.w, logoBox.h);
    }
    function drawStar(spr, x, y, size, rot, a){
      if(a <= .01) return;
      const c = Math.cos(rot) * size / 64 * dpr, s = Math.sin(rot) * size / 64 * dpr;
      ctx.globalAlpha = a; ctx.setTransform(c, s, -s, c, x * dpr, y * dpr); ctx.drawImage(spr, -32, -32);
    }
    function logoGlow(a){
      if(a <= 0) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a; ctx.shadowColor = '#ffe9a8'; ctx.shadowBlur = 24;
      ctx.drawImage(logoImg, logoBox.x, logoBox.y, logoBox.w, logoBox.h); ctx.shadowBlur = 0;
    }

    // ---- letusan titik bulat kecil dari tengah layar: menyebar ke seluruh layar, pecah saat menyentuh tepi ----
    const DOTS = COLORS.map(col => {
      const sz = 16, c = document.createElement('canvas'); c.width = c.height = sz;
      const x = c.getContext('2d'), m = sz / 2, g = x.createRadialGradient(m, m, 0, m, m, m);
      g.addColorStop(0, '#fff'); g.addColorStop(.45, col); g.addColorStop(.62, col + '99'); g.addColorStop(1, 'transparent');
      x.fillStyle = g; x.fillRect(0, 0, sz, sz); return c;
    });
    function spawnPop(){
      popC = { x: W / 2, y: H_ / 2 };
      const n = Math.max(450, Math.min(1100, Math.round(W * H_ / 450)));
      dots = []; pops = []; frags = [];
      for(let i = 0; i < n; i++){
        const a = Math.random() * 6.283, sp = 380 + Math.pow(Math.random(), .8) * 900;
        dots.push({ x: popC.x, y: popC.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: rnd(-.6, .6), r: rnd(.8, 1.7), ci: (Math.random() * 3) | 0, ph: Math.random() * 6.28, age: 0, dead: false });
      }
      popAlive = n;
    }
    function popAt_(d, x, y){   // titik pecah di tepi layar: kilatan kecil + serpihan mungil
      pops.push({ x, y, age: 0, ci: d.ci, r: d.r });
      const nx = x <= 0 ? 1 : x >= W ? -1 : 0, ny = y <= 0 ? 1 : y >= H_ ? -1 : 0, base = Math.atan2(ny || 0, nx || 0) + (nx || ny ? 0 : Math.random() * 6.283);
      for(let k = 0; k < 3; k++){
        const a = base + rnd(-1.2, 1.2), sp = rnd(80, 260);
        frags.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: d.r * .7, ci: d.ci, age: 0, life: rnd(.25, .45) });
      }
    }
    function drawPop(t, time, dt){
      const pa = (t - popAt) / 1000, cx0 = popC.x, cy0 = popC.y;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'lighter';
      if(pa < .6){   // kilatan cahaya di pusat
        const k = pa / .6, R = 40 + 140 * k, g = ctx.createRadialGradient(cx0, cy0, 0, cx0, cy0, R);
        g.addColorStop(0, `rgba(255,255,255,${(.9 * (1 - k)).toFixed(3)})`); g.addColorStop(.4, `rgba(255,233,168,${(.35 * (1 - k)).toFixed(3)})`); g.addColorStop(1, 'rgba(255,233,168,0)');
        ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx0, cy0, R, 0, 6.283); ctx.fill();
      }
      let alive = 0;
      for(const d of dots){
        if(d.dead) continue;
        d.age += dt;
        const ca = Math.cos(d.w * dt), sa = Math.sin(d.w * dt), vx = d.vx * ca - d.vy * sa, vy = d.vx * sa + d.vy * ca; d.vx = vx; d.vy = vy;   // lintasan sedikit melengkung
        d.x += d.vx * dt; d.y += d.vy * dt;
        if(d.x <= 0 || d.x >= W || d.y <= 0 || d.y >= H_ || d.age > 4.5){
          d.dead = true; popAt_(d, Math.min(W, Math.max(0, d.x)), Math.min(H_, Math.max(0, d.y))); continue;
        }
        alive++;
        const s = d.r * 4;
        ctx.globalAlpha = .8 + .2 * Math.sin(time * 14 + d.ph); ctx.drawImage(DOTS[d.ci], d.x - s / 2, d.y - s / 2, s, s);
      }
      for(let i = pops.length - 1; i >= 0; i--){   // kilatan kecil di titik pecah
        const q = pops[i]; q.age += dt;
        if(q.age > .3){ pops.splice(i, 1); continue; }
        const k = q.age / .3, s = q.r * (3 + 5 * k);   // kilatan pecah tetap kecil seperti titik
        ctx.globalAlpha = .8 * (1 - k); ctx.drawImage(DOTS[q.ci], q.x - s / 2, q.y - s / 2, s, s);
      }
      const ff = Math.exp(-3 * dt);
      for(let i = frags.length - 1; i >= 0; i--){   // serpihan mungil
        const f = frags[i]; f.age += dt;
        if(f.age >= f.life){ frags.splice(i, 1); continue; }
        f.vx *= ff; f.vy *= ff; f.x += f.vx * dt; f.y += f.vy * dt;
        const s = f.r * 3.2; ctx.globalAlpha = 1 - f.age / f.life; ctx.drawImage(DOTS[f.ci], f.x - s / 2, f.y - s / 2, s, s);
      }
      return alive + pops.length + frags.length;
    }

    // ---- alur utama ----
    let t0 = performance.now();
    let last = t0, raf = 0, bursting = false, BS = 0, tBurst = Infinity, realP = 0, shown = 0, realDoneAt = -1, revealed = false, finished = false, rmAt = 0, popAt = 0, popAlive = 1, dots = [], pops = [], frags = [], popC = { x: 0, y: 0 };
    function reveal(){
      if(revealed) return; revealed = true;
      screenEl.classList.add('reveal');
      window.dispatchEvent(new Event('skymeetb:reveal'));
    }
    function finish(){
      if(finished) return; finished = true;
      reveal();
      screenEl.classList.add('hidden');
      window.dispatchEvent(new Event('skymeetb:done'));
      cancelAnimationFrame(raf); removeEventListener('resize', onResize);
      setTimeout(() => { cvs.width = cvs.height = 1; }, 800);
    }

    function frame(now){
      if(finished) return;
      const t = now - t0, time = t / 1000;
      const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;

      // persen = yang lebih lambat antara waktu (5 detik) dan proses memuat asli
      const rt = (loaded.dom ? .3 : 0) + (loaded.fonts ? .35 : 0) + (loaded.win ? .35 : 0);
      realP += (rt - realP) * (1 - Math.exp(-6 * dt));
      const realDone = (loaded.dom && loaded.fonts && loaded.win) || t > SAFETY_MS;
      if(realDone && realDoneAt < 0){ realDoneAt = t; tBurst = Math.max(MIN_MS, t + 900); }
      const target = Math.min(t / MIN_MS, realDone ? 1 : Math.min(realP, .99));
      shown += (target - shown) * (1 - Math.exp(-10 * dt));
      if(target >= 1 && shown > .998) shown = 1;
      if(!reduced && !bursting && t >= G && t >= tBurst && shown >= .995){ bursting = true; BS = t; }

      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.globalCompositeOperation = 'lighter';
      arc.style.strokeDashoffset = 213.63 * (1 - shown);
      pct.textContent = Math.round(shown * 100) + '%';

      if(reduced){   // mode tanpa gerak: logo diam, hanya berkelap-kelip
        for(const p of parts){
          const tw = Math.sin(time * 2.2 + p.ph) * .5 + .5;
          drawStar(p.spr, p.tx, p.ty, p.size * (.7 + .4 * tw), p.rot, .3 + .7 * tw);
        }
        logoGlow(.3 + .15 * Math.sin(time * 1.6));
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        const full = shown >= .995;
        whitehole(time, full, true);
        if(full && t >= tBurst){
          if(!rmAt) rmAt = t;
          const k = t - rmAt;
          ringEl.style.opacity = (1 - clamp((k - 800) / 900)).toFixed(3);
          if(k > 800) reveal();
          if(k > 1700){ finish(); return; }
        }
        raf = requestAnimationFrame(frame); return;
      }

      if(!bursting){ ringU = 0; ringV = 0; ringT = 0; }
      else {   // target dari jumlah bintang terserap itu bergelombang -> dihaluskan dengan pegas teredam kritis supaya geraknya mulus
        const RW = 6;
        ringV += ((ringT - ringU) * RW * RW - 2 * RW * ringV) * dt; ringU = clamp(ringU + ringV * dt);
        if(ringU <= 0 || ringU >= 1) ringV = 0;
      }
      { const e = ringU * ringU * (3 - 2 * ringU); ring.x = ring0.x + (W / 2 - ring0.x) * e; ring.y = ring0.y + (H_ / 2 - ring0.y) * e; ringK = 1 - ringU; }   // lingkaran bergeser ke tengah layar, bintang ikut mengejarnya
      let pending = 0;
      const tails = Array.from({ length: 9 }, () => new Path2D());
      for(const p of parts){
        let x, y, a = 1, sz = p.size, rot = p.rot + time * p.spin;
        if(t < G){   // berkumpul membentuk logo
          p.sim = false; p.done = false;
          const g = clamp((t / G - p.delay) / .55), e = outQuart(g);
          const dx = p.tx - p.sx, dy = p.ty - p.sy, k = (1 - e) * Math.sin(e * Math.PI) * p.curve;
          x = p.sx + dx * e - dy * k; y = p.sy + dy * e + dx * k; a = clamp(g * 3);
        } else if(!bursting){   // menunggu persen 100%: berkelip
          const tw = Math.sin(time * 3 + p.ph) * .5 + .5;
          x = p.tx; y = p.ty; a = .7 + .3 * tw; sz *= .85 + .35 * tw;
        } else {   // pecah
          if(p.done) continue;
          pending++;
          const tb = t - BS - p.bdel;
          if(tb < 0){ x = p.tx; y = p.ty; }
          else {
            if(!p.sim){
              p.sim = true; p.age = 0; p.x = p.tx; p.y = p.ty; p.hn = 0;
              const v0 = p.bd * DRAG * 1.25;
              p.vx = Math.cos(p.ba) * v0; p.vy = Math.sin(p.ba) * v0;
            }
            step(p, dt / 2); step(p, dt / 2);
            x = p.x; y = p.y;
            if(p.done || y > H_ + 200){ p.done = true; continue; }
            sz *= .35 + .65 * clamp((p.d - 24 * Math.max(ringK, .2)) / 60);
            for(let i = TN - 1; i > 0; i--){ p.hx[i] = p.hx[i - 1]; p.hy[i] = p.hy[i - 1]; }
            p.hx[0] = x; p.hy[0] = y; if(p.hn < TN) p.hn++;
            if(p.vx * p.vx + p.vy * p.vy > 400)
              for(let i = 0; i < p.hn - 1; i++){ const tp = tails[p.ci * 3 + (i >> 1)]; tp.moveTo(p.hx[i], p.hy[i]); tp.lineTo(p.hx[i + 1], p.hy[i + 1]); }
          }
        }
        drawStar(p.spr, x, y, sz, rot, a);
      }

      // lingkaran: bereaksi, mengecil setelah 20% bintang masuk, hilang bersama bintang terakhir
      const om = 22;
      rk.vx += (-om * om * rk.x - .36 * om * rk.vx) * dt; rk.vy += (-om * om * rk.y - .36 * om * rk.vy) * dt;
      rk.x = clamp(rk.x + rk.vx * dt, -4, 4); rk.y = clamp(rk.y + rk.vy * dt, -4, 4); rk.hit *= Math.exp(-5 * dt);
      let ro = t < G ? clamp(t / 700) : 1;
      if(bursting){
        ringT = clamp((1 - pending / Math.max(1, parts.length) - .2) / .8);
        ro = 1 - clamp((ringU - .8) / .2);
      }
      const sh = 1 - ringU * .85;   // goyangan & denyut mereda saat lingkaran sedang bergerak ke tengah
      ringEl.style.opacity = ro.toFixed(3);
      whitehole(time, shown >= .995, false);
      ringEl.style.transform = `translate3d(${(rk.x * sh + ring.x - ring0.x).toFixed(2)}px,${(rk.y * sh + ring.y - ring0.y).toFixed(2)}px,0) scale(${(ringK * (1 + rk.hit * .1 * sh)).toFixed(3)})`;
      if(Math.abs(rk.hit - lastHit) > .015){ lastHit = rk.hit; ringEl.style.setProperty('--hit', rk.hit.toFixed(2)); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round';
      for(let i = 0; i < 9; i++){ ctx.globalAlpha = TA[i % 3]; ctx.lineWidth = TW[i % 3]; ctx.strokeStyle = COLORS[(i / 3) | 0]; ctx.stroke(tails[i]); }

      if(isFinite(tBurst) && t > tBurst - 800 && t < tBurst + 150){ const k = (t - (tBurst - 800)) / 950; drawShine(k * k * (3 - 2 * k)); }
      let la = 0;
      if(!bursting){ if(t > G * .85) la = clamp((t - G * .85) / 1100) * .55; }
      else if(t < BS + 350) la = .55 * (1 - (t - BS) / 350);
      logoGlow(la);
      if(popAt) popAlive = drawPop(t, time, dt);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

      // semua partikel logo sudah terhisap & lingkaran tepat di tengah -> langsung pecah jadi titik bulat kecil, dan form login muncul
      if(bursting && !popAt && t > BS + 300 && ((pending === 0 && ringU > .985) || t > BS + 15000)){ popAt = t; spawnPop(); reveal(); }
      if(popAt && t > popAt + 900 && popAlive === 0){ finish(); return; }
      raf = requestAnimationFrame(frame);
    }

    let rz = 0;
    function onResize(){ clearTimeout(rz); rz = setTimeout(() => { if(bursting || finished) measure(); else build(); }, 150); }

    getLogo().then(c => { logoImg = c; t0 = performance.now(); last = t0; build(); addEventListener('resize', onResize); raf = requestAnimationFrame(frame); }).catch(() => bail());
  }
})();
</script>
</body>
