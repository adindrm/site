<script>
/* tautan relatif (manifest, ikon, aset, sw.js) harus dihitung dari folder tempat berkas ini berada.
   URL tanpa "/" di akhir dan tanpa ekstensi (mis. /engine/skymeet) punya dua kemungkinan:
     (a) FOLDER   : /engine/skymeet/index.html            -> perlu <base href="/engine/skymeet/">
     (b) URL BERSIH: /engine/skymeet -> /engine/skymeet.html -> JANGAN pakai <base> (aset sejajar dengan berkas ini)
   Jadi jangan menebak: cek apakah manifest.webmanifest benar-benar ada di dalam folder itu. */
(function(){
  var p = location.pathname;
  if(/\/$/.test(p) || /\.[A-Za-z0-9]{1,5}$/.test(p.split('/').pop())) return;
  try{
    var x = new XMLHttpRequest(); x.open('GET', p + '/skymeet.webmanifest', false); x.send();
    if(x.status === 200 && /^\s*\{/.test(x.responseText) && x.responseText.indexOf('"start_url"') > -1) document.write('<base href="' + p + '/">');
  }catch(e){}
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('skymeet-sw.js', { scope: 'skymeet' }).catch(function(){}); }); }   /* sw.js: lingkup hanya folder ini, tidak bentrok dengan situs utama */
</script>
<script>
/* bila skrip utama error saat layar loading masih tampil, tulis pesan errornya di layar agar mudah dilacak */
window.addEventListener('error', function(e){ var m = document.getElementById('loadMsg'), l = document.getElementById('loadingScreen'); if(m && l && !l.classList.contains('hidden')){ m.style.display = 'block'; m.textContent = 'Error: ' + (e.message || 'script'); } });
</script>
<style>
  :root{
    --top: #0b1026;
    --bottom: #1a2044;
    --body-color: #d8dcf5;
    --glow: rgba(216,220,245,0.35);
    --star-opacity: 1;
    --ink: #f4f5fb;
    --ink-soft: rgba(244,245,251,0.62);
    --logo-filter:none; --warn:#ffd9a0; --warn-bg:rgba(255,200,120,0.1); --warn-bd:rgba(255,200,120,0.24); --err:#ff9b9b; --ok:#8fe3a8; --toast-bg:rgba(20,22,45,0.94); --toast-fg:#f4f5fb;
    --panel: rgba(0,0,0,0.34);   /* latar menu dropdown: gelap saat malam, terang saat siang agar teks tetap terbaca */
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ overscroll-behavior:none; height:100%; height:100dvh; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; }
  body{
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
    background: linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%);
    transition: background 3s linear;
    position:relative;
    color: var(--ink);
  }

  /* selama animasi masuk, langit mengejar tiap perubahan digit lebih cepat agar terasa menyala-nyala halus */
  body:not(.ready){
    transition: background 0.55s ease;
  }
  body:not(.ready) #stars{
    transition: opacity 0.55s ease;
  }
  body:not(.ready) #celestial{
    transition: background 0.55s ease, box-shadow 0.55s ease, left 0.55s ease, top 0.55s ease;
  }

  /* bintang */
  #stars{
    position:absolute; inset:0;
    opacity: var(--star-opacity);
    transition: opacity 3s linear;
    pointer-events:none;
  }
  /* latar malam (gaya rasi_bintang_bercahaya): canvas bintang berpendar + kabut tipis + debu cahaya melayang.
     Semuanya di dalam #stars, jadi ikut memudar saat siang lewat --star-opacity. */
  #stars canvas, #loginStars canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #stars .nebula, #loginStars .nebula{ position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(20,34,69,.50) 0%, rgba(7,13,32,.30) 40%, transparent 72%),
      radial-gradient(ellipse at 25% 30%, rgba(54,77,132,.16), transparent 42%),
      radial-gradient(ellipse at 75% 70%, rgba(45,72,130,.14), transparent 40%); }
  #stars .motes, #loginStars .motes{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #stars .mote, #loginStars .mote{ position:absolute; width:2px; height:2px; border-radius:50%; background:rgba(226,239,255,.8); box-shadow:0 0 7px 2px rgba(173,207,255,.24);
    animation: moteDrift var(--duration) ease-in-out infinite alternate; animation-delay: var(--delay); will-change:transform, opacity; }
  @keyframes moteDrift{ from{ transform:translate3d(0,18px,0); opacity:.22; } to{ transform:translate3d(var(--drift),-35px,0); opacity:.85; } }

  /* matahari / bulan */
  #celestial{
    position:absolute;
    width:64px; height:64px;
    border-radius:50%;
    background: var(--body-color);
    box-shadow: 0 0 70px 18px var(--glow);
    transition: background 3s linear, box-shadow 3s linear, left 3s ease, top 3s ease;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
  }

  /* siluet bukit, penanda horizon minimal */
  #horizon{
    position:absolute;
    bottom:0; left:0; right:0;
    height:16vh;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.18) 100%);
    pointer-events:none;
  }


  /* ===== loading screen (logo -> partikel bintang) ===== */
  #loadingScreen{
    position:fixed; inset:0; z-index:9999;
    background:transparent;   /* latar = latar layar login di bawahnya, jadi tidak ada loncatan saat transisi */
    --ld-accent:#ffe9a8; --ld-fg:#eaf1ff;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #loadingScreen.reveal{ pointer-events:none; }   /* login/aplikasi di bawahnya sudah boleh diklik */
  #loadingScreen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #ldCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ldHud{ position:absolute; left:0; right:0; bottom:calc(10vh + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; pointer-events:none; }
  #ldRing{ position:relative; width:58px; height:58px; will-change:transform,opacity; }
  #ldRing svg{ width:100%; height:100%; display:block; transform:rotate(-90deg); overflow:visible; }
  #ldRing .ld-tr{ fill:none; stroke:rgba(255,255,255,calc(.12 + var(--hit,0) * .3)); stroke-width:3; }
  #ldRing .ld-arc{ fill:none; stroke:var(--ld-accent); stroke-width:3; stroke-linecap:round; stroke-dasharray:213.63; stroke-dashoffset:213.63; filter:drop-shadow(0 0 calc(6px + var(--hit,0) * 14px) var(--ld-accent)); }
  #ldPct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--ld-fg); text-shadow:0 0 calc(var(--hit,0) * 12px) var(--ld-accent); font-variant-numeric:tabular-nums; transition:opacity .25s; }
  #ldRing.ld-full #ldPct{ opacity:0; }
  .ld-wh{ position:absolute; inset:0; opacity:0; transition:opacity .35s; pointer-events:none; }
  #ldRing.ld-full .ld-wh{ opacity:1; }
  .ld-wh i{ position:absolute; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%); }
  .ld-wh i:first-child{ width:11px; height:11px; background:radial-gradient(circle,#fff 30%,#fff7d6 100%); box-shadow:0 0 calc(8px + var(--hit,0) * 10px) 2px #fff, 0 0 calc(18px + var(--hit,0) * 18px) 6px rgba(255,233,168,.75); }
  .ld-wh i:last-child{ width:26px; height:26px; border:1.5px solid rgba(255,255,255,.9); box-shadow:0 0 8px 1px rgba(255,255,255,.8), inset 0 0 8px 1px rgba(159,208,255,.7), 0 0 calc(14px + var(--hit,0) * 14px) rgba(255,233,168,.5); }

  #loadMsg{ display:none; position:absolute; left:16px; right:16px; bottom:calc(4vh + env(safe-area-inset-bottom,0px)); text-align:center; font-size:13px; color:#ff9b9b; pointer-events:none; }   /* hanya tampil bila ada error skrip */

  /* ===== layar login (demo) ===== */
  #loginScreen{
    position:fixed; inset:0; z-index:9998; overflow-y:auto;
    display:flex; align-items:flex-start; justify-content:center; padding:24px;
    color:#f4f5fb;
    --ink:#f4f5fb; --ink-soft:rgba(244,245,251,0.62); --panel:rgba(0,0,0,0.34); --logo-filter:none;   /* layar login selalu bertema malam, sama dengan loading */
    --warn:#ffd9a0; --warn-bg:rgba(255,200,120,0.1); --warn-bd:rgba(255,200,120,0.24); --err:#ff9b9b; --ok:#8fe3a8;
    background: linear-gradient(180deg, #030611 0%, #070d20 55%, #02040c 100%);   /* langit malam yang sama dengan beranda; kabut + bintang digambar di #loginStars */
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #loginScreen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #loginScreen.hidden #loginStars .mote{ animation-play-state:paused; }
  /* latar login = latar loading screen (langit malam + bintang berkelip) */
  #loginStars{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #loginCard{ position:relative; z-index:1; }
  #loginScreen:not(.ready) #loginCard{ opacity:0; visibility:hidden; pointer-events:none; }
  /* kartu login muncul dari tengah, tepat saat titik-titik bintang pecah menyebar */
  #loginScreen.ready #loginCard{ animation: lgPop 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes lgPop{ 0%{ opacity:0; transform:scale(.86) translateY(16px); filter:blur(8px); } 55%{ filter:blur(0); } 100%{ opacity:1; transform:none; filter:none; } }
  @media (prefers-reduced-motion: reduce){ #loginScreen.ready #loginCard{ animation: lgFade .8s ease both; } @keyframes lgFade{ from{ opacity:0; } to{ opacity:1; } } }

  #loginMain, #regPane{ display:flex; flex-direction:column; gap:12px; }

  #loginLang{ display:flex; justify-content:center; gap:6px; }

  #loginLang button[aria-pressed="true"]{ color:var(--top); background:var(--ink); border-color:transparent; }
  #loginCard p.about{ font-size:12.5px; line-height:1.55; color:var(--ink-soft); text-align:left; margin:0; }
  #loginCard p.about.note{ font-size:11.5px; opacity:0.85; }
  .lgWarn{ font-size:11.5px; line-height:1.5; color:#ffd9a0; background:rgba(255,200,120,0.08); border:1px solid rgba(255,200,120,0.18); border-radius:12px; padding:9px 12px; text-align:left; }
  .lgInfo{ font-size:12px; line-height:1.55; color:var(--ink-soft); background:rgba(255,255,255,0.05); border-radius:12px; padding:10px 12px; text-align:left; margin:0; }
  #regErr{ font-size:12px; color:#ff9b9b; min-height:16px; }
  #createBtn, #regBack{ font-family:inherit; font-size:13px; color:var(--ink); background:rgba(255,255,255,0.08); border:none; border-radius:12px; padding:11px; cursor:pointer; }
  #regBtn{ font-family:inherit; font-size:14px; color:var(--top); background:var(--ink); border:none; border-radius:12px; padding:12px; cursor:pointer; font-weight:500; }

  }
  #loginCard input:focus{ border-color:rgba(255,255,255,0.3); }
  #loginBtn{

  }
  #guestBtn{

  /* header progres: nama + Winged Light */
  #p3head{ justify-content:center; }
  .pgBar{ display:flex; align-items:center; justify-content:center; gap:10px; min-width:0; max-width:calc(100% - 150px); padding:5px 14px; border-radius:16px; border:1px solid rgba(255,255,255,0.28); background:rgba(0,0,0,0.15); }
  .pgName{ font-size:14px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wl{ position:relative; display:inline-grid; place-items:center; flex:none; width:34px; height:34px; padding:0; margin:0 0 4px; border:0; background:none; }   /* ikon berdiri sendiri, angka kecil di bawah tengah */
  .wl svg{ width:28px; height:28px; fill:#ffe9a8; }
  .wl img.ai{ width:28px; height:28px; }   /* ikon dari aset (aset/skymeet/progres/winglight) */
  .wl input{ position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:3.2ch; min-width:20px; box-sizing:content-box; padding:1px 3px; border-radius:7px; border:0; outline:none; background:var(--panel); color:var(--ink); font:600 10px/1.2 'Space Grotesk', sans-serif; text-align:center; font-variant-numeric:tabular-nums; }
  /* halaman Visit: profil, teman, kehadiran */
  .profCard{ display:flex; flex-direction:column; gap:10px; padding:14px 16px; border-radius:16px; background:rgba(0,0,0,0.15); border:1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .profTop{ display:flex; align-items:center; gap:12px; }
  .profMain{ flex:1; min-width:0; text-align:left; }

  #setOpen svg, #setOpen img.ai{ width:29px; height:29px; } #setOpen img.ai{ filter:var(--logo-filter); transition:filter .6s linear; }
  #setOpen:active{ transform:scale(0.9); } #setOpen:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .profStatus{ font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .profStatus:empty{ display:none; }
  .profUser{ font-size:12px; color:var(--ink-soft); }
  .avBig{ flex:none; width:56px; height:56px; padding:0; border-radius:50%; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.18); font-size:28px; cursor:pointer; display:grid; place-items:center; }
  .profCard input[type=text], #setBox input[type=text], #setBox input[type=password], #setBox input[type=email], #setBox select{ width:100%; box-sizing:border-box; font-family:inherit; font-size:16px; color:var(--ink); background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:9px 12px; outline:none; }

  .avPick{ display:flex; flex-direction:column; gap:8px; text-align:left; padding:2px 0 4px; }
  .avBig[aria-expanded="true"]{ border-color:var(--ink); }
  .avGrid button{ width:72px; height:72px; padding:0; border-radius:12px; border:1px solid rgba(255,255,255,0.14); background:transparent; font-size:42px; cursor:pointer; display:grid; place-items:center; }
  .avGrid button[aria-pressed="true"]{ background:var(--ink); }
  .fgt{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); padding:8px 4px 0; text-align:left; }

  .frWrap .friendRow{ flex:1; min-width:0; }
  .friendAvatar{ position:relative; font-size:18px; }
  .dotOn{ position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; background:#5ee08a; border:2px solid var(--bottom, #0b1026); }
  .favBtn{ flex:none; display:grid; place-items:center; width:36px; height:44px; margin-right:-4px; padding:0; border:0; background:none; color:var(--ink-soft); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; transition:color .2s ease, transform .15s ease; }
  .favBtn svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linejoin:round; transition:fill .2s ease; }

  #p4 .page-in{ justify-content:flex-start; padding-top:0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }   /* Visit: profil tepat di bawah header, daftar teman mengalir ke bawah */

  #active.off, .act.off, #actEmpty.off{ display:none; }

  /* lilin abu-abu = harian sudah selesai (penanda cap hari ini); kembali normal otomatis saat reset harian */
  .gc{ fill:#9aa0b4; color:#9aa0b4; }
  img.ai.gcf{ filter:grayscale(1) brightness(.75); }
  .cap[aria-pressed="true"] > svg:not(.gc), .cap[aria-pressed="true"] > img.ai:not(.gc){ display:none; }
  .cap:not([aria-pressed="true"]) > .gc{ display:none; }
  /* tombol lilin abu-abu: hanya ikon 20px, teks disembunyikan tapi tetap terbaca screen reader */
  .cap{ position:relative; justify-content:center; min-width:40px; padding:0 10px; }
  .cap svg, .cap img.ai{ width:24px; height:24px; margin-right:0; }
  /* tombol lilin abu-abu: ikon saja (tanpa kartu/bingkai bulat), area sentuh 44px */
  button.cap, button.cap[aria-pressed="true"]{ display:inline-grid; place-items:center; width:44px; height:44px; min-width:44px; min-height:44px; padding:0; border:0; border-radius:50%; background:none; box-shadow:none; }
  .cap svg.gc{ fill:#9aa0b4; }   /* sebelumnya kalah oleh .cap svg{fill:kuning} sehingga lilin 'abu-abu' tampak kuning */
  .cap span{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .hbtns{ display:flex; align-items:center; gap:8px; flex:none; }
  /* warna api: dua daftar filter dengan fungsi & urutan sama supaya bisa di-transisi mulus (abu-abu <-> kuning menyala) */
  :root{ --fx-gray:grayscale(1) opacity(.55) brightness(1) drop-shadow(0 0 0 rgba(255,236,150,0)) drop-shadow(0 0 0 rgba(255,190,70,0)); --fx-lit:grayscale(0) opacity(1) brightness(1.1) drop-shadow(0 0 3px rgba(255,236,150,.95)) drop-shadow(0 0 9px rgba(255,190,70,.7)); --fx-glow:grayscale(0) opacity(1) brightness(1.9) drop-shadow(0 0 5px rgba(255,248,210,1)) drop-shadow(0 0 16px rgba(255,200,80,.95)); }
  /* tombol on/off ikon melayang: ikon saja (tanpa kartu/bingkai), area sentuh 44px */
  button.fabTog, button.fabTog[aria-pressed="true"]{ display:inline-grid; place-items:center; width:44px; height:44px; min-width:44px; min-height:44px; padding:0; border:0; border-radius:50%; background:none; box-shadow:none; }
  .fabTog .flame{ width:30px; height:30px; font-size:24px; filter:var(--fx-gray); transition:filter 1.4s ease; }   /* menyala perlahan */
  .fabTog[aria-pressed="true"] .flame{ filter:var(--fx-lit); }
  .flame{ display:inline-grid; place-items:center; line-height:1; }
  .flame img.fr{ width:100%; height:100%; display:block; }
  /* animasi frame: semua frame ditumpuk di sel yang sama; yang aktif = visible. Tanpa display:none (memicu animasi aiIn ulang + decode ulang = berkedip) */
  /* ganti frame tanpa kedip: frame baru (.on) memudar masuk DI ATAS frame lama (.prev) yang tetap penuh; baru setelah itu frame lama dilepas.
     (Crossfade biasa membuat dua frame sama-sama setengah transparan sehingga cahaya turun-naik = berkedip.) */
  .flame.fanim img.fr{ grid-area:1/1; animation:none; opacity:0; transition:none; will-change:opacity; backface-visibility:hidden; }
  .flame.fanim img.fr.on{ opacity:1; }   /* satu frame saja yang tampil: bentuk & cahaya selalu sesuai frame itu, tidak ada bayangan frame sebelumnya */
  .flame.flk{ transform-origin:50% 90%; animation:flameFlick .9s ease-in-out infinite; }
  @keyframes flameFlick{ 0%,100%{ transform:scale(1,1) skewX(0); } 20%{ transform:scale(.95,1.07) skewX(-4deg); } 45%{ transform:scale(1.04,.95) skewX(3deg); } 70%{ transform:scale(.97,1.05) skewX(-2deg); } }

  .pill small.wx{ opacity:.6; font-size:11px; margin-left:5px; font-weight:400; }
  /* ikon melayang progres harian */

<script>
(function(){
  // ---------- musik latar + pemutar mini di header ----------
  // Folder lagu: aset/skymeet/musik/   (mp3 / ogg / m4a / webm, dicoba berurutan)
  //  - paling sederhana: lagu.mp3, lagu2.mp3, lagu3.mp3, ... (berurutan, sampai lagu12; berhenti di nomor yang kosong)
  //  - atau buat daftar.json untuk nama & judul bebas: [{"file":"awan","title":"Awan Pagi"}, {"file":"bintang","title":"Bintang"}]
  const DIR = 'aset/skymeet/musik/', VOL = 0.35, IDLE = 5000, HOLD = 500, MAXN = 12;
  const FMT = ['mp3', 'ogg', 'm4a', 'webm'];
  let au = null, wanted = false, focused = true, armed = false, failed = false, fadeT = null, userPaused = false;
  let tracks = [{ file:'lagu', title:'' }], cur = 0, tried = 0, loadedFile = '', initP = null;
  const $m = id => document.getElementById(id);
  const MZ = {

  const trackUrl = (t, k) => DIR + t.file + (/\.(mp3|ogg|m4a|webm|wav)$/i.test(t.file) ? '' : '.' + FMT[k]);

    if(!shown.length){ const e = document.createElement('div'); e.className = 'mzEmpty'; e.textContent = mzT().none; listEl.appendChild(e); return; }
    shown.forEach(([t, i]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mzItem' + (i === cur ? ' on' : ''); b.setAttribute('role', 'option'); b.setAttribute('aria-selected', String(i === cur));
      const sp = document.createElement('span'); sp.textContent = title(t, i); b.appendChild(sp);

  }
  const bump = () => { clearTimeout(idleT); idleT = setTimeout(closeBar, IDLE); };   // 5 detik tanpa sentuhan = kembali jadi ikon musik
  function openBar(){ if(!box) return; box.classList.add('open'); paint(); bump(); }
  function closeBar(){ if(!box) return; clearTimeout(idleT); box.classList.remove('open'); paint(); }
  function setList(o){ if(!box) return; box.classList.toggle('listOpen', o); listEl.inert = !o; if(o){ closeBar(); } paint(); }

// ---------- aset gambar eksternal (folder "aset" di samping html ini); gagal dimuat = tetap pakai ikon/teks bawaan ----------
(function(){
  const BASE = 'aset/skymeet/', st = {}, done = {};
  // resolve('menu/menu.svg') -> mencoba aset/menu/menu.svg lalu aset/menu/menu.webp (ekstensi di nama diabaikan); null bila keduanya tidak ada
  function resolve(f){
    const b = f.replace(/\.(svg|webp)$/i, '');
    return st[b] || (st[b] = new Promise(res => {
      const tryExt = i => { const ex = ['svg', 'webp'], u = BASE + b + '.' + ex[i]; if(i >= ex.length){ res(null); return; } const im = new Image(); im.onload = () => { done[b] = u; res(u); }; im.onerror = () => tryExt(i + 1); im.src = u; };
      tryExt(0);
    }));
  }
  const peek = f => done[f.replace(/\.(svg|webp)$/i, '')] || null;
  const probe = f => resolve(f).then(u => !!u);
  function mkImg(u, cls){ const im = new Image(); im.src = u; im.alt = ''; im.draggable = false; im.className = 'ai ' + (cls || ''); im.setAttribute('aria-hidden', 'true'); return im; }
  function swap(el, f){ resolve(f).then(u => { if(u && el.isConnected) el.replaceWith(mkImg(u)); }); }
  window.SkyAsset = { BASE, resolve, peek, probe, mkImg, swap };
  document.querySelectorAll('[data-asset]').forEach(el => swap(el, el.getAttribute('data-asset')));
  resolve('logo').then(u => {
    if(!u) return;
    document.getElementById('lgLogoBox').appendChild(mkImg(u));
    document.getElementById('lgBrand').classList.add('hasLogo');
    const h = document.getElementById('hdrLogo'); h.textContent = ''; h.appendChild(mkImg(u));
  });
})();
</script>

  const Store = (function(){

    const writeLocal = () => { try { localStorage.setItem(PREFIX + uid, JSON.stringify(data)); } catch(e){} };
    const emit = k => listeners.forEach(fn => { try { fn(k, uid); } catch(e){} });
    function queueRemote(){
      if(!adapter || uid === 'guest') return;
      clearTimeout(timer);
      const id = uid, snap = JSON.parse(JSON.stringify(data));
      timer = setTimeout(() => { Promise.resolve(adapter.save(id, snap)).catch(() => {}); }, 800);
    }

      get user(){ return uid; },
      get(k, d){ return data[k] === undefined ? d : data[k]; },
      set(k, v){ data[k] = v; data._t = Date.now(); writeLocal(); queueRemote(); emit(k); },

  const EVENTS = [

    { k:'concert', c:'aurora',      type:'cycle', period:7200,  o:600,   d:2400 },   // konser mulai :10, tiap 2 jam
  ];
  const CATS = ['candles', 'shards', 'environment', 'reset', 'spirits', 'aurora'];
  // perkiraan wax dari wiki Sky. pool = batas harian bersama, bukan per kejadian
  const WXU = { en:{ u:'wax', max:'up to', day:'/day' }, id:{ u:'wax', max:'hingga', day:'/hari' }, es:{ u:'cera', max:'hasta', day:'/d\u00eda' } };
  const wxText = ev => { if(!ev.wax) return ''; const w = WXU[lang] || WXU.en; return (ev.pool ? w.max + ' ' : '') + '\u2248' + ev.wax + ' ' + w.u + (ev.pool ? w.day : ''); };
  // Roh pengembara: datang Kamis 00:00 Pacific, tiap 14 hari, selama 4 hari. anchor = [tahun, bulan, tanggal] jendela yang diketahui.

  const TS = { anchor:[2026, 9, 10], every:14, days:4, names:{ '2026-10-08':'Talented Builder' } };

  let laFmt = null, hmFmt = null;

  const laOff = ts => { const q = laParts(ts); return Date.UTC(q.year, q.month-1, q.day, q.hour, q.minute, q.second) - Math.floor(ts/1000)*1000; };

  const skyDayKey = ts => { const q = laParts(ts); return q.year + '-' + pad2(q.month) + '-' + pad2(q.day); };
  const skyWeekKey = ts => {   // tanggal Minggu (awal minggu Sky) di Pacific

  const fmtLocal = (ts, left) => { const d = new Date(ts); return (left >= 72000 ? wdFmt(lang).format(d) + ' ' : '') + hmFmt.format(d); };

  // ===== Shard eruption: aturan prediksi komunitas (github.com/PlutoyDev/sky-shards), bukan data resmi server =====
  // Hari kalender Pacific: tanggal ganjil = shard merah, genap = hitam. Realm = (tanggal-1) % 5.
  // Tiap hari ada 3 jendela: mulai (muncul di gerbang) -> mendarat +8m40s -> berakhir +4 jam. Merah tiap 6 jam, hitam tiap 8 jam.
  const SHARD_REALMS = ['Daylight Prairie', 'Hidden Forest', 'Valley of Triumph', 'Golden Wasteland', 'Vault of Knowledge'];
  const SHARD_GROUPS = [   // h:m = mulai pertama (Pacific), iv = interval jam, no = hari tanpa shard (0=Minggu)
    { h:1, m:50, iv:8, no:[6,0], maps:['Butterfly Fields','Forest Brook','Ice Rink','Broken Temple','Starlight Desert'] },
    { h:2, m:10, iv:8, no:[0,1], maps:['Village Islands','Boneyard','Ice Rink','Battlefield','Starlight Desert'] },
    { h:7, m:40, iv:6, no:[1,2], maps:['Cave','Forest Garden','Village of Dreams','Graveyard','Jellyfish Cove'] },
    { h:2, m:20, iv:6, no:[2,3], maps:['Bird Nest','Treehouse','Village of Dreams','Crabfield','Jellyfish Cove'] },

  ];
  const SHARD_LAND = 520e3, SHARD_LEN = 4 * 3600e3;
  function shardDay(y, m, d){
    const dow = new Date(Date.UTC(y, m-1, d)).getUTCDay();
    const red = d % 2 === 1;
    const gi = red ? (((d - 1) / 2) % 3) + 2 : (d / 2) % 2;
    const g = SHARD_GROUPS[gi], ri = (d - 1) % 5;

  }
  function calcShard(ev, nowTs, P){
    const wins = [];
    for(let off = 0; off <= 14 && wins.length < 2; off++){
      const u = new Date(Date.UTC(P.year, P.month-1, P.day + off));
      const s = shardDay(u.getUTCFullYear(), u.getUTCMonth() + 1, u.getUTCDate());
      if(s.red !== ev.red || !s.has) continue;
      for(let i = 0; i < 3 && wins.length < 2; i++){
        const st = s.first + i * s.iv, end = st + SHARD_LEN;
        if(end > nowTs) wins.push({ land: st + SHARD_LAND, end, place: s.place });

    if(a.land <= nowTs) return { live:true, startTs:a.land, endTs:a.end, nextTs: b ? b.land : a.end, place:a.place };
    return { live:false, nextTs:a.land, place:a.place };
  }

  function calc(ev, nowTs, P, secOfDay){
    if(ev.type === 'shard') return calcShard(ev, nowTs, P);

  // --- bangun kartu sekali saja (kategori -> kartu), lalu tiap detik hanya teksnya yang diperbarui ---
  const evRootEl = document.getElementById('evRoot');
  const rowInner = '<div class="evl"><span class="enw"><span class="en"></span><i class="lv"></i></span><span class="pl"></span><span class="el"></span></div><span class="ec">--:--:--</span>';

y;\n  }\n  @keyframes chFloat {\n    0%, 100% { transform: translateY(0) rotate(0deg); opacity: .88; }\n    30% { transform: translateY(calc(var(--amp, 4px) * -1)) rotate(var(--rot, .8deg)); opacity: 1; }\n    66% { transform: translateY(calc(var(--amp, 4px) * .5)) rotate(calc(var(--rot, .8deg) * -.7)); opacity: .92; }\n  }\n\n  /* ===== Animasi muncul (kelas \"intro\" di \u003cbody> dilepas otomatis setelah selesai) =====\n     urutan: langit memudar masuk -> judul huruf demi huruf -> bintang kecil berkedip muncul -> 4 lingkaran digambar satu per satu */\n  body.intro-bg #stars, body.intro-bg .nebula, body.intro-bg .motes { animation: bgIn 2s ease-out both; }   /* latar hanya memudar pada pemuatan pertama, bukan tiap ganti realm */\n  @keyframes bgIn { from { opacity: 0; } }\n  body.intro .title .ch {\n    animation: chFloat var(--fdur, 6s) ease-in-out var(--fdelay, 0s) infinite,\n               chIn 1.1s cubic-bezier(.2, .8, .2, 1) var(--in, 0s) backwards;   /* chIn di urutan akhir agar menang atas opacity chFloat selama masuk */\n  }\n  @keyframes chIn { from { opacity: 0; filter: blur(8px); translate: 0 16px; } }\n  body.intro .constellation .st0 {\n    animation: starIn 1s cubic-bezier(.2, .9, .25, 1.25) backwards, starFloat 5.8s ease-in-out infinite;\n    animation-delay: var(--in-delay, 0s), var(--star-delay, 0s);\n  }\n  @keyframes starIn { from { scale: 0; rotate: -120deg; } 55% { scale: 1.55; } }\n  body.intro .constellation .circle-node {\n    animation: nodeIn 1.3s cubic-bezier(.22, 1, .36, 1) backwards, circleFloat 8s ease-in-out infinite;\n    animation-delay: var(--in-delay, 0s), var(--circle-delay, 0s);\n  }\n  @keyframes nodeIn { from { opacity: 0; scale: .84; } }\n  body.intro .constellation .st1 { animation: ringDraw 1.4s var(--in-delay, 0s) ease-in-out backwards; }\n  @keyframes ringDraw { from { stroke-dasharray: 1 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1 1; stroke-dashoffset: 0; } }\n  body.intro .constellation .logo-icon, body.intro 7.1\" r=\"73.8\"/>\n\t  \u003cimage class=\"logo-icon\" href=\"aset/skymeet/rasi/rasiprogres/isle/4.svg\" x=\"525.7\" y=\"647.1\" width=\"100\" height=\"100\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\"/>\n\t\u003c/g>\n\u003cline class=\"st2\" x1=\"279.7\" y1=\"88.7\" x2=\"329.8\" y2=\"88.5\"/>\n\t\u003cline class=\"st2\" x1=\"221.5\" y1=\"179.3\" x2=\"228.5\" y2=\"214.2\"/>\n\t\u003cline class=\"st2\" x1=\"277\" y1=\"245.4\" x2=\"341\" y2=\"243.2\"/>\n\t\u003cline class=\"st2\" x1=\"382.1\" y1=\"313.5\" x2=\"345.6\" y2=\"394.3\"/>\n\t\u003cline class=\"st2\" x1=\"356.9\" y1=\"427.3\" x2=\"390.2\" y2=\"427.6\"/>\n\t\u003cline class=\"st2\" x1=\"514.1\" y1=\"509.6\" x2=\"541\" y2=\"614.2\"/>\n\t\u003cline class=\"st2\" x1=\"649.5\" y1=\"765.2\" x2=\"791.9\" y2=\"895.9\"/>\n\u003c/g>\n\u003c/svg>\n\n\u003c/main>\n\u003cscript>\n(() => {\n  const canvas = document.getElementById('stars');\n  const ctx = canvas.getContext('2d');\n  const motesLayer = document.getElementById('motes');\n  for (let i = 0; i \u003c 34; i++) {\n    const mote = document.createElement('span');\n    mote.className = 'mote';\n    mote.style.left = (Math.random() * 100) + '%';\n    mote.style.top = (Math.random() * 100) + '%';\n    mote.style.setProperty('--duration', (5 + Math.random() * 9) + 's');\n    mote.style.setProperty('--delay', (-Math.random() * 12) + 's');\n    mote.style.setProperty('--drift', ((Math.random() - .5) * 70) + 'px');\n    motesLayer.appendChild(mote);\n  }\n  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const LT = { en: { star: 'Small star', circ: 'circle', locked: '{n} is locked: light all the other circles first', on: 'Turn on the light of {n}', off: 'Turn off the light of {n}', prev: 'Previous: ', next: 'Next: ', ttl: 'Constellation', pat: 'Star constellation pattern' }, id: { star: 'Bintang kecil', circ: 'lingkaran', locked: '{n} terkunci: nyalakan semua lingkaran lain dulu', on: 'Nyalakan cahaya {n}', off: 'Matikan cahaya {n}', prev: 'Sebelumnya: ', next: 'Berikutnya: ', ttl: 'Rasi Bintang', pat: 'Pola rasi bintang' }, es: { star: 'Estrellita', circ: 'círculo', locked: '{n} está bloqueado: enciende primero todos los demás círculos', on: 'Encender la luz de {n}', off: 'Apagar la luz de {n}', prev: 'Anterior: ', next: 'Siguiente: ', ttl: 'Constelación', pat: 'Patrón de constelación' } }; let LG = (/[?&]lang=(en|id|es)/.exec(location.search) || [])[1] || (navigator.language || 'en').slice(0, 2).toLowerCase(); if (!LT[LG]) LG = 'en'; const T = k => (LT[LG] || LT.en)[k] || LT.en[k]; function setLang(l) { if (!LT[l] || l === LG) return; LG = l; document.documentElement.lang = l; try { document.title = REALMS[realmIdx].name + ' — ' + T('ttl'); constellation.querySelectorAll('.st0').forEach((st, i) => st.setAttribute('aria-label', T('star') + ' ' + (i + 1))); constellation.querySelectorAll('.st1').forEach((c, i) => circleAria(c, i)); constellation.setAttribute('aria-label', T('pat') + ' ' + REALMS[realmIdx].name); updateNav(); } catch (e) {} }\n  // ---------- mode embed: dipasang di iframe overlay skymeet.html; induk menentukan realm & menyimpan nyala/padam ----------\n  const EMBED = document.documentElement.classList.contains('embed');\n  const hostOrigin = '*';   // iframe srcdoc: lawan bicara hanya induknya (dicek lewat e.source); origin file:// bersifat buram sehingga tidak bisa dicocokkan\n  const post = o => { if (!EMBED || window.parent === window) return; try { window.parent.postMessage(Object.assign({ sky: 'rasi' }, o), hostOrigin); } catch (e) {} };\n  const hostMuted = () => { try { return EMBED && window.parent.SkyMuted === true; } catch (e) { return false; } };\n  let drawOn = true;\n\n  // ---------- efek suara (disintesis langsung, tanpa file; mengikuti window.SkyMuted dari halaman utama) ----------\n  let actx = null, master = null;\n  const muted = () => window.SkyMuted === true || hostMuted();\n  function ensure() {\n    if (!actx) {\n      try {\n        actx = new (window.AudioContext || window.webkitAudioContext)();\n        master = actx.createGain(); master.gain.value = .9;\n        const comp = actx.createDynamicsCompressor();   // tumpukan suara tidak pecah saat banyak yang menyala bersamaan\n        master.connect(comp); comp.connect(actx.destination);\n      } catch (e) { actx = null; }\n    }\n    if (actx && actx.state !== 'running') { try { actx.resume(); } catch (e) {} }\n    return actx;\n  }\n  // browser baru mengizinkan suara setelah sentuhan pertama\n  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, ensure, { capture: true, passive: true }));\n  function tone(f, at, dur, type, vol, opt) {\n    const c = ensure(); if (!c || muted()) return null;\n    opt = opt || {};\n    const t = c.currentTime + Math.max(0, at), atk = opt.atk || .012;\n    const o = c.createOscillator(), g = c.createGain();\n    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);\n    if (opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, t + dur);\n    g.gain.setValueAtTime(.0001, t);\n    g.gain.exponentialRampToValueAtTime(vol, t + atk);\n    g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);\n    return { o, g, t };\n  }\n  // lonceng kaca: nada dasar + overtone yang lebih singkat\n  function bell(f, at, vol, dur) {\n    tone(f, at, dur, 'sine', vol);\n    tone(f * 2, at, dur * .55, 'sine', vol * .3);\n    tone(f * 3.01, at, dur * .3, 'sine', vol * .1);\n  }\n  // pentatonik D mayor, selaras dengan nada dasar halaman utama\n  const SCALE = [587.33, 659.25, 739.99, 880, 987.77, 1174.66, 1318.51, 1479.98, 1760, 1975.53];\n  const NODE_NOTE = [587.33, 739.99, 880, 1174.66, 1318.51, 1479.98, 1760, 1975.53, 2349.3];   // lingkaran 1..9\n  const SPARK = [1568, 1760, 2093, 2349, 2637];\n  const hums = new Map();   // dengung cahaya yang menyusuri garis, per lingkaran\n  function stopHum(index, fast) {\n    const h = hums.get(index); if (!h) return; hums.delete(index);\n    try {\n      const c = actx, t = c.currentTime;\n      h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(Math.max(h.g.gain.value, .0001), t);\n      h.g.gain.exponentialRampToValueAtTime(.0001, t + (fast ? .25 : .6)); h.o.stop(t + (fast ? .3 : .65));\n    } catch (e) {}\n  }\n  const sfx = {\n    star() {   // klik bintang kecil: kerlip dua nada\n      const f = SPARK[Math.floor(Math.random() * SPARK.length)];\n      bell(f, 0, .028, .5); bell(f * 1.5, .07, .018, .45);\n    },\n    on(index, travelMs) {   // lingkaran menyala: lonceng hangat + cahaya naik menyusuri garis\n      const f = NODE_NOTE[index] || 880;\n      bell(f, 0, .06, 1.5); tone(f / 2, 0, 1.1, 'sine', .035);\n      tone(f * .5, 0, .9, 'sine', .02, { to: f * 1.5, atk: .2 });\n      stopHum(index, true);\n      if (travelMs > 0) { const h = tone(f * .75, .05, travelMs / 1000, 'sine', .011, { to: f * 1.5, atk: 1.2 }); if (h) hums.set(index, h); }\n    },\n    off(index) {   // lingkaran diredupkan: dua nada turun, dengung ditarik pulang\n      stopHum(index, false);\n      const f = NODE_NOTE[index] || 880;\n      tone(f, 0, .28, 'sine', .045, { to: f * .7 }); tone(f * .66, .09, .4, 'sine', .035, { to: f * .45 });\n    },\n    lineDone(index) {   // cahaya sampai di ujung garis\n      bell((NODE_NOTE[index] || 880) * 2, 0, .022, .7);\n    },\n    special(on) {   // keempat lingkaran menyala = gelombang akor; salah satu padam = turun\n      if (on) {\n        [587.33, 739.99, 880, 1174.66, 1479.98].forEach((f, i) => bell(f, i * .085, .05, 1.9));\n        tone(146.83, 0, 2.4, 'sine', .04, { atk: .25 }); tone(220, 0, 2.4, 'sine', .028, { atk: .3 });\n      } else {\n        tone(880, 0, .5, 'sine', .04, { to: 330 }); tone(587.33, .12, .6, 'sine', .03, { to: 220 });\n      }\n    },\n    locked() {   // lingkaran spesial diklik tapi belum boleh menyala: dua ketukan rendah\n      tone(196, 0, .13, 'triangle', .03, { to: 165 }); tone(165, .12, .18, 'triangle', .024, { to: 130 });\n    },\n    next() {   // pindah ke realm berikutnya: sapuan naik + lonceng\n      tone(300, 0, .38, 'sine', .035, { to: 700 }); bell(1174.66, .12, .03, .8);\n    },\n    intro(plan, first) {   // diselaraskan dengan jadwal animasi muncul\n      const c = ensure(); if (!c || c.state !== 'running' || muted() || document.hidden) return;\n      if (first) { tone(146.83, 0, 5.4, 'sine', .022, { atk: 1.8 }); tone(220, .2, 5.2, 'sine', .016, { atk: 2 }); tone(293.66, .4, 5, 'sine', .012, { atk: 2.2 }); }   // alas lembut (hanya saat pertama)\n      plan.letters.forEach((ms, i) => bell(SCALE[Math.min(i, SCALE.length - 1)], ms / 1000, .024, .9));   // judul: tiap huruf satu nada naik\n      plan.stars.forEach(ms => bell(SPARK[Math.floor(Math.random() * SPARK.length)], ms / 1000 + .12, .012, .4));\n      plan.nodes.forEach((ms, i) => {\n        const t = ms / 1000;\n        tone(170, t, 1.3, 'sine', .022, { to: 520, atk: .5 });   // lingkaran digambar\n        bell(NODE_NOTE[i] || 880, t + 1.25, .045, 1.6);                  // lingkaran selesai\n      });\n    }\n  };\n  let stars = [], w = 0, h = 0, dpr = 1;\n  function resize() {\n    dpr = Math.min(window.devicePixelRatio || 1, 2);\n    w = window.innerWidth; h = window.innerHeight;\n    canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);\n    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    const count = Math.max(90, Math.floor(w * h / 4300));\n    stars = Array.from({length: count}, () => ({\n      x: Math.random() * w, y: Math.random() * h,\n      r: Math.random() * 1.35 + .25,\n      phase: Math.random() * Math.PI * 2,\n      speed: Math.random() * .9 + .25,\n      alpha: Math.random() * .55 + .25\n    }));\n    draw(0);\n  }\n  function draw(t) {\n    ctx.clearRect(0, 0, w, h);\n    for (const s of stars) {\n      const twinkle = reduceMotion ? 0.85 : (Math.sin(t * 0.001 * s.speed + s.phase) + 1) / 2;\n      const a = s.alpha * (0.35 + twinkle * 0.65);\n      ctx.beginPath();\n      ctx.fillStyle = `rgba(235,243,255,${a})`;\n      ctx.shadowColor = 'rgba(185,214,255,.65)';\n      ctx.shadowBlur = s.r > 1.1 ? 5 : 2;\n      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);\n      ctx.fill();\n      if (s.r > 1.35 && twinkle > .82) {\n        ctx.strokeStyle = `rgba(235,243,255,${a * .6})`;\n        ctx.lineWidth = .5;\n        ctx.beginPath(); ctx.moveTo(s.x - 3, s.y); ctx.lineTo(s.x + 3, s.y);\n        ctx.moveTo(s.x, s.y - 3); ctx.lineTo(s.x, s.y + 3); ctx.stroke();\n      }\n    }\n    ctx.shadowBlur = 0;\n    if (!reduceMotion && drawOn) requestAnimationFrame(draw);\n  }\n  const constellation = document.querySelector('.constellation');\n  const ISLE_TEMPLATE = constellation.innerHTML;   // rasi buatan tangan (Isle of Dawn), disimpan agar bisa dipasang ulang\n  let lines = [], linesByCircle = [], circleNodes = [], specialIcon = null, restoredDraw = [];   // restoredDraw: garis milik lingkaran yang sudah menyala saat realm dibuka (digambar bertahap)\n  const chargeTimers = new Map();\n  const lineAnimations = new Map();\n\n  // Setiap bintang sudut empat bergerak dengan fase berbeda, bukan serempak.\n  // Klik bintang kecil: beri goyangan singkat yang lembut.\n  function bindStars() {\n    constellation.querySelectorAll('.st0').forEach((star, index) => {\n      star.style.setProperty('--star-delay', (-Math.random() * 5.8) + 's');\n      star.setAttribute('tabindex', '0');\n      star.setAttribute('role', 'button');\n      star.setAttribute('aria-label', T('star') + ' ' + (index + 1));\n      const wobble = () => {\n        star.classList.remove('is-wobbling');\n        void star.getBoundingClientRect();\n        star.classList.add('is-wobbling');\n        sfx.star();\n        window.setTimeout(() => star.classList.remove('is-wobbling'), 520);\n      };\n      star.addEventListener('click', wobble);\n      star.addEventListener('keydown', event => {\n        if (   async function hashPw(id, pw){
    try{
      if(window.crypto && crypto.subtle){
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('skymeet:' + id + ':' + pw));
        return 'h:' + Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
      }
    }catch(e){}
    return 'p:' + pw;
  }
  async function checkPw(id, pw, stored){
    if(stored.indexOf('p:') === 0) return stored === 'p:' + pw;
    return (await hashPw(id, pw)) === stored;
  }

      return;
    }
    let ok = false;
    { const accs = readAccounts(); if(Object.prototype.hasOwnProperty.call(accs, u)) ok = await checkPw(u, p, accs[u]); }
    if(ok){
      SFX.success();
      const session = { type:'account', id: u };

  async function doRegister(){
    const L = curL(), u = ($('regUser').value || '').trim().toLowerCase(), p = $('regPass').value || '', p2 = $('regPass2').value || '';
    const fail = m => { SFX.error(); regErrEl.textContent = m; };
    if(!/^[a-z0-9_]{3,16}$/.test(u) || u.indexOf('guest') === 0) return fail(L.eName);
    if(p.length < 6) return fail(L.ePw);
    if(p !== p2) return fail(L.eMatch);
    if(SKY_API){
      const r = await api('register', { username:u, password:p });
      if(!r.ok) return fail(r.error === 'taken' ? L.eTaken : L.eName);
      SFX.success(); hydrate(u, r); const session = { type:'account', id:u }; writeSession(session); enterApp(session);
      return;
    }
    const accs = readAccounts();
    if(Object.prototype.hasOwnProperty.call(accs, u)) return fail(L.eTaken);
    accs[u] = await hashPw(u, p); lsSet(ACC_KEY, JSON.stringify(accs));

  function renderFriends(force){
    const listEl = $('friendList'), emptyEl = $('visitEmpty'), v = vt();

      frRows.clear(); listEl.textContent = ''; frSeen.clear();
      emptyEl.textContent = v.empty; emptyEl.style.display = 'block'; return;
    }
    emptyEl.style.display = 'none';
    const data = friendsCache.map(f => { const st = chatStat(f); return { f, m: metaFor(f.code) || {}, n: st.n, l: st.last, ty: !!typingMap[f.code], lbl: fLabel(f), fav: favSet.has(f.code) }; });
    const order = (x, y) => (y.n > 0) - (x.n > 0) || ((y.l && y.l.ts) || 0) - ((x.l && x.l.ts) || 0) || x.lbl.localeCompare(y.lbl);

  // ID divalidasi server dalam SATU request (cek ada + simpan + tambahkan aku ke daftar temannya)
  async function addFriendByCode(raw, nameRaw){
    const v = vt(), code = (raw || '').trim().toUpperCase(), name = (nameRaw || '').trim().slice(0, 10);
    const fail = m => { toast(m); SFX.error(); return false; };
    if(!new RegExp('^[' + CODE_CHARS + ']{6}$').test(code)) return fail(v.bad);
    if(code === myCode) return fail(v.own);
    if(friendsCache.some(f => f.code === code)) return fail(v.dup);
    if(srv()){
      if(reqOut.some(x => x.code === code)) return fail(v.pend);
      const r = await friendOp('addFriend', { code, name });
      if(!r.ok) return fail(r.error === 'nf' ? v.nf : r.error === 'dup' ? v.dup : r.error === 'own' ? v.own : r.error === 'pend' ? v.pend : v.netErr);
      if(r.pending){ toast(v.reqSent); SFX.success(); return true; }   // menunggu persetujuan
      if(r.meta){ meta[code] = r.meta; }   // dia sudah lebih dulu mengajukan: langsung berteman
    } else {
      let ok = !!findLocalUid(code);
      const ad = window.SkyVisitAdapter;
      if(!ok && ad && typeof ad.exists === 'function'){ try{ ok = !!(await ad.exists(code)); }catch(e){} }
      if(!ok) return fail(v.nf);
      const lu = findLocalUid(code), custom = lu ? lsGet('sky_myname_' + lu) : null;
      friendsCache.push({ code, name: name || custom || (lu && lu.indexOf('guest_') !== 0 ? lu : '') }); persistFriends();
    }
    renderFriends(true); toast(v.added); SFX.success();
    return true;
  }

  $('chatInput').addEventListener('keydown', e => {   // desktop: Enter = kirim, Shift+Enter = baris baru. HP (layar sentuh): Enter = baris baru, kirim lewat tombol
    if(e.key !== 'Enter' || e.shiftKey || e.isComposing || !matchMedia('(pointer:fine)').matches) return;
    e.preventDefault(); if($('chatForm').requestSubmit) $('chatForm').requestSubmit(); else $('chatForm').dispatchEvent(new Event('submit', { cancelable:true }));
  });
  window.addEventListener('resize', () => { if(chatPid) chatGrow(); });
  $('chatInput').addEventListener('input', () => {   // indikator "sedang mengetik" (ringan: 1 request kecil, tanpa poll penuh)
    lastType = Date.now();
    const f = chatFriend();
    if(!f || Date.now() - lastTypeSend < 2500) return;
    lastTypeSend = Date.now();
    if(srv()) api('typing', { to: f.code }); else lsSet('sky_typing_' + chatPid, JSON.stringify({ from: myCode, ts: Date.now() }));
  });
  function paintDots(n){ $('navDot').hidden = $('navDotItem').hidden = !n; }
  function flamedMap(){ try{ return JSON.parse(lsGet('sky_flamed_' + myUid) || '{}'); }catch(e){ return {}; } }
  function flamedToday(code){ return flamedMap()[code] === window.SkyApp.dayKey(); }   // sekali sehari per teman (ganti hari = reset harian Sky)
  function syncFlame(row){   // sudah dinyalakan hari ini: api berwarna & bergerak; belum: abu-abu & diam
    if(!row.flame) return;
    const on = flamedToday(row.code), fl = row.flame.querySelector('.flame'); row.flame.classList.toggle('lit', on);
    if(!fl || !window.SkyFlame) return;
    if(on) delete fl.dataset.hold; else { fl.dataset.hold = '1'; window.SkyFlame.setFrame(fl, 0); }
  }
  function lightFlame(f){   // nyalakan api ringan tanpa membuka chat
    const v = vt(), day = window.SkyApp.dayKey(), fl = flamedMap();
    if(fl[f.code] === day){ toast(v.flameDone.replace('{n}', fLabel(f))); return; }
    fl[f.code] = day; lsSet('sky_flamed_' + myUid, JSON.stringify(fl));
    SFX.send(); toast(v.flameSent.replace('{n}', fLabel(f))); renderFriends();
    if(srv()){ api('nudge', { to: f.code }); return; }
    const uid = findLocalUid(f.code); if(!uid) return;
    let l = []; try{ l = JSON.parse(lsGet('sky_nudge_' + uid) || '[]'); }catch(e){}
    l.push({ from: myCode, ts: Date.now() }); lsSet('sky_nudge_' + uid, JSON.stringify(l.slice(-20)));
  }
  async function pollNow(){
    if(!myUid || !myCode) return;
    const seq = ++pollSeq, me = myUid, rev0 = friendRev;
    let nudges = [], incoming = [];
    if(srv()){
      const hold = chatVisible() ? 4000 : 0, t0 = Date.now();   // chat terbuka = long-poll: server menahan sampai ada yang baru
      const r = await api('poll', { since, tz: tzNow(), sig: sigS, hold }, null, { timeout: hold + 15000, ref: c => { pollCtl = c; } });
      lastPollMs = Date.now() - t0;
      if(seq !== pollSeq || myUid !== me) return;   // sudah diganti poll baru / ganti akun: hasil lama dibuang
      netMark(r);
      if(!r.ok){ if(r.error === 'auth' && mySession && mySession.type === 'account' && ++authFails >= 5){ authFails = 0; logout(); toast(vt().sessEnd); } return; }   // tamu tidak punya token: tidak pernah dikeluarkan

      authFails = 0; clockSkew = r.now - Date.now(); sigS = r.sig || '';
      if(typeof r.seq === 'number' && since > r.seq){ since = 0; lsSet('sky_since_' + myUid, '0'); }   // penghitung server lebih kecil dari yang diingat browser (server/sheet di-reset): ambil ulang dari awal
      meta = r.metas || {}; typingMap = r.typing || {}; applyInvMom(r.inv, r.mom);
      if(curFriend) paintFCode();   // 'aktif X lalu' ikut segar
      if(Array.isArray(r.friends) && !friendOps && friendRev === rev0) applyServerFriends(r.friends);
      if(r.reads){   // status baca dari perangkat lain
        Object.keys(r.reads).forEach(c => { const n = Number(r.reads[c]) || 0; if(n > (readMap[c] || 0)) readMap[c] = n; if(n > (readPushed[c] || 0)) readPushed[c] = n; });
        saveReads();
      }
      const ms = r.msgs || [];
      if(ms.length){ mergeBatch(ms); ms.forEach(m => { since = Math.max(since, m.id); if(m.from !== myCode && !m.ctl && !m.del) incoming.push(m); }); lsSet('sky_since_' + myUid, String(since)); }
      lsSet('sky_meta_' + myUid, JSON.stringify(meta));   // cache: tampil instan saat app dibuka lagi
      nudges = r.nudges || [];
      if(Array.isArray(r.reqIn) && !friendOps && friendRev === rev0) setReqs(r.reqIn, r.reqOut);   // permintaan pertemanan
      let readNow = false;   // pesanku baru saja dibaca teman (chat yang sedang terbuka)
      Object.keys(meta).forEach(c => { const n = meta[c].rd || 0; if(n > (prevRd[c] || 0) && chatFriend() && chatFriend().code === c) readNow = true; prevRd[c] = n; });
      if(readNow && chatVisible()) SFX.read();
    } else {
      lsSet('sky_seen_' + myUid, String(Date.now())); lsSet('sky_tz_' + myUid, String(tzNow()));
      try{ nudges = JSON.parse(lsGet('sky_nudge_' + myUid) || '[]'); }catch(e){}
      if(nudges.length) lsDel('sky_nudge_' + myUid);
      typingMap = {};
      friendsCache.forEach(f => { try{ const t = JSON.parse(lsGet('sky_typing_' + pairId(myCode, f.code)) || 'null'); if(t && t.from !== myCode && Date.now() - t.ts < 5000) typingMap[f.code] = true; }catch(e){} });
    }
    nudges.forEach(n => { const f = friendsCache.find(x => x.code === n.from); toast(vt().flamed.replace('{n}', f ? fLabel(f) : n.from)); SFX.notify(); });
    if(chatVisible()){
      if(incoming.some(m => m.pid === chatPid)) SFX.recv();   // pesan masuk di chat yang sedang dibuka: nada pendek, langsung terbaca
      renderChat(); markRead();
    } else if(chatPid) renderChat();
    const total = friendsCache.reduce((a, f) => a + unreadOf(f), 0);
    if(total > lastUnread) SFX.notify();   // pesan baru di tempat lain: bunyi berbeda dari suara UI biasa
    lastUnread = total; paintDots(total + reqIn.length); renderFriends(); updateChatSub();
  }
  function startLoop(){
    const gen = ++netGen;
    const loop = async () => {
      await pollNow();
      if(!myUid || gen !== netGen) return;
      flushOutbox(); syncReads();
      // chat terbuka: sambung lagi hampir langsung (server yang menahan). Bila server lama tidak menahan (balas <0,8 dtk) beri jeda agar tidak membanjiri.
      const wait = !srv() ? 2500 : document.hidden ? 30000 : chatPid ? (lastPollMs < 800 ? 1500 : 120) : 5000;
      pollTimer = setTimeout(loop, wait);
    };
    loop();
  }
  function kickPoll(){ if(!myUid) return; try{ if(pollCtl) pollCtl.abort(); }catch(e){} clearTimeout(pollTimer); startLoop(); }   // ulangi poll sekarang juga
  function startNet(){
    stopNet(); invList = []; momList = []; invPrev = null; momPrev = null; paintMomW();
    prof = readProf(myUid); window.SkyMuted = !!prof.mute; if(window.SkyMusic) window.SkyMusic.sync();
    if(prof.lang && prof.lang !== window.SkyApp.getLang()) window.SkyApp.applyLang(prof.lang);   // pakai bahasa yang tersimpan di akun walau bahasa perangkat berbeda
    else if(!prof.lang) saveProf({ lang: window.SkyApp.getLang() }, true);   // akun lama: simpan bahasa saat ini sebagai bawaan
    try{ meta = JSON.parse(lsGet('sky_meta_' + myUid) || '{}'); }catch(e){ meta = {}; }
    since = parseInt(lsGet('sky_since_' + myUid), 10) || 0; sigS = ''; prevRd = {}; loadReads();
    Object.keys(meta).forEach(c => { prevRd[c] = meta[c].rd || 0; });
    lastUnread = friendsCache.reduce((a, f) => a + unreadOf(f), 0); paintDots(lastUnread);
    paintProf(); renderFriends(true);
    startLoop();
  }
  function stopNet(){ netGen++; pollSeq++; clearTimeout(pollTimer); pollTimer = null; try{ if(pollCtl) pollCtl.abort(); }catch(e){} reqIn = []; reqOut = []; reqSeen = null; renderReqs(); paintDots(0); }
  document.addEventListener('visibilitychange', () => { if(!document.hidden && myUid){ kickPoll(); markRead(); } });   // balik ke app: sinkron sekarang
  window.addEventListener('online', () => { if(myUid) kickPoll(); });
  window.addEventListener('focus', () => { if(myUid && chatPid) markRead(); });
  if(window.visualViewport){   // keyboard HP: overlay chat mengikuti area yang terlihat, kolom ketik tidak tertutup
    const fit = () => { const r = document.documentElement.style; r.setProperty('--vvh', visualViewport.height + 'px'); r.setProperty('--vvt', visualViewport.offsetTop + 'px'); if(chatPid) $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight; };
    visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); fit();
  }

  // ----- perayaan saat rasi bintang / season mencapai 100% -----
  window.addEventListener('sky:celebrate', e => {
    SFX.cheer(); toast(vt().c100.replace('{n}', e.detail.name));
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = mkEl('div', 'cfLayer'); document.body.appendChild(layer);
    const A = window.SkyAsset, favU = A ? A.resolve('aksi/favorit').catch(() => null) : Promise.resolve(null);   // ikon bintang = aset/skymeet/aksi/favorit; tanpa file: bintang bawaan
    for(let i = 0; i < 22; i++){
      const c = mkEl('i', 'cf'); c.style.cssText = '--x:' + (Math.random() * 100) + 'vw;--d:' + (Math.random() * 0.5) + 's;--r:' + (Math.random() * 360) + 'deg;--s:' + (16 + Math.random() * 16) + 'px';
      c.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z"/></svg>';
      favU.then(u => { if(u && c.isConnected) c.replaceChildren(A.mkImg(u, '')); });
      layer.appendChild(c);
    }
    setTimeout(() => layer.remove(), 2600);
  });

  applyVisitLang();
  window.SkyVisit = { render: renderFriends };
})();
</script>
<script>
/* ===== Loading screen Skymeet: logo pecah jadi partikel bintang, persen mengikuti proses memuat asli =====
   - Persen minimal 5 detik. Jika semua sudah termuat, 100% tepat di 5 detik.
     Jika belum, persen tertahan di 99% sampai benar-benar selesai (jaring pengaman 20 dtk).
   - Event: 'skymeetb:reveal' (20% bintang sudah terserap -> tampilkan login / masuk app)
            'skymeetb:done'   (bintang terakhir terserap -> loading screen ditutup)  */
(function(){
  const screenEl = document.getElementById('loadingScreen');

  // latar login = langit malam yang sama dengan beranda (dibuat oleh SkyNight di skrip utama); dipakai juga sebagai latar loading
  (function(){
    const box = document.getElementById('loginStars'), scr = document.getElementById('loginScreen');
    if(!box || !scr || !window.SkyNight) return;
    window.SkyNight.build(box, innerWidth < 600 ? 55 : 90, { on: () => !scr.classList.contains('hidden'), yMax: 1, watch: scr });
  })();

  function bail(){   // bila canvas/animasi gagal: jangan pernah mengunci pengguna di loading
    screenEl.classList.add('reveal', 'hidden');
    window.dispatchEvent(new Event('skymeetb:reveal'));
    window.dispatchEvent(new Event('skymeetb:done'));
  }
  try{ init(); }catch(e){ console.error('loader', e); bail(); }

  function init(){
    const MIN_MS = 5000, SAFETY_MS = 20000, G = 2600;
    const cvs = document.getElementById('ldCanvas'), ctx = cvs.getContext('2d');
    if(!ctx) throw new Error('canvas');
    const hud = document.getElementById('ldHud'), ringEl = document.getElementById('ldRing');
    const arc = document.getElementById('ldArc'), pct = document.getElementById('ldPct');
    const w1 = document.getElementById('ldW1'), w2 = document.getElementById('ldW2');
    const COLORS = ['#ffffff', '#ffe9a8', '#9fd0ff'];
    const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    let W, H_, dpr, parts = [], logoImg, logoBox, cx, cy, sc, sx;

    // ---- progres memuat yang asli ----
    const loaded = { dom: document.readyState !== 'loading', fonts: false, win: document.readyState === 'complete' };
    if(document.fonts && document.fonts.ready){
      Promise.all([document.fonts.ready, document.fonts.load('400 16px "Space Grotesk"').catch(() => {})]).then(() => { loaded.fonts = true; }, () => { loaded.fonts = true; });
    } else loaded.fonts = true;
    if(!loaded.win) addEventListener('load', () => { loaded.win = true; });
    if(!loaded.dom) document.addEventListener('DOMContentLoaded', () => { loaded.dom = true; });

    // ---- sprite bintang 4 sudut ----
    const sprites = COLORS.map(col => {
      const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
      const x = c.getContext('2d'), m = s / 2;
      const g = x.createRadialGradient(m, m, 0, m, m, m);
      g.addColorStop(0, col); g.addColorStop(.25, col + '88'); g.addColorStop(1, 'transparent');
      x.fillStyle = g; x.globalAlpha = .5; x.fillRect(0, 0, s, s); x.globalAlpha = 1;
      x.fillStyle = col; x.beginPath();
      for(let i = 0; i < 8; i++){ const r = i % 2 ? 9 : 30, a = i * Math.PI / 4 - Math.PI / 2; x.lineTo(m + Math.cos(a) * r, m + Math.sin(a) * r); }
      x.closePath(); x.fill();
      return c;
    });

    // ---- logo: aset yang sama dengan layar login (aset/skymeet/logo.svg|webp). Tanpa aset / gagal dibaca -> tulisan "Skymeet" ----
    const loadImg = u => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; });
    async function logoImage(){
      const A = window.SkyAsset, u = A && await A.resolve('logo');
      if(!u) return null;
      let im = await loadImg(u);
      if(!im.naturalWidth && /\.svg$/i.test(u)){   // SVG hanya ber-viewBox (tanpa width/height): beri ukuran supaya bisa digambar ke canvas
        const txt = await (await fetch(u)).text(), vb = txt.match(/viewBox\s*=\s*["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/);
        if(!vb) return null;
        im = await loadImg(URL.createObjectURL(new Blob([txt.replace(/<svg\b/, `<svg width="${vb[1]}" height="${vb[2]}"`)], { type: 'image/svg+xml' })));
      }
      return im;
    }
    function crop(c){   // potong rapat ke bagian yang terisi, lalu jadikan siluet putih (hanya alfa gambar yang dipakai)
      const w = c.width, h = c.height, d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++) if(d[(y * w + x) * 4 + 3] > 16){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
      if(x1 < 0) return null;
      const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      const ox = o.getContext('2d'); ox.drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      ox.globalCompositeOperation = 'source-in'; ox.fillStyle = '#fff'; ox.fillRect(0, 0, o.width, o.height);
      return o;
    }
    function fromImage(im){
      const nw = im.naturalWidth || 300, nh = im.naturalHeight || 150, k = Math.min(1100 / nw, 1100 / nh);
      const c = document.createElement('canvas'); c.width = Math.ceil(nw * k); c.height = Math.ceil(nh * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      return crop(c);
    }
    function textLogo(){
      const c = document.createElement('canvas'); c.width = 1000; c.height = 300; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '600 200px "Space Grotesk", system-ui, sans-serif'; x.fillText('Skymeet', 500, 150);
      return crop(c);
    }
    async function getLogo(){
      try{ const im = await Promise.race([logoImage(), new Promise(r => setTimeout(() => r(null), 3000))]); const c = im && fromImage(im); if(c) return c; }catch(e){}
      return textLogo();
    }

    const TN = 7, TA = [.5, .3, .14], TW = [1.8, 1.3, .8];
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const rnd = (a, b) => a + Math.random() * (b - a);
    const outQuart = v => 1 - Math.pow(1 - v, 4);
    const rk = { x: 0, y: 0, vx: 0, vy: 0, hit: 0 };   // reaksi lingkaran: bergoyang + berpendar
    let ring = { x: -999, y: -999, r: 0 }, ring0 = { x: -999, y: -999 }, ringK = 1, ringU = 0, ringT = 0, ringV = 0, lastHit = -1;   // ringT: target progres (dari jumlah bintang terserap), ringU: progres yang sudah dihaluskan; ring0: posisi asal; ringU: progres menyusut/bergeser (0..1)
    const PULL = 1400, DRAG = 1.0, DRAG_IN = 2.5, REST_WALL = .9;

    function measure(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H_ = innerHeight;
      cvs.width = W * dpr; cvs.height = H_ * dpr;
      const hb = hud.getBoundingClientRect();
      ring = { x: hb.left + hb.width / 2, y: hb.top + hb.height / 2, r: ringEl.offsetWidth * .45 + 4 };
      ring0 = { x: ring.x, y: ring.y };
    }
    function build(){
      measure();
      const lw = Math.min(W * .72, 520), lh = lw * logoImg.height / logoImg.width;
      cx = W / 2; cy = H_ * .44;
      logoBox = { x: cx - lw / 2, y: cy - lh / 2, w: lw, h: lh };
      sc = document.createElement('canvas'); sc.width = Math.ceil(lw * dpr); sc.height = Math.ceil(lh * dpr); sx = sc.getContext('2d');
      const off = document.createElement('canvas'); off.width = Math.ceil(lw); off.height = Math.ceil(lh);
      const o = off.getContext('2d', { willReadFrequently: true });
      o.drawImage(logoImg, 0, 0, lw, lh);
      const data = o.getImageData(0, 0, off.width, off.height).data;
      const step = Math.max(3, Math.round(lw / 150));
      parts = [];
      for(let y = 0; y < off.height; y += step) for(let x = 0; x < off.width; x += step){
        if(data[(y * off.width + x) * 4 + 3] < 128) continue;
        const tx = logoBox.x + x + rnd(0, step), ty = logoBox.y + y + rnd(0, step);
        const ang = Math.random() * Math.PI * 2, rad = Math.max(W, H_) * rnd(.55, .9), ci = (Math.random() * 3) | 0;
        parts.push({
          tx, ty, sx: cx + Math.cos(ang) * rad, sy: cy + Math.sin(ang) * rad,
          delay: Math.random() * .45, curve: rnd(-.6, .6),
          size: rnd(step * 1.2, step * 2.8), ci, spr: sprites[ci], hx: new Float32Array(TN), hy: new Float32Array(TN), hn: 0,
          rot: Math.random() * 6.28, spin: rnd(-1.5, 1.5), ph: Math.random() * 6.28,
          ba: Math.atan2(ty - cy, tx - cx) + rnd(-.7, .7), bd: rnd(.35, 1) * Math.max(W, H_) * .5,
          bdel: ((ty - logoBox.y) / lh) * 900 + Math.random() * 150, g: rnd(.8, 1.2)   // pecah menyapu dari atas ke bawah
        });
      }
    }

    // ---- fisika: menyebar, lalu ditarik ke lingkaran persen dan terserap ----
    function step(p, dt){
      if(p.done) return;
      p.age += dt;
      const dx = ring.x - p.x, dy = ring.y - p.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
      p.d = d;
      const k = clamp((p.age - .35) / .7);
      const a = PULL * p.g * k * clamp(.6 + d / 800, .6, 1.5) * (1 + 3 / (d / 40 + 1));
      p.vx += (nx * a - ny * a * .05) * dt;
      p.vy += (ny * a + nx * a * .05) * dt;
      const f = Math.exp(-(p.age > 1.5 ? DRAG_IN : DRAG) * dt); p.vx *= f; p.vy *= f;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if(p.x < 0){ p.x = -p.x; p.vx = Math.abs(p.vx) * REST_WALL; }
      else if(p.x > W){ p.x = 2 * W - p.x; p.vx = -Math.abs(p.vx) * REST_WALL; }
      if(d < ring.r * .8 * Math.max(ringK, .2)){ p.done = true; rk.hit = Math.min(1, rk.hit + .03); }
    }

    function whitehole(time, full, calm){   // di 100%: dua lingkaran bercahaya bergetar berlawanan arah
      ringEl.classList.toggle('ld-full', full);
      if(!full) return;
      if(calm){
        w1.style.transform = w2.style.transform = 'translate(-50%,-50%)';
        w1.style.opacity = w2.style.opacity = (.65 + .35 * Math.sin(time * 3)).toFixed(2); return;
      }
      const jx = Math.sin(time * 47) * 1.4, jy = Math.cos(time * 53) * 1.4;
      w1.style.opacity = w2.style.opacity = 1;
      w1.style.transform = `translate(-50%,-50%) translate(${jx.toFixed(2)}px,${jy.toFixed(2)}px) scale(${(1 + .15 * Math.sin(time * 9)).toFixed(3)})`;
      w2.style.transform = `translate(-50%,-50%) translate(${(-jx * 1.3).toFixed(2)}px,${(-jy * 1.3).toFixed(2)}px) scale(${(1 + .1 * Math.sin(time * 7 + 1)).toFixed(3)})`;
    }

    function drawShine(pr){   // pita cahaya menyapu logo dari atas ke bawah tepat sebelum pecah
      const w = sc.width, h = sc.height, bh = h * .22, y = -bh + (h + 2 * bh) * pr;
      sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, w, h);
      const g = sx.createLinearGradient(0, y - bh, 0, y + bh);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,248,220,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      sx.fillStyle = g; sx.fillRect(0, 0, w, h);
      sx.globalCompositeOperation = 'destination-in'; sx.drawImage(logoImg, 0, 0, w, h);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
      ctx.drawImage(sc, logoBox.x, logoBox.y, logoBox.w, logoBox.h);
    }
    function drawStar(spr, x, y, size, rot, a){
      if(a <= .01) return;
      const c = Math.cos(rot) * size / 64 * dpr, s = Math.sin(rot) * size / 64 * dpr;
      ctx.globalAlpha = a; ctx.setTransform(c, s, -s, c, x * dpr, y * dpr); ctx.drawImage(spr, -32, -32);
    }
    function logoGlow(a){
      if(a <= 0) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a; ctx.shadowColor = '#ffe9a8'; ctx.shadowBlur = 24;
      ctx.drawImage(logoImg, logoBox.x, logoBox.y, logoBox.w, logoBox.h); ctx.shadowBlur = 0;
    }

    // ---- letusan titik bulat kecil dari tengah layar: menyebar ke seluruh layar, pecah saat menyentuh tepi ----
    const DOTS = COLORS.map(col => {
      const sz = 16, c = document.createElement('canvas'); c.width = c.height = sz;
      const x = c.getContext('2d'), m = sz / 2, g = x.createRadialGradient(m, m, 0, m, m, m);
      g.addColorStop(0, '#fff'); g.addColorStop(.45, col); g.addColorStop(.62, col + '99'); g.addColorStop(1, 'transparent');
      x.fillStyle = g; x.fillRect(0, 0, sz, sz); return c;
    });
    function spawnPop(){
      popC = { x: W / 2, y: H_ / 2 };
      const n = Math.max(450, Math.min(1100, Math.round(W * H_ / 450)));
      dots = []; pops = []; frags = [];
      for(let i = 0; i < n; i++){
        const a = Math.random() * 6.283, sp = 380 + Math.pow(Math.random(), .8) * 900;
        dots.push({ x: popC.x, y: popC.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: rnd(-.6, .6), r: rnd(.8, 1.7), ci: (Math.random() * 3) | 0, ph: Math.random() * 6.28, age: 0, dead: false });
      }
      popAlive = n;
    }
    function popAt_(d, x, y){   // titik pecah di tepi layar: kilatan kecil + serpihan mungil
      pops.push({ x, y, age: 0, ci: d.ci, r: d.r });
      const nx = x <= 0 ? 1 : x >= W ? -1 : 0, ny = y <= 0 ? 1 : y >= H_ ? -1 : 0, base = Math.atan2(ny || 0, nx || 0) + (nx || ny ? 0 : Math.random() * 6.283);
      for(let k = 0; k < 3; k++){
        const a = base + rnd(-1.2, 1.2), sp = rnd(80, 260);
        frags.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: d.r * .7, ci: d.ci, age: 0, life: rnd(.25, .45) });
      }
    }
    function drawPop(t, time, dt){
      const pa = (t - popAt) / 1000, cx0 = popC.x, cy0 = popC.y;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'lighter';
      if(pa < .6){   // kilatan cahaya di pusat
        const k = pa / .6, R = 40 + 140 * k, g = ctx.createRadialGradient(cx0, cy0, 0, cx0, cy0, R);
        g.addColorStop(0, `rgba(255,255,255,${(.9 * (1 - k)).toFixed(3)})`); g.addColorStop(.4, `rgba(255,233,168,${(.35 * (1 - k)).toFixed(3)})`); g.addColorStop(1, 'rgba(255,233,168,0)');
        ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx0, cy0, R, 0, 6.283); ctx.fill();
      }
      let alive = 0;
      for(const d of dots){
        if(d.dead) continue;
        d.age += dt;
        const ca = Math.cos(d.w * dt), sa = Math.sin(d.w * dt), vx = d.vx * ca - d.vy * sa, vy = d.vx * sa + d.vy * ca; d.vx = vx; d.vy = vy;   // lintasan sedikit melengkung
        d.x += d.vx * dt; d.y += d.vy * dt;
        if(d.x <= 0 || d.x >= W || d.y <= 0 || d.y >= H_ || d.age > 4.5){
          d.dead = true; popAt_(d, Math.min(W, Math.max(0, d.x)), Math.min(H_, Math.max(0, d.y))); continue;
        }
        alive++;
        const s = d.r * 4;
        ctx.globalAlpha = .8 + .2 * Math.sin(time * 14 + d.ph); ctx.drawImage(DOTS[d.ci], d.x - s / 2, d.y - s / 2, s, s);
      }
      for(let i = pops.length - 1; i >= 0; i--){   // kilatan kecil di titik pecah
        const q = pops[i]; q.age += dt;
        if(q.age > .3){ pops.splice(i, 1); continue; }
        const k = q.age / .3, s = q.r * (3 + 5 * k);   // kilatan pecah tetap kecil seperti titik
        ctx.globalAlpha = .8 * (1 - k); ctx.drawImage(DOTS[q.ci], q.x - s / 2, q.y - s / 2, s, s);
      }
      const ff = Math.exp(-3 * dt);
      for(let i = frags.length - 1; i >= 0; i--){   // serpihan mungil
        const f = frags[i]; f.age += dt;
        if(f.age >= f.life){ frags.splice(i, 1); continue; }
        f.vx *= ff; f.vy *= ff; f.x += f.vx * dt; f.y += f.vy * dt;
        const s = f.r * 3.2; ctx.globalAlpha = 1 - f.age / f.life; ctx.drawImage(DOTS[f.ci], f.x - s / 2, f.y - s / 2, s, s);
      }
      return alive + pops.length + frags.length;
    }

    // ---- alur utama ----
    let t0 = performance.now();
    let last = t0, raf = 0, bursting = false, BS = 0, tBurst = Infinity, realP = 0, shown = 0, realDoneAt = -1, revealed = false, finished = false, rmAt = 0, popAt = 0, popAlive = 1, dots = [], pops = [], frags = [], popC = { x: 0, y: 0 };
    function reveal(){
      if(revealed) return; revealed = true;
      screenEl.classList.add('reveal');
      window.dispatchEvent(new Event('skymeetb:reveal'));
    }
    function finish(){
      if(finished) return; finished = true;
      reveal();
      screenEl.classList.add('hidden');
      window.dispatchEvent(new Event('skymeetb:done'));
      cancelAnimationFrame(raf); removeEventListener('resize', onResize);
      setTimeout(() => { cvs.width = cvs.height = 1; }, 800);
    }

    function frame(now){
      if(finished) return;
      const t = now - t0, time = t / 1000;
      const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;

      // persen = yang lebih lambat antara waktu (5 detik) dan proses memuat asli
      const rt = (loaded.dom ? .3 : 0) + (loaded.fonts ? .35 : 0) + (loaded.win ? .35 : 0);
      realP += (rt - realP) * (1 - Math.exp(-6 * dt));
      const realDone = (loaded.dom && loaded.fonts && loaded.win) || t > SAFETY_MS;
      if(realDone && realDoneAt < 0){ realDoneAt = t; tBurst = Math.max(MIN_MS, t + 900); }
      const target = Math.min(t / MIN_MS, realDone ? 1 : Math.min(realP, .99));
      shown += (target - shown) * (1 - Math.exp(-10 * dt));
      if(target >= 1 && shown > .998) shown = 1;
      if(!reduced && !bursting && t >= G && t >= tBurst && shown >= .995){ bursting = true; BS = t; }

      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.globalCompositeOperation = 'lighter';
      arc.style.strokeDashoffset = 213.63 * (1 - shown);
      pct.textContent = Math.round(shown * 100) + '%';

      if(reduced){   // mode tanpa gerak: logo diam, hanya berkelap-kelip
        for(const p of parts){
          const tw = Math.sin(time * 2.2 + p.ph) * .5 + .5;
          drawStar(p.spr, p.tx, p.ty, p.size * (.7 + .4 * tw), p.rot, .3 + .7 * tw);
        }
        logoGlow(.3 + .15 * Math.sin(time * 1.6));
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        const full = shown >= .995;
        whitehole(time, full, true);
        if(full && t >= tBurst){
          if(!rmAt) rmAt = t;
          const k = t - rmAt;
          ringEl.style.opacity = (1 - clamp((k - 800) / 900)).toFixed(3);
          if(k > 800) reveal();
          if(k > 1700){ finish(); return; }
        }
        raf = requestAnimationFrame(frame); return;
      }

      if(!bursting){ ringU = 0; ringV = 0; ringT = 0; }
      else {   // target dari jumlah bintang terserap itu bergelombang -> dihaluskan dengan pegas teredam kritis supaya geraknya mulus
        const RW = 6;
        ringV += ((ringT - ringU) * RW * RW - 2 * RW * ringV) * dt; ringU = clamp(ringU + ringV * dt);
        if(ringU <= 0 || ringU >= 1) ringV = 0;
      }
      { const e = ringU * ringU * (3 - 2 * ringU); ring.x = ring0.x + (W / 2 - ring0.x) * e; ring.y = ring0.y + (H_ / 2 - ring0.y) * e; ringK = 1 - ringU; }   // lingkaran bergeser ke tengah layar, bintang ikut mengejarnya
      let pending = 0;
      const tails = Array.from({ length: 9 }, () => new Path2D());
      for(const p of parts){
        let x, y, a = 1, sz = p.size, rot = p.rot + time * p.spin;
        if(t < G){   // berkumpul membentuk logo
          p.sim = false; p.done = false;
          const g = clamp((t / G - p.delay) / .55), e = outQuart(g);
          const dx = p.tx - p.sx, dy = p.ty - p.sy, k = (1 - e) * Math.sin(e * Math.PI) * p.curve;
          x = p.sx + dx * e - dy * k; y = p.sy + dy * e + dx * k; a = clamp(g * 3);
        } else if(!bursting){   // menunggu persen 100%: berkelip
          const tw = Math.sin(time * 3 + p.ph) * .5 + .5;
          x = p.tx; y = p.ty; a = .7 + .3 * tw; sz *= .85 + .35 * tw;
        } else {   // pecah
          if(p.done) continue;
          pending++;
          const tb = t - BS - p.bdel;
          if(tb < 0){ x = p.tx; y = p.ty; }
          else {
            if(!p.sim){
              p.sim = true; p.age = 0; p.x = p.tx; p.y = p.ty; p.hn = 0;
              const v0 = p.bd * DRAG * 1.25;
              p.vx = Math.cos(p.ba) * v0; p.vy = Math.sin(p.ba) * v0;
            }
            step(p, dt / 2); step(p, dt / 2);
            x = p.x; y = p.y;
            if(p.done || y > H_ + 200){ p.done = true; continue; }
            sz *= .35 + .65 * clamp((p.d - 24 * Math.max(ringK, .2)) / 60);
            for(let i = TN - 1; i > 0; i--){ p.hx[i] = p.hx[i - 1]; p.hy[i] = p.hy[i - 1]; }
            p.hx[0] = x; p.hy[0] = y; if(p.hn < TN) p.hn++;
            if(p.vx * p.vx + p.vy * p.vy > 400)
              for(let i = 0; i < p.hn - 1; i++){ const tp = tails[p.ci * 3 + (i >> 1)]; tp.moveTo(p.hx[i], p.hy[i]); tp.lineTo(p.hx[i + 1], p.hy[i + 1]); }
          }
        }
        drawStar(p.spr, x, y, sz, rot, a);
      }

      // lingkaran: bereaksi, mengecil setelah 20% bintang masuk, hilang bersama bintang terakhir
      const om = 22;
      rk.vx += (-om * om * rk.x - .36 * om * rk.vx) * dt; rk.vy += (-om * om * rk.y - .36 * om * rk.vy) * dt;
      rk.x = clamp(rk.x + rk.vx * dt, -4, 4); rk.y = clamp(rk.y + rk.vy * dt, -4, 4); rk.hit *= Math.exp(-5 * dt);
      let ro = t < G ? clamp(t / 700) : 1;
      if(bursting){
        ringT = clamp((1 - pending / Math.max(1, parts.length) - .2) / .8);
        ro = 1 - clamp((ringU - .8) / .2);
      }
      const sh = 1 - ringU * .85;   // goyangan & denyut mereda saat lingkaran sedang bergerak ke tengah
      ringEl.style.opacity = ro.toFixed(3);
      whitehole(time, shown >= .995, false);
      ringEl.style.transform = `translate3d(${(rk.x * sh + ring.x - ring0.x).toFixed(2)}px,${(rk.y * sh + ring.y - ring0.y).toFixed(2)}px,0) scale(${(ringK * (1 + rk.hit * .1 * sh)).toFixed(3)})`;
      if(Math.abs(rk.hit - lastHit) > .015){ lastHit = rk.hit; ringEl.style.setProperty('--hit', rk.hit.toFixed(2)); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round';
      for(let i = 0; i < 9; i++){ ctx.globalAlpha = TA[i % 3]; ctx.lineWidth = TW[i % 3]; ctx.strokeStyle = COLORS[(i / 3) | 0]; ctx.stroke(tails[i]); }

      if(isFinite(tBurst) && t > tBurst - 800 && t < tBurst + 150){ const k = (t - (tBurst - 800)) / 950; drawShine(k * k * (3 - 2 * k)); }
      let la = 0;
      if(!bursting){ if(t > G * .85) la = clamp((t - G * .85) / 1100) * .55; }
      else if(t < BS + 350) la = .55 * (1 - (t - BS) / 350);
      logoGlow(la);
      if(popAt) popAlive = drawPop(t, time, dt);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

      // semua partikel logo sudah terhisap & lingkaran tepat di tengah -> langsung pecah jadi titik bulat kecil, dan form login muncul
      if(bursting && !popAt && t > BS + 300 && ((pending === 0 && ringU > .985) || t > BS + 15000)){ popAt = t; spawnPop(); reveal(); }
      if(popAt && t > popAt + 900 && popAlive === 0){ finish(); return; }
      raf = requestAnimationFrame(frame);
    }

    let rz = 0;
    function onResize(){ clearTimeout(rz); rz = setTimeout(() => { if(bursting || finished) measure(); else build(); }, 150); }

    getLogo().then(c => { logoImg = c; t0 = performance.now(); last = t0; build(); addEventListener('resize', onResize); raf = requestAnimationFrame(frame); }).catch(() => bail());
  }
})();
</script>
</body>
</html>
