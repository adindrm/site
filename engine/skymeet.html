  const myToken = () => (myUid ? lsGet(tokenKey(myUid)) : null);
  let authFails = 0, netGen = 0;
  const AVNAMES = ['bulan', 'bintang', 'awan', 'kupu-kupu', 'paus', 'lilin', 'bunga', 'daun', 'salju', 'api', 'matahari', 'sayap'];
  function setAv(el, emoji){   // emoji tetap jadi cadangan; bila aset/skymeet/avatar/<nama> ada, diganti gambar
    el.dataset.av = emoji; const i = AVATARS.indexOf(emoji), A = window.SkyAsset; if(i < 0 || !A) return;
    const f = 'avatar/' + AVNAMES[i], put = u => { if(!u || el.dataset.av !== emoji) return; const t = [...el.childNodes].find(n => n.nodeType === 3); if(t) t.replaceWith(A.mkImg(u, 'av')); };
    const u0 = A.peek(f); if(u0) put(u0); else A.resolve(f).then(put);
  }
  const AVATARS = ['🌙', '⭐', '☁️', '🦋', '🐋', '🕯️', '🌸', '🍃', '❄️', '🔥', '☀️', '🪽'];
  const tzNow = () => -new Date().getTimezoneOffset();
  const profKey = uid => 'sky_prof_' + uid;
  const defProf = () => ({ avatar: AVATARS[0], status: '', vis: 'friends', mute: false, email: '' });
  const readProf = uid => { try{ return Object.assign(defProf(), JSON.parse(lsGet(profKey(uid)) || '{}')); }catch(e){ return defProf(); } };
  let prof = defProf(), meta = {}, typingMap = {}, since = 0, pollTimer = null, lastUnread = 0, lastType = 0, lastTypeSend = 0;

  async function api(action, data, uid, opt){   // uid opsional: pakai token akun itu (mis. saat simpan data tertunda)
    if(!SKY_API) return { ok:false, error:'off' };
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    if(opt && opt.ref) opt.ref(ctl);
    const tm = setTimeout(() => { try{ if(ctl) ctl.abort(); }catch(e){} }, (opt && opt.timeout) || 20000);   // fetch yang menggantung (ganti jaringan di HP) dibatalkan
    try{
      const r = await fetch(SKY_API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, signal: ctl ? ctl.signal : undefined, body: JSON.stringify(Object.assign({ action, token: (uid || myUid) ? (lsGet(tokenKey(uid || myUid)) || '') : '' }, data || {})) });
      return await r.json();
    }catch(e){ return { ok:false, error:'net' }; }
    finally{ clearTimeout(tm); }
  }
  if(SKY_API){   // progres akun & data teman lewat server
    window.SkyApp.store.useAdapter({
      load: id => lsGet(tokenKey(id)) ? api('getData', null, id).then(r => (r.ok ? r.data : null)) : null,
      save: (id, snap) => lsGet(tokenKey(id)) ? api('saveData', { data: snap }, id) : null
    });
    window.SkyVisitAdapter = {
      exists: async code => { const r = await api('exists', { code }); return !!(r.ok && r.exists); },
      getFriendProgress: async code => { const r = await api('progressOf', { code }); return r.ok ? (r.denied ? { __denied:true } : r.pg) : null; }
    };
  }
  function hydrate(u, r){   // hasil login/daftar server -> tulis ke penyimpanan lokal, lalu enterApp memakainya
    lsSet(tokenKey(u), r.token); lsSet('sky_code_' + u, r.code); lsSet('sky_friends_' + u, JSON.stringify(r.friends || []));
    try{ const o = JSON.parse(lsGet('sky_reads_' + u) || '{}'), m = o.m || {}, p = o.p || {}; Object.keys(r.reads || {}).forEach(c => { const n = Number(r.reads[c]) || 0; if(n > (m[c] || 0)) m[c] = n; if(n > (p[c] || 0)) p[c] = n; }); lsSet('sky_reads_' + u, JSON.stringify({ m, p })); }catch(e){}
    lsSet(profKey(u), JSON.stringify(Object.assign(readProf(u), r.profile || {}, { email: r.email || '' })));
    if(r.profile && r.profile.name) lsSet('sky_myname_' + u, r.profile.name);
  }
  function moveAccount(from, to){
    ['sky:v1:u:', 'sky_friends_', 'sky_myname_', 'sky_prof_', 'sky_code_', 'sky_token_', 'sky_reads_'].forEach(pfx => { const v = lsGet(pfx + from); if(v !== null){ lsSet(pfx + to, v); lsDel(pfx + from); } });
  }

  // ----- profil -----
  function saveProf(patch, push){
    Object.assign(prof, patch); lsSet(profKey(myUid), JSON.stringify(prof));
    window.SkyMuted = !!prof.mute; paintProf();
    if(push && SKY_API && myToken()){ const o = Object.assign({}, patch); delete o.mute; api('updateProfile', o); }
  }
  function paintProf(){
    if(!$('avBtn')) return;
    const v = vt(), acct = !!(mySession && mySession.type === 'account' && !BUILTIN[myUid]);
    $('avBtn').textContent = prof.avatar; setAv($('avBtn'), prof.avatar);
    $('profUser').textContent = acct ? '@' + myUid : '';
    if(document.activeElement !== $('stIn')) $('stIn').value = prof.status || '';
    $('visSel').value = prof.vis;
    $('muteBtn').textContent = v.mute + ': ' + (prof.mute ? v.muteOn : v.muteOff); $('muteBtn').setAttribute('aria-pressed', String(!!prof.mute));
    document.querySelectorAll('#avGrid button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.av === prof.avatar)));
    $('accSec').hidden = !acct; $('upSec').hidden = !(mySession && mySession.type === 'guest');
    $('accNote').hidden = !!SKY_API; ['accUser', 'accEmail', 'accPwOld', 'accPwNew', 'accSave'].forEach(id => { $(id).disabled = !SKY_API; });
    if(document.activeElement !== $('accUser')) $('accUser').value = myUid || '';
    if(document.activeElement !== $('accEmail')) $('accEmail').value = prof.email || '';
  }
  function applyProfLang(){
    const v = vt(), set = (id, t) => { const e = $(id); if(e) e.textContent = t; };
    set('setT', v.settings); set('avT', v.avT); set('visT', v.visT); set('accT', v.accT); set('upT', v.upT); set('friendsT', v.friendsT);
    set('accSave', v.accSave); set('upBtn', v.upBtn); set('accNote', v.noSrv);
    const o = $('visSel').options; o[0].textContent = v.vPub; o[1].textContent = v.vFr; o[2].textContent = v.vPri;
    $('stIn').placeholder = v.stPh; $('accUser').placeholder = v.uname; $('accEmail').placeholder = v.email; $('accPwOld').placeholder = v.pwOld; $('accPwNew').placeholder = v.pwNew;
    $('upUser').placeholder = v.uname; $('upPw').placeholder = curL().rPass;
    paintProf(); updateChatSub();
  }
  AVATARS.forEach(a => { const b = mkEl('button', '', a); b.type = 'button'; setAv(b, a); b.addEventListener('click', () => saveProf({ avatar:a }, true)); $('avGrid').appendChild(b); });
  const toggleSet = () => { const f = $('setFold'), o = f.classList.toggle('open'); $('setBtn').setAttribute('aria-expanded', String(o)); f.inert = !o; };
  $('setBtn').addEventListener('click', toggleSet); $('avBtn').addEventListener('click', toggleSet);
  $('stIn').addEventListener('change', () => saveProf({ status: $('stIn').value.trim().slice(0, 40) }, true));
  $('visSel').addEventListener('change', () => saveProf({ vis: $('visSel').value }, true));
  $('muteBtn').addEventListener('click', () => saveProf({ mute: !prof.mute }, false));

  async function saveAccount(){   // username / email / sandi (butuh server)
    const v = vt(), L = curL(), fail = m => { toast(m); SFX.error(); };
    if(!SKY_API) return fail(v.noSrv);
    const nu = ($('accUser').value || '').trim().toLowerCase(), em = ($('accEmail').value || '').trim(), po = $('accPwOld').value, pn = $('accPwNew').value, rename = nu && nu !== myUid;
    if(em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return fail(v.bEmail);
    if(pn && pn.length < 6) return fail(L.ePw);
    if((pn || rename) && !po) return fail(v.needPw);
    if(rename && (!/^[a-z0-9_]{3,16}$/.test(nu) || nu.indexOf('guest') === 0)) return fail(L.eName);
    if(em !== (prof.email || '')){ await api('updateProfile', { email: em }); saveProf({ email: em }, false); }
    if(pn){ const r = await api('changePassword', { oldPw: po, newPw: pn }); if(!r.ok) return fail(L.eBad); }
    if(rename){
      const r = await api('changeUser', { newUser: nu, pw: pn || po });
      if(!r.ok) return fail(r.error === 'taken' ? L.eTaken : L.eBad);
      moveAccount(myUid, nu); const session = { type:'account', id:nu }; writeSession(session); enterApp(session);
    }
    $('accPwOld').value = ''; $('accPwNew').value = '';
    toast(v.accOk); SFX.success();
  }
  $('accSave').addEventListener('click', saveAccount);

  async function upgradeGuest(){   // tamu -> akun asli, progres/teman/ID ikut terbawa
    const v = vt(), L = curL(), fail = m => { toast(m); SFX.error(); };
    if(!mySession || mySession.type !== 'guest') return;
    const u = ($('upUser').value || '').trim().toLowerCase(), pw = $('upPw').value || '', gid = myUid;
    if(!/^[a-z0-9_]{3,16}$/.test(u) || u.indexOf('guest') === 0) return fail(L.eName);
    if(pw.length < 6) return fail(L.ePw);
    if(srv()){
      let data = {}; try{ data = JSON.parse(lsGet('sky:v1:u:' + gid) || '{}'); }catch(e){}
      const r = await api('register', { username:u, password:pw, code:myCode, friends:friendsCache, data });
      if(!r.ok) return fail(r.error === 'taken' ? L.eTaken : L.eName);
      lsSet(tokenKey(u), r.token);
    } else {
      const accs = readAccounts();
      if(BUILTIN[u] || Object.prototype.hasOwnProperty.call(accs, u)) return fail(L.eTaken);
      accs[u] = await hashPw(u, pw); lsSet(ACC_KEY, JSON.stringify(accs));
    }
    moveAccount(gid, u); lsDel(GUEST_KEY); lsDel(GUEST_SEEN);
    const session = { type:'account', id:u }; writeSession(session); enterApp(session);
    toast(v.upDone); SFX.success();
  }
  $('upBtn').addEventListener('click', upgradeGuest);

  // ----- kehadiran, jam teman, status baca, polling -----
  let clockSkew = 0, sigS = '', pollSeq = 0, pollCtl = null, lastPollMs = 0, prevRd = {};
  const srvNow = () => Date.now() + clockSkew;   // jam server: tampilan jam teman & urutan pesan tidak terpengaruh jam perangkat yang salah / beda zona
  function metaFor(code){
    if(srv()) return meta[code] || null;
    const uid = findLocalUid(code); if(!uid) return null;   // mode lokal: baca dari akun lain di perangkat ini
    const p = readProf(uid), seen = parseInt(lsGet('sky_seen_' + uid), 10) || 0;
    return { avatar:p.avatar, status:p.status, tz: parseInt(lsGet('sky_tz_' + uid), 10) || 0, online: Date.now() - seen < 20000 };
  }
  function timeInfo(m){
    if(!m || m.tz === undefined) return '';
    const v = vt(), t = new Date(srvNow() + m.tz * 60000), diff = m.tz - tzNow(), h = Math.round(Math.abs(diff) / 6) / 10;
    return String(t.getUTCHours()).padStart(2, '0') + ':' + String(t.getUTCMinutes()).padStart(2, '0') + ' \u00b7 ' + (diff === 0 ? v.same : (diff > 0 ? v.ahead : v.behind).replace('{h}', h));
  }
  // status baca: readMap[kode teman] = id pesan terakhir yang sudah kubaca. Disimpan di server -> sama di semua perangkat.
  const readsKey = () => 'sky_reads_' + myUid;
  function loadReads(){ try{ const o = JSON.parse(lsGet(readsKey()) || '{}'); readMap = o.m || {}; readPushed = o.p || {}; }catch(e){ readMap = {}; readPushed = {}; } }
  const saveReads = () => lsSet(readsKey(), JSON.stringify({ m: readMap, p: readPushed }));
  const unreadOf = f => { const rd = readMap[f.code] || 0; return readMsgs(pairId(myCode, f.code)).filter(m => m.from !== myCode && m.id > rd).length; };
  function markRead(){
    const f = chatFriend(); if(!f || !chatVisible()) return;
    let top = 0; readMsgs(chatPid).forEach(m => { if(m.from !== myCode && m.id > top) top = m.id; });
    if(top > (readMap[f.code] || 0)){ readMap[f.code] = top; saveReads(); paintDots(friendsCache.reduce((a, x) => a + unreadOf(x), 0)); syncReads(); }
  }
  let syncing = false;
  async function syncReads(){   // dorong pointer baca ke server (diulang otomatis bila gagal)
    if(!srv() || syncing || !myUid) return;
    syncing = true; const me = myUid;
    try{
      for(const c of Object.keys(readMap)){
        if(readMap[c] <= (readPushed[c] || 0)) continue;
        const up = readMap[c], r = await api('read', { with: c, upTo: up });
        if(myUid !== me) return;
        if(r.ok){ readPushed[c] = Math.max(readPushed[c] || 0, up); saveReads(); } else break;
      }
    } finally { syncing = false; }
  }
  function updateChatSub(){ const f = chatFriend(); $('chatSub').textContent = f ? (typingMap[f.code] ? vt().typing : timeInfo(metaFor(f.code))) : ''; paintFCode(); }
  $('chatInput').addEventListener('input', () => {   // indikator "sedang mengetik" (ringan: 1 request kecil, tanpa poll penuh)
    lastType = Date.now();
    const f = chatFriend();
    if(!f || Date.now() - lastTypeSend < 2500) return;
    lastTypeSend = Date.now();
    if(srv()) api('typing', { to: f.code }); else lsSet('sky_typing_' + chatPid, JSON.stringify({ from: myCode, ts: Date.now() }));
  });
  function paintDots(n){ $('navDot').hidden = $('navDotItem').hidden = !n; }
  function waveTo(f){   // lambaian ringan tanpa membuka chat
    SFX.send(); toast('\ud83d\udc4b ' + fLabel(f));
    if(srv()){ api('nudge', { to: f.code }); return; }
    const uid = findLocalUid(f.code); if(!uid) return;
    let l = []; try{ l = JSON.parse(lsGet('sky_nudge_' + uid) || '[]'); }catch(e){}
    l.push({ from: myCode, ts: Date.now() }); lsSet('sky_nudge_' + uid, JSON.stringify(l.slice(-20)));
  }
  async function pollNow(){
    if(!myUid || !myCode) return;
    const seq = ++pollSeq, me = myUid, rev0 = friendRev;
    let nudges = [], incoming = [];
    if(srv()){
      const hold = chatVisible() ? 4000 : 0, t0 = Date.now();   // chat terbuka = long-poll: server menahan sampai ada yang baru
      const r = await api('poll', { since, tz: tzNow(), sig: sigS, hold }, null, { timeout: hold + 15000, ref: c => { pollCtl = c; } });
      lastPollMs = Date.now() - t0;
      if(seq !== pollSeq || myUid !== me) return;   // sudah diganti poll baru / ganti akun: hasil lama dibuang
      netMark(r);
      if(!r.ok){ if(r.error === 'auth' && mySession && mySession.type === 'account' && ++authFails >= 5){ authFails = 0; logout(); toast(vt().sessEnd); } return; }   // tamu tidak punya token: tidak pernah dikeluarkan

      authFails = 0; clockSkew = r.now - Date.now(); sigS = r.sig || '';
      meta = r.metas || {}; typingMap = r.typing || {};
      if(Array.isArray(r.friends) && !friendOps && friendRev === rev0) applyServerFriends(r.friends);
      if(r.reads){   // status baca dari perangkat lain
        Object.keys(r.reads).forEach(c => { const n = Number(r.reads[c]) || 0; if(n > (readMap[c] || 0)) readMap[c] = n; if(n > (readPushed[c] || 0)) readPushed[c] = n; });
        saveReads();
      }
      const ms = r.msgs || [];
      if(ms.length){ mergeBatch(ms); ms.forEach(m => { since = Math.max(since, m.id); if(m.from !== myCode) incoming.push(m); }); lsSet('sky_since_' + myUid, String(since)); }
      lsSet('sky_meta_' + myUid, JSON.stringify(meta));   // cache: tampil instan saat app dibuka lagi
      nudges = r.nudges || [];
      let readNow = false;   // pesanku baru saja dibaca teman (chat yang sedang terbuka)
      Object.keys(meta).forEach(c => { const n = meta[c].rd || 0; if(n > (prevRd[c] || 0) && chatFriend() && chatFriend().code === c) readNow = true; prevRd[c] = n; });
      if(readNow && chatVisible()) SFX.read();
    } else {
      lsSet('sky_seen_' + myUid, String(Date.now())); lsSet('sky_tz_' + myUid, String(tzNow()));
      try{ nudges = JSON.parse(lsGet('sky_nudge_' + myUid) || '[]'); }catch(e){}
      if(nudges.length) lsDel('sky_nudge_' + myUid);
      typingMap = {};
      friendsCache.forEach(f => { try{ const t = JSON.parse(lsGet('sky_typing_' + pairId(myCode, f.code)) || 'null'); if(t && t.from !== myCode && Date.now() - t.ts < 5000) typingMap[f.code] = true; }catch(e){} });
    }
    nudges.forEach(n => { const f = friendsCache.find(x => x.code === n.from); toast(vt().waved.replace('{n}', f ? fLabel(f) : n.from)); SFX.notify(); });
    if(chatVisible()){
      if(incoming.some(m => m.pid === chatPid)) SFX.recv();   // pesan masuk di chat yang sedang dibuka: nada pendek, langsung terbaca
      renderChat(); markRead();
    } else if(chatPid) renderChat();
    const total = friendsCache.reduce((a, f) => a + unreadOf(f), 0);
    if(total > lastUnread) SFX.notify();   // pesan baru di tempat lain: bunyi berbeda dari suara UI biasa
    lastUnread = total; paintDots(total); renderFriends(); updateChatSub();
  }
  function startLoop(){
    const gen = ++netGen;
    const loop = async () => {
      await pollNow();
      if(!myUid || gen !== netGen) return;
      flushOutbox(); syncReads();
      // chat terbuka: sambung lagi hampir langsung (server yang menahan). Bila server lama tidak menahan (balas <0,8 dtk) beri jeda agar tidak membanjiri.
      const wait = !srv() ? 2500 : document.hidden ? 30000 : chatPid ? (lastPollMs < 800 ? 1500 : 120) : 5000;
      pollTimer = setTimeout(loop, wait);
    };
    loop();
  }
  function kickPoll(){ if(!myUid) return; try{ if(pollCtl) pollCtl.abort(); }catch(e){} clearTimeout(pollTimer); startLoop(); }   // ulangi poll sekarang juga
  function startNet(){
    stopNet();
    prof = readProf(myUid); window.SkyMuted = !!prof.mute;
    try{ meta = JSON.parse(lsGet('sky_meta_' + myUid) || '{}'); }catch(e){ meta = {}; }
    since = parseInt(lsGet('sky_since_' + myUid), 10) || 0; sigS = ''; prevRd = {}; loadReads();
    Object.keys(meta).forEach(c => { prevRd[c] = meta[c].rd || 0; });
    lastUnread = friendsCache.reduce((a, f) => a + unreadOf(f), 0); paintDots(lastUnread);
    paintProf(); renderFriends(true);
    startLoop();
  }
  function stopNet(){ netGen++; pollSeq++; clearTimeout(pollTimer); pollTimer = null; try{ if(pollCtl) pollCtl.abort(); }catch(e){} paintDots(0); }
  document.addEventListener('visibilitychange', () => { if(!document.hidden && myUid){ kickPoll(); markRead(); } });   // balik ke app: sinkron sekarang
  window.addEventListener('online', () => { if(myUid) kickPoll(); });
  window.addEventListener('focus', () => { if(myUid && chatPid) markRead(); });
  if(window.visualViewport){   // keyboard HP: overlay chat mengikuti area yang terlihat, kolom ketik tidak tertutup
    const fit = () => { const r = document.documentElement.style; r.setProperty('--vvh', visualViewport.height + 'px'); r.setProperty('--vvt', visualViewport.offsetTop + 'px'); if(chatPid) $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight; };
    visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); fit();
  }

  // ----- perayaan saat rasi bintang / season mencapai 100% -----
  window.addEventListener('sky:celebrate', e => {
    SFX.cheer(); toast(vt().c100.replace('{n}', e.detail.name));
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = mkEl('div', 'cfLayer'); document.body.appendChild(layer);
    for(let i = 0; i < 22; i++){ const c = mkEl('i', 'cf'); c.style.cssText = '--x:' + (Math.random() * 100) + 'vw;--d:' + (Math.random() * 0.4) + 's;--r:' + (Math.random() * 360) + 'deg;--s:' + (8 + Math.random() * 10) + 'px'; layer.appendChild(c); }
    setTimeout(() => layer.remove(), 2200);
  });

  applyVisitLang();
  window.SkyVisit = { render: renderFriends };
})();
</script>
</body>
